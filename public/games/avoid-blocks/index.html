<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Avoid Blocks</title>
<style>
*{margin:0;padding:0}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;overflow:hidden}
#ui{color:#fff;margin-bottom:6px;font-size:16px}
#ui span{color:#4fc3f7;font-weight:bold}
canvas{border-radius:8px;touch-action:none}
#msg{color:#aaa;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div id="ui">Score: <span id="sc">0</span> | Best: <span id="bs">0</span></div>
<canvas id="c"></canvas>
<div id="msg">Move left/right to dodge falling blocks!</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=Math.min(860,innerWidth-16),H=Math.min(640,innerHeight-80);
cv.width=W;cv.height=H;
let player,blocks,score,best=+localStorage.getItem('ab-best')||0;
let gameOver=false,started=false,frame=0;
document.getElementById('bs').textContent=best;
function init(){
  player={x:W/2,y:H-40,w:24,h:24};
  blocks=[];score=0;frame=0;gameOver=false;started=false;
  document.getElementById('sc').textContent=0;
}
function update(){
  if(!started||gameOver)return;
  frame++;
  const speed=2+score*0.03;
  if(frame%Math.max(15,40-Math.floor(score/5))===0){
    const size=20+Math.random()*30;
    blocks.push({x:Math.random()*(W-size),y:-size,w:size,h:size,speed:speed+Math.random()*2,color:`hsl(${Math.random()*360},70%,50%)`});
  }
  for(let b of blocks)b.y+=b.speed;
  blocks=blocks.filter(b=>{
    if(b.y>H){score++;document.getElementById('sc').textContent=score;return false;}
    return true;
  });
  for(let b of blocks){
    if(player.x<b.x+b.w&&player.x+player.w>b.x&&player.y<b.y+b.h&&player.y+player.h>b.y){
      gameOver=true;
      if(score>best){best=score;localStorage.setItem('ab-best',best);}
      document.getElementById('bs').textContent=best;
    }
  }
}
function draw(){
  ctx.fillStyle='#16213e';ctx.fillRect(0,0,W,H);
  for(let b of blocks){
    ctx.fillStyle=b.color;
    ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,4);ctx.fill();
  }
  ctx.fillStyle='#4fc3f7';
  ctx.beginPath();ctx.roundRect(player.x,player.y,player.w,player.h,6);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(player.x+8,player.y+8,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(player.x+16,player.y+8,3,0,Math.PI*2);ctx.fill();
  if(!started&&!gameOver){
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText('TAP TO START',W/2,H/2);
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e94560';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText('HIT!',W/2,H/2-12);
    ctx.fillStyle='#fff';ctx.font='15px Arial';
    ctx.fillText('Score: '+score+' | Tap to retry',W/2,H/2+18);
  }
}
function loop(){update();draw();requestAnimationFrame(loop);}
cv.addEventListener('pointermove',e=>{
  if(!started||gameOver)return;
  const r=cv.getBoundingClientRect();
  player.x=Math.max(0,Math.min(W-player.w,e.clientX-r.left-player.w/2));
});
cv.addEventListener('pointerdown',e=>{
  if(!started){started=true;return;}
  if(gameOver){init();started=true;return;}
  const r=cv.getBoundingClientRect();
  player.x=Math.max(0,Math.min(W-player.w,e.clientX-r.left-player.w/2));
});
document.addEventListener('keydown',e=>{
  if(!started){started=true;return;}
  if(gameOver){init();started=true;return;}
  if(e.code==='ArrowLeft')player.x=Math.max(0,player.x-20);
  if(e.code==='ArrowRight')player.x=Math.min(W-player.w,player.x+20);
});
init();loop();
</script>
</body>
</html>
