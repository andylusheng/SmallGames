<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Avoid Blocks</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial,sans-serif;background:#050714;color:#fff}body{display:flex;align-items:center;justify-content:center}.wrap{position:relative;width:min(720px,100vw);height:min(700px,100vh);overflow:hidden;background:#070b1d}.hud{position:absolute;z-index:5;left:9px;right:9px;top:9px;display:flex;justify-content:space-between}.group{display:flex;gap:5px}.pill{min-width:60px;padding:6px 8px;border:1px solid #ffffff16;border-radius:9px;background:#080f26d9;color:#64748b;font-size:8px;text-align:center}.pill b{display:block;color:#fff;font-size:14px}.pill.near b{color:#fbbf24}canvas{width:100%;height:100%;display:block;touch-action:none}.phase{position:absolute;z-index:6;bottom:12px;left:50%;transform:translateX(-50%);width:min(260px,76%);display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:6px;border:1px solid #22d3ee44;background:#06101fd9;border-radius:11px}.phaseText{font-size:8px;color:#67e8f9;font-weight:900}.track{height:6px;margin-top:4px;background:#ffffff10;border-radius:999px;overflow:hidden}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#818cf8,#f0abfc)}.phaseBtn{border:0;border-radius:8px;padding:8px 10px;background:#22d3ee;color:#07111f;font-size:8px;font-weight:950}.phaseBtn:disabled{opacity:.35}.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#020617dc}.overlay.hidden{display:none}.card{width:min(320px,88vw);padding:21px;border:1px solid #ffffff1c;border-radius:20px;background:#10172d;text-align:center}.card h1{margin:0 0 6px}.card p{font-size:11px;color:#94a3b8;line-height:1.5}.btn{border:0;border-radius:11px;padding:10px 18px;background:linear-gradient(135deg,#22d3ee,#818cf8);color:#07111f;font-weight:950}</style></head><body><main id="wrap" class="wrap"><div class="hud"><div class="group"><div class="pill">SCORE<b id="score">0</b></div><div class="pill near">NEAR MISS<b id="near">×0</b></div></div><div class="group"><div class="pill">LEVEL<b id="level">1</b></div><div class="pill">BEST<b id="best">0</b></div></div></div><canvas id="c"></canvas><div class="phase"><div><div class="phaseText" id="phaseText">PHASE SHIFT · charge with near misses</div><div class="track"><i id="phaseBar"></i></div></div><button id="phaseBtn" class="phaseBtn" disabled>PHASE</button></div><div id="overlay" class="overlay"><div class="card"><h1 id="title">◇ Avoid Blocks</h1><p id="summary">Dodge falling blocks. Pass dangerously close to charge Phase Shift, then trigger it to survive one impossible moment.</p><button id="play" class="btn">START RUN</button></div></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d'),wrap=$('wrap'),scoreEl=$('score'),nearEl=$('near'),levelEl=$('level'),bestEl=$('best'),bar=$('phaseBar'),phaseBtn=$('phaseBtn'),phaseText=$('phaseText'),overlay=$('overlay'),title=$('title'),summary=$('summary');let W=0,H=0,D=Math.min(devicePixelRatio||1,2),player,blocks=[],fx=[],trail=[],score=0,near=0,best=+localStorage.getItem('avoid-blocks-flag-best')||0,charge=0,phase=0,running=false,keys={},spawnCd=0,shake=0,last=performance.now();bestEl.textContent=best;function resize(){const r=wrap.getBoundingClientRect();W=r.width;H=r.height;c.width=Math.round(W*D);c.height=Math.round(H*D);x.setTransform(D,0,0,D,0,0);if(player){player.y=H-70;player.x=Math.min(W-player.w,player.x)}}addEventListener('resize',resize);resize();function hud(){scoreEl.textContent=score;nearEl.textContent='×'+near;const level=1+Math.floor(score/14);levelEl.textContent=level;bar.style.width=(phase>0?100:Math.min(100,charge))+'%';phaseBtn.disabled=charge<100||phase>0;phaseText.textContent=phase>0?'PHASE ACTIVE · '+phase.toFixed(1)+'s':'PHASE SHIFT · '+Math.floor(charge)+'%'}function reset(){player={x:W/2-14,y:H-70,w:28,h:28};blocks=[];fx=[];trail=[];score=0;near=0;charge=0;phase=0;spawnCd=.5;shake=0;running=true;overlay.classList.add('hidden');hud()}function spawn(){const level=1+Math.floor(score/14),wide=level>=3&&Math.random()<.25,w=wide?80+Math.random()*100:28+Math.random()*40;blocks.push({x:Math.random()*(W-w),y:-60,w,h:wide?20+Math.random()*18:28+Math.random()*48,v:120+level*16+Math.random()*70,color:`hsl(${185+Math.random()*150} 78% 60%)`,passed:false})}function burst(px,py,color,n=8){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=35+Math.random()*110;fx.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4,color})}}function activatePhase(){if(charge<100||phase>0)return;charge=0;phase=1.25;navigator.vibrate?.(25);burst(player.x+14,player.y+14,'#67e8f9',18);hud()}phaseBtn.onclick=activatePhase;function end(){running=false;best=Math.max(best,score);localStorage.setItem('avoid-blocks-flag-best',best);bestEl.textContent=best;title.textContent=score>=best?'🏆 New Best':'Run Over';summary.textContent=`Score ${score} · best ${best} · near-miss streak ${near}. Use Phase Shift only when you have no clean escape.`;$('#play');overlay.classList.remove('hidden')}function update(dt){if(!running)return;const level=1+Math.floor(score/14);if(phase>0)phase=Math.max(0,phase-dt);if(keys.ArrowLeft||keys.a)player.x-=280*dt;if(keys.ArrowRight||keys.d)player.x+=280*dt;player.x=Math.max(3,Math.min(W-player.w-3,player.x));spawnCd-=dt;if(spawnCd<=0){spawn();spawnCd=Math.max(.18,.52-level*.025)}trail.unshift({x:player.x+player.w/2,y:player.y+player.h/2,life:1});trail=trail.slice(0,12);for(let i=blocks.length-1;i>=0;i--){const b=blocks[i];b.y+=b.v*dt;const hit=player.x<b.x+b.w&&player.x+player.w>b.x&&player.y<b.y+b.h&&player.y+player.h>b.y;if(hit&&phase<=0){shake=14;burst(player.x+14,player.y+14,'#fb7185',18);navigator.vibrate?.(45);end();return}if(!b.passed&&b.y>player.y+player.h){b.passed=true;const gap=Math.min(Math.abs((b.x+b.w)-player.x),Math.abs((player.x+player.w)-b.x));if(gap<24){near++;charge=Math.min(100,charge+25);score+=2+Math.min(4,Math.floor(near/3));burst(player.x+14,player.y,'#fbbf24',9);navigator.vibrate?.(8)}else{score++;near=Math.max(0,near-1)}hud()}if(b.y>H+80)blocks.splice(i,1)}for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt}fx=fx.filter(f=>f.life>0);if(shake>0)shake*=.83;hud()}function draw(){x.save();if(shake>1)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#050817');g.addColorStop(1,'#111b3c');x.fillStyle=g;x.fillRect(-20,-20,W+40,H+40);x.strokeStyle='#ffffff09';for(let yy=90;yy<H;yy+=52){x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke()}trail.forEach((t,i)=>{x.globalAlpha=(1-i/trail.length)*(phase>0?.55:.14);x.fillStyle=phase>0?'#67e8f9':'#38bdf8';x.beginPath();x.arc(t.x,t.y,5+i*.3,0,6.28);x.fill()});x.globalAlpha=1;for(const b of blocks){x.shadowBlur=12;x.shadowColor=b.color;x.fillStyle=b.color;x.beginPath();x.roundRect(b.x,b.y,b.w,b.h,5);x.fill();x.shadowBlur=0;x.fillStyle='#ffffff26';x.fillRect(b.x+5,b.y+5,Math.max(4,b.w-10),3)}x.shadowBlur=phase>0?28:16;x.shadowColor=phase>0?'#f0abfc':'#38bdf8';x.fillStyle=phase>0?'#f0abfc':'#38bdf8';x.beginPath();x.roundRect(player.x,player.y,player.w,player.h,7);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.fillRect(player.x+7,player.y+8,4,4);x.fillRect(player.x+17,player.y+8,4,4);for(const f of fx){x.globalAlpha=Math.max(0,f.life/.4);x.fillStyle=f.color;x.fillRect(f.x,f.y,3,3)}x.globalAlpha=1;x.restore()}function move(clientX){const r=c.getBoundingClientRect();player.x=Math.max(0,Math.min(W-player.w,(clientX-r.left)*W/r.width-player.w/2))}c.addEventListener('pointerdown',e=>move(e.clientX));c.addEventListener('pointermove',e=>move(e.clientX));document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){activatePhase();e.preventDefault()}if(['ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});document.addEventListener('keyup',e=>keys[e.key]=false);$('play').onclick=reset;let lastTime=performance.now();function loop(now){const dt=Math.min(.033,(now-lastTime)/1000);lastTime=now;update(dt);draw();requestAnimationFrame(loop)}player={x:W/2-14,y:H-70,w:28,h:28};requestAnimationFrame(loop)})();</script></body></html>
