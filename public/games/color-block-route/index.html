<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Color Block Route</title><link rel="stylesheet" href="/games/_color-puzzle/core.css"><style>
.board-card{padding:9px;background:linear-gradient(180deg,#1d3c68,#112947 100%);border-color:#5d7da8}.goals{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}.goal{display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 4px;border-radius:11px;background:linear-gradient(#f9fcff,#dce8f4);border:1px solid #b8cce1;color:#2c4e71;font-size:8px;font-weight:1000;box-shadow:0 4px 10px #07162b44}.goal i{width:16px;height:16px;border-radius:5px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 65%,#fff),var(--c));border:2px solid color-mix(in srgb,var(--c) 60%,#24405b);box-shadow:inset 0 2px #fff8}.wrap{display:grid;place-items:center}.board{position:relative;width:min(96vw,440px);height:min(58vh,510px);min-height:450px;border-radius:25px;padding:12px;background:linear-gradient(145deg,#354b62,#15283b 62%,#0c1a29);border:7px solid #71879d;box-shadow:inset 0 0 0 3px #0a1622,inset 0 8px 18px #ffffff12,0 14px 25px #020a1677}.board:before{content:"";position:absolute;inset:9px;border-radius:17px;box-shadow:inset 0 0 26px #0005;pointer-events:none;z-index:2}.tiles{position:absolute;inset:12px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:5px}.tile{border-radius:8px;background:linear-gradient(#314960,#22374a);border:1px solid #49647e;box-shadow:inset 0 2px #ffffff0f}.tile.wall{background:repeating-linear-gradient(135deg,#667482 0 7px,#4d5965 7px 14px);border-color:#8a969f;box-shadow:inset 0 0 0 2px #39444d}.block{--c:#3f8cff;position:absolute;border:3px solid color-mix(in srgb,var(--c) 58%,#fff);border-radius:13px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 68%,#fff),var(--c) 54%,color-mix(in srgb,var(--c) 72%,#14263a));box-shadow:inset 0 3px #fff8,inset 0 -6px #0002,0 6px 0 color-mix(in srgb,var(--c) 42%,#20364a),0 10px 11px #06132480;display:grid;place-items:center;cursor:pointer;z-index:5;transition:left .26s,top .26s,transform .14s,opacity .2s}.block:after{content:"";position:absolute;inset:6px;border-radius:8px;border:1px solid #ffffff42}.block b{font-size:27px;color:#fff;text-shadow:0 3px 4px #17324c66;z-index:2}.block:hover{transform:scale(1.04)}.gate{--c:#3f8cff;position:absolute;z-index:12;border:3px solid #fff;border-radius:9px;background:linear-gradient(color-mix(in srgb,var(--c) 72%,#fff),var(--c) 58%,color-mix(in srgb,var(--c) 72%,#14304a));box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 58%,#2b4258),0 0 18px color-mix(in srgb,var(--c) 58%,transparent);color:#fff;font-weight:1000;display:grid;place-items:center;text-shadow:0 2px #17334e88}.gate.top,.gate.bottom{width:49px;height:29px;left:calc(12px + var(--p)*((100% - 24px)/6) + 4px)}.gate.top{top:-17px}.gate.bottom{bottom:-17px}.gate.left,.gate.right{height:49px;width:29px;top:calc(12px + var(--p)*((100% - 24px)/6) + 4px)}.gate.left{left:-17px}.gate.right{right:-17px}.gate:after{content:"";position:absolute;inset:-6px;border:2px solid color-mix(in srgb,var(--c) 60%,#fff);border-radius:12px;opacity:.35;animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.08);opacity:.12}}.burst{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%) scale(.5);opacity:0;color:#fff5a3;font-size:38px;font-weight:1000;text-shadow:0 4px #d05c21,0 0 18px #ffae22}.burst.show{animation:burst .65s ease}@keyframes burst{35%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-72%) scale(.8)}}.route-note{margin:9px auto 0;width:min(96vw,440px);display:flex;justify-content:space-between;gap:6px;color:#bdd2e8;font-size:7px;font-weight:900}.route-note span{flex:1;text-align:center;padding:5px;border-radius:9px;background:#0b1d36aa;border:1px solid #3d5f85}
</style></head><body><main class="game-shell"><div class="topbar"><div class="brand">Color <span>Block Route</span></div><div class="level-pill">LEVEL <span id="level">1</span></div><div class="top-actions"><button class="icon-btn" id="sound">🔊</button><button class="icon-btn" id="restart">↻</button></div></div><div class="stats"><div class="stat"><small>Moves</small><b id="moves">0</b></div><div class="stat"><small>Cleared</small><b id="cleared">0/6</b></div><div class="stat"><small>Best</small><b id="best">—</b></div></div><section class="board-card"><div class="goals" id="goals"></div><div class="wrap"><div class="board" id="board"><div class="tiles" id="tiles"></div><div class="burst" id="burst">NICE!</div></div></div><div class="route-note"><span>SLIDE</span><span>MATCH EXIT</span><span>CLEAR ROUTE</span></div><div class="game-caption">Tap a colored block. It slides along the arrow and disappears only through its matching gate.</div><div class="modal-wrap" id="modal"><div class="modal"><div class="stars">⭐ ⭐ ⭐</div><h2>Routes cleared!</h2><p id="result"></p><div class="modal-actions"><button class="secondary-btn" id="again">Replay</button><button class="primary-btn" id="next">Next Level</button></div></div></div></section><div class="tools"><button class="tool-btn" id="undo"><b>↶</b><span>UNDO</span></button><button class="tool-btn" id="hint"><b>💡</b><span>HINT</span></button><button class="tool-btn" id="reset"><b>↻</b><span>RESET</span></button></div></main><script src="/games/_color-puzzle/core.js"></script><script>
const $=x=>document.getElementById(x),P=ZP.colors,N=6,D={U:[-1,0,'↑'],D:[1,0,'↓'],L:[0,-1,'←'],R:[0,1,'→']};let level=Math.max(1,ZP.store('block-route-level',1)),moves=0,best=ZP.store('block-route-best',0),blocks=[],walls=[[2,2],[3,2],[3,3]],gates=[['top',0,4],['right',1,0],['bottom',4,1],['left',5,2]],history=[];$('best').textContent=best||'—';function init(){moves=0;history=[];blocks=[[0,4,'U',4],[1,1,'R',0],[4,4,'D',1],[5,3,'L',2],[2,4,'R',0],[4,1,'L',2]].map((b,i)=>({r:b[0],c:b[1],d:b[2],color:b[3],id:i,gone:false}));$('moves').textContent=0;$('level').textContent=level;$('modal').classList.remove('show');renderStatic();render();ZP.emit('game_start',{game:'color-block-route',level})}function renderStatic(){$('tiles').innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){let e=document.createElement('i');e.className='tile'+(walls.some(w=>w[0]===r&&w[1]===c)?' wall':'');$('tiles').appendChild(e)}$('board').querySelectorAll('.gate').forEach(e=>e.remove());gates.forEach(g=>{let e=document.createElement('div');e.className='gate '+g[0];e.style.cssText=`--c:${P[g[2]]};--p:${g[1]}`;e.textContent=g[0]==='top'?'↓':g[0]==='bottom'?'↑':g[0]==='left'?'→':'←';$('board').appendChild(e)});let cnt={};blocks.forEach(b=>cnt[b.color]=(cnt[b.color]||0)+1);$('goals').innerHTML=Object.entries(cnt).map(([c,n])=>`<span class="goal" style="--c:${P[c]}"><i></i>${n} BLOCKS</span>`).join('')}function dim(){let b=$('board').getBoundingClientRect(),pad=12,gap=5,cellW=(b.width-pad*2-gap*5)/6,cellH=(b.height-pad*2-gap*5)/6;return{pad,gap,cellW,cellH,stepX:cellW+gap,stepY:cellH+gap}}function render(){$('board').querySelectorAll('.block').forEach(e=>e.remove());let d=dim();blocks.filter(b=>!b.gone).forEach(b=>{let e=document.createElement('button');e.className='block';e.style.cssText=`--c:${P[b.color]};left:${d.pad+b.c*d.stepX}px;top:${d.pad+b.r*d.stepY}px;width:${d.cellW}px;height:${d.cellH}px`;e.innerHTML=`<b>${D[b.d][2]}</b>`;e.onclick=()=>move(b,e);$('board').appendChild(e)});let n=blocks.filter(b=>b.gone).length;$('cleared').textContent=`${n}/6`}function occupied(r,c,self){return r<0||r>=6||c<0||c>=6||walls.some(w=>w[0]===r&&w[1]===c)||blocks.some(b=>!b.gone&&b.id!==self&&b.r===r&&b.c===c)}function atGate(b){return gates.some(g=>g[2]===b.color&&((g[0]==='top'&&b.r===0&&b.c===g[1]&&b.d==='U')||(g[0]==='bottom'&&b.r===5&&b.c===g[1]&&b.d==='D')||(g[0]==='left'&&b.c===0&&b.r===g[1]&&b.d==='L')||(g[0]==='right'&&b.c===5&&b.r===g[1]&&b.d==='R')))}function move(b,e){let [dr,dc]=D[b.d],snap=JSON.parse(JSON.stringify(blocks)),changed=false;while(!occupied(b.r+dr,b.c+dc,b.id)){b.r+=dr;b.c+=dc;changed=true}if(!changed&&!atGate(b)){ZP.sfx('bad');e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),250);return ZP.toast('That route is blocked')}history.push(snap);moves++;$('moves').textContent=moves;let d=dim();e.style.left=(d.pad+b.c*d.stepX)+'px';e.style.top=(d.pad+b.r*d.stepY)+'px';setTimeout(()=>{if(atGate(b)){b.gone=true;ZP.sfx('clear');ZP.vibrate();e.style.opacity='0';e.style.transform='scale(.35)';let x=$('burst');x.classList.remove('show');void x.offsetWidth;x.classList.add('show')}else ZP.sfx('tap');render();if(blocks.every(x=>x.gone))win()},280)}function win(){if(!best||moves<best){best=moves;ZP.save('block-route-best',best);$('best').textContent=best}ZP.save('block-route-level',level);ZP.sfx('win');ZP.confetti();$('result').textContent=`6 blocks cleared · ${moves} moves`;$('modal').classList.add('show');ZP.emit('game_end',{game:'color-block-route',result:'win',level,moves})}$('undo').onclick=()=>{if(history.length){blocks=history.pop();moves=Math.max(0,moves-1);$('moves').textContent=moves;render()}};$('hint').onclick=()=>ZP.toast('Clear blockers first, then send each color to its matching gate');$('reset').onclick=init;$('restart').onclick=init;$('again').onclick=init;$('next').onclick=()=>{level++;ZP.save('block-route-level',level);init()};$('sound').onclick=()=>{$('sound').textContent=ZP.toggleAudio()?'🔊':'🔇'};addEventListener('resize',render);init();
</script></body></html>
