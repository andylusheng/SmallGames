<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Color Block Route</title><link rel="stylesheet" href="/games/_color-puzzle/core.css"><style>
.board-card{padding:12px}.goalbar{display:flex;justify-content:center;gap:8px;margin-bottom:10px}.goal{display:flex;align-items:center;gap:5px;padding:7px 9px;border-radius:11px;background:#0a1a2e;border:1px solid #27496d;font-size:11px;font-weight:800}.dot{width:12px;height:12px;border-radius:3px;background:var(--c);box-shadow:0 0 10px var(--c)}
.grid-wrap{display:grid;place-items:center;height:360px}.grid{--n:6;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:5px;width:min(92vw,360px);aspect-ratio:1;padding:8px;border-radius:20px;background:#07111f;border:2px solid #2b4b70;box-shadow:inset 0 0 25px #0007}.cell{position:relative;border-radius:8px;background:linear-gradient(180deg,#112947,#0b1c32);border:1px solid #19395c}.cell.wall{background:repeating-linear-gradient(135deg,#25364d 0 7px,#1a283a 7px 14px);border-color:#42566f}.cell.exit{border:2px solid var(--c);box-shadow:inset 0 0 14px color-mix(in srgb,var(--c) 50%,transparent)}.cell.exit:after{content:"▼";position:absolute;inset:0;display:grid;place-items:center;color:var(--c);font-size:17px;font-weight:900}.block{position:absolute;inset:5px;border:none;border-radius:10px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 65%,#000));box-shadow:inset 0 0 0 2px #ffffff38,0 5px 10px #0005;cursor:pointer;z-index:3;transition:.14s}.block.selected{outline:3px solid #fff;transform:scale(1.05)}.move-pad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,46px);gap:5px;justify-content:center;margin-top:8px}.move-pad button{border:none;border-radius:12px;background:#16345a;color:#fff;font-size:20px;font-weight:900;box-shadow:inset 0 1px #ffffff22;cursor:pointer}.move-pad .up{grid-column:2}.move-pad .left{grid-column:1;grid-row:2}.move-pad .down{grid-column:2;grid-row:2}.move-pad .right{grid-column:3;grid-row:2}.hint{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
</style></head><body><main class="game-shell"><div class="topbar"><div class="brand">Color <span>Block Route</span></div><div class="level-pill">LEVEL <span id="level">1</span></div><div class="top-actions"><button class="icon-btn" id="sound">🔊</button><button class="icon-btn" id="restart">↻</button></div></div><div class="stats"><div class="stat"><small>Moves</small><b id="moves">0</b></div><div class="stat"><small>Blocks Left</small><b id="left">0</b></div><div class="stat"><small>Best</small><b id="best">0</b></div></div><section class="board-card"><div class="goalbar" id="goals"></div><div class="grid-wrap"><div class="grid" id="grid"></div></div><div class="move-pad"><button class="up" data-d="-1,0">↑</button><button class="left" data-d="0,-1">←</button><button class="down" data-d="1,0">↓</button><button class="right" data-d="0,1">→</button></div><div class="hint">Select a block, then move it to the matching colored exit.</div><div class="modal-wrap" id="modal"><div class="modal"><div class="stars">⭐ ⭐ ⭐</div><h2>Routes cleared!</h2><p id="result"></p><div class="modal-actions"><button class="secondary-btn" id="again">Replay</button><button class="primary-btn" id="next">Next Level</button></div></div></div></section><div class="tools"><button class="tool-btn" id="hint"><b>💡</b><span>HINT</span></button><button class="tool-btn" id="undo"><b>↩️</b><span>UNDO</span></button><button class="tool-btn" id="open"><b>🧱</b><span>REMOVE WALL</span></button></div></main><script src="/games/_color-puzzle/core.js"></script><script>
const $=id=>document.getElementById(id),P=ZP.colors,N=6;let level=Math.max(1,+localStorage.getItem('block-route-level')||1),moves=0,best=+localStorage.getItem('block-route-best')||0,blocks=[],walls=[],exits=[],selected=-1,history=[];$('best').textContent=best;
const baseLevels=[
{b:[[1,1,0],[2,4,1],[4,1,2],[4,4,3]],w:[[2,2],[2,3],[3,2],[3,3]],e:[[0,1,0],[0,4,1],[5,1,2],[5,4,3]]},
{b:[[1,2,0],[2,1,1],[3,4,2],[4,3,3]],w:[[1,3],[2,3],[3,2],[4,2]],e:[[0,2,0],[2,0,1],[3,5,2],[5,3,3]]},
{b:[[1,1,0],[1,4,1],[4,1,2],[4,4,3],[2,2,0]],w:[[2,3],[3,3],[3,2]],e:[[0,1,0],[0,4,1],[5,1,2],[5,4,3],[2,5,0]]}
];
function build(){const src=baseLevels[(level-1)%baseLevels.length];moves=0;selected=-1;history=[];blocks=src.b.map((x,i)=>({id:i,r:x[0],c:x[1],color:x[2],gone:false}));walls=src.w.map(x=>[...x]);exits=src.e.map(x=>({r:x[0],c:x[1],color:x[2]}));$('moves').textContent=0;$('level').textContent=level;$('modal').classList.remove('show');render();ZP.emit('game_start',{game:'color-block-route',level})}
function key(r,c){return r+','+c}function occupied(r,c){return blocks.find(b=>!b.gone&&b.r===r&&b.c===c)}function wall(r,c){return walls.some(w=>w[0]===r&&w[1]===c)}function exitAt(r,c){return exits.find(e=>e.r===r&&e.c===c)}
function render(){$('left').textContent=blocks.filter(b=>!b.gone).length;$('goals').innerHTML=exits.map(e=>`<div class="goal"><i class="dot" style="--c:${P[e.color]}"></i>EXIT</div>`).join('');const g=$('grid');g.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){const cell=document.createElement('div');cell.className='cell';cell.dataset.k=key(r,c);if(wall(r,c))cell.classList.add('wall');const ex=exitAt(r,c);if(ex){cell.classList.add('exit');cell.style.setProperty('--c',P[ex.color])}const b=occupied(r,c);if(b){const btn=document.createElement('button');btn.className='block'+(b.id===selected?' selected':'');btn.style.setProperty('--c',P[b.color]);btn.onclick=()=>{selected=b.id;ZP.sfx('tap');render()};cell.appendChild(btn)}g.appendChild(cell)}}
function move(dr,dc){if(selected<0){ZP.toast('Select a block first');return}const b=blocks.find(x=>x.id===selected);if(!b||b.gone)return;const nr=b.r+dr,nc=b.c+dc;if(nr<0||nr>=N||nc<0||nc>=N||wall(nr,nc)||occupied(nr,nc)){ZP.sfx('bad');ZP.toast('Path blocked');return}const ex=exitAt(nr,nc);if(ex&&ex.color!==b.color){ZP.sfx('bad');ZP.toast('Wrong color exit');return}history.push({id:b.id,r:b.r,c:b.c,gone:b.gone});b.r=nr;b.c=nc;moves++;$('moves').textContent=moves;if(ex&&ex.color===b.color){b.gone=true;selected=-1;ZP.sfx('clear');ZP.confetti(innerWidth/2,innerHeight/2,10)}else ZP.sfx('good');ZP.vibrate();render();if(blocks.every(x=>x.gone))setTimeout(win,250)}
function win(){if(best===0||moves<best){best=moves;localStorage.setItem('block-route-best',best);$('best').textContent=best}localStorage.setItem('block-route-level',level);ZP.sfx('win');ZP.confetti();$('result').textContent=`All blocks cleared in ${moves} moves`;$('modal').classList.add('show');ZP.emit('game_end',{game:'color-block-route',result:'win',level,moves})}
document.querySelectorAll('.move-pad button').forEach(btn=>btn.onclick=()=>{const [dr,dc]=btn.dataset.d.split(',').map(Number);move(dr,dc)});addEventListener('keydown',e=>{const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(m){e.preventDefault();move(...m)}});$('undo').onclick=()=>{const h=history.pop();if(!h)return ZP.toast('Nothing to undo');const b=blocks.find(x=>x.id===h.id);b.r=h.r;b.c=h.c;b.gone=h.gone;moves=Math.max(0,moves-1);$('moves').textContent=moves;selected=b.id;render();ZP.sfx('tap')};$('hint').onclick=()=>{const b=blocks.find(x=>!x.gone);if(b){selected=b.id;render();ZP.toast('Move a selected block toward its color exit')}};$('open').onclick=()=>{if(walls.length){walls.pop();render();ZP.sfx('good');ZP.toast('One wall removed')}};$('restart').onclick=build;$('again').onclick=build;$('next').onclick=()=>{level++;localStorage.setItem('block-route-level',level);build()};$('sound').onclick=()=>{$('sound').textContent=ZP.toggleAudio()?'🔊':'🔇'};build();
</script></body></html>
