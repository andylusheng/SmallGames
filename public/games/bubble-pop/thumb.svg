<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="100%" style="stop-color:#4a148c"/>
    </linearGradient>
    <radialGradient id="shine"><stop offset="0%" style="stop-color:#fff;stop-opacity:.4"/><stop offset="100%" style="stop-color:#fff;stop-opacity:0"/></radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Bubbles -->
  <circle cx="80" cy="80" r="28" fill="#ef5350" opacity=".9"/><circle cx="70" cy="70" r="8" fill="url(#shine)"/>
  <circle cx="140" cy="70" r="28" fill="#42a5f5" opacity=".9"/><circle cx="130" cy="60" r="8" fill="url(#shine)"/>
  <circle cx="200" cy="85" r="28" fill="#66bb6a" opacity=".9"/><circle cx="190" cy="75" r="8" fill="url(#shine)"/>
  <circle cx="260" cy="70" r="28" fill="#ef5350" opacity=".9"/><circle cx="250" cy="60" r="8" fill="url(#shine)"/>
  <circle cx="320" cy="80" r="28" fill="#ffee58" opacity=".9"/><circle cx="310" cy="70" r="8" fill="url(#shine)"/>
  <circle cx="110" cy="140" r="28" fill="#66bb6a" opacity=".9"/><circle cx="100" cy="130" r="8" fill="url(#shine)"/>
  <circle cx="170" cy="145" r="28" fill="#ffee58" opacity=".9"/><circle cx="160" cy="135" r="8" fill="url(#shine)"/>
  <circle cx="230" cy="140" r="28" fill="#42a5f5" opacity=".9"/><circle cx="220" cy="130" r="8" fill="url(#shine)"/>
  <circle cx="290" cy="145" r="28" fill="#ab47bc" opacity=".9"/><circle cx="280" cy="135" r="8" fill="url(#shine)"/>
  <circle cx="80" cy="200" r="28" fill="#42a5f5" opacity=".9"/><circle cx="70" cy="190" r="8" fill="url(#shine)"/>
  <circle cx="140" cy="210" r="28" fill="#ef5350" opacity=".9"/><circle cx="130" cy="200" r="8" fill="url(#shine)"/>
  <circle cx="200" cy="200" r="28" fill="#ab47bc" opacity=".9"/><circle cx="190" cy="190" r="8" fill="url(#shine)"/>
  <circle cx="260" cy="210" r="28" fill="#66bb6a" opacity=".9"/><circle cx="250" cy="200" r="8" fill="url(#shine)"/>
  <circle cx="320" cy="200" r="28" fill="#42a5f5" opacity=".9"/><circle cx="310" cy="190" r="8" fill="url(#shine)"/>
  <!-- Pop effect -->
  <circle cx="350" cy="140" r="20" fill="none" stroke="#fff" stroke-width="2" opacity=".5"/>
  <circle cx="350" cy="140" r="12" fill="none" stroke="#fff" stroke-width="1.5" opacity=".3"/>
  <line x1="340" y1="125" x2="335" y2="118" stroke="#fff" stroke-width="2" opacity=".6"/>
  <line x1="362" y1="128" x2="368" y2="122" stroke="#fff" stroke-width="2" opacity=".6"/>
  <line x1="365" y1="150" x2="372" y2="155" stroke="#fff" stroke-width="2" opacity=".6"/>
</svg>
