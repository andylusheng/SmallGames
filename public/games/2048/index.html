<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#faf8ef;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;touch-action:none}
#ui{display:flex;gap:20px;margin-bottom:15px;align-items:center}
#ui h1{font-size:36px;color:#776e65}
.box{background:#bbada0;border-radius:6px;padding:8px 16px;text-align:center;color:#fff}
.box span{display:block;font-size:12px}.box b{font-size:20px}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#bbada0;border-radius:8px;padding:10px;width:340px;height:340px}
.cell{border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:28px;background:rgba(238,228,218,.35)}
#msg{margin-top:15px;color:#776e65;font-size:14px}
#over{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(238,228,218,.7);display:none;align-items:center;justify-content:center;flex-direction:column}
#over h2{font-size:36px;color:#776e65;margin-bottom:10px}
#over button{padding:12px 30px;font-size:16px;background:#8f7a66;color:#fff;border:none;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div id="ui"><h1>2048</h1><div class="box"><span>SCORE</span><b id="sc">0</b></div><div class="box"><span>BEST</span><b id="bs">0</b></div></div>
<div id="grid"></div>
<div id="msg">Use arrow keys or swipe to play</div>
<div id="over"><h2>Game Over!</h2><p style="color:#776e65;margin-bottom:15px">Score: <span id="fs">0</span></p><button onclick="init()">Try Again</button></div>
<script>
let grid,score=0,best=0;
const colors={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
const tcolors={2:'#776e65',4:'#776e65'};

function init(){
  grid=Array(4).fill(null).map(()=>Array(4).fill(0));
  score=0;document.getElementById('sc').textContent='0';
  document.getElementById('over').style.display='none';
  addTile();addTile();render();
}
function addTile(){
  const empty=[];
  for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(grid[r][c]===0)empty.push([r,c]);
  if(!empty.length)return;
  const[r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<0.9?2:4;
}
function render(){
  const el=document.getElementById('grid');el.innerHTML='';
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const v=grid[r][c],d=document.createElement('div');
    d.className='cell';
    if(v){d.textContent=v;d.style.background=colors[v]||'#3c3a32';d.style.color=tcolors[v]||'#f9f6f2';
      if(v>=128)d.style.fontSize='24px';if(v>=1024)d.style.fontSize='20px'}
    el.appendChild(d);
  }
}
function slide(row){
  let a=row.filter(v=>v),merged=[];
  for(let i=0;i<a.length-1;i++){
    if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1)}
  }
  while(a.length<4)a.push(0);
  return a;
}
function move(dir){
  const prev=JSON.stringify(grid);
  if(dir==='left')for(let r=0;r<4;r++)grid[r]=slide(grid[r]);
  if(dir==='right')for(let r=0;r<4;r++)grid[r]=slide(grid[r].reverse()).reverse();
  if(dir==='up'){for(let c=0;c<4;c++){let col=[grid[0][c],grid[1][c],grid[2][c],grid[3][c]];col=slide(col);for(let r=0;r<4;r++)grid[r][c]=col[r]}}
  if(dir==='down'){for(let c=0;c<4;c++){let col=[grid[3][c],grid[2][c],grid[1][c],grid[0][c]];col=slide(col);for(let r=0;r<4;r++)grid[3-r][c]=col[r]}}
  if(JSON.stringify(grid)!==prev){
    addTile();render();
    document.getElementById('sc').textContent=score;
    best=Math.max(best,score);document.getElementById('bs').textContent=best;
    if(isGameOver()){document.getElementById('fs').textContent=score;document.getElementById('over').style.display='flex'}
  }
}
function isGameOver(){
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    if(grid[r][c]===0)return false;
    if(c<3&&grid[r][c]===grid[r][c+1])return false;
    if(r<3&&grid[r][c]===grid[r+1][c])return false;
  }
  return true;
}
document.addEventListener('keydown',e=>{
  const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
  if(map[e.key]){e.preventDefault();move(map[e.key])}
});
let sx,sy;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
  else move(dy>0?'down':'up');
});
init();
</script>
<script>
(function(){function z(){document.body.style.zoom=1;var w=Math.max(document.documentElement.scrollWidth,320);var h=Math.max(document.documentElement.scrollHeight,320);var s=Math.min((innerWidth-12)/w,(innerHeight-12)/h,1.85);if(s>1.05)document.body.style.zoom=s;else document.body.style.zoom=1}z();addEventListener('resize',z)})();
</script>
</body>
</html>
