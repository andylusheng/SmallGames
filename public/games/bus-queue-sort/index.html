<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Bus Queue Sort</title><link rel="stylesheet" href="/games/_color-puzzle/core.css"><style>
.board-card{padding:9px;background:linear-gradient(180deg,#7dccf1 0 15%,#7dbc72 15% 22%,#cad5dc 22% 100%);border-color:#79a9cd}.station{min-height:500px;border-radius:19px;overflow:hidden;position:relative;background:linear-gradient(#8bd7ff 0 16%,#82b96d 16% 21%,#d4dce2 21% 100%);border:2px solid #9cbdd3;box-shadow:inset 0 0 0 1px #fff7}.station:before{content:"";position:absolute;left:0;right:0;top:21%;height:88px;background:repeating-linear-gradient(90deg,#687681 0 52px,#75848f 52px 55px);border-top:4px solid #f8f0ca;border-bottom:4px solid #fff;box-shadow:0 6px 16px #1c344044}.station:after{content:"";position:absolute;left:0;right:0;top:calc(21% + 40px);height:4px;background:repeating-linear-gradient(90deg,#fff 0 26px,transparent 26px 45px);opacity:.85}.tag{position:absolute;z-index:8;top:5px;left:50%;transform:translateX(-50%);padding:5px 11px;border-radius:999px;background:linear-gradient(#fff,#dcefff);border:1px solid #9dbed8;color:#315473;font-size:8px;font-weight:1000;white-space:nowrap;box-shadow:0 4px 10px #2f597526}.buses{position:relative;z-index:9;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:42px 7px 10px}.buscard{position:relative;text-align:center;padding:4px 2px 1px}.bus{--c:#3f8cff;height:62px;border-radius:13px 13px 9px 9px;position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 48%,#fff),var(--c) 54%,color-mix(in srgb,var(--c) 72%,#17283d));border:3px solid color-mix(in srgb,var(--c) 62%,#273d53);box-shadow:inset 0 3px #fff9,inset 0 -6px #0002,0 7px 0 color-mix(in srgb,var(--c) 50%,#213346),0 11px 12px #213a4b44;transform-origin:center bottom}.bus .front{position:absolute;left:5px;right:5px;top:5px;height:29px;border-radius:8px;background:linear-gradient(#e7f9ff,#9bd3ee);border:2px solid #fff8;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}.bus .front i{border-radius:3px;background:linear-gradient(145deg,#c8edff,#78b7dc);box-shadow:inset 0 1px #fff}.bus .bumper{position:absolute;left:8px;right:8px;bottom:7px;height:8px;border-radius:999px;background:#fff7;box-shadow:inset 0 -2px #0002}.bus:before,.bus:after{content:"";position:absolute;bottom:-10px;width:14px;height:14px;border-radius:50%;background:#142a3d;border:4px solid #263e52;box-shadow:inset 0 0 0 2px #0a1723}.bus:before{left:9px}.bus:after{right:9px}.buscard b{display:block;margin-top:11px;color:#18344e;font-size:8px;font-weight:1000;background:#ffffffe8;border:1px solid #a9c5d9;border-radius:999px;padding:3px 2px}.waiting{position:relative;z-index:7;margin:4px 8px 5px;padding:5px 7px;min-height:38px;border-radius:11px;background:#f8fbfddf;border:1px solid #aebfcb;display:flex;gap:6px;align-items:center;box-shadow:0 3px 9px #304b5d28}.waiting strong{font-size:7px;color:#657b8d}.slots{display:flex;gap:4px}.slot{width:24px;height:27px;border:1px dashed #8ba0b1;border-radius:7px;background:#eaf1f5;display:grid;place-items:center}.queues{position:relative;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:3px 7px 8px}.queues:after{content:"BOARDING ZONE  •  KEEP THE LANES CLEAR";position:absolute;left:8px;right:8px;top:100%;height:74px;border-top:2px dashed #9eacb6;background:repeating-linear-gradient(90deg,transparent 0 34px,#ffffff8a 35px 38px,transparent 39px 72px);color:#81909b;font-size:7px;font-weight:1000;letter-spacing:1px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;opacity:.72}.queue{min-height:275px;border:1px solid #9cb2c2;border-radius:16px;background:linear-gradient(180deg,#ffffffd9,#edf4f8d9);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:7px 2px 5px;box-shadow:0 6px 10px #24475d24,inset 0 1px #fff;position:relative}.queue:before{content:"";position:absolute;top:8px;bottom:8px;left:50%;width:2px;background:repeating-linear-gradient(#c9d7e1 0 10px,transparent 10px 16px);opacity:.7}.queue small{font-size:6px;color:#8093a3;font-weight:1000;letter-spacing:.7px;margin-bottom:auto;z-index:2}.people{display:flex;flex-direction:column-reverse;gap:1px;align-items:center;z-index:3}.people>span{display:block;height:37px;flex:0 0 37px;position:relative}.person{--c:#3f8cff;display:block;width:30px;height:39px;position:relative;cursor:pointer;filter:drop-shadow(0 3px 2px #213b4f40);transform-origin:center bottom}.person .head{position:absolute;width:13px;height:13px;border-radius:50%;left:8px;top:0;background:linear-gradient(135deg,#ffe2c4,#dca879);border:1px solid #b98a66;z-index:3}.person .body{position:absolute;left:6px;right:6px;top:11px;height:18px;border-radius:8px 8px 5px 5px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c));border:2px solid color-mix(in srgb,var(--c) 64%,#264259);z-index:2}.person .arm{position:absolute;top:13px;width:6px;height:16px;border-radius:5px;background:var(--c);border:1px solid color-mix(in srgb,var(--c) 65%,#29445a)}.person .arm.l{left:2px;transform:rotate(10deg)}.person .arm.r{right:2px;transform:rotate(-10deg)}.person .leg{position:absolute;top:27px;width:7px;height:11px;border-radius:0 0 5px 5px;background:color-mix(in srgb,var(--c) 72%,#20354a);z-index:1}.person .leg.l{left:7px}.person .leg.r{right:7px}.person.front{animation:bob 1.05s ease-in-out infinite;filter:drop-shadow(0 0 7px #fff) drop-shadow(0 3px 2px #213b4f40)}@keyframes bob{50%{transform:translateY(-3px)}}.person.mini{transform:scale(.68);transform-origin:center}.depart{animation:drive .62s cubic-bezier(.4,.1,.5,1) forwards}@keyframes drive{45%{transform:translateX(8px) rotate(-2deg)}100%{transform:translateX(170%) scale(.86);opacity:0}}.flying{position:fixed;z-index:2000;pointer-events:none;transition:transform .38s cubic-bezier(.2,.7,.2,1),opacity .38s}.platform-sign{position:absolute;right:8px;top:165px;z-index:5;padding:6px 7px;border-radius:8px;background:#324b5c;color:#fff;font-size:6px;font-weight:1000;box-shadow:0 3px 7px #1c303d55}.platform-sign i{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 1px}
</style></head><body><main class="game-shell"><div class="topbar"><div class="brand">Bus <span>Queue Sort</span></div><div class="level-pill">LEVEL <span id="level">1</span></div><div class="top-actions"><button class="icon-btn" id="sound">🔊</button><button class="icon-btn" id="restart">↻</button></div></div><div class="stats"><div class="stat"><small>Moves</small><b id="moves">0</b></div><div class="stat"><small>Boarded</small><b id="boarded">0</b></div><div class="stat"><small>Best</small><b id="best">—</b></div></div><section class="board-card"><div class="station"><div class="tag">MATCH PASSENGERS TO THE SAME COLOR BUS</div><div class="buses" id="buses"></div><div class="platform-sign">PLATFORM <i style="background:#8e63f5"></i><i style="background:#ffc94b"></i><i style="background:#3f8cff"></i><i style="background:#45c96b"></i></div><div class="waiting"><strong>WAITING</strong><div class="slots" id="waiting"></div></div><div class="queues" id="queues"></div></div><div class="modal-wrap" id="modal"><div class="modal"><div class="stars">⭐ ⭐ ⭐</div><h2>Station cleared!</h2><p id="result"></p><div class="modal-actions"><button class="secondary-btn" id="again">Replay</button><button class="primary-btn" id="next">Next Level</button></div></div></div></section><div class="tools"><button class="tool-btn" id="hint"><b>💡</b><span>HINT</span></button><button class="tool-btn" id="slot"><b>➕</b><span>EXTRA SLOT</span></button><button class="tool-btn" id="refresh"><b>🔄</b><span>REFRESH BUSES</span></button></div><div class="game-caption">Tap the front passenger. Matching colors walk onto the bus; unmatched passengers wait.</div></main><script src="/games/_color-puzzle/core.js"></script><script>
const $=x=>document.getElementById(x),P=ZP.colors;let level=Math.max(1,ZP.store('bus-sort-level',1)),moves=0,done=0,best=ZP.store('bus-sort-best',0),queues=[],buses=[],waiting=[],cap=5,busy=false;const COLORS=[4,2,0,1],names=['Blue','Green','Yellow','Orange','Red','Purple'];$('best').textContent=best||'—';function rnd(){return COLORS[Math.floor(Math.random()*COLORS.length)]}function person(c,mini=''){return `<i class="person ${mini}" style="--c:${P[c]}"><i class="head"></i><i class="body"></i><i class="arm l"></i><i class="arm r"></i><i class="leg l"></i><i class="leg r"></i></i>`}function build(){moves=done=0;waiting=[];cap=5;queues=Array.from({length:5},()=>Array.from({length:5+Math.floor(Math.random()*2)},rnd));buses=COLORS.map(c=>({c,count:0}));$('level').textContent=level;$('moves').textContent=0;$('boarded').textContent=0;$('modal').classList.remove('show');render();ZP.emit('game_start',{game:'bus-queue-sort',level})}function render(){$('buses').innerHTML=buses.map((b,i)=>`<div class="buscard" data-b="${i}"><div class="bus" style="--c:${P[b.c]}"><div class="front"><i></i><i></i><i></i></div><div class="bumper"></div></div><b>${b.count}/4</b></div>`).join('');$('queues').innerHTML=queues.map((q,i)=>`<div class="queue" data-q="${i}"><small>QUEUE ${i+1}</small><div class="people">${q.map((c,k)=>`<span data-k="${k}" class="${k===q.length-1?'frontwrap':''}">${person(c,k===q.length-1?'front':'')}</span>`).join('')}</div><small>TAP FRONT</small></div>`).join('');document.querySelectorAll('.queue').forEach(e=>e.onclick=ev=>{let f=ev.target.closest('.frontwrap');if(f)pick(+e.dataset.q,f)});renderWait()}function renderWait(){$('waiting').innerHTML='';for(let i=0;i<cap;i++){let s=document.createElement('span');s.className='slot';if(waiting[i]!=null){s.innerHTML=person(waiting[i],'mini');s.onclick=()=>tryWait(i,s)}$('waiting').appendChild(s)}}function busFor(c){return buses.findIndex(b=>b.c===c&&b.count<4)}function fly(from,bi,c,cb){let target=document.querySelector(`[data-b="${bi}"] .bus`);if(!from||!target){cb();return}let a=from.getBoundingClientRect(),b=target.getBoundingClientRect(),f=document.createElement('div');f.className='flying';f.innerHTML=person(c);f.style.left=(a.left+a.width/2-15)+'px';f.style.top=(a.top+a.height/2-20)+'px';document.body.appendChild(f);requestAnimationFrame(()=>{f.style.transform=`translate(${b.left+b.width/2-(a.left+a.width/2)}px,${b.top+b.height/2-(a.top+a.height/2)}px) scale(.55)`;f.style.opacity='.45'});setTimeout(()=>{f.remove();cb()},390)}function pick(qi,from){if(busy||!queues[qi].length)return;let c=queues[qi][queues[qi].length-1],bi=busFor(c);moves++;$('moves').textContent=moves;if(bi<0){if(waiting.length>=cap){ZP.sfx('bad');return ZP.toast('Waiting is full')}queues[qi].pop();waiting.push(c);ZP.sfx('tap');render();return}busy=true;queues[qi].pop();fly(from,bi,c,()=>{board(bi);busy=false;render()})}function tryWait(i,from){if(busy)return;let c=waiting[i],bi=busFor(c);if(bi<0)return ZP.toast('No matching bus yet');busy=true;waiting.splice(i,1);fly(from,bi,c,()=>{board(bi);busy=false;render()})}function board(i){buses[i].count++;done++;$('boarded').textContent=done;ZP.sfx('good');ZP.vibrate();if(buses[i].count===4)setTimeout(()=>depart(i),100);check()}function depart(i){let e=document.querySelector(`[data-b="${i}"]`);e?.classList.add('depart');ZP.sfx('drive');setTimeout(()=>{let need=[...waiting,...queues.filter(q=>q.length).map(q=>q[q.length-1])];buses[i]={c:need.length?need[Math.floor(Math.random()*need.length)]:rnd(),count:0};render();autoWait();check()},650)}function autoWait(){for(let i=waiting.length-1;i>=0;i--){let bi=busFor(waiting[i]);if(bi>=0){waiting.splice(i,1);buses[bi].count++;done++;$('boarded').textContent=done;if(buses[bi].count===4){setTimeout(()=>depart(bi),80);break}}}renderWait()}function check(){if(queues.every(q=>!q.length)&&!waiting.length)setTimeout(win,260)}function win(){if(!best||moves<best){best=moves;ZP.save('bus-sort-best',best);$('best').textContent=best}ZP.save('bus-sort-level',level);ZP.sfx('win');ZP.confetti();$('result').textContent=`${done} passengers · ${moves} moves`;$('modal').classList.add('show');ZP.emit('game_end',{game:'bus-queue-sort',result:'win',level,moves})}$('hint').onclick=()=>ZP.toast('Tap a front passenger matching one of the four buses');$('slot').onclick=()=>{if(cap<7){cap++;renderWait();ZP.sfx('good')}};$('refresh').onclick=()=>{let need=[...waiting,...queues.filter(q=>q.length).map(q=>q[q.length-1])];buses=buses.map((b,i)=>({c:need[i%Math.max(1,need.length)]??rnd(),count:b.count}));render()};$('restart').onclick=build;$('again').onclick=build;$('next').onclick=()=>{level++;ZP.save('bus-sort-level',level);build()};$('sound').onclick=()=>{$('sound').textContent=ZP.toggleAudio()?'🔊':'🔇'};build();
</script></body></html>
