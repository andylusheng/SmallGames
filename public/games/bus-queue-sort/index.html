<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Bus Queue Sort</title><link rel="stylesheet" href="/games/_color-puzzle/core.css"><style>
.board-card{padding:12px}.station{display:grid;grid-template-rows:auto auto 1fr;gap:10px;height:100%}.buses{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.bus{position:relative;min-height:78px;border-radius:16px;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 60%,#10243d));border:2px solid color-mix(in srgb,var(--c) 75%,#fff);box-shadow:inset 0 2px rgba(255,255,255,.28),0 8px 18px rgba(0,0,0,.2);overflow:hidden;padding:8px;color:#07111f;font-weight:900}.bus:before{content:"";position:absolute;left:12px;right:12px;top:12px;height:25px;border-radius:8px;background:linear-gradient(90deg,#d9f7ff 0 30%,#96d9ff 30% 47%,#d9f7ff 47% 77%,#96d9ff 77%);opacity:.8}.bus-name{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px}.seatbar{position:absolute;left:12px;right:12px;bottom:27px;height:7px;border-radius:99px;background:#07111f44;overflow:hidden}.seatbar i{display:block;height:100%;width:var(--p);background:#fff8;border-radius:99px}.waiting{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:#09192d;border:1px solid #284463}.waiting b{font-size:11px;color:var(--muted)}.wait-slots{display:flex;gap:5px;flex:1}.wait-slot{width:27px;height:27px;border-radius:50%;border:1px dashed #507196;display:grid;place-items:center}.person{width:25px;height:25px;border-radius:50% 50% 44% 44%;background:var(--c);box-shadow:inset 0 0 0 3px #ffffff28,0 4px 7px #0004;position:relative}.person:before{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#ffe7c7;left:8px;top:4px}.queues{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;align-items:end}.queue{min-height:270px;border-radius:17px;background:linear-gradient(180deg,#102641,#09172a);border:1px solid #29496d;padding:7px;display:flex;flex-direction:column;gap:5px;justify-content:flex-start;align-items:center;position:relative}.queue:after{content:"TAP FRONT";margin-top:auto;font-size:9px;color:#7089a7;letter-spacing:.7px}.passenger{width:38px;height:38px;border:none;border-radius:50% 50% 42% 42%;background:var(--c);box-shadow:inset 0 0 0 4px #ffffff25,0 6px 9px #0005;cursor:pointer;position:relative;transition:.18s}.passenger:before{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:#ffe8c8;left:12px;top:6px}.passenger:not(:first-child){opacity:.72;transform:scale(.92);pointer-events:none}.passenger.board{transform:translateY(-70px) scale(.3);opacity:0}.progress{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;font-size:11px;color:#9fb3ca;pointer-events:none}
</style></head><body><main class="game-shell"><div class="topbar"><div class="brand">Bus <span>Queue Sort</span></div><div class="level-pill">LEVEL <span id="level">1</span></div><div class="top-actions"><button class="icon-btn" id="sound">🔊</button><button class="icon-btn" id="restart">↻</button></div></div><div class="stats"><div class="stat"><small>Moves</small><b id="moves">0</b></div><div class="stat"><small>Buses</small><b><span id="done">0</span>/8</b></div><div class="stat"><small>Best</small><b id="best">0</b></div></div><section class="board-card"><div class="station"><div class="buses" id="buses"></div><div class="waiting"><b>WAITING</b><div class="wait-slots" id="waiting"></div></div><div class="queues" id="queues"></div></div><div class="modal-wrap" id="modal"><div class="modal"><div class="stars">⭐ ⭐ ⭐</div><h2>Station cleared!</h2><p id="result"></p><div class="modal-actions"><button class="secondary-btn" id="again">Replay</button><button class="primary-btn" id="next">Next Level</button></div></div></div></section><div class="tools"><button class="tool-btn" id="hint"><b>💡</b><span>HINT</span></button><button class="tool-btn" id="extra"><b>➕</b><span>EXTRA SLOT</span></button><button class="tool-btn" id="refresh"><b>🔄</b><span>REFRESH QUEUE</span></button></div></main><script src="/games/_color-puzzle/core.js"></script><script>
const P=ZP.colors,$=id=>document.getElementById(id);let level=Math.max(1,+localStorage.getItem('bus-sort-level')||1),moves=0,best=+localStorage.getItem('bus-sort-best')||0,sequence=[],active=[],queues=[],waiting=[],waitCap=5,done=0;const seats=4;$('best').textContent=best;
function rng(seed){let s=seed*1664525+1013904223;return()=>((s=(s*1664525+1013904223)>>>0)/4294967296)}
function build(){const r=rng(level+91),colorCount=Math.min(4+Math.floor((level-1)/5),6);moves=0;done=0;waiting=[];waitCap=5;$('moves').textContent=0;$('done').textContent=0;$('level').textContent=level;$('modal').classList.remove('show');sequence=Array.from({length:8},(_,i)=>Math.floor(r()*colorCount));active=sequence.slice(0,3).map((c,i)=>({color:c,count:0,seq:i}));const passengers=[];sequence.forEach(c=>{for(let i=0;i<seats;i++)passengers.push(c)});for(let i=passengers.length-1;i;i--){const j=Math.floor(r()*(i+1));[passengers[i],passengers[j]]=[passengers[j],passengers[i]]}queues=Array.from({length:4},()=>[]);passengers.forEach((c,i)=>queues[i%4].push(c));render();ZP.emit('game_start',{game:'bus-queue-sort',level})}
function render(){renderBuses();$('waiting').innerHTML=Array.from({length:waitCap},(_,i)=>`<div class="wait-slot">${waiting[i]!==undefined?`<div class="person" style="--c:${P[waiting[i]]}"></div>`:''}</div>`).join('');$('queues').innerHTML=queues.map((q,qi)=>`<div class="queue" data-q="${qi}">${q.map((c,i)=>`<button class="passenger" style="--c:${P[c]}" data-q="${qi}" data-i="${i}"></button>`).join('')}</div>`).join('');document.querySelectorAll('.passenger:first-child').forEach(el=>el.onclick=()=>tapQueue(+el.dataset.q))}
function renderBuses(){$('buses').innerHTML=active.map((b,i)=>`<div class="bus" style="--c:${P[b.color]}"><div class="seatbar"><i style="--p:${b.count/seats*100}%"></i></div><div class="bus-name">${b.count}/${seats}</div></div>`).join('')}
function findBus(color){return active.findIndex(b=>b.color===color&&b.count<seats)}
function tapQueue(qi){if(!queues[qi].length)return;const color=queues[qi][0],busIdx=findBus(color);if(busIdx<0&&waiting.length>=waitCap){ZP.sfx('bad');ZP.toast('Waiting area is full');$('queues').classList.add('shake');setTimeout(()=>$('queues').classList.remove('shake'),260);return}moves++;$('moves').textContent=moves;queues[qi].shift();if(busIdx>=0){board(color,busIdx);ZP.sfx('good')}else{waiting.push(color);ZP.sfx('tap')}ZP.vibrate();render();checkDeadlock()}
function board(color,busIdx){const b=active[busIdx];b.count++;if(b.count===seats){done++;$('done').textContent=done;ZP.sfx('clear');setTimeout(()=>ZP.confetti(innerWidth/2,160,12),10);const nextIndex=done+2;if(nextIndex<sequence.length)active[busIdx]={color:sequence[nextIndex],count:0,seq:nextIndex};else active.splice(busIdx,1);flushWaiting()}}
function flushWaiting(){let changed=true;while(changed){changed=false;for(let i=0;i<waiting.length;i++){const bi=findBus(waiting[i]);if(bi>=0){const c=waiting.splice(i,1)[0];board(c,bi);changed=true;break}}}}
function checkDeadlock(){flushWaiting();render();if(done>=sequence.length){win();return}const playable=queues.some(q=>q.length&&findBus(q[0])>=0)||waiting.length<waitCap;if(!playable){ZP.sfx('bad');ZP.toast('Queue jam — use a tool or restart')}}
function win(){if(best===0||moves<best){best=moves;localStorage.setItem('bus-sort-best',best);$('best').textContent=best}localStorage.setItem('bus-sort-level',level);ZP.sfx('win');ZP.confetti();$('result').textContent=`8 buses sent · ${moves} moves`;$('modal').classList.add('show');ZP.emit('game_end',{game:'bus-queue-sort',result:'win',level,moves})}
$('hint').onclick=()=>{const qi=queues.findIndex(q=>q.length&&findBus(q[0])>=0);if(qi>=0){const el=document.querySelector(`.queue[data-q="${qi}"] .passenger`);el?.classList.add('pop');setTimeout(()=>el?.classList.remove('pop'),320);ZP.toast('This passenger can board now')}else ZP.toast('Use an extra slot')};$('extra').onclick=()=>{if(waitCap<7){waitCap++;render();ZP.sfx('good');ZP.toast('Waiting slot added')}};$('refresh').onclick=()=>{queues.forEach(q=>q.sort(()=>Math.random()-.5));render();ZP.sfx('tap');ZP.toast('Queues refreshed')};$('restart').onclick=build;$('again').onclick=build;$('next').onclick=()=>{level++;localStorage.setItem('bus-sort-level',level);build()};$('sound').onclick=()=>{$('sound').textContent=ZP.toggleAudio()?'🔊':'🔇'};build();
</script></body></html>
