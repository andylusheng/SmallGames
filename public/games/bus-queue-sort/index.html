<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bus Queue Sort — Play Free</title>
<link rel="stylesheet" href="game.css">
</head>
<body>
<main class="stage" id="stage" aria-label="Bus Queue Sort">
  <img class="art" id="art" alt="Bus Queue Sort">
  <div id="dynamic" class="dynamic"></div>
  <div id="runtimeHud" class="runtime-hud" aria-hidden="true">
    <div id="movesValue" class="moves-value">24</div>
    <div id="capPurple" class="cap-overlay purple">12/12</div>
    <div id="capYellow" class="cap-overlay yellow">8/12</div>
    <div id="capBlue" class="cap-overlay blue">6/12</div>
    <div id="capGreen" class="cap-overlay green">10/12</div>
  </div>
  <div class="combo" id="combo">COMBO ×2</div>
  <div class="toast" id="toast"></div>
  <div class="confetti" id="confetti"></div>
  <button class="tool-hit shuffle" id="shuffleHit" aria-label="Shuffle"></button>
  <button class="tool-hit slot" id="slotHit" aria-label="Extra slot"></button>
  <button class="tool-hit refresh" id="refreshHit" aria-label="Refresh passenger"></button>
  <div class="overlay" id="winOverlay">
    <div class="result-card">
      <div class="result-ribbon">太棒了！</div>
      <div class="result-stars">★★★</div>
      <strong>关卡完成</strong>
      <p id="winText">乘客已顺利上车</p>
      <button id="nextButton">下一关 →</button>
    </div>
  </div>
  <div class="overlay" id="loseOverlay">
    <div class="result-card fail">
      <div class="result-ribbon">站台已满</div>
      <strong>换个顺序试试</strong>
      <p>候车位已用完。</p>
      <button id="retryButton">重新挑战</button>
    </div>
  </div>
</main>
<script src="game.js"></script>
</body>
</html>
