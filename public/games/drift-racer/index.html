<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Drift Racer</title>
<style>
*{margin:0;padding:0}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;overflow:hidden}
#ui{color:#fff;margin-bottom:6px;font-size:16px}
#ui span{color:#4fc3f7;font-weight:bold}
canvas{border-radius:8px;touch-action:none}
#msg{color:#aaa;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div id="ui">Score: <span id="sc">0</span> | Speed: <span id="sp">0</span> | Best: <span id="bs">0</span></div>
<canvas id="c"></canvas>
<div id="msg">← → to steer | Drift through corners for points!</div>
<script>
const W=Math.min(860,innerWidth-16),H=Math.min(640,innerHeight-100);
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');
let score=0,best=+localStorage.getItem('drift_best')||0,gameOver=false;
document.getElementById('bs').textContent=best;
// Track - top-down racing
const car={x:W/2,y:H*0.7,angle:-Math.PI/2,speed:0,drift:0};
let trackOffset=0,trackCurve=0,nextCurve=0,curveTimer=0;
let keys={},roadSegments=[];
document.addEventListener('keydown',e=>keys[e.key]=true);
document.addEventListener('keyup',e=>keys[e.key]=false);
let touchL=false,touchR=false;
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();if(e.clientX-r.left<W/2)touchL=true;else touchR=true});
cv.addEventListener('pointerup',()=>{touchL=false;touchR=false});
cv.addEventListener('pointerleave',()=>{touchL=false;touchR=false});
function loop(){
  if(gameOver)return;
  ctx.clearRect(0,0,W,H);
  // Auto accelerate
  car.speed=Math.min(8,car.speed+0.05);
  // Steering
  let steer=0;
  if(keys['ArrowLeft']||touchL)steer=-1;
  if(keys['ArrowRight']||touchR)steer=1;
  car.angle+=steer*0.04*(car.speed/8);
  // Track curves
  curveTimer--;
  if(curveTimer<=0){nextCurve=(Math.random()-0.5)*0.03;curveTimer=60+Math.random()*120}
  trackCurve+=(nextCurve-trackCurve)*0.02;
  // Road offset moves with curve
  trackOffset+=trackCurve*car.speed*3;
  trackOffset=Math.max(-W*0.3,Math.min(W*0.3,trackOffset));
  // Car position affected by curve (push outward)
  car.x+=steer*3-trackCurve*car.speed*8;
  car.x=Math.max(20,Math.min(W-20,car.x));
  // Drift detection
  const drifting=Math.abs(steer)>0&&car.speed>4;
  if(drifting){score+=Math.floor(car.speed);car.drift=Math.min(1,car.drift+0.1)}
  else{car.drift*=0.9}
  // Check if car is off road
  const roadCenter=W/2+trackOffset;
  const roadWidth=140;
  if(Math.abs(car.x-roadCenter)>roadWidth/2+15){
    gameOver=true;
    if(score>best){best=score;localStorage.setItem('drift_best',best);document.getElementById('bs').textContent=best}
  }
  // Draw road
  ctx.fillStyle='#16213e';ctx.fillRect(0,0,W,H);
  for(let i=0;i<H;i+=4){
    const seg=i/H;
    const cx=W/2+trackOffset*(1-seg*0.5);
    ctx.fillStyle=(Math.floor((i+trackOffset*10)/20)%2)?'#2a2a3e':'#252538';
    ctx.fillRect(cx-roadWidth/2,i,roadWidth,4);
    // Road edges
    ctx.fillStyle='#e94560';
    ctx.fillRect(cx-roadWidth/2-4,i,4,4);
    ctx.fillRect(cx+roadWidth/2,i,4,4);
    // Center dashes
    if(Math.floor((i+score)/30)%2){ctx.fillStyle='#ffc10744';ctx.fillRect(cx-2,i,4,4)}
  }
  // Draw car
  ctx.save();ctx.translate(car.x,car.y);ctx.rotate(steer*0.2+car.drift*steer*0.3);
  ctx.fillStyle='#4fc3f7';
  ctx.fillRect(-10,-18,20,36);
  ctx.fillStyle='#fff';
  ctx.fillRect(-8,-16,16,8);
  // Drift smoke
  if(car.drift>0.3){
    ctx.fillStyle='rgba(255,255,255,'+car.drift*0.3+')';
    ctx.beginPath();ctx.arc(-8+steer*5,20,6+car.drift*4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(8+steer*5,20,5+car.drift*3,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  // Score from distance
  score+=Math.floor(car.speed*0.5);
  document.getElementById('sc').textContent=score;
  document.getElementById('sp').textContent=Math.floor(car.speed*20);
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText('OFF TRACK!',W/2,H/2-15);
    ctx.font='16px Arial';ctx.fillText('Score: '+score,W/2,H/2+15);
    ctx.font='13px Arial';ctx.fillStyle='#4fc3f7';ctx.fillText('Tap to restart',W/2,H/2+45);
    cv.addEventListener('pointerdown',restart,{once:true});
    return;
  }
  requestAnimationFrame(loop);
}
function restart(){
  score=0;gameOver=false;car.x=W/2;car.speed=0;car.drift=0;trackOffset=0;trackCurve=0;
  document.getElementById('sc').textContent=0;
  loop();
}
loop();
</script>
</body>
</html>
