<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Idle Miner</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial,sans-serif;background:#120e0b;color:#fff}body{display:flex;align-items:center;justify-content:center;padding:6px}.game{width:min(420px,100%);height:100%;max-height:720px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px}.top h1{margin:0;text-align:center;font-size:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}.stat{padding:5px 3px;border:2px solid #5d402b;background:#20160f;color:#a98b72;font-size:8px;text-align:center}.stat b{display:block;color:#fff0c6;font-size:13px}.scene{position:relative;min-height:0;border:3px solid #765035;overflow:hidden;background:linear-gradient(#8dc9e8 0 20%,#6f4a2e 20% 100%)}.sky{position:absolute;inset:0 0 80% 0;background:linear-gradient(#80c8ed,#d4f3ff)}.ground{position:absolute;left:0;right:0;top:20%;bottom:0;background:repeating-linear-gradient(0deg,#50321f 0 42px,#5b3923 42px 84px)}.shaft{position:absolute;left:50%;top:18%;bottom:0;width:44%;transform:translateX(-50%);background:#261810;border-left:8px solid #3e281b;border-right:8px solid #3e281b}.levelLine{position:absolute;left:0;right:0;height:2px;background:#8b603e44}.cart{position:absolute;width:44px;height:22px;background:#777;border:3px solid #ddd;bottom:12%;left:50%;transform:translateX(-50%);transition:bottom .4s}.cart:after,.cart:before{content:"";position:absolute;bottom:-9px;width:10px;height:10px;border-radius:50%;background:#222}.cart:before{left:3px}.cart:after{right:3px}.miner{position:absolute;font-size:26px;left:20%;top:36%;animation:mining .7s steps(2,end) infinite}@keyframes mining{50%{transform:rotate(-18deg)}}.rock{position:absolute;z-index:4;left:50%;bottom:12%;transform:translateX(-50%);width:126px;height:126px;border:5px solid #4b3020;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ad8061,#6f4a36 56%,#38251c);box-shadow:inset 0 -18px 28px #0007,0 10px 30px #0008;color:#fff;font-size:40px;cursor:pointer;touch-action:manipulation}.rock:active{transform:translateX(-50%) scale(.92)}.depth{position:absolute;z-index:4;left:8px;right:8px;top:8px;padding:6px;background:#1b120ccf;border:2px solid #765035}.depthHead{display:flex;justify-content:space-between;font-size:9px;font-weight:900;color:#dfc096}.bar{height:6px;margin-top:4px;background:#0f0a07}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0a94d,#f37445,#e95383);transition:width .2s}.overdrive{position:absolute;z-index:4;left:8px;right:8px;bottom:7px;padding:5px;background:#1b120cdd;border:2px solid #765035}.odHead{display:flex;justify-content:space-between;color:#f5b642;font-size:8px;font-weight:950}.odTrack{height:6px;margin-top:3px;background:#100a07}.odTrack i{display:block;height:100%;width:0;background:#ffd166}.scene.hot{box-shadow:inset 0 0 70px #ff9f1c66}.scene.hot .rock{box-shadow:0 0 36px #ffd166,inset 0 -18px 28px #0007}.spark{position:absolute;z-index:6;pointer-events:none;color:#ffd166;font-size:15px;font-weight:950;animation:spark .55s ease-out forwards}@keyframes spark{to{transform:translateY(-45px);opacity:0}}.upgrades{display:grid;grid-template-columns:1fr 1fr;gap:5px}.upg{border:2px solid #4f3928;background:#221810;color:#fff;padding:8px;text-align:left;cursor:pointer}.upg.cant{opacity:.45}.upg b{font-size:10px;color:#ffe0a3}.upg span{display:block;margin-top:2px;color:#a98b72;font-size:8px}.upg em{float:right;color:#ffd166;font-style:normal}.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;padding:7px 12px;background:#20140d;border:2px solid #e0a94d;color:#ffd166;font-size:10px;font-weight:900;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}</style></head><body><main class="game"><div class="top"><h1>⛏️ Idle Miner</h1><div class="stats"><div class="stat">GOLD<b id="gold">0</b></div><div class="stat">CLICK<b id="ppc">1</b></div><div class="stat">/ SEC<b id="pps">0</b></div><div class="stat">TOTAL<b id="total">0</b></div></div></div><section id="scene" class="scene"><div class="sky"></div><div class="ground"></div><div class="shaft" id="shaft"></div><div class="miner">👷</div><div id="cart" class="cart"></div><div class="depth"><div class="depthHead"><span id="layer">SURFACE</span><span id="next">100 to Copper</span></div><div class="bar"><i id="depthBar"></i></div></div><button id="rock" class="rock">⛏️</button><div class="overdrive"><div class="odHead"><span>OVERDRIVE</span><span id="odText">0 / 20</span></div><div class="odTrack"><i id="odBar"></i></div></div></section><div id="upgrades" class="upgrades"></div></main><div id="toast" class="toast"></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),goldEl=$('gold'),ppcEl=$('ppc'),ppsEl=$('pps'),totalEl=$('total'),scene=$('scene'),rock=$('rock'),upEl=$('upgrades'),depthBar=$('depthBar'),odBar=$('odBar'),odText=$('odText'),layerEl=$('layer'),nextEl=$('next'),cart=$('cart'),toast=$('toast');let gold=0,total=0,perClick=1,perSec=0,energy=0,overdrive=0,last=performance.now();const upgrades=[{n:'Better Pickaxe',d:'+1 click',base:10,c:0,type:'click',v:1},{n:'Hire Miner',d:'+1 / sec',base:50,c:0,type:'auto',v:1},{n:'Gold Drill',d:'+5 click',base:200,c:0,type:'click',v:5},{n:'Mining Crew',d:'+5 / sec',base:500,c:0,type:'auto',v:5},{n:'Dynamite',d:'+25 click',base:2000,c:0,type:'click',v:25},{n:'Excavator',d:'+25 / sec',base:5000,c:0,type:'auto',v:25}],layers=[['SURFACE',0],['COPPER',100],['SILVER',1000],['GOLD',10000],['CRYSTAL',100000],['CORE',1000000]];try{const s=JSON.parse(localStorage.getItem('idle-miner-flag')||'{}');gold=s.g||0;total=s.t||0;perClick=s.pc||1;perSec=s.ps||0;upgrades.forEach((u,i)=>u.c=s.u?.[i]||0)}catch{}function cost(u){return Math.floor(u.base*Math.pow(1.42,u.c))}function fmt(n){if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return Math.floor(n)}function save(){localStorage.setItem('idle-miner-flag',JSON.stringify({g:gold,t:total,pc:perClick,ps:perSec,u:upgrades.map(u=>u.c)}))}function show(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1100)}function layer(){let idx=0;for(let i=0;i<layers.length;i++)if(total>=layers[i][1])idx=i;const cur=layers[idx],nxt=layers[Math.min(idx+1,layers.length-1)];layerEl.textContent=cur[0];if(idx===layers.length-1){depthBar.style.width='100%';nextEl.textContent='DEEPEST LAYER';cart.style.bottom='72%';return}const pct=(total-cur[1])/(nxt[1]-cur[1]);depthBar.style.width=Math.min(100,pct*100)+'%';nextEl.textContent=fmt(Math.max(0,nxt[1]-total))+' to '+nxt[0];cart.style.bottom=(12+idx*11)+'%'}function ui(){goldEl.textContent=fmt(gold);ppcEl.textContent=fmt(perClick);ppsEl.textContent=fmt(perSec);totalEl.textContent=fmt(total);odBar.style.width=(overdrive>0?100:energy/20*100)+'%';odText.textContent=overdrive>0?'×2 · '+overdrive.toFixed(1)+'s':energy+' / 20';scene.classList.toggle('hot',overdrive>0);layer();upEl.innerHTML=upgrades.map((u,i)=>`<button class="upg${gold<cost(u)?' cant':''}" data-i="${i}"><b>${['⛏️','👷','⚙️','🧑‍🏭','💣','🚜'][i]} ${u.n} <em>${fmt(cost(u))}g</em></b><span>Lv.${u.c} · ${u.d}</span></button>`).join('');upEl.querySelectorAll('button').forEach(b=>b.onclick=()=>buy(+b.dataset.i))}function spark(amount,e){const r=scene.getBoundingClientRect(),s=document.createElement('div');s.className='spark';s.textContent='+'+fmt(amount);s.style.left=((e?.clientX||r.left+r.width/2)-r.left)+'px';s.style.top=((e?.clientY||r.top+r.height*.6)-r.top)+'px';scene.appendChild(s);setTimeout(()=>s.remove(),600)}function mine(e){const mult=overdrive>0?2:1,gain=perClick*mult;gold+=gain;total+=gain;energy++;if(energy>=20&&overdrive<=0){energy=0;overdrive=8;show('⚡ OVERDRIVE ×2');navigator.vibrate?.(25)}spark(gain,e);navigator.vibrate?.(7);rock.animate([{transform:'translateX(-50%) scale(.92) rotate(-4deg)'},{transform:'translateX(-50%) scale(1.04)'},{transform:'translateX(-50%) scale(1)'}],{duration:160});ui()}function buy(i){const u=upgrades[i],co=cost(u);if(gold<co)return;gold-=co;u.c++;if(u.type==='click')perClick+=u.v;else perSec+=u.v;show(u.n+' Lv.'+u.c);ui();save()}rock.onclick=mine;setInterval(()=>{const now=performance.now(),dt=(now-last)/1000;last=now;if(overdrive>0)overdrive=Math.max(0,overdrive-dt);const gain=perSec*dt*(overdrive>0?2:1);gold+=gain;total+=gain;ui()},250);setInterval(save,5000);addEventListener('pagehide',save);ui()})();</script></body></html>
