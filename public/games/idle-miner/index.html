<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Idle Miner</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#07111f;color:#fff}body{display:flex;align-items:center;justify-content:center;padding:12px}.game{width:min(390px,96vw)}.title{text-align:center;font-size:23px;font-weight:900;margin-bottom:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{background:#101a31;border:1px solid #ffffff14;border-radius:11px;padding:7px 4px;text-align:center;font-size:9px;color:#94a3b8}.stat b{display:block;color:#fff;font-size:15px;margin-top:2px}.mineCard{position:relative;margin:9px 0;background:linear-gradient(155deg,#17213b,#0d162c);border:1px solid #ffffff14;border-radius:20px;padding:18px;text-align:center;overflow:hidden}.mineCard:before{content:"";position:absolute;inset:auto 0 0;height:42%;background:linear-gradient(#3e2b24,#271b18);opacity:.75}.depth{position:relative;z-index:2;display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;margin-bottom:8px}.depth b{color:#fbbf24}.bar{position:relative;z-index:2;height:7px;background:#111827;border-radius:999px;overflow:hidden;margin-bottom:13px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fbbf24,#fb923c,#fb7185);transition:width .2s}.rock{position:relative;z-index:2;width:132px;height:132px;margin:auto;border-radius:50%;border:5px solid #51382d;background:radial-gradient(circle at 38% 32%,#9b735c,#65483a 56%,#37251f);box-shadow:inset 0 -18px 28px #0005,0 14px 40px #0006;display:flex;align-items:center;justify-content:center;font-size:45px;cursor:pointer;user-select:none;transition:transform .08s}.rock:active{transform:scale(.91)}.spark{position:absolute;z-index:4;pointer-events:none;font-weight:900;color:#fbbf24;animation:pop .6s ease-out forwards}@keyframes pop{to{transform:translateY(-45px) scale(1.2);opacity:0}}.milestone{position:relative;z-index:2;margin-top:10px;font-size:11px;color:#cbd5e1;min-height:18px}.upgrades{display:flex;flex-direction:column;gap:6px}.upg{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#101a31;border:1px solid #ffffff12;border-radius:12px;padding:9px 11px;cursor:pointer;color:#fff;text-align:left}.upg:hover{border-color:#38bdf8}.upg.cant{opacity:.48}.upg .name{font-size:12px;font-weight:800}.upg .desc{font-size:10px;color:#94a3b8;margin-top:2px}.upg .count{color:#38bdf8}.cost{font-weight:900;color:#fbbf24;font-size:12px;white-space:nowrap}.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-20px);background:#111b33;border:1px solid #fbbf2455;border-radius:12px;padding:9px 14px;color:#fbbf24;font-size:12px;font-weight:900;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><main class="game"><div class="title">⛏️ Idle Miner</div><div class="stats"><div class="stat">GOLD<b id="gold">0</b></div><div class="stat">CLICK<b id="ppc">1</b></div><div class="stat">/ SECOND<b id="pps">0</b></div><div class="stat">TOTAL<b id="tot">0</b></div></div><section class="mineCard" id="card"><div class="depth"><span>Mine progress</span><b id="depth">Surface</b></div><div class="bar"><i id="bar"></i></div><button id="mine" class="rock">⛏️</button><div id="milestone" class="milestone">Mine 100 gold to reach the Copper Layer.</div></section><div id="upgrades" class="upgrades"></div></main><div id="toast" class="toast"></div><script>
let gold=0,total=0,perClick=1,perSec=0,lastMilestone=0;const upgrades=[{name:'Better Pickaxe',desc:'+1 per click',base:10,cost:10,count:0,type:'click',val:1},{name:'Hire Miner',desc:'+1 gold / sec',base:50,cost:50,count:0,type:'auto',val:1},{name:'Gold Drill',desc:'+5 per click',base:200,cost:200,count:0,type:'click',val:5},{name:'Mining Team',desc:'+5 gold / sec',base:500,cost:500,count:0,type:'auto',val:5},{name:'Dynamite',desc:'+25 per click',base:2000,cost:2000,count:0,type:'click',val:25},{name:'Excavator',desc:'+25 gold / sec',base:5000,cost:5000,count:0,type:'auto',val:25}],layers=[{n:'Surface',v:0},{n:'Copper Layer',v:100},{n:'Silver Layer',v:1000},{n:'Gold Layer',v:10000},{n:'Crystal Depths',v:100000},{n:'Core Mine',v:1000000}],goldEl=document.getElementById('gold'),ppcEl=document.getElementById('ppc'),ppsEl=document.getElementById('pps'),totEl=document.getElementById('tot'),upEl=document.getElementById('upgrades'),bar=document.getElementById('bar'),depthEl=document.getElementById('depth'),milestone=document.getElementById('milestone'),toast=document.getElementById('toast'),card=document.getElementById('card'),mine=document.getElementById('mine');
try{const s=JSON.parse(localStorage.getItem('idleminer'));if(s){gold=+s.g||0;total=+s.t||0;perClick=+s.pc||1;perSec=+s.ps||0;upgrades.forEach((u,i)=>{if(s.u?.[i]){u.count=+s.u[i].c||0;u.cost=+s.u[i].co||u.base}})}}catch(e){}
function fmt(n){if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return Math.floor(n)}function save(){localStorage.setItem('idleminer',JSON.stringify({g:gold,t:total,pc:perClick,ps:perSec,u:upgrades.map(u=>({c:u.count,co:u.cost}))}))}
function show(text){toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}
function layer(){let idx=0;for(let i=0;i<layers.length;i++)if(total>=layers[i].v)idx=i;const cur=layers[idx],next=layers[Math.min(idx+1,layers.length-1)];depthEl.textContent=cur.n;if(idx===layers.length-1){bar.style.width='100%';milestone.textContent='Deepest layer reached · keep growing the mine.';return}const pct=(total-cur.v)/(next.v-cur.v);bar.style.width=Math.max(0,Math.min(100,pct*100))+'%';milestone.textContent=`Mine ${fmt(next.v-total)} more gold to reach ${next.n}.`;if(idx>lastMilestone){lastMilestone=idx;show('⛏️ '+cur.n+' unlocked');navigator.vibrate?.(18)}}
function ui(){goldEl.textContent=fmt(gold);ppcEl.textContent=fmt(perClick);ppsEl.textContent=fmt(perSec);totEl.textContent=fmt(total);upEl.innerHTML=upgrades.map((u,i)=>`<button class="upg${gold<u.cost?' cant':''}" data-i="${i}"><div><div class="name">${['🪓','👷','⚙️','👷‍♂️','💣','🚜'][i]} ${u.name} <span class="count">Lv.${u.count}</span></div><div class="desc">${u.desc}</div></div><div class="cost">${fmt(u.cost)}g</div></button>`).join('');upEl.querySelectorAll('.upg').forEach(b=>b.onclick=()=>buy(+b.dataset.i));layer()}
function spark(amount,e){const r=card.getBoundingClientRect(),s=document.createElement('div');s.className='spark';s.textContent='+'+fmt(amount);s.style.left=((e?.clientX||r.left+r.width/2)-r.left)+'px';s.style.top=((e?.clientY||r.top+r.height*.55)-r.top)+'px';card.appendChild(s);setTimeout(()=>s.remove(),650)}
function doMine(e){gold+=perClick;total+=perClick;spark(perClick,e);navigator.vibrate?.(8);if(total%100<perClick)mine.animate([{transform:'scale(.92) rotate(-4deg)'},{transform:'scale(1.04) rotate(2deg)'},{transform:'scale(1)'}],{duration:180});ui()}
function buy(i){const u=upgrades[i];if(gold<u.cost)return;gold-=u.cost;u.count++;if(u.type==='click')perClick+=u.val;else perSec+=u.val;u.cost=Math.floor(u.base*Math.pow(1.4,u.count));show(`${u.name} upgraded to Lv.${u.count}`);navigator.vibrate?.(12);ui();save()}
mine.onclick=doMine;setInterval(()=>{if(perSec>0){gold+=perSec;total+=perSec;ui()}},1000);setInterval(save,5000);addEventListener('pagehide',save);for(let i=0;i<layers.length;i++)if(total>=layers[i].v)lastMilestone=i;ui();
</script></body></html>
