<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Subway Dash</title>
<style>
*{margin:0;padding:0}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;overflow:hidden}
#ui{color:#fff;margin-bottom:6px;font-size:16px}
#ui span{color:#4fc3f7;font-weight:bold}
canvas{border-radius:8px;touch-action:none}
#msg{color:#aaa;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div id="ui">Score: <span id="sc">0</span> | Coins: <span id="cn">0</span> | Best: <span id="bs">0</span></div>
<canvas id="c"></canvas>
<div id="msg">← → or Swipe to switch lanes | Avoid trains! Collect coins!</div>
<script>
const W=Math.min(860,innerWidth-16),H=Math.min(640,innerHeight-80);
const c=document.getElementById('c');c.width=W;c.height=H;
const ctx=c.getContext('2d');
let score=0,coins=0,gameOver=false,best=+localStorage.getItem('subway-dash-best')||0;
document.getElementById('bs').textContent=best;
const lanes=[W/2-70,W/2,W/2+70];
let player={lane:1,y:H-80},obstacles=[],coinList=[],speed=4,spawnT=0,coinT=0;
document.addEventListener('keydown',e=>{if(gameOver){reset();return;}if(e.key==='ArrowLeft'&&player.lane>0)player.lane--;if(e.key==='ArrowRight'&&player.lane<2)player.lane++;});
let touchX=0;
c.addEventListener('pointerdown',e=>{if(gameOver){reset();return;}touchX=e.clientX;});
c.addEventListener('pointerup',e=>{const dx=e.clientX-touchX;if(dx>30&&player.lane<2)player.lane++;if(dx<-30&&player.lane>0)player.lane--;});
function reset(){score=0;coins=0;gameOver=false;obstacles=[];coinList=[];speed=4;player.lane=1;document.getElementById('sc').textContent=0;document.getElementById('cn').textContent=0;}
function update(){if(gameOver)return;score++;if(score%200===0)speed+=0.5;document.getElementById('sc').textContent=Math.floor(score/10);
spawnT++;if(spawnT>50-speed*2){spawnT=0;const lane=Math.floor(Math.random()*3);obstacles.push({lane,y:-60,h:50+Math.random()*30});}
coinT++;if(coinT>30){coinT=0;const lane=Math.floor(Math.random()*3);coinList.push({lane,y:-20});}
obstacles.forEach((o,i)=>{o.y+=speed;if(o.y>H+60){obstacles.splice(i,1);return;}
if(o.lane===player.lane&&o.y+o.h>player.y-15&&o.y<player.y+15){gameOver=true;if(Math.floor(score/10)>best){best=Math.floor(score/10);localStorage.setItem('subway-dash-best',best);document.getElementById('bs').textContent=best;}}});
coinList.forEach((cn,i)=>{cn.y+=speed;if(cn.y>H+20){coinList.splice(i,1);return;}
if(cn.lane===player.lane&&Math.abs(cn.y-player.y)<20){coinList.splice(i,1);coins++;document.getElementById('cn').textContent=coins;}});}
function draw(){ctx.fillStyle='#37474f';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#455a64';ctx.fillRect(W/2-105,0,210,H);
ctx.strokeStyle='#ffc107';ctx.setLineDash([20,15]);ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(W/2-35,0);ctx.lineTo(W/2-35,H);ctx.stroke();
ctx.beginPath();ctx.moveTo(W/2+35,0);ctx.lineTo(W/2+35,H);ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1;
ctx.fillStyle='#e94560';obstacles.forEach(o=>{ctx.fillRect(lanes[o.lane]-20,o.y,40,o.h);ctx.fillStyle='#c62828';ctx.fillRect(lanes[o.lane]-15,o.y+5,30,8);ctx.fillStyle='#e94560';});
ctx.fillStyle='#ffc107';coinList.forEach(cn=>{ctx.beginPath();ctx.arc(lanes[cn.lane],cn.y,8,0,Math.PI*2);ctx.fill();});
ctx.fillStyle='#4fc3f7';ctx.beginPath();ctx.arc(lanes[player.lane],player.y,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(lanes[player.lane],player.y-4,5,0,Math.PI*2);ctx.fill();
if(gameOver){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#e94560';ctx.font='bold 28px Arial';ctx.textAlign='center';ctx.fillText('CRASHED!',W/2,H/2-20);ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.fillText('Score: '+Math.floor(score/10)+' | Tap to retry',W/2,H/2+20);}}
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
