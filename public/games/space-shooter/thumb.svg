<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="50" cy="40" r="1.5" fill="#fff" opacity=".8"/>
  <circle cx="120" cy="70" r="1" fill="#fff" opacity=".6"/>
  <circle cx="200" cy="30" r="1.5" fill="#fff" opacity=".7"/>
  <circle cx="300" cy="50" r="1" fill="#fff" opacity=".5"/>
  <circle cx="350" cy="90" r="1.5" fill="#fff" opacity=".8"/>
  <circle cx="80" cy="120" r="1" fill="#fff" opacity=".4"/>
  <circle cx="320" cy="140" r="1" fill="#fff" opacity=".6"/>
  <circle cx="370" cy="200" r="1.5" fill="#fff" opacity=".5"/>
  <circle cx="30" cy="250" r="1" fill="#fff" opacity=".7"/>
  <!-- Player ship -->
  <polygon points="200,180 185,220 200,210 215,220" fill="#4fc3f7"/>
  <polygon points="200,170 190,200 200,195 210,200" fill="#81d4fa"/>
  <rect x="197" y="220" width="6" height="15" fill="#ff9800" opacity=".9"/>
  <polygon points="195,235 200,250 205,235" fill="#ff5722" opacity=".7"/>
  <!-- Bullets -->
  <rect x="198" y="140" width="4" height="12" fill="#76ff03" rx="2"/>
  <rect x="198" y="110" width="4" height="12" fill="#76ff03" rx="2" opacity=".7"/>
  <rect x="198" y="80" width="4" height="12" fill="#76ff03" rx="2" opacity=".4"/>
  <!-- Enemies -->
  <g fill="#ef5350">
    <rect x="100" y="50" width="24" height="18" rx="4"/>
    <rect x="160" y="40" width="24" height="18" rx="4"/>
    <rect x="240" y="55" width="24" height="18" rx="4"/>
    <rect x="290" y="35" width="24" height="18" rx="4"/>
  </g>
  <g fill="#e57373" opacity=".7">
    <rect x="130" y="80" width="20" height="15" rx="3"/>
    <rect x="220" y="85" width="20" height="15" rx="3"/>
    <rect x="270" y="75" width="20" height="15" rx="3"/>
  </g>
  <!-- Explosion -->
  <circle cx="160" cy="45" r="12" fill="#ff9800" opacity=".6"/>
  <circle cx="160" cy="45" r="7" fill="#ffeb3b" opacity=".8"/>
</svg>
