<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Space Shooter</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Arial,sans-serif;background:#050816;color:#fff}body{display:flex;align-items:center;justify-content:center;overflow:hidden}.wrap{position:relative;width:min(860px,100vw);height:min(680px,100vh);background:linear-gradient(#050816,#101a3d);overflow:hidden}.hud{position:absolute;z-index:3;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;pointer-events:none}.group{display:flex;gap:6px}.pill{background:#071126cc;border:1px solid #ffffff18;border-radius:10px;padding:6px 9px;font-size:10px;color:#94a3b8}.pill b{display:block;color:#fff;font-size:15px}.pill.combo b{color:#fbbf24}canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#030712c7}.card{width:min(320px,86vw);background:#101a34;border:1px solid #ffffff1c;border-radius:20px;padding:22px;text-align:center}.card h1{margin:0 0 7px;font-size:28px}.card p{font-size:13px;color:#cbd5e1;line-height:1.45}.btn{border:0;border-radius:12px;padding:11px 22px;font-weight:900;background:linear-gradient(135deg,#22d3ee,#818cf8);color:#07111f}.hint{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);font-size:10px;color:#94a3b8;background:#020617aa;padding:5px 8px;border-radius:999px;white-space:nowrap}</style></head><body><main class="wrap" id="wrap"><div class="hud"><div class="group"><div class="pill">SCORE<b id="score">0</b></div><div class="pill combo">COMBO<b id="combo">×0</b></div></div><div class="group"><div class="pill">LIVES<b id="lives">♥♥♥</b></div><div class="pill">BEST<b id="best">0</b></div></div></div><canvas id="game"></canvas><div class="hint">A/D or ← → · Space to shoot · drag on mobile</div><div id="overlay" class="overlay"><div class="card"><h1 id="title">🚀 Space Shooter</h1><p id="summary">Survive escalating enemy waves. Faster ships and tougher targets appear as your score rises.</p><button id="play" class="btn">Launch</button></div></div></main><script>
const c=document.getElementById('game'),x=c.getContext('2d'),wrap=document.getElementById('wrap'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),livesEl=document.getElementById('lives'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),summary=document.getElementById('summary'),play=document.getElementById('play');let W=0,H=0,D=Math.min(devicePixelRatio||1,2),score=0,lives=3,combo=0,best=+localStorage.getItem('space-shooter-best')||0,running=false,p,shots=[],foes=[],fx=[],stars=[],keys={},frame=0,shake=0,touch=false;bestEl.textContent=best;
function resize(){const r=wrap.getBoundingClientRect();W=r.width;H=r.height;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);if(p){p.y=H-70;p.x=Math.min(W-p.w,p.x)}}addEventListener('resize',resize);resize();
function makeStars(){stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:.5+Math.random()*1.8,v:.4+Math.random()*1.3}))}
function reset(){score=0;lives=3;combo=0;shots=[];foes=[];fx=[];frame=0;shake=0;p={x:W/2-18,y:H-70,w:36,h:42,cool:0,inv:0};scoreEl.textContent=0;comboEl.textContent='×0';livesEl.textContent='♥♥♥';running=true;overlay.style.display='none';makeStars()}
function enemy(){const level=Math.floor(score/180),r=Math.random();if(level>=2&&r<.18)return{kind:2,hp:2,max:2,size:27,speed:1.2,color:'#fb7185',reward:25};if(level>=1&&r<.42)return{kind:1,hp:1,max:1,size:18,speed:2.7,color:'#fbbf24',reward:15};return{kind:0,hp:1,max:1,size:22,speed:1.7,color:'#a78bfa',reward:10}}
function spawn(){const e=enemy();e.x=18+Math.random()*(W-e.size-36);e.y=-35;e.phase=Math.random()*6.2;foes.push(e)}
function shoot(){if(!running||p.cool>0)return;p.cool=9;shots.push({x:p.x+p.w/2,y:p.y-4})}
function burst(px,py,color,n=9){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*3.7;fx.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:24,color})}}
function damage(){if(p.inv>0)return;lives--;combo=0;comboEl.textContent='×0';livesEl.textContent='♥'.repeat(Math.max(0,lives));p.inv=70;shake=12;burst(p.x+18,p.y+20,'#fb7185',16);navigator.vibrate?.(45);if(lives<=0)end()}
function end(){running=false;const isBest=score>best;if(isBest){best=score;localStorage.setItem('space-shooter-best',best);bestEl.textContent=best}title.textContent=isBest?'🏆 New Best':'Mission Over';summary.textContent=`Score ${score} · Best ${best} · build combos by destroying enemies without letting them escape.`;play.textContent='Fly Again';overlay.style.display='flex'}
function update(){if(!running)return;frame++;if(p.cool>0)p.cool--;if(p.inv>0)p.inv--;if(keys.ArrowLeft||keys.a)p.x-=6;if(keys.ArrowRight||keys.d)p.x+=6;if(keys[' ']||touch)shoot();p.x=Math.max(4,Math.min(W-p.w-4,p.x));if(frame%Math.max(18,48-Math.floor(score/50))===0)spawn();for(const s of stars){s.y+=s.v+score/1800;if(s.y>H){s.y=0;s.x=Math.random()*W}}for(let i=shots.length-1;i>=0;i--){shots[i].y-=10;if(shots[i].y<-20)shots.splice(i,1)}for(let i=foes.length-1;i>=0;i--){const e=foes[i];e.y+=e.speed+score/1500;if(e.kind===1)e.x+=Math.sin(e.y*.045+e.phase)*1.4;if(e.y>H+30){foes.splice(i,1);combo=0;comboEl.textContent='×0';continue}if(e.x<p.x+p.w&&e.x+e.size>p.x&&e.y<p.y+p.h&&e.y+e.size>p.y){foes.splice(i,1);damage();continue}for(let j=shots.length-1;j>=0;j--){const b=shots[j];if(b.x>e.x&&b.x<e.x+e.size&&b.y>e.y&&b.y<e.y+e.size){shots.splice(j,1);e.hp--;burst(b.x,b.y,e.color,4);if(e.hp<=0){foes.splice(i,1);combo++;const mult=1+Math.min(3,Math.floor(combo/6));score+=e.reward*mult;scoreEl.textContent=score;comboEl.textContent='×'+combo;burst(e.x+e.size/2,e.y+e.size/2,e.color,e.kind===2?16:10);if(combo%6===0)navigator.vibrate?.(12)}break}}}for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.x+=f.vx;f.y+=f.vy;f.vx*=.96;f.vy*=.96;if(--f.life<=0)fx.splice(i,1)}if(shake>0)shake*=.82}
function drawShip(){x.save();x.translate(p.x+18,p.y+21);if(p.inv>0&&Math.floor(p.inv/5)%2===0)x.globalAlpha=.3;x.shadowBlur=16;x.shadowColor='#22d3ee';x.fillStyle='#67e8f9';x.beginPath();x.moveTo(0,-21);x.lineTo(-17,18);x.lineTo(0,11);x.lineTo(17,18);x.closePath();x.fill();x.shadowBlur=0;x.fillStyle='#818cf8';x.beginPath();x.arc(0,-2,6,0,6.28);x.fill();x.fillStyle='#fbbf24';x.beginPath();x.moveTo(-5,17);x.lineTo(0,27+Math.random()*6);x.lineTo(5,17);x.fill();x.restore()}
function draw(){x.save();if(shake>1)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#050816');g.addColorStop(1,'#101a3d');x.fillStyle=g;x.fillRect(-20,-20,W+40,H+40);for(const s of stars){x.globalAlpha=.25+s.s*.25;x.fillStyle='#fff';x.fillRect(s.x,s.y,s.s,s.s)}x.globalAlpha=1;drawShip();x.fillStyle='#67e8f9';x.shadowBlur=8;x.shadowColor='#22d3ee';for(const b of shots)x.fillRect(b.x-2,b.y,4,12);x.shadowBlur=0;for(const e of foes){x.save();x.translate(e.x+e.size/2,e.y+e.size/2);x.rotate(e.y*.012);x.fillStyle=e.color;x.shadowBlur=10;x.shadowColor=e.color;x.beginPath();if(e.kind===1){x.moveTo(0,e.size/2);x.lineTo(-e.size/2,-e.size/2);x.lineTo(e.size/2,-e.size/2)}else for(let n=0;n<6;n++){const a=n*1.047;n?x.lineTo(Math.cos(a)*e.size/2,Math.sin(a)*e.size/2):x.moveTo(Math.cos(a)*e.size/2,Math.sin(a)*e.size/2)}x.closePath();x.fill();x.restore();if(e.max>1){x.fillStyle='#111827';x.fillRect(e.x,e.y-7,e.size,3);x.fillStyle='#34d399';x.fillRect(e.x,e.y-7,e.size*e.hp/e.max,3)}}for(const f of fx){x.globalAlpha=f.life/24;x.fillStyle=f.color;x.fillRect(f.x,f.y,3,3)}x.globalAlpha=1;x.restore()}
function loop(){update();draw();requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});document.addEventListener('keyup',e=>keys[e.key]=false);c.addEventListener('pointerdown',e=>{touch=true;const r=c.getBoundingClientRect();p.x=(e.clientX-r.left)*W/r.width-p.w/2});c.addEventListener('pointermove',e=>{if(!touch)return;const r=c.getBoundingClientRect();p.x=(e.clientX-r.left)*W/r.width-p.w/2});c.addEventListener('pointerup',()=>touch=false);c.addEventListener('pointercancel',()=>touch=false);play.onclick=reset;p={x:W/2-18,y:H-70,w:36,h:42,cool:0,inv:0};makeStars();requestAnimationFrame(loop);
</script></body></html>
