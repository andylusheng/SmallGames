<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a2e; overflow: hidden; font-family: 'Courier New', monospace; }
    canvas { display: block; margin: 0 auto; }
    #ui { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 14px; }
    #gameover { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; text-align: center; display: none; }
    #gameover h1 { font-size: 36px; color: #ff4444; margin-bottom: 10px; }
    #gameover p { font-size: 18px; margin-bottom: 20px; }
    #gameover button { padding: 10px 30px; font-size: 16px; background: #6366f1; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    #gameover button:hover { background: #4f46e5; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>Lives: <span id="lives">3</span></div>
  </div>
  <div id="gameover">
    <h1>GAME OVER</h1>
    <p>Score: <span id="finalScore">0</span></p>
    <button onclick="restartGame()">Play Again</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    
    function resize() {
      canvas.width = Math.min(window.innerWidth-16,860);
      canvas.height = Math.min(window.innerHeight-80,640);
    }
    resize();
    window.addEventListener('resize', resize);

    let score = 0, lives = 3, gameRunning = true;
    let player = { x: canvas.width / 2, y: canvas.height - 60, w: 40, h: 40, speed: 5 };
    let bullets = [], enemies = [], particles = [];
    let keys = {};
    let lastShot = 0, enemyTimer = 0;

    document.addEventListener('keydown', e => keys[e.key] = true);
    document.addEventListener('keyup', e => keys[e.key] = false);
    
    // Touch controls
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      player.x = e.touches[0].clientX - player.w / 2;
    });
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      shoot();
    });

    function shoot() {
      const now = Date.now();
      if (now - lastShot > 200) {
        bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 12 });
        lastShot = now;
      }
    }

    function spawnEnemy() {
      const size = 30 + Math.random() * 20;
      enemies.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        w: size, h: size,
        speed: 1.5 + Math.random() * 2 + score / 500
      });
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 30,
          color
        });
      }
    }

    function update() {
      if (!gameRunning) return;

      // Player movement
      if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
      if (keys['ArrowRight'] || keys['d']) player.x += player.speed;
      if (keys[' ']) shoot();
      player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

      // Bullets
      bullets = bullets.filter(b => {
        b.y -= 8;
        return b.y > -b.h;
      });

      // Enemies
      enemyTimer++;
      if (enemyTimer > Math.max(20, 60 - score / 50)) {
        spawnEnemy();
        enemyTimer = 0;
      }

      enemies = enemies.filter(e => {
        e.y += e.speed;
        // Collision with player
        if (e.x < player.x + player.w && e.x + e.w > player.x &&
            e.y < player.y + player.h && e.y + e.h > player.y) {
          lives--;
          document.getElementById('lives').textContent = lives;
          createExplosion(e.x + e.w/2, e.y + e.h/2, '#ff4444');
          if (lives <= 0) gameOver();
          return false;
        }
        return e.y < canvas.height;
      });

      // Bullet-enemy collision
      bullets.forEach((b, bi) => {
        enemies.forEach((e, ei) => {
          if (b.x < e.x + e.w && b.x + b.w > e.x &&
              b.y < e.y + e.h && b.y + b.h > e.y) {
            createExplosion(e.x + e.w/2, e.y + e.h/2, '#fbbf24');
            enemies.splice(ei, 1);
            bullets.splice(bi, 1);
            score += 10;
            document.getElementById('score').textContent = score;
          }
        });
      });

      // Particles
      particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        return p.life > 0;
      });
    }

    function draw() {
      ctx.fillStyle = '#0a0a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars background
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      for (let i = 0; i < 50; i++) {
        const sx = (i * 97 + Date.now() * 0.01 * (i % 3 + 1)) % canvas.width;
        const sy = (i * 53 + Date.now() * 0.02 * (i % 2 + 1)) % canvas.height;
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }

      // Player (triangle ship)
      ctx.fillStyle = '#6366f1';
      ctx.beginPath();
      ctx.moveTo(player.x + player.w / 2, player.y);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.closePath();
      ctx.fill();
      // Engine glow
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.moveTo(player.x + player.w / 2 - 5, player.y + player.h);
      ctx.lineTo(player.x + player.w / 2, player.y + player.h + 10 + Math.random() * 5);
      ctx.lineTo(player.x + player.w / 2 + 5, player.y + player.h);
      ctx.closePath();
      ctx.fill();

      // Bullets
      ctx.fillStyle = '#22d3ee';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Enemies
      enemies.forEach(e => {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(e.x + e.w/2, e.y + e.h/2, e.w/2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#7f1d1d';
        ctx.beginPath();
        ctx.arc(e.x + e.w/2, e.y + e.h/2, e.w/4, 0, Math.PI * 2);
        ctx.fill();
      });

      // Particles
      particles.forEach(p => {
        ctx.globalAlpha = p.life / 30;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      });
      ctx.globalAlpha = 1;
    }

    function gameOver() {
      gameRunning = false;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameover').style.display = 'block';
    }

    function restartGame() {
      score = 0; lives = 3; gameRunning = true;
      bullets = []; enemies = []; particles = [];
      player.x = canvas.width / 2;
      document.getElementById('score').textContent = '0';
      document.getElementById('lives').textContent = '3';
      document.getElementById('gameover').style.display = 'none';
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
