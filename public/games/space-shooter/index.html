<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Space Shooter</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial,sans-serif;background:#030611;color:#fff}body{display:flex;align-items:center;justify-content:center}.wrap{position:relative;width:min(820px,100vw);height:min(700px,100vh);overflow:hidden;background:#050816}.hud{position:absolute;z-index:5;left:9px;right:9px;top:9px;display:flex;justify-content:space-between;pointer-events:none}.group{display:flex;gap:5px}.pill{min-width:58px;padding:6px 8px;border:1px solid #ffffff16;border-radius:10px;background:#071126d9;color:#64748b;font-size:8px;text-align:center}.pill b{display:block;color:#fff;font-size:14px}.pill.wave b{color:#67e8f9}.pill.hp b{color:#fb7185}canvas{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;z-index:4;bottom:8px;left:50%;transform:translateX(-50%);padding:5px 9px;border-radius:999px;background:#020617b8;color:#64748b;font-size:9px;white-space:nowrap}.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:#020617dc;backdrop-filter:blur(7px)}.overlay.hidden{display:none}.card{width:min(340px,90vw);padding:21px;border:1px solid #ffffff1c;border-radius:20px;background:linear-gradient(155deg,#111a35,#080d1c);text-align:center}.card h1,.card h2{margin:0 0 6px}.card p{font-size:11px;line-height:1.5;color:#94a3b8}.btn{border:0;border-radius:11px;padding:10px 15px;background:linear-gradient(135deg,#22d3ee,#818cf8);color:#06101f;font-weight:950;cursor:pointer}.choices{display:grid;gap:7px;margin-top:12px}.choice{border:1px solid #ffffff13;border-radius:11px;padding:10px;background:#0a1228;color:#fff;text-align:left;cursor:pointer}.choice b{display:block;color:#67e8f9;font-size:11px}.choice span{display:block;margin-top:3px;color:#94a3b8;font-size:9px}.boss{position:absolute;z-index:6;left:50%;top:54px;transform:translateX(-50%);display:none;width:min(360px,70%);padding:5px;border:1px solid #fb718566;background:#260914}.boss.show{display:block}.bossLabel{display:flex;justify-content:space-between;color:#fecdd3;font-size:8px;font-weight:900}.bossTrack{height:6px;margin-top:4px;background:#450a0a}.bossTrack i{display:block;height:100%;width:100%;background:#fb7185}</style></head><body><main class="wrap" id="wrap"><div class="hud"><div class="group"><div class="pill">SCORE<b id="score">0</b></div><div class="pill wave">WAVE<b id="wave">1</b></div></div><div class="group"><div class="pill hp">LIVES<b id="lives">♥♥♥</b></div><div class="pill">BEST<b id="best">0</b></div></div></div><div id="boss" class="boss"><div class="bossLabel"><span>DREADNOUGHT</span><span id="bossPct">100%</span></div><div class="bossTrack"><i id="bossFill"></i></div></div><canvas id="game"></canvas><div class="hint">Drag to move + auto fire · desktop: ← → / A D + Space</div><div id="startOverlay" class="overlay"><div class="card"><h1>🚀 Space Shooter</h1><p>Clear enemy waves, choose an upgrade after every wave, and survive the Dreadnought every 5 waves.</p><button id="play" class="btn">LAUNCH</button></div></div><div id="upgradeOverlay" class="overlay hidden"><div class="card"><h2>WAVE CLEARED</h2><p>Choose one ship upgrade before the next wave.</p><div id="choices" class="choices"></div></div></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),c=$('game'),x=c.getContext('2d'),wrap=$('wrap'),scoreEl=$('score'),waveEl=$('wave'),livesEl=$('lives'),bestEl=$('best'),startOverlay=$('startOverlay'),upOverlay=$('upgradeOverlay'),choices=$('choices'),boss=$('boss'),bossFill=$('bossFill'),bossPct=$('bossPct');let W=0,H=0,D=Math.min(devicePixelRatio||1,2),running=false,paused=false,wave=1,score=0,lives=3,best=+localStorage.getItem('space-shooter-flag-best')||0,player,shots=[],foes=[],fx=[],stars=[],keys={},touch=false,spawnQueue=[],spawnCd=0,shake=0,audio=null,build={rate:1,damage:1,spread:1,shield:0};bestEl.textContent=best;function resize(){const r=wrap.getBoundingClientRect();W=r.width;H=r.height;c.width=Math.round(W*D);c.height=Math.round(H*D);x.setTransform(D,0,0,D,0,0);if(player){player.y=H-70;player.x=Math.min(W-42,player.x)}}addEventListener('resize',resize);resize();function tone(f,d=.05){try{audio=audio||new(AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.025,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}function starsInit(){stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,s:.5+Math.random()*2,v:.3+Math.random()*1.5}))}function reset(){wave=1;score=0;lives=3;build={rate:1,damage:1,spread:1,shield:0};player={x:W/2,y:H-70,cool:0,inv:0};shots=[];foes=[];fx=[];shake=0;running=true;paused=false;startOverlay.classList.add('hidden');upOverlay.classList.add('hidden');starsInit();hud();startWave()}function hud(){scoreEl.textContent=score;waveEl.textContent=wave;livesEl.textContent='♥'.repeat(Math.max(0,lives));bestEl.textContent=best}function plan(n){const q=[];const count=5+Math.min(12,n*2);for(let i=0;i<count;i++){const r=Math.random();q.push(n%5===0&&i===count-1?'boss':n>=3&&r<.18?'tank':n>=2&&r<.43?'dart':'drone')}return q}function startWave(){spawnQueue=plan(wave);spawnCd=.3;foes=[];shots=[];boss.classList.remove('show')}function enemy(type){const base=22+wave*8;if(type==='dart')return{type,hp:base*.7,max:base*.7,speed:95,size:16,reward:18,color:'#fbbf24'};if(type==='tank')return{type,hp:base*2.5,max:base*2.5,speed:38,size:28,reward:28,color:'#fb7185'};if(type==='boss')return{type,hp:base*12,max:base*12,speed:22,size:62,reward:180,color:'#c084fc',boss:true};return{type,hp:base,max:base,speed:58,size:21,reward:12,color:'#60a5fa'}}function spawn(){const type=spawnQueue.shift();if(!type)return;const e=enemy(type);e.x=25+Math.random()*(W-e.size-50);e.y=-e.size;e.phase=Math.random()*6.28;foes.push(e);if(e.boss)boss.classList.add('show')}function shoot(){if(player.cool>0)return;player.cool=Math.max(4,10-build.rate*2);const count=Math.min(3,build.spread);for(let i=0;i<count;i++){const off=(i-(count-1)/2)*12;shots.push({x:player.x+off,y:player.y-18,vx:off*.03,vy:-460,damage:build.damage})}tone(520,.025)}function burst(px,py,color,n=9){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=30+Math.random()*100;fx.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.3,color})}}function damagePlayer(){if(player.inv>0)return;if(build.shield>0){build.shield--;player.inv=.6;burst(player.x,player.y,'#67e8f9',14);tone(820,.08);return}lives--;player.inv=1;shake=10;burst(player.x,player.y,'#fb7185',18);navigator.vibrate?.(45);hud();if(lives<=0)end()}function end(){running=false;paused=true;best=Math.max(best,score);localStorage.setItem('space-shooter-flag-best',best);bestEl.textContent=best;startOverlay.classList.remove('hidden');startOverlay.querySelector('h1').textContent='MISSION OVER';startOverlay.querySelector('p').textContent=`Score ${score} · reached wave ${wave} · best ${best}.`;$('play').textContent='FLY AGAIN'}const upgrades=[['Rapid Fire','Fire 18% faster',()=>build.rate+=.7],['Twin Shot','Add one projectile',()=>build.spread=Math.min(3,build.spread+1)],['Heavy Bolts','Damage +35%',()=>build.damage*=1.35],['Shield Cell','Gain 1 shield charge',()=>build.shield++],['Hull Repair','Restore one life',()=>lives=Math.min(3,lives+1)]];function levelUp(){paused=true;upOverlay.classList.remove('hidden');const pool=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);choices.innerHTML='';pool.forEach(u=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<b>${u[0]}</b><span>${u[1]}</span>`;b.onclick=()=>{u[2]();upOverlay.classList.add('hidden');wave++;hud();paused=false;startWave();tone(780,.1)};choices.appendChild(b)})}function update(dt){if(!running||paused)return;player.cool-=dt*60;if(player.inv>0)player.inv-=dt;if(keys.ArrowLeft||keys.a)player.x-=250*dt;if(keys.ArrowRight||keys.d)player.x+=250*dt;player.x=Math.max(24,Math.min(W-24,player.x));if(keys[' ']||touch)shoot();spawnCd-=dt;if(spawnQueue.length&&spawnCd<=0){spawn();spawnCd=.42}for(const s of stars){s.y+=s.v*(1+wave*.04);if(s.y>H){s.y=0;s.x=Math.random()*W}}for(let i=shots.length-1;i>=0;i--){const b=shots[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y<-20){shots.splice(i,1);continue}for(let j=foes.length-1;j>=0;j--){const e=foes[j];if(Math.abs(b.x-(e.x+e.size/2))<e.size*.55&&Math.abs(b.y-(e.y+e.size/2))<e.size*.55){e.hp-=b.damage*10;burst(b.x,b.y,e.color,3);shots.splice(i,1);if(e.hp<=0){score+=e.reward;burst(e.x+e.size/2,e.y+e.size/2,e.color,e.boss?28:11);foes.splice(j,1);tone(e.boss?120:320,.07);hud()}break}}}for(let i=foes.length-1;i>=0;i--){const e=foes[i];e.y+=e.speed*dt;if(e.type==='dart')e.x+=Math.sin(e.y*.045+e.phase)*70*dt;if(e.boss){e.x+=Math.sin(performance.now()/450)*35*dt;bossFill.style.width=Math.max(0,e.hp/e.max*100)+'%';bossPct.textContent=Math.max(0,Math.ceil(e.hp/e.max*100))+'%'}if(Math.hypot(e.x+e.size/2-player.x,e.y+e.size/2-player.y)<e.size*.45+18){foes.splice(i,1);damagePlayer();continue}if(e.y>H+40){foes.splice(i,1);damagePlayer()}}for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.96;f.vy*=.96;f.life-=dt;if(f.life<=0)fx.splice(i,1)}if(shake>0)shake*=.84;if(!spawnQueue.length&&!foes.length&&running&&!paused){score+=25+wave*8;hud();levelUp()}}function drawShip(){x.save();x.translate(player.x,player.y);if(player.inv>0&&Math.floor(player.inv*15)%2===0)x.globalAlpha=.35;x.shadowBlur=16;x.shadowColor='#22d3ee';x.fillStyle='#67e8f9';x.beginPath();x.moveTo(0,-22);x.lineTo(-18,18);x.lineTo(0,9);x.lineTo(18,18);x.closePath();x.fill();x.fillStyle='#818cf8';x.fillRect(-6,-2,12,13);x.fillStyle='#fbbf24';x.beginPath();x.moveTo(-5,16);x.lineTo(0,30+Math.random()*5);x.lineTo(5,16);x.fill();if(build.shield>0){x.strokeStyle='#67e8f9';x.lineWidth=2;x.beginPath();x.arc(0,0,30,0,6.28);x.stroke()}x.restore()}function drawEnemy(e){x.save();x.translate(e.x+e.size/2,e.y+e.size/2);x.fillStyle=e.color;x.shadowBlur=12;x.shadowColor=e.color;if(e.type==='dart'){x.beginPath();x.moveTo(0,e.size/2);x.lineTo(-e.size/2,-e.size/2);x.lineTo(e.size/2,-e.size/2);x.closePath();x.fill()}else if(e.type==='tank'){x.fillRect(-e.size/2,-e.size/2,e.size,e.size);x.fillStyle='#111827';x.fillRect(-e.size*.25,-e.size*.25,e.size*.5,e.size*.5)}else if(e.type==='boss'){for(let k=0;k<8;k++){const a=k*Math.PI/4,xx=Math.cos(a)*e.size*.48,yy=Math.sin(a)*e.size*.48;k?x.lineTo(xx,yy):x.moveTo(xx,yy)}x.closePath();x.fill();x.fillStyle='#111827';x.fillRect(-12,-12,24,24)}else{x.beginPath();x.arc(0,0,e.size/2,0,6.28);x.fill();x.fillStyle='#111827';x.fillRect(-7,-3,14,6)}x.restore()}function draw(){x.save();if(shake>1)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#030611');g.addColorStop(.55,'#08132d');g.addColorStop(1,'#150b2d');x.fillStyle=g;x.fillRect(-20,-20,W+40,H+40);for(const s of stars){x.globalAlpha=.3+s.s*.25;x.fillStyle='#fff';x.fillRect(s.x,s.y,s.s,s.s)}x.globalAlpha=1;drawShip();x.shadowBlur=8;x.shadowColor='#67e8f9';x.fillStyle='#67e8f9';for(const b of shots)x.fillRect(b.x-2,b.y,4,14);x.shadowBlur=0;foes.forEach(drawEnemy);for(const f of fx){x.globalAlpha=Math.max(0,f.life/.6);x.fillStyle=f.color;x.fillRect(f.x,f.y,3,3)}x.globalAlpha=1;x.restore()}let last=performance.now();function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});document.addEventListener('keyup',e=>keys[e.key]=false);function move(e){const r=c.getBoundingClientRect();player.x=(e.clientX-r.left)*W/r.width}c.addEventListener('pointerdown',e=>{touch=true;move(e)});c.addEventListener('pointermove',e=>{if(touch)move(e)});c.addEventListener('pointerup',()=>touch=false);c.addEventListener('pointercancel',()=>touch=false);$('play').onclick=reset;player={x:W/2,y:H-70,cool:0,inv:0};starsInit();requestAnimationFrame(loop)})();</script></body></html>
