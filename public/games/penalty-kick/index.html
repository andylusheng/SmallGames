<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Penalty Kick</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;padding:20px;color:#fff}
h1{font-size:20px;margin-bottom:8px}
.hud{display:flex;gap:16px;margin-bottom:12px;font-size:14px}
.hud span{color:#4fc3f7;font-weight:bold}
#goal{position:relative;width:min(320px,85vw);height:160px;background:#1b5e20;border:4px solid #fff;border-bottom:none;border-radius:8px 8px 0 0;overflow:hidden;margin-bottom:0}
#keeper{position:absolute;bottom:0;width:50px;height:70px;background:#ffc107;border-radius:8px 8px 0 0;transition:left .3s;display:flex;align-items:center;justify-content:center;font-size:28px}
.zone{position:absolute;top:0;width:33.33%;height:100%;cursor:pointer;border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:all .2s}
.zone:hover{background:rgba(79,195,247,.15);color:#4fc3f7}
#field{width:min(320px,85vw);height:80px;background:#2d5a27;border-radius:0 0 8px 8px;display:flex;align-items:center;justify-content:center}
#ball{font-size:36px;transition:transform .3s;cursor:pointer}
#msg{margin-top:12px;font-size:18px;font-weight:bold;min-height:28px}
#msg.goal{color:#4caf50}
#msg.miss{color:#e94560}
#best{margin-top:8px;font-size:13px;color:#aaa}
</style>
</head>
<body>
<h1>⚽ Penalty Kick</h1>
<div class="hud">Goals: <span id="gl">0</span> | Attempts: <span id="at">0</span> | Streak: <span id="sk">0</span></div>
<div id="goal">
<div class="zone" style="left:0" onclick="shoot(0)">TL</div>
<div class="zone" style="left:33.33%" onclick="shoot(1)">TC</div>
<div class="zone" style="left:66.66%" onclick="shoot(2)">TR</div>
<div id="keeper">🧤</div>
</div>
<div id="field"><div id="ball">⚽</div></div>
<div id="msg">Tap a zone to shoot!</div>
<div id="best">Best streak: <span id="bs">0</span></div>
<script>
let goals=0,attempts=0,streak=0,best=+localStorage.getItem('penalty_best')||0,shooting=false;
document.getElementById('bs').textContent=best;
const keeper=document.getElementById('keeper');
const ball=document.getElementById('ball');
const msg=document.getElementById('msg');
function shoot(zone){
  if(shooting)return;
  shooting=true;attempts++;
  document.getElementById('at').textContent=attempts;
  // Keeper dives randomly
  const dive=Math.floor(Math.random()*3);
  keeper.style.left=(dive*33.33+8)+'%';
  // Animate ball
  ball.style.transform='translateY(-120px) scale(0.6)';
  setTimeout(()=>{
    if(zone===dive){
      // Saved!
      msg.textContent='🧤 SAVED!';msg.className='miss';
      streak=0;
    }else{
      // Goal!
      goals++;streak++;
      msg.textContent='⚽ GOAL!';msg.className='goal';
      document.getElementById('gl').textContent=goals;
      if(streak>best){best=streak;localStorage.setItem('penalty_best',best);document.getElementById('bs').textContent=best}
    }
    document.getElementById('sk').textContent=streak;
    // Reset
    setTimeout(()=>{
      ball.style.transform='';
      keeper.style.left='calc(50% - 25px)';
      msg.textContent='Tap a zone to shoot!';msg.className='';
      shooting=false;
    },1000);
  },400);
}
keeper.style.left='calc(50% - 25px)';
</script>
<script>
(function(){function z(){document.body.style.zoom=1;var w=Math.max(document.documentElement.scrollWidth,320);var h=Math.max(document.documentElement.scrollHeight,320);var s=Math.min((innerWidth-12)/w,(innerHeight-12)/h,1.85);if(s>1.05)document.body.style.zoom=s;else document.body.style.zoom=1}z();addEventListener('resize',z)})();
</script>
</body>
</html>
