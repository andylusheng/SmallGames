<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Magic 8 Ball</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;padding:16px;color:#fff}
h1{font-size:20px;margin-bottom:12px}
#ball{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#333,#000);display:flex;align-items:center;justify-content:center;margin:20px 0;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,0.5);transition:transform .2s}
#ball:active{transform:scale(0.95)}
#ball.shaking{animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
#window{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#1a237e,#0d1442);display:flex;align-items:center;justify-content:center;padding:10px}
#answer{font-size:11px;text-align:center;color:#4fc3f7;font-weight:bold;line-height:1.3}
#input-area{display:flex;gap:8px;margin-top:16px;width:100%;max-width:320px}
#question{flex:1;padding:10px 14px;border-radius:8px;border:2px solid #4fc3f7;background:#16213e;color:#fff;font-size:14px;outline:none}
#askBtn{padding:10px 18px;background:#4fc3f7;border:none;border-radius:8px;color:#1a1a2e;font-weight:bold;cursor:pointer;font-size:14px}
#history{margin-top:16px;font-size:12px;color:#aaa;text-align:center;max-width:300px}
#count{font-size:13px;color:#666;margin-top:8px}
</style>
</head>
<body>
<h1>🎱 Magic 8 Ball</h1>
<div id="ball"><div id="window"><div id="answer">Ask me anything...</div></div></div>
<div id="input-area">
<input id="question" type="text" placeholder="Type your yes/no question..." maxlength="100">
<button id="askBtn">Ask</button>
</div>
<div id="history"></div>
<div id="count">Questions asked: <span id="qc">0</span></div>
<script>
const answers=['It is certain','Without a doubt','Yes definitely','You may rely on it','Most likely','Outlook good','Yes','Signs point to yes',
'Reply hazy, try again','Ask again later','Better not tell you now','Cannot predict now','Concentrate and ask again',
'Don\'t count on it','My reply is no','My sources say no','Outlook not so good','Very doubtful'];
let count=+localStorage.getItem('magic-8ball-count')||0;
document.getElementById('qc').textContent=count;
const ballEl=document.getElementById('ball'),answerEl=document.getElementById('answer'),questionEl=document.getElementById('question'),historyEl=document.getElementById('history');
let lastAnswer='';
function ask(){const q=questionEl.value.trim();if(!q){answerEl.textContent='Type a question first!';return;}
ballEl.classList.add('shaking');answerEl.textContent='...';
setTimeout(()=>{ballEl.classList.remove('shaking');
let ans;do{ans=answers[Math.floor(Math.random()*answers.length)];}while(ans===lastAnswer);
lastAnswer=ans;answerEl.textContent=ans;count++;localStorage.setItem('magic-8ball-count',count);document.getElementById('qc').textContent=count;
historyEl.textContent='Q: "'+q+'" → '+ans;questionEl.value='';},600);}
document.getElementById('askBtn').addEventListener('click',ask);
questionEl.addEventListener('keydown',e=>{if(e.key==='Enter')ask();});
ballEl.addEventListener('click',()=>{if(questionEl.value.trim())ask();else{answerEl.textContent='Type a question below!';}});
</script>
<script>
(function(){function z(){document.body.style.zoom=1;var w=Math.max(document.documentElement.scrollWidth,320);var h=Math.max(document.documentElement.scrollHeight,320);var s=Math.min((innerWidth-12)/w,(innerHeight-12)/h,1.85);if(s>1.05)document.body.style.zoom=s;else document.body.style.zoom=1}z();addEventListener('resize',z)})();
</script>
</body>
</html>
