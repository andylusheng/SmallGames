<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Whack-a-Mole</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#4a7c59;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:Arial,sans-serif}
#ui{color:#fff;margin-bottom:15px;font-size:18px;display:flex;gap:25px}
#grid{display:grid;grid-template-columns:repeat(3,100px);gap:15px}
.hole{width:100px;height:100px;border-radius:50%;background:#3d2b1f;display:flex;align-items:center;justify-content:center;
  font-size:50px;cursor:pointer;transition:transform .1s;position:relative;overflow:hidden;border:4px solid #2a1f14}
.hole:active{transform:scale(.95)}
.hole .mole{transition:transform .15s;transform:translateY(100%)}
.hole.active .mole{transform:translateY(0)}
#start{margin-top:20px;padding:12px 30px;background:#f59e0b;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;font-weight:bold}
#msg{color:#fff;margin-top:10px;font-size:14px}
</style>
</head>
<body>
<div id="ui"><span>Score: <b id="sc">0</b></span><span>Time: <b id="tm">30</b>s</span></div>
<div id="grid"></div>
<button id="start" onclick="startGame()">Start Game</button>
<div id="msg">Whack the moles! 🐹</div>
<script>
let score=0,timeLeft=30,gameTimer,moleTimer,activeHole=-1,playing=false;
const grid=document.getElementById('grid');

function init(){
  grid.innerHTML='';
  for(let i=0;i<9;i++){
    const hole=document.createElement('div');
    hole.className='hole';hole.id='hole'+i;
    hole.innerHTML='<span class="mole">🐹</span>';
    hole.addEventListener('pointerdown',()=>whack(i));
    grid.appendChild(hole);
  }
}
function startGame(){
  score=0;timeLeft=30;playing=true;
  document.getElementById('sc').textContent='0';
  document.getElementById('tm').textContent='30';
  document.getElementById('start').textContent='Playing...';
  document.getElementById('start').disabled=true;
  clearInterval(gameTimer);clearInterval(moleTimer);
  gameTimer=setInterval(()=>{
    timeLeft--;document.getElementById('tm').textContent=timeLeft;
    if(timeLeft<=0)endGame();
  },1000);
  showMole();
}
function showMole(){
  if(!playing)return;
  // hide previous
  if(activeHole>=0)document.getElementById('hole'+activeHole).classList.remove('active');
  activeHole=Math.floor(Math.random()*9);
  document.getElementById('hole'+activeHole).classList.add('active');
  const delay=Math.max(400,900-score*10);
  moleTimer=setTimeout(()=>{
    document.getElementById('hole'+activeHole).classList.remove('active');
    activeHole=-1;
    if(playing)setTimeout(showMole,200);
  },delay);
}
function whack(i){
  if(!playing||i!==activeHole)return;
  score++;document.getElementById('sc').textContent=score;
  document.getElementById('hole'+i).classList.remove('active');
  document.getElementById('hole'+i).innerHTML='<span class="mole">💫</span>';
  setTimeout(()=>{document.getElementById('hole'+i).innerHTML='<span class="mole">🐹</span>'},200);
  activeHole=-1;
  clearTimeout(moleTimer);
  setTimeout(showMole,300);
}
function endGame(){
  playing=false;clearInterval(gameTimer);clearTimeout(moleTimer);
  if(activeHole>=0)document.getElementById('hole'+activeHole).classList.remove('active');
  document.getElementById('start').textContent='Play Again (Score: '+score+')';
  document.getElementById('start').disabled=false;
  document.getElementById('msg').textContent=score>=20?'Amazing! 🏆':score>=10?'Great job! 👏':'Keep trying! 💪';
}
init();
</script>
<script>
(function(){function z(){document.body.style.zoom=1;var w=Math.max(document.documentElement.scrollWidth,320);var h=Math.max(document.documentElement.scrollHeight,320);var s=Math.min((innerWidth-12)/w,(innerHeight-12)/h,1.85);if(s>1.05)document.body.style.zoom=s;else document.body.style.zoom=1}z();addEventListener('resize',z)})();
</script>
</body>
</html>
