<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Quick Tap</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,Arial,sans-serif;color:#fff}body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,#24346b 0,#11172e 42%,#090d1c 100%);padding:14px;overflow:hidden}.game{width:min(390px,96vw);text-align:center}.title{font-size:24px;font-weight:900;letter-spacing:-.02em;margin:0 0 8px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:8px}.stat{background:rgba(15,23,42,.78);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:7px 4px;font-size:10px;color:#94a3b8}.stat b{display:block;color:#fff;font-size:18px;margin-top:1px}.stat.combo b{color:#fbbf24}.bar{height:5px;border-radius:999px;background:#182039;overflow:hidden;margin:0 2px 10px}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#38bdf8,#a78bfa,#fb7185);transform-origin:left}.area{position:relative;width:min(360px,92vw);aspect-ratio:1;margin:auto;border-radius:24px;overflow:hidden;background:linear-gradient(145deg,rgba(30,41,59,.96),rgba(15,23,42,.96));border:1px solid rgba(148,163,184,.18);box-shadow:0 24px 80px rgba(0,0,0,.35),inset 0 0 60px rgba(56,189,248,.03);touch-action:manipulation}.area:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}.target{position:absolute;border:0;border-radius:50%;display:none;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fb7185,#e11d48 65%,#9f1239);box-shadow:0 10px 28px rgba(244,63,94,.42),inset 0 2px 7px rgba(255,255,255,.35);transform:scale(.7);animation:pop .16s cubic-bezier(.2,1.4,.4,1) forwards;user-select:none}.target.gold{background:radial-gradient(circle at 35% 30%,#fde68a,#f59e0b 64%,#b45309);box-shadow:0 10px 30px rgba(245,158,11,.5),0 0 0 5px rgba(245,158,11,.08)}@keyframes pop{to{transform:scale(1)}}.controls{display:flex;gap:8px;justify-content:center;margin-top:10px}.btn{border:0;border-radius:12px;padding:11px 22px;font-weight:800;font-size:14px;cursor:pointer;background:linear-gradient(135deg,#38bdf8,#818cf8);color:#07111f;box-shadow:0 8px 24px rgba(56,189,248,.2)}.msg{height:24px;margin-top:7px;color:#cbd5e1;font-size:13px;font-weight:700}.float{position:absolute;pointer-events:none;font-size:18px;font-weight:900;animation:float .55s ease-out forwards;text-shadow:0 2px 8px #000}@keyframes float{0%{opacity:0;transform:translate(-50%,0) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px) scale(1.15)}}.particle{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;animation:burst .42s ease-out forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}.flash{animation:flash .18s}@keyframes flash{50%{box-shadow:0 0 0 5px rgba(56,189,248,.22),0 0 55px rgba(56,189,248,.25)}}
</style>
</head>
<body><main class="game"><h1 class="title">⚡ Quick Tap</h1><div class="hud"><div class="stat">SCORE<b id="sc">0</b></div><div class="stat">TIME<b><span id="tm">20</span>s</b></div><div class="stat combo">COMBO<b id="cb">×0</b></div><div class="stat">BEST<b id="bs">0</b></div></div><div class="bar"><i id="timebar"></i></div><div id="area" class="area"><button id="target" class="target" aria-label="Tap target">🎯</button></div><div class="controls"><button id="start" class="btn">Start Game</button></div><div id="msg" class="msg">20 seconds. Build a combo. Gold targets are worth more.</div></main>
<script>
const area=document.getElementById('area'),target=document.getElementById('target'),sc=document.getElementById('sc'),tm=document.getElementById('tm'),bs=document.getElementById('bs'),cb=document.getElementById('cb'),msg=document.getElementById('msg'),start=document.getElementById('start'),timebar=document.getElementById('timebar');
let score=0,timeLeft=20,combo=0,timer=null,active=false,best=+localStorage.getItem('qt-best')||0,audio=null;bs.textContent=best;
function tone(freq=520,d=.045,type='sine'){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function buzz(ms=18){try{navigator.vibrate?.(ms)}catch(e){}}
function burst(x,y,gold=false){for(let i=0;i<8;i++){const p=document.createElement('i');p.className='particle';p.style.left=x+'px';p.style.top=y+'px';p.style.background=gold?'#fbbf24':['#38bdf8','#a78bfa','#fb7185'][i%3];const a=Math.PI*2*i/8,r=24+Math.random()*18;p.style.setProperty('--x',Math.cos(a)*r+'px');p.style.setProperty('--y',Math.sin(a)*r+'px');area.appendChild(p);setTimeout(()=>p.remove(),450)}}
function floatText(x,y,text,gold=false){const f=document.createElement('div');f.className='float';f.textContent=text;f.style.left=x+'px';f.style.top=y+'px';f.style.color=gold?'#fbbf24':'#fff';area.appendChild(f);setTimeout(()=>f.remove(),600)}
function targetSize(){const elapsed=20-timeLeft;return elapsed<7?54:elapsed<14?46:40}
function moveTarget(){const size=targetSize(),aw=area.clientWidth-size,ah=area.clientHeight-size;target.style.width=size+'px';target.style.height=size+'px';target.style.left=Math.random()*aw+'px';target.style.top=Math.random()*ah+'px';const gold=Math.random()<.15;target.className='target'+(gold?' gold':'');target.textContent=gold?'💎':'🎯';target.dataset.pts=gold?3:1;target.style.animation='none';void target.offsetWidth;target.style.animation='pop .16s cubic-bezier(.2,1.4,.4,1) forwards'}
function updateCombo(){cb.textContent='×'+combo;cb.style.transform='scale(1.15)';setTimeout(()=>cb.style.transform='',90)}
function end(){clearInterval(timer);active=false;target.style.display='none';start.style.display='inline-block';start.textContent='Play Again';if(score>best){best=score;localStorage.setItem('qt-best',best);bs.textContent=best;msg.textContent='🏆 New best! '+score+' points';tone(760,.13,'triangle')}else{const rank=score>=48?'Master':score>=35?'Gold':score>=24?'Silver':'Bronze';msg.textContent=`${rank} run · ${score} points · best combo ${maxCombo}`;tone(240,.09,'sawtooth')}}
let maxCombo=0;
function startGame(){score=0;timeLeft=20;combo=0;maxCombo=0;active=true;sc.textContent='0';tm.textContent='20';cb.textContent='×0';timebar.style.transform='scaleX(1)';msg.textContent='Go!';start.style.display='none';target.style.display='flex';moveTarget();tone(600,.06,'triangle');timer=setInterval(()=>{timeLeft--;tm.textContent=timeLeft;timebar.style.transform=`scaleX(${timeLeft/20})`;if(timeLeft<=0)end()},1000)}
target.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!active)return;combo++;maxCombo=Math.max(maxCombo,combo);const base=+target.dataset.pts,bonus=Math.min(3,Math.floor(combo/5)),pts=base+bonus;score+=pts;sc.textContent=score;updateCombo();const r=area.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,gold=base===3;burst(x,y,gold);floatText(x,y,'+'+pts+(combo>=5?' ×'+combo:''),gold);area.classList.remove('flash');void area.offsetWidth;area.classList.add('flash');tone(gold?820:480+Math.min(combo,12)*18,.045,'triangle');buzz(gold?32:12);moveTarget()});
area.addEventListener('pointerdown',()=>{if(!active)return;if(combo>0){combo=0;updateCombo();msg.textContent='Combo reset';tone(150,.035,'square')}});start.addEventListener('click',startGame);
</script></body></html>
