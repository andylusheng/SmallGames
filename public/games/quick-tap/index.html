<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Quick Tap</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,Arial,sans-serif;color:#fff}body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,#263978 0,#11172e 44%,#080c18 100%);padding:8px;overflow:auto}.game{width:min(404px,97vw);text-align:center}.brand{display:flex;align-items:end;justify-content:space-between;margin:0 2px 6px}.title{text-align:left}.title h1{font-size:23px;line-height:1;margin:0;font-weight:950}.title small{display:block;margin-top:3px;color:#94a3b8;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.mode{font-size:9px;font-weight:900;color:#bae6fd;background:#0c4a6e;border:1px solid #38bdf855;border-radius:999px;padding:5px 8px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}.stat{background:#0f172add;border:1px solid #ffffff14;border-radius:11px;padding:5px 4px;font-size:8px;color:#94a3b8}.stat b{display:block;color:#fff;font-size:16px}.stat.combo b{color:#fbbf24}.bar{height:5px;border-radius:999px;background:#182039;overflow:hidden;margin:0 2px 7px}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#38bdf8,#a78bfa,#fb7185);transform-origin:left}.challenge{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 7px;padding:6px 8px;border:1px solid #ffffff10;background:#0f172acc;border-radius:11px;text-align:left}.challenge strong{font-size:10px}.challenge span{display:block;color:#94a3b8;font-size:8px;margin-top:2px}.progress{color:#fbbf24;font-weight:900;font-size:10px;white-space:nowrap}.area{position:relative;width:min(370px,93vw,calc(100dvh - 245px));min-width:210px;min-height:210px;aspect-ratio:1;margin:auto;border-radius:24px;overflow:hidden;background:linear-gradient(145deg,#1e293bfa,#0f172afa);border:1px solid #94a3b82e;box-shadow:0 18px 60px #0006;touch-action:manipulation}.area:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff0e 1px,transparent 1px);background-size:23px 23px;pointer-events:none}.target{position:absolute;border:0;border-radius:50%;display:none;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fb7185,#e11d48 65%,#9f1239);box-shadow:0 10px 28px #f43f965f,inset 0 2px 7px #ffffff59;animation:pop .16s cubic-bezier(.2,1.4,.4,1) forwards;user-select:none}.target.gold{background:radial-gradient(circle at 35% 30%,#fde68a,#f59e0b 64%,#b45309)}.target.fake{background:radial-gradient(circle at 35% 30%,#cbd5e1,#64748b 65%,#334155);opacity:.76}@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:7px}.btn{border:0;border-radius:10px;padding:8px 7px;font-weight:900;font-size:10px;cursor:pointer;background:linear-gradient(135deg,#38bdf8,#818cf8);color:#07111f}.btn.alt{background:#172033;color:#cbd5e1;border:1px solid #ffffff12}.btn.daily{background:linear-gradient(135deg,#fbbf24,#fb7185);color:#2a1600}.msg{min-height:18px;margin-top:4px;color:#cbd5e1;font-size:10px;font-weight:750}.float{position:absolute;pointer-events:none;font-size:17px;font-weight:950;animation:float .55s ease-out forwards;text-shadow:0 2px 8px #000}@keyframes float{0%{opacity:0;transform:translate(-50%,0) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px) scale(1.15)}}.particle{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;animation:burst .42s ease-out forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:#020617dd;backdrop-filter:blur(6px);z-index:10}.card{width:min(330px,92vw);background:linear-gradient(160deg,#15213d,#0d1528);border:1px solid #ffffff17;border-radius:22px;padding:18px}.rankIcon{font-size:40px}.card h2{margin:4px 0 2px;font-size:23px}.scoreline{font-size:33px;font-weight:950}.card p{font-size:10px;color:#cbd5e1}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.mini div{background:#0b1326;border-radius:10px;padding:7px 3px;color:#94a3b8;font-size:8px}.mini b{display:block;color:#fff;font-size:13px}.achievements{display:grid;grid-template-columns:1fr 1fr;gap:5px;text-align:left;margin:8px 0}.achievement{font-size:8px;background:#0b1326;color:#64748b;border-radius:9px;padding:6px}.achievement.on{color:#fde68a;border:1px solid #fbbf2433}.cardButtons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}@media(max-height:560px){body{align-items:flex-start}.brand{margin-bottom:4px}.challenge{padding:4px 7px;margin-bottom:5px}.hud{margin-bottom:4px}.controls{margin-top:5px}.area{width:min(330px,90vw,calc(100dvh - 220px))}}
</style></head><body>
<main class="game"><div class="brand"><div class="title"><h1>⚡ Quick Tap</h1><small>ZeroPlay Reaction Challenge</small></div><div id="modeBadge" class="mode">CLASSIC</div></div><div class="hud"><div class="stat">SCORE<b id="sc">0</b></div><div class="stat">TIME<b><span id="tm">20</span>s</b></div><div class="stat combo">COMBO<b id="cb">×0</b></div><div class="stat">BEST<b id="bs">0</b></div></div><div class="bar"><i id="timebar"></i></div><div class="challenge"><div><strong id="challengeTitle">Run target · reach 35 points</strong><span id="challengeSub">Build combo to accelerate your score.</span></div><div id="challengeProgress" class="progress">0 / 35</div></div><div id="area" class="area"><button id="target" class="target" aria-label="Tap target">🎯</button></div><div class="controls"><button id="classic" class="btn">Classic</button><button id="daily" class="btn daily">Daily</button><button id="statsBtn" class="btn alt">Stats</button></div><div id="msg" class="msg">Tap targets. Ignore gray decoys. Gold targets are worth more.</div></main>
<div id="result" class="overlay"><div class="card"><div id="rankIcon" class="rankIcon">🥉</div><h2 id="rankName">Bronze</h2><div id="resultScore" class="scoreline">0</div><p id="resultText"></p><div class="mini"><div>BEST COMBO<b id="rCombo">0</b></div><div>ACCURACY<b id="rAccuracy">100%</b></div><div>RUNS<b id="rRuns">1</b></div></div><div id="achievementList" class="achievements"></div><div class="cardButtons"><button id="again" class="btn">Play Again</button><button id="share" class="btn alt">Share Score</button></div></div></div><div id="stats" class="overlay"><div class="card"><h2>Player Stats</h2><p id="statsText"></p><div id="statsAchievements" class="achievements"></div><div class="cardButtons"><button id="closeStats" class="btn">Back</button><button id="playDailyFromStats" class="btn daily">Daily</button></div></div></div>
<script>
const $=id=>document.getElementById(id),area=$('area'),target=$('target'),sc=$('sc'),tm=$('tm'),bs=$('bs'),cb=$('cb'),msg=$('msg'),timebar=$('timebar'),result=$('result'),stats=$('stats'),modeBadge=$('modeBadge'),progress=$('challengeProgress');const STORE='quicktap-v3';let save={best:0,runs:0,totalHits:0,totalMisses:0,maxCombo:0,ach:{},daily:{}};try{save={...save,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{}let score=0,timeLeft=20,combo=0,maxCombo=0,hits=0,misses=0,timer=null,active=false,audio=null,mode='classic',seed=1,lastMode='classic';bs.textContent=save.best||0;const ACH=[['first','First Run','Finish one run'],['combo10','Hot Hands','Reach combo ×10'],['score40','Gold Pace','Score 40+'],['score55','Tap Master','Score 55+'],['perfect','Clean Run','95%+ accuracy'],['daily','Daily Player','Finish a Daily Challenge']];function persist(){localStorage.setItem(STORE,JSON.stringify(save))}function dateKey(){return new Date().toISOString().slice(0,10)}function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function rand(){if(mode!=='daily')return Math.random();seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}function tone(freq=520,d=.045,type='sine'){try{audio=audio||new (AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.05,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}function burst(x,y,gold=false){for(let i=0;i<9;i++){const p=document.createElement('i');p.className='particle';p.style.left=x+'px';p.style.top=y+'px';p.style.background=gold?'#fbbf24':['#38bdf8','#a78bfa','#fb7185'][i%3];const a=Math.PI*2*i/9,r=24+Math.random()*20;p.style.setProperty('--x',Math.cos(a)*r+'px');p.style.setProperty('--y',Math.sin(a)*r+'px');area.appendChild(p);setTimeout(()=>p.remove(),450)}}function floatText(x,y,text,color='#fff'){const f=document.createElement('div');f.className='float';f.textContent=text;f.style.left=x+'px';f.style.top=y+'px';f.style.color=color;area.appendChild(f);setTimeout(()=>f.remove(),600)}function targetSize(){const e=20-timeLeft;return e<6?54:e<12?47:e<17?42:38}function moveTarget(){const size=targetSize(),aw=Math.max(1,area.clientWidth-size),ah=Math.max(1,area.clientHeight-size);target.style.width=size+'px';target.style.height=size+'px';target.style.left=rand()*aw+'px';target.style.top=rand()*ah+'px';const fake=timeLeft<=12&&rand()<.13,gold=!fake&&rand()<.14;target.className='target'+(gold?' gold':'')+(fake?' fake':'');target.textContent=fake?'✦':gold?'💎':'🎯';target.dataset.pts=gold?3:fake?0:1}function updateHud(){sc.textContent=score;cb.textContent='×'+combo;const goal=mode==='daily'?45:35;progress.textContent=Math.min(score,goal)+' / '+goal;progress.style.color=score>=goal?'#34d399':'#fbbf24'}function rankFor(n){if(n>=60)return['👑','Legend'];if(n>=50)return['💎','Master'];if(n>=40)return['🥇','Gold'];if(n>=28)return['🥈','Silver'];return['🥉','Bronze']}function unlock(id){save.ach[id]=true}function renderAchievements(el){el.innerHTML=ACH.map(a=>`<div class="achievement${save.ach[a[0]]?' on':''}">${save.ach[a[0]]?'✓':'○'} <b>${a[1]}</b><br>${a[2]}</div>`).join('')}
function startGame(nextMode){clearInterval(timer);mode=nextMode;lastMode=nextMode;seed=hash(dateKey()+'-quicktap');score=0;timeLeft=20;combo=0;maxCombo=0;hits=0;misses=0;active=true;result.style.display='none';stats.style.display='none';target.style.display='flex';modeBadge.textContent=mode==='daily'?'DAILY '+dateKey().slice(5):'CLASSIC';$('challengeTitle').textContent=mode==='daily'?'Daily target · reach 45 points':'Run target · reach 35 points';$('challengeSub').textContent=mode==='daily'?'Same target sequence for everyone today.':'Build combo to accelerate your score.';tm.textContent='20';timebar.style.transform='scaleX(1)';msg.textContent='Go!';updateHud();moveTarget();tone(600,.06,'triangle');timer=setInterval(()=>{timeLeft--;tm.textContent=timeLeft;timebar.style.transform=`scaleX(${timeLeft/20})`;if(timeLeft<=0)end()},1000)}function end(){clearInterval(timer);active=false;target.style.display='none';save.runs++;save.totalHits+=hits;save.totalMisses+=misses;save.maxCombo=Math.max(save.maxCombo||0,maxCombo);save.best=Math.max(save.best||0,score);bs.textContent=save.best;const acc=Math.round(100*hits/Math.max(1,hits+misses));unlock('first');if(maxCombo>=10)unlock('combo10');if(score>=40)unlock('score40');if(score>=55)unlock('score55');if(acc>=95&&hits>=10)unlock('perfect');if(mode==='daily'){unlock('daily');const k=dateKey();save.daily[k]=Math.max(save.daily[k]||0,score)}persist();const [icon,rank]=rankFor(score);$('rankIcon').textContent=icon;$('rankName').textContent=rank+(mode==='daily'?' · Daily':'');$('resultScore').textContent=score+' pts';$('resultText').textContent=score>=45?'Challenge cleared. Push for a cleaner run.':'Protect longer combos to jump tiers.';$('rCombo').textContent=maxCombo;$('rAccuracy').textContent=acc+'%';$('rRuns').textContent=save.runs;renderAchievements($('achievementList'));result.style.display='flex';tone(score>=45?760:260,.13,score>=45?'triangle':'sawtooth')}
target.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!active)return;const pts=+target.dataset.pts;if(pts===0){misses++;combo=0;updateHud();msg.textContent='Decoy! Combo reset';tone(150,.05,'square');navigator.vibrate?.(25);moveTarget();return}hits++;combo++;maxCombo=Math.max(maxCombo,combo);const bonus=Math.min(3,Math.floor(combo/5)),gain=pts+bonus;score+=gain;const r=area.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;burst(x,y,pts===3);floatText(x,y,'+'+gain,pts===3?'#fbbf24':'#fff');updateHud();tone(pts===3?820:480+Math.min(combo,12)*18,.045,'triangle');navigator.vibrate?.(pts===3?32:12);moveTarget()});area.addEventListener('pointerdown',()=>{if(!active)return;misses++;combo=0;updateHud();msg.textContent='Miss · combo reset';tone(150,.035,'square')});$('classic').onclick=()=>startGame('classic');$('daily').onclick=()=>startGame('daily');$('again').onclick=()=>startGame(lastMode);$('statsBtn').onclick=()=>{stats.style.display='flex';const total=save.totalHits+save.totalMisses,acc=Math.round(100*save.totalHits/Math.max(1,total));$('statsText').textContent=`${save.runs} runs · ${save.totalHits} hits · ${acc}% lifetime accuracy · best combo ×${save.maxCombo||0}`;renderAchievements($('statsAchievements'))};$('closeStats').onclick=()=>stats.style.display='none';$('playDailyFromStats').onclick=()=>startGame('daily');$('share').onclick=async()=>{const text=`I scored ${score} in Quick Tap on ZeroPlay Games.`;try{if(navigator.share)await navigator.share({title:'Quick Tap',text});else{await navigator.clipboard.writeText(text);msg.textContent='Score copied'}}catch{}};addEventListener('resize',()=>{if(active)moveTarget()});
</script></body></html>
