<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Quick Tap</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,Arial,sans-serif;color:#fff}body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,#263978 0,#11172e 44%,#080c18 100%);padding:12px;overflow:hidden}.game{width:min(404px,97vw);text-align:center}.brand{display:flex;align-items:end;justify-content:space-between;margin:0 2px 8px}.title{text-align:left}.title h1{font-size:23px;line-height:1;margin:0;font-weight:950;letter-spacing:-.03em}.title small{display:block;margin-top:4px;color:#94a3b8;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.mode{font-size:10px;font-weight:900;color:#bae6fd;background:#0c4a6e;border:1px solid #38bdf855;border-radius:999px;padding:6px 9px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:7px}.stat{background:rgba(15,23,42,.86);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:6px 4px;font-size:9px;color:#94a3b8}.stat b{display:block;color:#fff;font-size:17px;margin-top:1px}.stat.combo b{color:#fbbf24}.bar{height:5px;border-radius:999px;background:#182039;overflow:hidden;margin:0 2px 8px}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#38bdf8,#a78bfa,#fb7185);transform-origin:left}.challenge{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px;padding:7px 9px;border:1px solid #ffffff10;background:#0f172acc;border-radius:12px;text-align:left}.challenge strong{font-size:11px}.challenge span{display:block;color:#94a3b8;font-size:9px;margin-top:2px}.challenge .progress{color:#fbbf24;font-weight:900;font-size:11px;white-space:nowrap}.area{position:relative;width:min(370px,93vw);aspect-ratio:1;margin:auto;border-radius:25px;overflow:hidden;background:linear-gradient(145deg,rgba(30,41,59,.98),rgba(15,23,42,.98));border:1px solid rgba(148,163,184,.18);box-shadow:0 24px 80px rgba(0,0,0,.38),inset 0 0 70px rgba(56,189,248,.04);touch-action:manipulation}.area:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);background-size:23px 23px;pointer-events:none}.target{position:absolute;border:0;border-radius:50%;display:none;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fb7185,#e11d48 65%,#9f1239);box-shadow:0 10px 28px rgba(244,63,94,.42),inset 0 2px 7px rgba(255,255,255,.35);transform:scale(.7);animation:pop .16s cubic-bezier(.2,1.4,.4,1) forwards;user-select:none}.target.gold{background:radial-gradient(circle at 35% 30%,#fde68a,#f59e0b 64%,#b45309);box-shadow:0 10px 30px rgba(245,158,11,.5),0 0 0 5px rgba(245,158,11,.08)}.target.fake{background:radial-gradient(circle at 35% 30%,#cbd5e1,#64748b 65%,#334155);box-shadow:0 10px 25px #0005;opacity:.76}@keyframes pop{to{transform:scale(1)}}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.btn{border:0;border-radius:11px;padding:9px 7px;font-weight:900;font-size:11px;cursor:pointer;background:linear-gradient(135deg,#38bdf8,#818cf8);color:#07111f}.btn.alt{background:#172033;color:#cbd5e1;border:1px solid #ffffff12}.btn.daily{background:linear-gradient(135deg,#fbbf24,#fb7185);color:#2a1600}.msg{height:22px;margin-top:5px;color:#cbd5e1;font-size:11px;font-weight:750}.float{position:absolute;pointer-events:none;font-size:18px;font-weight:950;animation:float .55s ease-out forwards;text-shadow:0 2px 8px #000}@keyframes float{0%{opacity:0;transform:translate(-50%,0) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px) scale(1.15)}}.particle{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;animation:burst .42s ease-out forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}.flash{animation:flash .18s}@keyframes flash{50%{box-shadow:0 0 0 5px rgba(56,189,248,.22),0 0 55px rgba(56,189,248,.25)}}.shake{animation:shake .18s}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:#020617dd;backdrop-filter:blur(6px);z-index:10}.card{width:min(330px,92vw);background:linear-gradient(160deg,#15213d,#0d1528);border:1px solid #ffffff17;border-radius:22px;padding:20px;box-shadow:0 30px 90px #0009}.rankIcon{font-size:44px}.card h2{margin:4px 0 2px;font-size:25px}.card .scoreline{font-size:36px;font-weight:950;color:#f8fafc}.card p{font-size:11px;color:#cbd5e1;line-height:1.5}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.mini div{background:#0b1326;border-radius:10px;padding:7px 3px;color:#94a3b8;font-size:8px}.mini b{display:block;color:#fff;font-size:14px;margin-top:2px}.achievements{display:grid;grid-template-columns:1fr 1fr;gap:5px;text-align:left;margin:9px 0}.achievement{font-size:9px;background:#0b1326;color:#64748b;border-radius:9px;padding:7px}.achievement.on{color:#fde68a;border:1px solid #fbbf2433}.cardButtons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.cardButtons .btn{padding:11px}.hint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;background:#02061755}.hint span{padding:10px 14px;border-radius:12px;background:#020617cc;font-weight:900;font-size:12px;animation:pulse 1.1s infinite}@keyframes pulse{50%{transform:scale(1.06)}}
</style>
</head>
<body><main class="game"><div class="brand"><div class="title"><h1>⚡ Quick Tap</h1><small>ZeroPlay Reaction Challenge</small></div><div id="modeBadge" class="mode">CLASSIC</div></div><div class="hud"><div class="stat">SCORE<b id="sc">0</b></div><div class="stat">TIME<b><span id="tm">20</span>s</b></div><div class="stat combo">COMBO<b id="cb">×0</b></div><div class="stat">BEST<b id="bs">0</b></div></div><div class="bar"><i id="timebar"></i></div><div class="challenge"><div><strong id="challengeTitle">Run target · reach 35 points</strong><span id="challengeSub">Build combo to accelerate your score.</span></div><div id="challengeProgress" class="progress">0 / 35</div></div><div id="area" class="area"><button id="target" class="target" aria-label="Tap target">🎯</button><div id="hint" class="hint"><span>Tap the target</span></div></div><div class="controls"><button id="start" class="btn">Classic</button><button id="daily" class="btn daily">Daily</button><button id="statsBtn" class="btn alt">Stats</button></div><div id="msg" class="msg">20 seconds. Tap fast, protect your combo, ignore gray decoys.</div></main><div id="result" class="overlay"><div class="card"><div id="rankIcon" class="rankIcon">🥉</div><h2 id="rankName">Bronze</h2><div id="resultScore" class="scoreline">0</div><p id="resultText"></p><div class="mini"><div>BEST COMBO<b id="rCombo">0</b></div><div>ACCURACY<b id="rAccuracy">100%</b></div><div>RUNS<b id="rRuns">1</b></div></div><div id="achievementList" class="achievements"></div><div class="cardButtons"><button id="again" class="btn">Play Again</button><button id="share" class="btn alt">Share Score</button></div></div></div><div id="stats" class="overlay"><div class="card"><h2>Player Stats</h2><p id="statsText"></p><div id="statsAchievements" class="achievements"></div><div class="cardButtons"><button id="closeStats" class="btn">Back</button><button id="playDailyFromStats" class="btn daily">Daily</button></div></div></div><script>
const area=document.getElementById('area'),target=document.getElementById('target'),sc=document.getElementById('sc'),tm=document.getElementById('tm'),bs=document.getElementById('bs'),cb=document.getElementById('cb'),msg=document.getElementById('msg'),start=document.getElementById('start'),dailyBtn=document.getElementById('daily'),timebar=document.getElementById('timebar'),result=document.getElementById('result'),stats=document.getElementById('stats'),hint=document.getElementById('hint'),challengeProgress=document.getElementById('challengeProgress'),modeBadge=document.getElementById('modeBadge');
const STORE='quicktap-v3';let save={best:0,runs:0,totalHits:0,totalMisses:0,maxCombo:0,ach:{},daily:{}};try{save={...save,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){}let score=0,timeLeft=20,combo=0,maxCombo=0,hits=0,misses=0,timer=null,active=false,audio=null,mode='classic',seed=1,step=0;bs.textContent=save.best||0;
const ACH=[['first','First Run','Finish one run'],['combo10','Hot Hands','Reach combo ×10'],['score40','Gold Pace','Score 40+'],['score55','Tap Master','Score 55+'],['perfect','Clean Run','95%+ accuracy'],['daily','Daily Player','Finish a Daily Challenge']];
function persist(){localStorage.setItem(STORE,JSON.stringify(save))}function dateKey(){return new Date().toISOString().slice(0,10)}function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function rand(){if(mode!=='daily')return Math.random();seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
function tone(freq=520,d=.045,type='sine'){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.05,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function buzz(ms=18){try{navigator.vibrate?.(ms)}catch(e){}}
function burst(x,y,gold=false){for(let i=0;i<9;i++){const p=document.createElement('i');p.className='particle';p.style.left=x+'px';p.style.top=y+'px';p.style.background=gold?'#fbbf24':['#38bdf8','#a78bfa','#fb7185'][i%3];const a=Math.PI*2*i/9,r=24+Math.random()*20;p.style.setProperty('--x',Math.cos(a)*r+'px');p.style.setProperty('--y',Math.sin(a)*r+'px');area.appendChild(p);setTimeout(()=>p.remove(),450)}}function floatText(x,y,text,color='#fff'){const f=document.createElement('div');f.className='float';f.textContent=text;f.style.left=x+'px';f.style.top=y+'px';f.style.color=color;area.appendChild(f);setTimeout(()=>f.remove(),600)}
function targetSize(){const elapsed=20-timeLeft;return elapsed<6?54:elapsed<12?47:elapsed<17?42:38}function moveTarget(){step++;const size=targetSize(),aw=area.clientWidth-size,ah=area.clientHeight-size;target.style.width=size+'px';target.style.height=size+'px';target.style.left=rand()*aw+'px';target.style.top=rand()*ah+'px';const fake=timeLeft<=12&&rand()<.13,gold=!fake&&rand()<.14;target.className='target'+(gold?' gold':'')+(fake?' fake':'');target.textContent=fake?'✦':gold?'💎':'🎯';target.dataset.pts=gold?3:fake?0:1;target.style.animation='none';void target.offsetWidth;target.style.animation='pop .16s cubic-bezier(.2,1.4,.4,1) forwards'}
function updateCombo(){cb.textContent='×'+combo;cb.style.transform='scale(1.15)';setTimeout(()=>cb.style.transform='',90)}function updateChallenge(){const goal=mode==='daily'?45:35;challengeProgress.textContent=Math.min(score,goal)+' / '+goal;challengeProgress.style.color=score>=goal?'#34d399':'#fbbf24'}
function rankFor(n){if(n>=60)return['👑','Legend'];if(n>=50)return['💎','Master'];if(n>=40)return['🥇','Gold'];if(n>=28)return['🥈','Silver'];return['🥉','Bronze']}
function unlock(id){if(!save.ach[id]){save.ach[id]=true;return true}return false}function renderAchievements(el){el.innerHTML=ACH.map(a=>`<div class="achievement${save.ach[a[0]]?' on':''}">${save.ach[a[0]]?'✓':'○'} <b>${a[1]}</b><br>${a[2]}</div>`).join('')}
function end(){clearInterval(timer);active=false;target.style.display='none';hint.style.display='none';save.runs++;save.totalHits+=hits;save.totalMisses+=misses;save.maxCombo=Math.max(save.maxCombo||0,maxCombo);save.best=Math.max(save.best||0,score);bs.textContent=save.best;const acc=Math.round(100*hits/Math.max(1,hits+misses));unlock('first');if(maxCombo>=10)unlock('combo10');if(score>=40)unlock('score40');if(score>=55)unlock('score55');if(acc>=95&&hits>=10)unlock('perfect');if(mode==='daily'){unlock('daily');const k=dateKey();save.daily[k]=Math.max(save.daily[k]||0,score)}persist();const [icon,rank]=rankFor(score);document.getElementById('rankIcon').textContent=icon;document.getElementById('rankName').textContent=rank+(mode==='daily'?' · Daily':'');document.getElementById('resultScore').textContent=score+' pts';document.getElementById('resultText').textContent=score>=45?'Challenge cleared. Push for a cleaner, faster run.':'You finished the run. Protect longer combos to jump tiers.';document.getElementById('rCombo').textContent=maxCombo;document.getElementById('rAccuracy').textContent=acc+'%';document.getElementById('rRuns').textContent=save.runs;renderAchievements(document.getElementById('achievementList'));tone(score>=45?760:260,.13,score>=45?'triangle':'sawtooth');result.style.display='flex'}
function startGame(nextMode='classic'){mode=nextMode;seed=hash(dateKey()+'-zeroplay-quicktap');step=0;score=0;timeLeft=20;combo=0;maxCombo=0;hits=0;misses=0;active=true;sc.textContent='0';tm.textContent='20';cb.textContent='×0';timebar.style.transform='scaleX(1)';result.style.display='none';stats.style.display='none';modeBadge.textContent=mode==='daily'?'DAILY '+dateKey().slice(5):'CLASSIC';document.getElementById('challengeTitle').textContent=mode==='daily'?'Daily target · reach 45 points':'Run target · reach 35 points';document.getElementById('challengeSub').textContent=mode==='daily'?'Same target sequence for everyone today.':'Build combo to accelerate your score.';updateChallenge();msg.textContent=mode==='daily'?'Daily sequence loaded. Go!':'Go!';target.style.display='flex';moveTarget();tone(600,.06,'triangle');if(save.runs===0){hint.style.display='flex';setTimeout(()=>hint.style.display='none',1300)}timer=setInterval(()=>{timeLeft--;tm.textContent=timeLeft;timebar.style.transform=`scaleX(${timeLeft/20})`;if(timeLeft<=0)end()},1000)}
target.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!active)return;const base=+target.dataset.pts,r=area.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(base===0){combo=0;misses++;updateCombo();floatText(x,y,'DECOY','#cbd5e1');area.classList.remove('shake');void area.offsetWidth;area.classList.add('shake');tone(120,.055,'square');buzz(28);moveTarget();return}combo++;hits++;maxCombo=Math.max(maxCombo,combo);const bonus=Math.min(4,Math.floor(combo/5)),pts=base+bonus;score+=pts;sc.textContent=score;updateCombo();updateChallenge();const gold=base===3;burst(x,y,gold);floatText(x,y,'+'+pts+(combo>=5?' ×'+combo:''),gold?'#fbbf24':'#fff');area.classList.remove('flash');void area.offsetWidth;area.classList.add('flash');if(combo===5||combo===10||combo===15){msg.textContent=`Combo milestone ×${combo}`;tone(720+combo*10,.08,'triangle')}else tone(gold?840:480+Math.min(combo,12)*18,.045,'triangle');buzz(gold?32:12);moveTarget()});
area.addEventListener('pointerdown',()=>{if(!active)return;combo=0;misses++;updateCombo();msg.textContent='Miss · combo reset';tone(145,.035,'square')});start.onclick=()=>startGame('classic');dailyBtn.onclick=()=>startGame('daily');document.getElementById('again').onclick=()=>startGame(mode);document.getElementById('share').onclick=async()=>{const text=`I scored ${score} in Quick Tap (${rankFor(score)[1]}) on ZeroPlay Games. Can you beat it? https://zeroplaygames.com/game/quick-tap`;try{if(navigator.share)await navigator.share({title:'Quick Tap Score',text});else{await navigator.clipboard.writeText(text);msg.textContent='Score copied to clipboard'}}catch(e){}};
document.getElementById('statsBtn').onclick=()=>{const attempts=(save.totalHits||0)+(save.totalMisses||0),acc=Math.round(100*(save.totalHits||0)/Math.max(1,attempts)),today=save.daily?.[dateKey()]||0;document.getElementById('statsText').innerHTML=`Best score <b>${save.best||0}</b><br>Best combo <b>×${save.maxCombo||0}</b><br>Lifetime accuracy <b>${acc}%</b><br>Runs <b>${save.runs||0}</b><br>Today's Daily best <b>${today||'—'}</b>`;renderAchievements(document.getElementById('statsAchievements'));stats.style.display='flex'};document.getElementById('closeStats').onclick=()=>stats.style.display='none';document.getElementById('playDailyFromStats').onclick=()=>startGame('daily');updateChallenge();renderAchievements(document.getElementById('achievementList'));
</script></body></html>
