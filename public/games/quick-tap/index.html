<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Quick Tap</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial,sans-serif;background:#050814;color:#fff}body{display:flex;align-items:center;justify-content:center;padding:6px}.game{width:min(430px,100%);height:100%;max-height:700px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:7px}.top{display:flex;justify-content:space-between;align-items:center}.brand h1{margin:0;font-size:23px;letter-spacing:-.04em}.brand small{display:block;margin-top:3px;color:#7dd3fc;font-size:8px;font-weight:900;letter-spacing:.16em}.mode{padding:6px 9px;border:1px solid #38bdf855;background:#082f49;border-radius:999px;color:#bae6fd;font-size:9px;font-weight:900}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.stat{padding:6px 4px;border:1px solid #ffffff16;background:#0b1224;border-radius:10px;text-align:center;color:#64748b;font-size:8px;font-weight:800}.stat b{display:block;margin-top:1px;color:#fff;font-size:16px}.stat.combo b{color:#fbbf24}.arena{position:relative;min-height:0;border-radius:25px;overflow:hidden;border:1px solid #38bdf833;background:radial-gradient(circle at 50% 60%,#172554 0,#10172d 38%,#070b17 100%);box-shadow:0 20px 60px #0009,inset 0 0 60px #38bdf80a;touch-action:manipulation}.arena:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 80%,transparent)}.arena.fever{animation:feverBg .55s steps(2,end) infinite;box-shadow:0 0 45px #f0abfc44,inset 0 0 90px #38bdf833}@keyframes feverBg{50%{background:radial-gradient(circle at 50% 60%,#5b217e,#14275b 44%,#07101f)}}.bar{position:absolute;left:14px;right:14px;top:12px;height:7px;border-radius:999px;background:#ffffff12;overflow:hidden;z-index:3}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6);transition:width .12s}.feverText{position:absolute;z-index:3;top:25px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:950;color:#f0abfc;letter-spacing:.16em;opacity:0}.arena.fever .feverText{opacity:1}.target{position:absolute;display:none;align-items:center;justify-content:center;border:0;cursor:pointer;color:#fff;font-size:21px;user-select:none;touch-action:none;animation:spawn .12s cubic-bezier(.2,1.7,.4,1);filter:drop-shadow(0 0 13px #38bdf888)}@keyframes spawn{from{transform:scale(.3) rotate(-16deg);opacity:.2}to{transform:scale(1) rotate(0);opacity:1}}.target.normal{border-radius:50%;background:radial-gradient(circle at 34% 28%,#67e8f9,#0ea5e9 55%,#1d4ed8);box-shadow:inset 0 0 0 5px #ffffff1c}.target.gold{border-radius:18%;background:linear-gradient(135deg,#fff3a4,#f59e0b 55%,#b45309);transform:rotate(45deg);filter:drop-shadow(0 0 18px #fbbf24)}.target.gold span{transform:rotate(-45deg)}.target.fake{border-radius:10px;background:#334155;border:4px solid #64748b;filter:none;color:#94a3b8}.ring{position:absolute;border:3px solid #fff;border-radius:50%;pointer-events:none;animation:ring .38s ease-out forwards}@keyframes ring{to{transform:scale(2.4);opacity:0}}.float{position:absolute;pointer-events:none;font-weight:950;font-size:18px;text-shadow:0 3px 10px #000;animation:float .55s ease-out forwards}@keyframes float{to{transform:translateY(-42px) scale(1.18);opacity:0}}.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:#fff}.flash.on{animation:flash .16s}@keyframes flash{30%{opacity:.16}}.footer{display:grid;grid-template-columns:1fr 1fr;gap:6px}.btn{border:0;border-radius:11px;padding:9px;font-size:10px;font-weight:950;cursor:pointer;background:linear-gradient(135deg,#22d3ee,#818cf8);color:#07111f}.btn.daily{background:linear-gradient(135deg,#fbbf24,#fb7185);color:#2a1600}.status{grid-column:1/-1;min-height:17px;text-align:center;color:#94a3b8;font-size:9px;font-weight:800}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#020617e8;backdrop-filter:blur(8px);z-index:20}.card{width:min(330px,90vw);padding:20px;border-radius:22px;border:1px solid #ffffff1b;background:linear-gradient(160deg,#14203b,#0a1020);text-align:center}.rank{font-size:42px}.card h2{margin:3px 0;font-size:24px}.score{font-size:36px;font-weight:950}.card p{font-size:10px;color:#94a3b8}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.mini div{padding:7px 3px;border-radius:9px;background:#08101f;color:#64748b;font-size:8px}.mini b{display:block;color:#fff;font-size:14px}.card .btn{width:100%;margin-top:6px}@media(max-height:560px){.game{gap:4px}.brand small{display:none}.hud .stat{padding:4px}.target{font-size:17px}}</style></head><body><main class="game"><div class="top"><div class="brand"><h1>⚡ Quick Tap</h1><small>NEON REFLEX ARENA</small></div><div id="mode" class="mode">CLASSIC</div></div><div class="hud"><div class="stat">SCORE<b id="score">0</b></div><div class="stat">TIME<b><span id="time">20</span>s</b></div><div class="stat combo">COMBO<b id="combo">×0</b></div><div class="stat">BEST<b id="best">0</b></div></div><section id="arena" class="arena"><div class="bar"><i id="feverBar"></i></div><div class="feverText">FEVER ×2</div><button id="target" class="target normal"><span>✦</span></button><div id="flash" class="flash"></div></section><div class="footer"><button id="classic" class="btn">CLASSIC 20s</button><button id="daily" class="btn daily">DAILY RUN</button><div id="status" class="status">Tap blue targets · gold = bonus · gray = decoy</div></div></main><div id="result" class="overlay"><div class="card"><div id="rank" class="rank">🥉</div><h2 id="rankName">Bronze</h2><div id="finalScore" class="score">0</div><p id="summary"></p><div class="mini"><div>MAX COMBO<b id="maxCombo">0</b></div><div>ACCURACY<b id="accuracy">0%</b></div><div>FEVER<b id="fevers">0</b></div></div><button id="again" class="btn">PLAY AGAIN</button></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),arena=$('arena'),target=$('target'),scoreEl=$('score'),timeEl=$('time'),comboEl=$('combo'),bestEl=$('best'),bar=$('feverBar'),status=$('status'),result=$('result'),flash=$('flash');const STORE='quicktap-flagship-1';let save={best:0,daily:{}};try{save={...save,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{}let score=0,time=20,combo=0,maxCombo=0,hits=0,misses=0,fever=0,feverCount=0,active=false,timer=null,mode='classic',seed=1,audio=null;bestEl.textContent=save.best||0;function persist(){localStorage.setItem(STORE,JSON.stringify(save))}function day(){return new Date().toISOString().slice(0,10)}function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function rnd(){if(mode!=='daily')return Math.random();seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}function tone(f=520,d=.045){try{audio=audio||new(AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}function hud(){scoreEl.textContent=score;comboEl.textContent='×'+combo;bar.style.width=Math.min(100,combo/8*100)+'%';arena.classList.toggle('fever',fever>0)}function size(){const elapsed=20-time;return fever>0?34:elapsed<7?54:elapsed<14?46:39}function place(){const s=size(),w=Math.max(1,arena.clientWidth-s-8),h=Math.max(1,arena.clientHeight-s-44);target.style.width=s+'px';target.style.height=s+'px';target.style.left=4+rnd()*w+'px';target.style.top=40+rnd()*h+'px';const fake=time<14&&rnd()<.13,gold=!fake&&rnd()<.15;target.className='target '+(fake?'fake':gold?'gold':'normal');target.dataset.kind=fake?'fake':gold?'gold':'normal';target.querySelector('span').textContent=fake?'×':gold?'◆':'✦';target.style.display='flex'}function fx(px,py,text,color){const r=document.createElement('i');r.className='ring';r.style.left=px-12+'px';r.style.top=py-12+'px';r.style.width='24px';r.style.height='24px';r.style.borderColor=color;arena.appendChild(r);const f=document.createElement('b');f.className='float';f.textContent=text;f.style.left=px+'px';f.style.top=py+'px';f.style.color=color;arena.appendChild(f);setTimeout(()=>{r.remove();f.remove()},600)}function start(m){clearInterval(timer);mode=m;seed=hash(day()+'quick');score=0;time=20;combo=0;maxCombo=0;hits=0;misses=0;fever=0;feverCount=0;active=true;result.style.display='none';$('mode').textContent=m==='daily'?'DAILY '+day().slice(5):'CLASSIC';timeEl.textContent='20';status.textContent='Build combo ×8 to trigger FEVER';hud();place();tone(620,.07);timer=setInterval(()=>{time--;if(fever>0)fever--;timeEl.textContent=time;hud();if(time<=0)end()},1000)}function end(){clearInterval(timer);active=false;target.style.display='none';save.best=Math.max(save.best||0,score);if(mode==='daily'){save.daily[day()]=Math.max(save.daily[day()]||0,score)}persist();bestEl.textContent=save.best;const acc=Math.round(hits/Math.max(1,hits+misses)*100),rank=score>=75?['👑','Legend']:score>=58?['💎','Master']:score>=43?['🥇','Gold']:score>=28?['🥈','Silver']:['🥉','Bronze'];$('rank').textContent=rank[0];$('rankName').textContent=rank[1];$('finalScore').textContent=score+' pts';$('maxCombo').textContent='×'+maxCombo;$('accuracy').textContent=acc+'%';$('fevers').textContent=feverCount;$('summary').textContent=score>=43?'Strong run. Cleaner combos will push the next tier.':'Hit faster, protect combo and use Fever windows.';result.style.display='flex';tone(score>=43?820:220,.12)}target.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!active)return;const kind=target.dataset.kind,r=arena.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;if(kind==='fake'){misses++;combo=0;fever=0;status.textContent='DECOY · combo reset';tone(120,.06);navigator.vibrate?.(28);hud();place();return}hits++;combo++;maxCombo=Math.max(maxCombo,combo);if(combo===8&&fever<=0){fever=5;feverCount++;status.textContent='FEVER! Every hit scores ×2';flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');tone(900,.12)}const base=kind==='gold'?3:1,mult=fever>0?2:1,comboBonus=Math.min(3,Math.floor(combo/5)),gain=(base+comboBonus)*mult;score+=gain;fx(px,py,'+'+gain,kind==='gold'?'#fbbf24':fever>0?'#f0abfc':'#67e8f9');tone((kind==='gold'?760:480)+Math.min(combo,15)*18,.045);navigator.vibrate?.(kind==='gold'?24:10);hud();place()});arena.addEventListener('pointerdown',()=>{if(!active)return;misses++;combo=0;fever=0;status.textContent='MISS · combo reset';tone(130,.035);hud()});$('classic').onclick=()=>start('classic');$('daily').onclick=()=>start('daily');$('again').onclick=()=>start(mode);addEventListener('resize',()=>{if(active)place()})})();</script></body></html>
