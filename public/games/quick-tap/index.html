<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Quick Tap</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;padding:20px;color:#fff}
h1{font-size:22px;margin-bottom:8px}
.hud{display:flex;gap:16px;margin-bottom:12px;font-size:14px}
.hud span{color:#4fc3f7;font-weight:bold}
#area{position:relative;width:min(340px,90vw);height:min(340px,90vw);background:#16213e;border-radius:16px;border:2px solid #0f3460;overflow:hidden;touch-action:manipulation}
#target{position:absolute;width:50px;height:50px;border-radius:50%;background:#e94560;cursor:pointer;transition:transform .1s;display:flex;align-items:center;justify-content:center;font-size:20px}
#target:active{transform:scale(0.8)}
#target.gold{background:#ffc107}
#start{margin-top:16px;padding:10px 28px;border:none;border-radius:10px;background:#4fc3f7;color:#1a1a2e;font-size:15px;font-weight:bold;cursor:pointer}
#msg{margin-top:10px;font-size:16px;min-height:24px;color:#ffc107}
</style>
</head>
<body>
<h1>⚡ Quick Tap</h1>
<div class="hud">Score: <span id="sc">0</span> | Time: <span id="tm">20</span>s | Best: <span id="bs">0</span></div>
<div id="area"><div id="target" style="display:none">🎯</div></div>
<button id="start">Start Game</button>
<div id="msg"></div>
<script>
const area=document.getElementById('area'),target=document.getElementById('target');
let score=0,timeLeft=20,timer=null,active=false;
let best=+localStorage.getItem('qt-best')||0;
document.getElementById('bs').textContent=best;
function moveTarget(){
  const aw=area.clientWidth-50,ah=area.clientHeight-50;
  target.style.left=Math.random()*aw+'px';
  target.style.top=Math.random()*ah+'px';
  const gold=Math.random()<0.15;
  target.className=gold?'gold':'';
  target.textContent=gold?'💎':'🎯';
  target.dataset.pts=gold?3:1;
}
function startGame(){
  score=0;timeLeft=20;active=true;
  document.getElementById('sc').textContent=0;
  document.getElementById('tm').textContent=20;
  document.getElementById('msg').textContent='';
  document.getElementById('start').style.display='none';
  target.style.display='flex';
  moveTarget();
  timer=setInterval(()=>{
    timeLeft--;document.getElementById('tm').textContent=timeLeft;
    if(timeLeft<=0){
      clearInterval(timer);active=false;
      target.style.display='none';
      document.getElementById('msg').textContent=`Time's up! Score: ${score}`;
      document.getElementById('start').style.display='block';
      document.getElementById('start').textContent='Play Again';
      if(score>best){best=score;localStorage.setItem('qt-best',best);document.getElementById('bs').textContent=best;}
    }
  },1000);
}
target.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(!active)return;
  score+=+target.dataset.pts;
  document.getElementById('sc').textContent=score;
  moveTarget();
});
document.getElementById('start').addEventListener('click',startGame);
</script>
<script>
(function(){function z(){document.body.style.zoom=1;var w=Math.max(document.documentElement.scrollWidth,320);var h=Math.max(document.documentElement.scrollHeight,320);var s=Math.min((innerWidth-12)/w,(innerHeight-12)/h,1.85);if(s>1.05)document.body.style.zoom=s;else document.body.style.zoom=1}z();addEventListener('resize',z)})();
</script>
</body>
</html>
