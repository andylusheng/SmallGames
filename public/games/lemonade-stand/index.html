<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Lemonade Stand</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial,sans-serif;background:#e9f6ff;color:#2d381f}body{display:flex;align-items:center;justify-content:center;padding:6px}.game{width:min(430px,100%);height:100%;max-height:720px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:6px}.title{text-align:center;font-size:22px;font-weight:950;color:#36531f}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:5px}.stat{padding:5px 3px;border:2px solid #9abf70;background:#f8ffe9;color:#6a8752;font-size:8px;text-align:center}.stat b{display:block;color:#31501c;font-size:13px}.weather{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;padding:9px;border:2px solid #7aa6cf;background:#dff4ff}.weather .icon{font-size:34px}.weather b{display:block;font-size:12px;color:#244b70}.weather span{font-size:9px;color:#54738e}.rep{height:6px;margin-top:5px;background:#bad0df}.rep i{display:block;height:100%;width:60%;background:linear-gradient(90deg,#f7b267,#8ac926,#43aa8b)}.scene{position:relative;min-height:0;border:3px solid #b57b3e;overflow:hidden;background:linear-gradient(#8dd8ff 0 58%,#8dcc62 58% 100%)}.sun{position:absolute;right:10%;top:10%;width:52px;height:52px;border-radius:50%;background:#ffe476;box-shadow:0 0 30px #ffd76a}.stand{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);width:62%;height:43%;background:#f8d57e;border:6px solid #8f5a2e;box-shadow:0 8px 0 #70401f}.awning{position:absolute;left:-6px;right:-6px;top:-24px;height:25px;background:repeating-linear-gradient(90deg,#fff3cd 0 34px,#f06a5d 34px 68px);border:5px solid #8f5a2e}.sign{position:absolute;left:50%;top:14%;transform:translateX(-50%);padding:7px 15px;border:4px solid #8f5a2e;background:#fff7d4;color:#5b381f;font-weight:950}.cups{position:absolute;left:13%;bottom:15%;font-size:30px}.people{position:absolute;right:10%;bottom:8%;font-size:31px;letter-spacing:5px}.panel{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:7px;border-top:3px solid #b57b3e;background:#fff6d8}.action{border:2px solid #d6b66e;background:#fffef1;color:#3f4b2e;padding:7px;text-align:left;font-size:8px;cursor:pointer}.action b{display:block;font-size:10px;color:#805021}.action span{display:block;margin-top:2px;color:#7d806b}.priceRow{display:flex;align-items:center;justify-content:space-between;gap:4px}.small{border:0;background:#78b7d5;color:#fff;font-weight:950;padding:4px 8px}.open{grid-column:1/-1;border:0;padding:9px;background:linear-gradient(90deg,#ffd166,#f4a261);color:#5d3516;font-weight:950}.msg{text-align:center;min-height:20px;color:#68785a;font-size:9px}.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#24401edb}.overlay.show{display:flex}.card{width:min(330px,90vw);padding:20px;border:4px solid #8f5a2e;background:#fff6d8;color:#4a361e;text-align:center}.card h2{margin:0}.card p{font-size:10px;color:#775f43}.resultGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:12px 0}.resultGrid div{padding:7px;background:#fffef2;border:2px solid #d8bc7d;font-size:8px;color:#8a754d}.resultGrid b{display:block;color:#4f3b22;font-size:13px}.btn{width:100%;border:0;padding:9px;background:#7db653;color:#fff;font-weight:950}</style></head><body><main class="game"><div class="title">🍋 Lemonade Stand<div class="stats"><div class="stat">MONEY<b id="money">$20</b></div><div class="stat">DAY<b id="day">1</b></div><div class="stat">CUPS<b id="cups">10</b></div><div class="stat">BEST<b id="best">$20</b></div></div></div><section class="weather"><div id="weatherIcon" class="icon">☀️</div><div><b id="weatherName">Sunny</b><span id="forecast">Strong demand for cold drinks.</span><div class="rep"><i id="repBar"></i></div></div></section><section class="scene"><div class="sun"></div><div class="stand"><div class="awning"></div><div class="sign">LEMONADE</div><div class="cups">🥤🥤</div><div class="people">🧍🧍</div></div></section><section class="panel"><button id="stock" class="action"><b>🍋 BUY SUPPLIES · $3</b><span>+5 cups</span></button><button id="marketing" class="action"><b>📣 MARKETING · $5</b><span>Demand boost today</span></button><div class="action"><b>💵 PRICE / CUP</b><div class="priceRow"><button id="down" class="small">−</button><strong id="price">$1.0</strong><button id="up" class="small">+</button></div></div><button id="recipe" class="action"><b>⭐ RECIPE Lv.<span id="recipeLv">1</span></b><span>Upgrade · $15</span></button><button id="open" class="open">OPEN FOR BUSINESS</button></section><div id="msg" class="msg">Read the weather, keep supply money in reserve, then set a fair price.</div></main><div id="result" class="overlay"><div class="card"><h2 id="resultTitle">Day Complete</h2><p id="resultText"></p><div class="resultGrid"><div>CUSTOMERS<b id="rCustomers">0</b></div><div>REVENUE<b id="rRevenue">$0</b></div><div>REPUTATION<b id="rRep">60</b></div></div><button id="next" class="btn">NEXT DAY</button></div></div><div id="over" class="overlay"><div class="card"><h2>STAND CLOSED</h2><p id="overText"></p><button id="again" class="btn">START FRESH</button></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),moneyEl=$('money'),dayEl=$('day'),cupsEl=$('cups'),bestEl=$('best'),priceEl=$('price'),recipeEl=$('recipeLv'),repBar=$('repBar'),msg=$('msg'),result=$('result'),over=$('over');let money=20,day=1,cups=10,price=1,recipe=1,reputation=60,marketing=false,best=+localStorage.getItem('lemonade-flag-best')||20,weather;const weathers=[['☀️','Sunny',1.45,'Strong demand for cold drinks.'],['⛅','Cloudy',1,'Average foot traffic today.'],['🌧️','Rainy',.55,'Fewer people are outside.'],['🔥','Hot',1.9,'Excellent lemonade weather.'],['❄️','Cold',.35,'Demand will be very low.']];bestEl.textContent='$'+best;function chooseWeather(){weather=weathers[Math.floor(Math.random()*weathers.length)]}chooseWeather();function demand(){const value=weather[2]*(2-price*.38)*(1+(recipe-1)*.17)*(reputation/70)*(marketing?1.35:1);return Math.max(.08,Math.min(2.3,value))}function ui(){moneyEl.textContent='$'+money.toFixed(1);dayEl.textContent=day;cupsEl.textContent=cups;priceEl.textContent='$'+price.toFixed(1);recipeEl.textContent=recipe;$('weatherIcon').textContent=weather[0];$('weatherName').textContent=weather[1];$('forecast').textContent=weather[3];repBar.style.width=Math.max(0,Math.min(100,reputation))+'%';$('stock').disabled=money<3;$('marketing').disabled=money<5||marketing;$('marketing').querySelector('span').textContent=marketing?'Campaign active today':'Demand boost today';$('recipe').disabled=money<15;$('down').disabled=price<=.5;$('up').disabled=price>=5}function reset(){money=20;day=1;cups=10;price=1;recipe=1;reputation=60;marketing=false;chooseWeather();result.classList.remove('show');over.classList.remove('show');msg.textContent='Read the weather, keep supply money in reserve, then set a fair price.';ui()}$('stock').onclick=()=>{if(money>=3){money-=3;cups+=5;msg.textContent='Stocked +5 cups.';ui()}};$('marketing').onclick=()=>{if(money>=5&&!marketing){money-=5;marketing=true;msg.textContent='Marketing active for today.';ui()}};$('up').onclick=()=>{price=Math.min(5,price+.5);ui()};$('down').onclick=()=>{price=Math.max(.5,price-.5);ui()};$('recipe').onclick=()=>{if(money>=15){money-=15;recipe++;msg.textContent='Recipe improved. Customers accept a little more price.';ui()}};$('open').onclick=()=>{const traffic=5+Math.floor(Math.random()*8),potential=Math.max(0,Math.floor(traffic*demand())),customers=Math.min(cups,potential),revenue=customers*price;cups-=customers;money+=revenue;const fair=price<=1.5+.35*(recipe-1),repDelta=customers===0?-4:fair?2:-Math.min(6,Math.ceil((price-(1.5+.35*(recipe-1)))*2));reputation=Math.max(20,Math.min(100,reputation+repDelta));best=Math.max(best,Math.floor(money));localStorage.setItem('lemonade-flag-best',best);bestEl.textContent='$'+best;$('rCustomers').textContent=customers;$('rRevenue').textContent='$'+revenue.toFixed(1);$('rRep').textContent=Math.round(reputation);$('resultTitle').textContent=customers>=8?'🍋 Busy Day':'Day '+day+' Complete';$('resultText').textContent=`${weather[0]} ${weather[1]} · price $${price.toFixed(1)} · ${marketing?'marketing helped traffic.':'no marketing today.'}`;marketing=false;result.classList.add('show');ui()};$('next').onclick=()=>{result.classList.remove('show');day++;if(cups<=0&&money<3){$('overText').textContent=`No stock and not enough cash to restock. Best cash record: $${best}.`;over.classList.add('show');return}if(day%3===1){const bonus=10+recipe*2;money+=bonus;msg.textContent=`Local festival bonus: +$${bonus}.`}else msg.textContent='New day, new forecast. Reconsider your price.';chooseWeather();ui()};$('again').onclick=reset;ui()})();</script></body></html>
