<!DOCTYPE html>
<html lang="en">
<head>

<title>Merge Defense</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,Arial,sans-serif;background:#06101e;color:#fff}
body{display:flex;align-items:center;justify-content:center;padding:8px;overflow:auto}.game{width:min(430px,97vw)}
.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:6px}.title{font-size:21px;font-weight:950}.sub{font-size:8px;color:#94a3b8;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hud{display:flex;gap:4px}.pill{background:#101a31;border:1px solid #ffffff14;border-radius:9px;padding:5px 7px;text-align:center;font-size:8px;color:#94a3b8}.pill b{display:block;font-size:13px;color:#fff}.pill.gold b{color:#fbbf24}
.phase{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding:6px 8px;background:#0e172a;border:1px solid #ffffff10;border-radius:11px}.phase strong{font-size:10px}.phase span{font-size:8px;color:#94a3b8}.badge{font-size:9px;font-weight:950;color:#a7f3d0;background:#064e3b;border-radius:999px;padding:4px 7px}.phase.battle .badge{color:#fde68a;background:#78350f}
.battle{background:linear-gradient(#112540,#0c182b);border:1px solid #ffffff12;border-radius:18px;padding:7px}.battle canvas{width:100%;height:158px;display:block;border-radius:12px;background:#0a1426}.wavebar{height:5px;background:#111827;border-radius:999px;overflow:hidden;margin-top:5px}.wavebar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#a78bfa,#fb7185)}.bossbar{display:none;margin-top:5px;background:#1f0b1a;border:1px solid #fb718533;border-radius:9px;padding:4px 6px}.bossline{display:flex;justify-content:space-between;font-size:8px;color:#fda4af;margin-bottom:3px}.bossbar .track{height:5px;background:#3f0b24;border-radius:999px;overflow:hidden}.bossbar .track i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#fb7185,#e11d48)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}.slot{aspect-ratio:1;background:linear-gradient(#15223d,#10192e);border:2px solid #233250;border-radius:11px;color:#fff;position:relative;font-size:21px;cursor:pointer}.slot.filled{border-color:#38bdf8}.slot.sel{border-color:#fbbf24;transform:translateY(-2px);box-shadow:0 0 0 3px #fbbf2420}.slot.rapid{border-color:#22d3ee}.slot.blast{border-color:#fb7185}.slot:disabled{cursor:default}.lvl{position:absolute;right:4px;bottom:3px;font-size:8px;color:#fbbf24;font-weight:950}.path{position:absolute;left:4px;top:3px;font-size:7px;color:#cbd5e1;font-weight:900}.specialize{display:none;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.pathBtn{border:1px solid #ffffff12;border-radius:10px;padding:7px;background:#111c34;color:#cbd5e1;font-size:9px;font-weight:900}.pathBtn.rapid{border-color:#22d3ee55;color:#67e8f9}.pathBtn.blast{border-color:#fb718555;color:#fda4af}
.controls{display:grid;grid-template-columns:1.2fr 1.2fr .8fr;gap:6px;margin-top:7px}.btn{border:0;border-radius:10px;padding:9px 5px;font-weight:950;font-size:9px;background:linear-gradient(135deg,#38bdf8,#818cf8);color:#07111f;cursor:pointer}.btn.start{background:linear-gradient(135deg,#34d399,#a3e635);color:#082f22}.btn.alt{background:#172033;color:#cbd5e1;border:1px solid #ffffff12}.btn:disabled{opacity:.42}.msg{font-size:9px;color:#cbd5e1;margin-top:6px;min-height:22px;text-align:center}
.over{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:#020617dc;backdrop-filter:blur(6px);z-index:10}.card{width:min(320px,88vw);background:linear-gradient(160deg,#15213d,#0d1528);border:1px solid #ffffff1a;border-radius:20px;padding:20px;text-align:center}.card p{font-size:11px;color:#cbd5e1}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.summary div{background:#0b1326;border-radius:9px;padding:7px 3px;color:#94a3b8;font-size:8px}.summary b{display:block;color:#fff;font-size:14px}.card .btn{width:100%;padding:11px}@media(max-height:600px){body{align-items:flex-start}.battle canvas{height:132px}.slot{font-size:18px}.grid{gap:4px}.phase{padding:4px 7px}.controls{margin-top:5px}.msg{margin-top:4px}}
</style></head><body>
<main class="game"><div class="top"><div><div class="title">🛡️ Merge Defense</div><div class="sub">ZeroPlay Strategy Lab</div></div><div class="hud"><div class="pill gold">GOLD<b id="gold">60</b></div><div class="pill">WAVE<b id="wave">1</b></div><div class="pill">HP<b id="hp">20</b></div><div class="pill">BEST<b id="best">0</b></div></div></div><div id="phase" class="phase"><div><strong id="phaseTitle">Preparation</strong><span id="phaseText"> Buy, merge and specialize before the next wave.</span></div><div id="phaseBadge" class="badge">PREP</div></div><section class="battle"><canvas id="c"></canvas><div class="wavebar"><i id="bar"></i></div><div id="bossbar" class="bossbar"><div class="bossline"><b>👑 BOSS</b><span id="bossHp">100%</span></div><div class="track"><i id="bossFill"></i></div></div></section><div id="grid" class="grid"></div><div id="specialize" class="specialize"><button id="rapidPath" class="pathBtn rapid">⚡ Rapid Path<br>faster fire</button><button id="blastPath" class="pathBtn blast">💥 Blast Path<br>splash damage</button></div><div class="controls"><button id="buy" class="btn">Buy Tower · 20g</button><button id="waveBtn" class="btn start">Start Wave 1</button><button id="speed" class="btn alt">1× Speed</button></div><div id="msg" class="msg">Merge equal towers in PREP. Level 3+ towers can specialize into Rapid or Blast.</div></main>
<div id="over" class="over"><div class="card"><h2>Defense Broken</h2><p id="overText"></p><div class="summary"><div>WAVE<b id="rWave">1</b></div><div>KILLS<b id="rKills">0</b></div><div>BEST<b id="rBest">0</b></div></div><button id="again" class="btn">Defend Again</button></div></div>
<script>
const $=id=>document.getElementById(id);const c=$('c'),ctx=c.getContext('2d'),gridEl=$('grid'),goldEl=$('gold'),waveEl=$('wave'),hpEl=$('hp'),bestEl=$('best'),bar=$('bar'),msg=$('msg'),buy=$('buy'),waveBtn=$('waveBtn'),speedBtn=$('speed'),phaseEl=$('phase'),phaseTitle=$('phaseTitle'),phaseText=$('phaseText'),phaseBadge=$('phaseBadge'),bossbar=$('bossbar'),bossFill=$('bossFill'),bossHp=$('bossHp'),specialize=$('specialize'),over=$('over');const STORE='merge-defense-v3';let save={best:0,totalKills:0};try{save={...save,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{}let DPR=Math.min(devicePixelRatio||1,2),W=380,H=158,gold=60,wave=1,hp=20,kills=0,towers=Array(10).fill(null),selected=null,enemies=[],shots=[],fx=[],spawnQueue=[],spawnClock=0,phase='prep',running=true,speed=1,waveTotal=0,audio=null;bestEl.textContent=save.best||0;
function persist(){save.best=Math.max(save.best||0,wave);localStorage.setItem(STORE,JSON.stringify(save))}function tone(freq=420,d=.05){try{audio=audio||new (AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}function resize(){W=c.clientWidth;H=c.clientHeight;c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);function tower(level=1,path='core'){return{level,path,cd:0}}function icon(t){return t.path==='rapid'?'⚡':t.path==='blast'?'💥':['','🔹','🔷','💠','🌟','☄️','🌌'][Math.min(t.level,6)]}function same(a,b){return a&&b&&a.level===b.level&&a.path===b.path}function towerStats(t){let damage=1.4+t.level*1.25,interval=Math.max(.18,.66-t.level*.055),splash=0;if(t.path==='rapid'){damage*=.78;interval*=.56}if(t.path==='blast'){damage*=1.35;interval*=1.18;splash=22+t.level*3}return{damage,interval,splash}}
function stats(){goldEl.textContent=gold;waveEl.textContent=wave;hpEl.textContent=hp;bestEl.textContent=save.best||0;buy.disabled=phase!=='prep'||gold<20||!running}function setPhase(next){phase=next;const battle=next==='battle';phaseEl.classList.toggle('battle',battle);phaseTitle.textContent=battle?`Wave ${wave} Battle`:'Preparation';phaseText.textContent=battle?' Towers fire automatically.':' Buy, merge and specialize before the next wave.';phaseBadge.textContent=battle?'BATTLE':'PREP';waveBtn.disabled=battle||!running;waveBtn.textContent=battle?'Wave Running':`Start Wave ${wave}`;renderGrid()}function renderGrid(){gridEl.innerHTML='';towers.forEach((t,i)=>{const b=document.createElement('button');b.className='slot'+(t?' filled':'')+(selected===i?' sel':'')+(t?.path==='rapid'?' rapid':'')+(t?.path==='blast'?' blast':'');b.disabled=phase!=='prep'||!running;b.innerHTML=t?`<span>${icon(t)}</span><span class="path">${t.path==='core'?'CORE':t.path.toUpperCase()}</span><span class="lvl">L${t.level}</span>`:'';b.onclick=()=>slot(i);gridEl.appendChild(b)});const t=selected!==null?towers[selected]:null;specialize.style.display=phase==='prep'&&t&&t.level>=3&&t.path==='core'?'grid':'none';stats()}function slot(i){if(!running||phase!=='prep')return;if(selected===null){if(towers[i])selected=i;renderGrid();return}if(i===selected){selected=null;renderGrid();return}if(same(towers[i],towers[selected])){const old=towers[i];towers[i]=tower(old.level+1,old.path);towers[selected]=null;gold+=5+old.level;selected=i;msg.textContent=`Merged to L${towers[i].level} · +${5+old.level}g`;fx.push({x:W*.5,y:H*.75,t:.55,text:'MERGE!',color:'#fbbf24'});tone(620+old.level*40,.08);navigator.vibrate?.(16)}else if(!towers[i]){towers[i]=towers[selected];towers[selected]=null;selected=i}else{selected=i;msg.textContent='Select an equal level/path tower to merge.'}renderGrid()}function choosePath(path){if(selected===null)return;const t=towers[selected];if(!t||t.level<3||t.path!=='core')return;t.path=path;msg.textContent=path==='rapid'?'⚡ Rapid tower: faster attacks.':'💥 Blast tower: splash damage.';tone(path==='rapid'?760:420,.1);renderGrid()}$('rapidPath').onclick=()=>choosePath('rapid');$('blastPath').onclick=()=>choosePath('blast');
function makeEnemy(type,index){const base=10+wave*3.3;if(type==='scout')return{type,x:W+20+index*3,y:46+Math.random()*70,hp:base*.65,max:base*.65,v:76+wave*1.5,reward:4+wave,size:8,color:'#fbbf24',armor:0};if(type==='tank')return{type,x:W+20+index*3,y:46+Math.random()*70,hp:base*2.25,max:base*2.25,v:31+wave*.8,reward:8+wave*2,size:14,color:'#fb7185',armor:.12};if(type==='boss')return{type,x:W+26,y:80,hp:base*8,max:base*8,v:23+wave*.45,reward:35+wave*4,size:23,color:'#e879f9',armor:.2,boss:true};return{type:'grunt',x:W+20+index*3,y:46+Math.random()*70,hp:base,max:base,v:47+wave*1.05,reward:5+wave,size:10,color:'#a78bfa',armor:0}}function buildWave(){const q=[],count=4+wave*2;for(let i=0;i<count;i++){const r=Math.random();q.push(makeEnemy(wave>=3&&r<.2?'tank':wave>=2&&r<.45?'scout':'grunt',i))}if(wave%5===0)q.push(makeEnemy('boss',count));return q}function startWave(){if(phase!=='prep'||!running)return;selected=null;spawnQueue=buildWave();waveTotal=spawnQueue.length;spawnClock=0;enemies=[];shots=[];bar.style.width='0';bossbar.style.display=wave%5===0?'block':'none';bossFill.style.width='100%';bossHp.textContent='100%';setPhase('battle');msg.textContent=wave%5===0?`👑 Boss wave ${wave}`:`Wave ${wave} incoming`;tone(520,.1)}function target(){return enemies.reduce((a,b)=>!a||b.x<a.x?b:a,null)}function damage(e,dmg,color){if(e.dead)return;const real=dmg*(1-(e.armor||0));e.hp-=real;fx.push({x:e.x,y:e.y-12,t:.42,text:'-'+Math.max(1,Math.round(real)),color:color||'#fff'});if(e.hp<=0)kill(e)}function kill(e){if(e.dead)return;e.dead=true;gold+=e.reward;kills++;save.totalKills=(save.totalKills||0)+1;fx.push({x:e.x,y:e.y,t:.5,text:'+'+e.reward+'g',color:'#fbbf24'});if(e.boss){tone(880,.18);navigator.vibrate?.(60);msg.textContent='👑 Boss destroyed!'}stats()}function endGame(){running=false;phase='over';save.best=Math.max(save.best||0,wave);persist();$('overText').textContent=`The base fell on wave ${wave}. Merge earlier and specialize level 3+ towers.`;$('rWave').textContent=wave;$('rKills').textContent=kills;$('rBest').textContent=save.best;over.style.display='flex';tone(150,.18)}function waveClear(){const reward=10+wave*3;gold+=reward;save.best=Math.max(save.best||0,wave);persist();msg.textContent=`Wave ${wave} cleared · +${reward}g`;wave++;bar.style.width='0';bossbar.style.display='none';setPhase('prep');stats();tone(740,.1)}
function update(dt){if(!running||phase!=='battle')return;spawnClock+=dt;if(spawnQueue.length&&spawnClock>=.46){spawnClock-=.46;enemies.push(spawnQueue.shift())}for(const e of enemies){e.x-=e.v*dt;if(e.x<12){e.dead=true;hp--;hpEl.textContent=hp;fx.push({x:18,y:e.y,t:.42,text:'BASE -1',color:'#fb7185'});if(hp<=0){endGame();return}}}enemies=enemies.filter(e=>!e.dead);for(let i=0;i<towers.length;i++){const t=towers[i];if(!t)continue;t.cd=Math.max(0,(t.cd||0)-dt);if(t.cd>0)continue;const aim=target();if(!aim)continue;const s=towerStats(t),px=28+(i%5)*(W-56)/4,py=H-20-Math.floor(i/5)*14;t.cd=s.interval;shots.push({x:px,y:py,target:aim,damage:s.damage,splash:s.splash,v:450,color:t.path==='rapid'?'#22d3ee':t.path==='blast'?'#fb7185':['','#38bdf8','#34d399','#fbbf24','#fb923c','#c084fc'][Math.min(t.level,5)]})}for(let i=shots.length-1;i>=0;i--){const s=shots[i];if(!s.target||s.target.dead){shots.splice(i,1);continue}const dx=s.target.x-s.x,dy=s.target.y-s.y,d=Math.hypot(dx,dy);if(d<10){const hit=s.target;damage(hit,s.damage,s.color);if(s.splash){for(const e of enemies)if(e!==hit&&!e.dead&&Math.hypot(e.x-hit.x,e.y-hit.y)<s.splash)damage(e,s.damage*.48,s.color);fx.push({x:hit.x,y:hit.y,t:.3,text:'',color:'#fb7185',ring:s.splash})}shots.splice(i,1)}else{const step=Math.min(d,s.v*dt);s.x+=dx/d*step;s.y+=dy/d*step}}enemies=enemies.filter(e=>!e.dead);for(const f of fx)f.t-=dt;fx=fx.filter(f=>f.t>0);const remaining=spawnQueue.length+enemies.length;bar.style.width=Math.max(0,Math.min(100,(1-remaining/Math.max(1,waveTotal))*100))+'%';const boss=enemies.find(e=>e.boss)||spawnQueue.find(e=>e.boss);if(boss){bossbar.style.display='block';const pct=Math.max(0,boss.hp/boss.max*100);bossFill.style.width=pct+'%';bossHp.textContent=Math.ceil(pct)+'%'}if(!spawnQueue.length&&!enemies.length&&!shots.length)waveClear()}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'#081827');g.addColorStop(1,'#172c4c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let y=0;y<H;y+=24){ctx.strokeStyle='#ffffff08';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.fillStyle='#14532d';ctx.fillRect(0,30,10,H-44);ctx.fillStyle='#86efac';ctx.fillRect(3,42,4,H-68);ctx.fillStyle='#94a3b8';ctx.font='bold 9px Arial';ctx.fillText('BASE',14,17);ctx.strokeStyle='#334155';ctx.lineWidth=24;ctx.beginPath();ctx.moveTo(0,H*.53);ctx.lineTo(W,H*.53);ctx.stroke();ctx.setLineDash([10,9]);ctx.strokeStyle='#ffffff1f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,H*.53);ctx.lineTo(W,H*.53);ctx.stroke();ctx.setLineDash([]);for(const e of enemies){ctx.shadowBlur=e.boss?18:9;ctx.shadowColor=e.color;ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.size,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(e.type==='tank'){ctx.strokeStyle='#fecdd3';ctx.lineWidth=2;ctx.strokeRect(e.x-e.size*.65,e.y-e.size*.65,e.size*1.3,e.size*1.3)}if(e.boss){ctx.fillStyle='#fff';ctx.font='15px Arial';ctx.textAlign='center';ctx.fillText('♛',e.x,e.y+5);ctx.textAlign='start'}ctx.fillStyle='#07111f';ctx.fillRect(e.x-e.size,e.y-e.size-7,e.size*2,3);ctx.fillStyle=e.hp/e.max>.5?'#34d399':'#fb7185';ctx.fillRect(e.x-e.size,e.y-e.size-7,e.size*2*Math.max(0,e.hp/e.max),3)}for(const s of shots){ctx.fillStyle=s.color;ctx.shadowBlur=7;ctx.shadowColor=s.color;ctx.beginPath();ctx.arc(s.x,s.y,3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}for(let i=0;i<towers.length;i++){const t=towers[i];if(!t)continue;const px=28+(i%5)*(W-56)/4,py=H-20-Math.floor(i/5)*14,col=t.path==='rapid'?'#22d3ee':t.path==='blast'?'#fb7185':['','#38bdf8','#34d399','#fbbf24','#fb923c','#c084fc'][Math.min(t.level,5)];ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(px,py,7,0,Math.PI*2);ctx.fill();ctx.fillStyle=col;ctx.beginPath();ctx.arc(px,py,4.5,0,Math.PI*2);ctx.fill()}for(const f of fx){ctx.globalAlpha=Math.min(1,f.t/.2);if(f.ring){ctx.strokeStyle=f.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(f.x,f.y,f.ring*(1-f.t/.3),0,Math.PI*2);ctx.stroke()}if(f.text){ctx.fillStyle=f.color||'#fff';ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y-(.5-f.t)*18);ctx.textAlign='start'}ctx.globalAlpha=1}}
function reset(){gold=60;wave=1;hp=20;kills=0;towers=Array(10).fill(null);selected=null;enemies=[];shots=[];fx=[];spawnQueue=[];spawnClock=0;phase='prep';running=true;speed=1;bar.style.width='0';bossbar.style.display='none';over.style.display='none';speedBtn.textContent='1× Speed';msg.textContent='Merge equal towers in PREP. Level 3+ towers can specialize into Rapid or Blast.';setPhase('prep');stats()}buy.onclick=()=>{if(gold<20||phase!=='prep'||!running)return;const i=towers.indexOf(null);if(i<0){msg.textContent='Grid full · merge two equal towers first';return}gold-=20;towers[i]=tower(1);selected=i;renderGrid();tone(460,.05)};waveBtn.onclick=startWave;speedBtn.onclick=()=>{speed=speed===1?2:1;speedBtn.textContent=speed+'× Speed'};$('again').onclick=reset;resize();reset();let last=performance.now(),acc=0;const STEP=1/60;function loop(now){const elapsed=Math.min(.1,(now-last)/1000);last=now;acc+=elapsed*speed;while(acc>=STEP){update(STEP);acc-=STEP}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
