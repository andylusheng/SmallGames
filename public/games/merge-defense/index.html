<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Merge Defense</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;background:#1b130c;color:#fff7df}body{padding:6px;display:flex;align-items:stretch;justify-content:center}button{font:inherit}.game{width:min(760px,100%);height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:6px;user-select:none}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brandmark{width:32px;height:32px;display:grid;place-items:center;background:#d6b06b;border:3px solid #fff0bd;box-shadow:4px 4px 0 #4f3018;color:#4a2b13;font-size:18px}.brand h1{margin:0;font-size:18px;line-height:1;letter-spacing:-.04em}.brand small{display:block;margin-top:4px;color:#f2d58e;font-size:8px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.hud{display:flex;gap:5px}.chip{min-width:54px;padding:5px 7px;border:2px solid #9a6d38;background:#332313;box-shadow:3px 3px 0 #0f0a06;text-align:center;color:#ead4aa;font-size:8px;font-weight:900}.chip b{display:block;margin-top:1px;color:#fff7df;font-size:14px}.chip.gold b{color:#ffd56a}.chip.hp b{color:#aef279}
    .battle-wrap{position:relative;min-height:0;border:3px solid #d7a55f;padding:4px;background:#714a24;box-shadow:5px 5px 0 #0f0a06}.battle{position:relative;width:100%;height:100%;min-height:230px;overflow:hidden;background:#98d171}.battle canvas{display:block;width:100%;height:100%;background:#98d171;touch-action:none;image-rendering:pixelated;image-rendering:crisp-edges}.phase-label,.wave-preview{position:absolute;z-index:4;top:8px;display:flex;align-items:center;gap:6px;padding:6px 8px;background:#2a1b10;border:2px solid #a97a42;box-shadow:2px 2px 0 #0f0a06;font-size:10px;font-weight:950;letter-spacing:.04em}.phase-label{left:8px;width:auto;height:auto;min-height:0}.wave-preview{right:8px;max-width:55%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#fff1c8}.phase-dot{width:7px;height:7px;background:#aef279}.phase-label.is-battle .phase-dot{background:#ffd56a}.boss-hud{display:none;position:absolute;z-index:5;left:50%;top:7px;transform:translateX(-50%);width:min(300px,62%);padding:5px 7px;background:#4a1f14;border:2px solid #e89954}.boss-hud.show{display:block}.boss-title{display:flex;justify-content:space-between;color:#ffd5a3;font-size:9px;font-weight:950}.boss-track{height:6px;margin-top:4px;background:#6d2a18;overflow:hidden}.boss-fill{height:100%;width:100%;background:#e37a3c}.warning{display:none;position:absolute;z-index:8;left:50%;top:44px;transform:translateX(-50%);padding:8px 14px;background:#5a1f14;border:3px solid #f2b35f;box-shadow:4px 4px 0 #2c120a;text-align:center}.warning.show{display:block;animation:warnFlash .28s steps(2,end) 4}.warning strong{font-size:20px;letter-spacing:.1em;color:#ffd38a}.warning span{display:block;margin-top:3px;font-size:9px;color:#ffe5bd;letter-spacing:.12em;font-weight:900}@keyframes warnFlash{50%{background:#8a2e18}}
    .command{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:7px;padding:7px 9px;border:2px solid #8f6536;background:#2b1d10;box-shadow:3px 3px 0 #0f0a06}.inspector{min-width:0;flex:1;text-align:left}.inspector strong{display:block;font-size:11px;color:#fff7df}.inspector span{display:block;margin-top:3px;max-width:500px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:9px;color:#ead4aa}.specialize{display:none;gap:5px;flex:0 0 auto}.specialize.show{display:flex}.path-btn{border:2px solid #9b6c38;background:#3a2817;padding:7px 9px;color:#fff0c8;cursor:pointer;font-size:9px;font-weight:900;box-shadow:2px 2px 0 #0f0a06}.path-btn.catapult{border-color:#e0a34e;color:#ffd38a}.path-btn.trebuchet{border-color:#d66a43;color:#ffb08f}.actions{display:grid;grid-template-columns:1.05fr 1.25fr .65fr .78fr;gap:6px}.btn{border:2px solid #2b180b;padding:9px 7px;font-size:10px;font-weight:950;cursor:pointer;box-shadow:3px 3px 0 #0f0a06;transition:transform .08s}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #0f0a06}.buy{background:#e0b86c;color:#321d0c}.start{background:#9bd259;color:#1d310b;animation:breathe 1.2s steps(2,end) infinite}.start:disabled{animation:none}.speed{background:#695039;color:#fff1cf}.mud{background:#9a673c;color:#fff0d0}.btn:disabled{opacity:.48;cursor:default;filter:saturate(.4)}@keyframes breathe{50%{outline:3px solid #e7f78c66}}
    .toast{position:fixed;left:50%;top:50%;z-index:30;pointer-events:none;transform:translate(-50%,-50%) scale(.8);opacity:0;padding:9px 14px;background:#2b1a0e;border:3px solid #f3d496;box-shadow:5px 5px 0 #0f0a06;font-size:13px;font-weight:950}.toast.show{animation:toast .7s steps(5,end)}@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) scale(1)}}.game-over{display:none;position:fixed;inset:0;z-index:40;align-items:center;justify-content:center;padding:20px;background:#150d08e8}.game-over.show{display:flex}.over-card{width:min(330px,90vw);padding:20px;border:3px solid #9a6b38;background:#352312;text-align:center;box-shadow:7px 7px 0 #0f0a06}.over-card h2{margin:0;font-size:24px}.over-card p{color:#e2c89c;font-size:11px;line-height:1.5}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:13px 0}.summary div{padding:7px 3px;border:2px solid #7b5730;background:#24170d;color:#cfaf7f;font-size:9px}.summary b{display:block;margin-top:2px;color:#fff7df;font-size:14px}.over-card .btn{width:100%;padding:11px;background:#d7ae65;color:#3a220f}
    @media(max-width:520px){body{padding:4px}.game{gap:4px}.brand small{display:none}.brand h1{font-size:16px}.brandmark{width:28px;height:28px}.chip{min-width:43px;padding:4px 5px}.chip b{font-size:12px}.battle-wrap{padding:3px}.battle{min-height:205px}.command{min-height:42px;padding:5px 6px}.inspector span{max-width:235px}.actions{gap:4px}.btn{padding:8px 4px;font-size:8px}.wave-preview{max-width:56%;font-size:8px}.phase-label{font-size:8px}}
    @media(max-height:590px){.top{min-height:32px}.battle{min-height:190px}.command{min-height:38px}.btn{padding:7px 5px}.game{gap:4px}}
  </style>
</head>
<body>
  <main class="game">
    <header class="top">
      <div class="brand"><div class="brandmark">♜</div><div><h1>MERGE DEFENSE</h1><small>MEDIEVAL FRONTIER</small></div></div>
      <div class="hud"><div class="chip">WAVE<b id="wave">1</b></div><div class="chip hp">CASTLE<b id="hp">20</b></div><div class="chip gold">GOLD<b id="gold">60</b></div></div>
    </header>
    <section class="battle-wrap"><div class="battle" id="battleBox">
      <canvas id="battle" width="480" height="270" aria-label="Medieval Merge Defense battlefield"></canvas>
      <div id="phaseLabel" class="phase-label"><i class="phase-dot"></i><span id="phaseText">PREP</span></div>
      <div id="wavePreview" class="wave-preview">NEXT · RAIDER ×4</div>
      <div id="bossHud" class="boss-hud"><div class="boss-title"><span>OGRE CHIEF</span><span id="bossPct">100%</span></div><div class="boss-track"><div id="bossFill" class="boss-fill"></div></div></div>
      <div id="warning" class="warning"><strong>OGRE CHIEF</strong><span>HEAVY WAVE INCOMING</span></div>
    </div></section>
    <section class="command"><div class="inspector"><strong id="inspectTitle">Build Phase</strong><span id="message">Enemies enter from the RIGHT. Defend the CASTLE on the LEFT.</span></div><div id="specialize" class="specialize"><button id="catapultBtn" class="path-btn catapult">CATAPULT</button><button id="trebuchetBtn" class="path-btn trebuchet">TREBUCHET</button></div></section>
    <div class="actions"><button id="buy" class="btn buy">BUILD STONE TOWER · 20G</button><button id="startWave" class="btn start">START WAVE 1</button><button id="speed" class="btn speed">1×</button><button id="mud" class="btn mud" disabled>MUD TRAP</button></div>
  </main>
  <div id="toast" class="toast">LEVEL UP!</div>
  <div id="gameOver" class="game-over"><div class="over-card"><h2>CASTLE FALLEN</h2><p id="overText"></p><div class="summary"><div>WAVE<b id="finalWave">1</b></div><div>KILLS<b id="finalKills">0</b></div><div>BEST<b id="bestWave">1</b></div></div><button id="again" class="btn">DEFEND AGAIN</button></div></div>
  <script src="./game.js"></script>
</body>
</html>
