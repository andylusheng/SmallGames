<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Merge Defense</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111d;color:#f8fafc}body{display:flex;align-items:center;justify-content:center;padding:8px;overflow:auto}
    button{font:inherit}.game{width:min(560px,98vw);user-select:none}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}.brand{display:flex;align-items:center;gap:9px}.brandmark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#22d3ee,#2563eb);box-shadow:0 8px 24px #0284c755;font-size:18px}.brand h1{margin:0;font-size:20px;letter-spacing:-.03em}.brand small{display:block;margin-top:1px;color:#7dd3fc;font-size:8px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.hud{display:flex;gap:5px}.chip{min-width:56px;padding:6px 8px;border:1px solid #ffffff14;background:#0d1a2c;border-radius:12px;text-align:center;color:#8fa8bf;font-size:8px;font-weight:800}.chip b{display:block;margin-top:1px;color:#fff;font-size:14px}.chip.gold b{color:#fbbf24}.chip.hp b{color:#86efac}
    .battle-wrap{position:relative;border:1px solid #5ddcff22;border-radius:22px;padding:7px;background:linear-gradient(150deg,#0b1a2d,#081421);box-shadow:0 22px 70px #0008,inset 0 0 45px #0ea5e914}.battle{position:relative;overflow:hidden;border-radius:16px}.battle canvas{display:block;width:100%;aspect-ratio:16/9;background:#102438;touch-action:none}.battle:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px #02061780}.phase-label{position:absolute;left:12px;top:11px;z-index:3;display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;background:#07111dcc;border:1px solid #ffffff17;backdrop-filter:blur(7px);font-size:9px;font-weight:950;letter-spacing:.08em}.phase-dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 12px #34d399}.phase-label.battle .phase-dot{background:#fbbf24;box-shadow:0 0 12px #f59e0b}.boss-hud{display:none;position:absolute;z-index:4;left:50%;top:10px;transform:translateX(-50%);width:min(310px,67%);padding:6px 9px;border-radius:12px;background:#25091ddd;border:1px solid #fb718555;backdrop-filter:blur(7px)}.boss-hud.show{display:block}.boss-title{display:flex;justify-content:space-between;color:#fda4af;font-size:9px;font-weight:950;letter-spacing:.08em}.boss-track{height:6px;margin-top:4px;border-radius:999px;background:#4c102f;overflow:hidden}.boss-fill{height:100%;width:100%;background:linear-gradient(90deg,#fb7185,#e11d48,#c026d3);box-shadow:0 0 14px #fb718588}.warning{display:none;position:absolute;inset:0;z-index:6;align-items:center;justify-content:center;flex-direction:column;background:#14030fbb;backdrop-filter:blur(3px);text-align:center}.warning.show{display:flex;animation:warnFlash .28s linear 3}.warning strong{font-size:30px;letter-spacing:.14em;color:#fb7185;text-shadow:0 0 24px #ef4444}.warning span{margin-top:3px;font-size:11px;color:#fecdd3;letter-spacing:.2em;font-weight:900}@keyframes warnFlash{50%{background:#4c0519cc}}
    .between{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 2px 6px;color:#91a8bd;font-size:9px}.between strong{color:#e2e8f0}.hint{display:flex;gap:8px;align-items:center}.legend{display:flex;gap:5px}.tag{padding:4px 7px;border:1px solid #ffffff10;border-radius:999px;background:#0c1728;color:#94a3b8}.tag.rapid{color:#67e8f9}.tag.blast{color:#fdba74}
    .tray{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tower-slot{position:relative;aspect-ratio:1;border:1px solid #314157;border-radius:14px;background:linear-gradient(160deg,#15233a,#0d1829);display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;transition:transform .16s,border-color .16s,box-shadow .16s}.tower-slot.empty:after{content:"+";font-size:22px;color:#334155}.tower-slot img{width:74%;height:74%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 9px 8px #0006)}.tower-slot .level{position:absolute;right:5px;bottom:4px;padding:2px 5px;border-radius:999px;background:#07111de8;color:#fde68a;font-size:8px;font-weight:950}.tower-slot .path{position:absolute;left:5px;top:4px;font-size:7px;font-weight:950;letter-spacing:.08em;color:#94a3b8}.tower-slot.selected{border-color:#fbbf24;box-shadow:0 0 0 3px #fbbf2420,0 8px 24px #0005;transform:translateY(-2px)}.tower-slot.merge-target{border-color:#34d399;box-shadow:0 0 0 3px #34d39922,0 0 25px #34d39922}.tower-slot.dragging{opacity:.45;transform:scale(.94)}.tower-slot.merge-pop{animation:mergePop .42s cubic-bezier(.2,1.5,.3,1)}@keyframes mergePop{0%{transform:scale(.8)}45%{transform:scale(1.18);box-shadow:0 0 40px #fde04788}100%{transform:scale(1)}}
    .actions{display:grid;grid-template-columns:1fr 1.25fr .72fr;gap:7px;margin-top:7px}.btn{border:0;border-radius:12px;padding:10px 8px;font-size:10px;font-weight:950;cursor:pointer;transition:transform .14s,filter .14s}.btn:active{transform:scale(.98)}.buy{background:linear-gradient(135deg,#38bdf8,#6366f1);color:#06101e}.start{background:linear-gradient(135deg,#34d399,#a3e635);color:#052e16;box-shadow:0 0 0 0 #34d39955;animation:breathe 1.8s infinite}.start:disabled{animation:none}.speed{background:#172236;color:#cbd5e1;border:1px solid #ffffff12}.btn:disabled{opacity:.42;cursor:default;filter:saturate(.4)}@keyframes breathe{55%{box-shadow:0 0 0 8px #34d39900,0 0 26px #34d39944}}
    .specialize{display:none;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.specialize.show{display:grid}.path-btn{border:1px solid #ffffff12;border-radius:12px;background:#0d1829;padding:9px;color:#cbd5e1;text-align:left;cursor:pointer}.path-btn b{display:block;font-size:10px}.path-btn span{display:block;margin-top:2px;font-size:8px;color:#7890a6}.path-btn.rapid{border-color:#22d3ee55}.path-btn.rapid b{color:#67e8f9}.path-btn.blast{border-color:#fb923c55}.path-btn.blast b{color:#fdba74}.message{height:23px;margin-top:5px;text-align:center;color:#9fb2c4;font-size:9px;font-weight:750}
    .toast{position:fixed;left:50%;top:50%;z-index:20;pointer-events:none;transform:translate(-50%,-50%) scale(.8);opacity:0;padding:10px 16px;border-radius:14px;background:#07111de6;border:1px solid #ffffff1c;font-weight:950;box-shadow:0 18px 50px #0009}.toast.show{animation:toast .7s ease-out}@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
    .game-over{display:none;position:fixed;inset:0;z-index:30;align-items:center;justify-content:center;padding:20px;background:#020617dc;backdrop-filter:blur(7px)}.game-over.show{display:flex}.over-card{width:min(330px,90vw);padding:22px;border:1px solid #ffffff16;border-radius:24px;background:linear-gradient(150deg,#15233a,#0a1424);text-align:center;box-shadow:0 30px 90px #000a}.over-card h2{margin:0;font-size:26px}.over-card p{color:#9fb2c4;font-size:11px;line-height:1.5}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0}.summary div{padding:8px 3px;border-radius:10px;background:#07111d;color:#7890a6;font-size:8px}.summary b{display:block;margin-top:2px;color:#fff;font-size:15px}.over-card .btn{width:100%;padding:12px;background:linear-gradient(135deg,#38bdf8,#818cf8);color:#06101e}
    @media(max-height:650px){body{align-items:flex-start}.battle canvas{aspect-ratio:16/8}.tower-slot{aspect-ratio:1.15}.game{width:min(520px,98vw)}}
  </style>
</head>
<body>
  <main class="game">
    <header class="top">
      <div class="brand"><div class="brandmark">🛡</div><div><h1>Merge Defense</h1><small>Neon Outpost</small></div></div>
      <div class="hud"><div class="chip">WAVE<b id="wave">1</b></div><div class="chip hp">BASE<b id="hp">20</b></div><div class="chip gold">GOLD<b id="gold">60</b></div></div>
    </header>
    <section class="battle-wrap">
      <div class="battle">
        <canvas id="battle" width="960" height="540" aria-label="Merge Defense battlefield"></canvas>
        <div id="phaseLabel" class="phase-label"><i class="phase-dot"></i><span id="phaseText">PREP</span></div>
        <div id="bossHud" class="boss-hud"><div class="boss-title"><span>TITAN MK-I</span><span id="bossPct">100%</span></div><div class="boss-track"><div id="bossFill" class="boss-fill"></div></div></div>
        <div id="warning" class="warning"><strong>WARNING</strong><span>TITAN MK-I INCOMING</span></div>
      </div>
    </section>
    <div class="between"><div class="hint"><strong id="prepHint">Drag matching towers together to merge.</strong></div><div class="legend"><span class="tag rapid">⚡ Rapid</span><span class="tag blast">💥 Blast</span></div></div>
    <section id="tray" class="tray" aria-label="Tower merge tray"></section>
    <section id="specialize" class="specialize"><button id="rapidBtn" class="path-btn rapid"><b>⚡ Rapid Path</b><span>Fast laser bursts, lower damage per hit</span></button><button id="blastBtn" class="path-btn blast"><b>💥 Blast Path</b><span>Heavy shells with splash damage</span></button></section>
    <div class="actions"><button id="buy" class="btn buy">Buy Tower · 20g</button><button id="startWave" class="btn start">Start Wave 1</button><button id="speed" class="btn speed">1×</button></div>
    <div id="message" class="message">Build your squad, merge equal towers, then start the wave.</div>
  </main>
  <div id="toast" class="toast">LEVEL UP!</div>
  <div id="gameOver" class="game-over"><div class="over-card"><h2>Outpost Lost</h2><p id="overText"></p><div class="summary"><div>WAVE<b id="finalWave">1</b></div><div>KILLS<b id="finalKills">0</b></div><div>BEST<b id="bestWave">1</b></div></div><button id="again" class="btn">Defend Again</button></div></div>
  <script src="./game.js"></script>
</body>
</html>
