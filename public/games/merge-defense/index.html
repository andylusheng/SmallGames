<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Merge Defense</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;background:#071018;color:#f8fafc}body{padding:6px;display:flex;align-items:stretch;justify-content:center}button{font:inherit}.game{width:min(720px,100%);height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:6px;user-select:none}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brandmark{width:31px;height:31px;display:grid;place-items:center;background:#22d3ee;border:2px solid #cffafe;box-shadow:4px 4px 0 #0e3a57;color:#06212b;font-size:17px}.brand h1{margin:0;font-size:18px;line-height:1;letter-spacing:-.04em}.brand small{display:block;margin-top:4px;color:#67e8f9;font-size:7px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.hud{display:flex;gap:5px}.chip{min-width:51px;padding:5px 7px;border:2px solid #29415a;background:#0d1a2c;box-shadow:3px 3px 0 #02070c;text-align:center;color:#8198ae;font-size:7px;font-weight:900}.chip b{display:block;margin-top:1px;color:#fff;font-size:13px}.chip.gold b{color:#fbbf24}.chip.hp b{color:#86efac}
    .battle-wrap{position:relative;min-height:0;border:2px solid #3b6f87;padding:4px;background:#0b1a2d;box-shadow:5px 5px 0 #02070c}.battle{position:relative;width:100%;height:100%;min-height:230px;overflow:hidden}.battle canvas{display:block;width:100%;height:100%;background:#163c2f;touch-action:none;image-rendering:pixelated;image-rendering:crisp-edges}.battle:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 2px #07101866}.phase-label,.wave-preview{position:absolute;z-index:4;top:8px;display:flex;align-items:center;gap:6px;padding:5px 7px;background:#07111ddd;border:2px solid #29415a;box-shadow:2px 2px 0 #02070c;font-size:8px;font-weight:950;letter-spacing:.04em}.phase-label{left:8px}.wave-preview{right:8px;max-width:53%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#dbeafe}.phase-dot{width:6px;height:6px;background:#34d399}.phase-label.battle .phase-dot{background:#fbbf24}.boss-hud{display:none;position:absolute;z-index:5;left:50%;top:7px;transform:translateX(-50%);width:min(300px,62%);padding:5px 7px;background:#25091dee;border:2px solid #fb7185}.boss-hud.show{display:block}.boss-title{display:flex;justify-content:space-between;color:#fda4af;font-size:8px;font-weight:950}.boss-track{height:6px;margin-top:4px;background:#4c102f;overflow:hidden}.boss-fill{height:100%;width:100%;background:#e879f9}.warning{display:none;position:absolute;inset:0;z-index:8;align-items:center;justify-content:center;flex-direction:column;background:#190611d8;text-align:center}.warning.show{display:flex;animation:warnFlash .28s steps(2,end) 4}.warning strong{font-size:28px;letter-spacing:.12em;color:#fb7185;text-shadow:3px 3px 0 #4c0519}.warning span{margin-top:5px;font-size:10px;color:#fecdd3;letter-spacing:.14em;font-weight:900}@keyframes warnFlash{50%{background:#500a20e8}}
    .command{min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:7px;padding:6px 8px;border:2px solid #29415a;background:#0b1726;box-shadow:3px 3px 0 #02070c}.inspector{min-width:0;flex:1;text-align:left}.inspector strong{display:block;font-size:9px;color:#fff}.inspector span{display:block;margin-top:3px;max-width:460px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:8px;color:#8fa8bf}.specialize{display:none;gap:5px;flex:0 0 auto}.specialize.show{display:flex}.path-btn{border:2px solid #38516b;background:#111d2f;padding:6px 8px;color:#cbd5e1;cursor:pointer;font-size:8px;font-weight:900;box-shadow:2px 2px 0 #02070c}.path-btn.rapid{border-color:#22d3ee;color:#67e8f9}.path-btn.blast{border-color:#fb923c;color:#fdba74}.actions{display:grid;grid-template-columns:1.05fr 1.25fr .65fr .72fr;gap:6px}.btn{border:2px solid #071018;padding:9px 7px;font-size:9px;font-weight:950;cursor:pointer;box-shadow:3px 3px 0 #02070c;transition:transform .08s}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #02070c}.buy{background:#38bdf8;color:#06101e}.start{background:#84cc16;color:#102400;animation:breathe 1.2s steps(2,end) infinite}.start:disabled{animation:none}.speed{background:#23334b;color:#e2e8f0}.emp{background:#a78bfa;color:#16052c}.btn:disabled{opacity:.36;cursor:default;filter:saturate(.3)}@keyframes breathe{50%{outline:3px solid #a3e63555}}
    .toast{position:fixed;left:50%;top:50%;z-index:30;pointer-events:none;transform:translate(-50%,-50%) scale(.8);opacity:0;padding:9px 14px;background:#07111d;border:3px solid #e2e8f0;box-shadow:5px 5px 0 #02070c;font-size:12px;font-weight:950}.toast.show{animation:toast .7s steps(5,end)}@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) scale(1)}}.game-over{display:none;position:fixed;inset:0;z-index:40;align-items:center;justify-content:center;padding:20px;background:#020617e8}.game-over.show{display:flex}.over-card{width:min(330px,90vw);padding:20px;border:3px solid #51677f;background:#101d2f;text-align:center;box-shadow:7px 7px 0 #02070c}.over-card h2{margin:0;font-size:24px}.over-card p{color:#9fb2c4;font-size:10px;line-height:1.5}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:13px 0}.summary div{padding:7px 3px;border:2px solid #29415a;background:#07111d;color:#7890a6;font-size:8px}.summary b{display:block;margin-top:2px;color:#fff;font-size:14px}.over-card .btn{width:100%;padding:11px;background:#38bdf8;color:#06101e}
    @media(max-width:520px){body{padding:4px}.game{gap:4px}.brand small{display:none}.brand h1{font-size:16px}.brandmark{width:28px;height:28px}.chip{min-width:43px;padding:4px 5px}.chip b{font-size:12px}.battle-wrap{padding:3px}.battle{min-height:205px}.command{min-height:42px;padding:5px 6px}.inspector span{max-width:235px}.actions{gap:4px}.btn{padding:8px 4px;font-size:8px}.wave-preview{max-width:56%;font-size:7px}}
    @media(max-height:590px){.top{min-height:32px}.battle{min-height:190px}.command{min-height:38px}.btn{padding:7px 5px}.game{gap:4px}}
  </style>
</head>
<body>
  <main class="game">
    <header class="top">
      <div class="brand"><div class="brandmark">▣</div><div><h1>MERGE DEFENSE</h1><small>PIXEL OUTPOST</small></div></div>
      <div class="hud"><div class="chip">WAVE<b id="wave">1</b></div><div class="chip hp">BASE<b id="hp">20</b></div><div class="chip gold">GOLD<b id="gold">60</b></div></div>
    </header>
    <section class="battle-wrap"><div class="battle" id="battleBox">
      <canvas id="battle" width="480" height="270" aria-label="Pixel Merge Defense battlefield"></canvas>
      <div id="phaseLabel" class="phase-label"><i class="phase-dot"></i><span id="phaseText">PREP</span></div>
      <div id="wavePreview" class="wave-preview">NEXT · DRONE ×4</div>
      <div id="bossHud" class="boss-hud"><div class="boss-title"><span>TITAN MK-I</span><span id="bossPct">100%</span></div><div class="boss-track"><div id="bossFill" class="boss-fill"></div></div></div>
      <div id="warning" class="warning"><strong>WARNING</strong><span>TITAN MK-I INCOMING</span></div>
    </div></section>
    <section class="command"><div class="inspector"><strong id="inspectTitle">Build Phase</strong><span id="message">Buy a Core tower, then place it directly on a glowing field pad.</span></div><div id="specialize" class="specialize"><button id="rapidBtn" class="path-btn rapid">⚡ RAPID</button><button id="blastBtn" class="path-btn blast">💥 BLAST</button></div></section>
    <div class="actions"><button id="buy" class="btn buy">BUY CORE · 20G</button><button id="startWave" class="btn start">START WAVE 1</button><button id="speed" class="btn speed">1×</button><button id="emp" class="btn emp" disabled>EMP</button></div>
  </main>
  <div id="toast" class="toast">LEVEL UP!</div>
  <div id="gameOver" class="game-over"><div class="over-card"><h2>OUTPOST LOST</h2><p id="overText"></p><div class="summary"><div>WAVE<b id="finalWave">1</b></div><div>KILLS<b id="finalKills">0</b></div><div>BEST<b id="bestWave">1</b></div></div><button id="again" class="btn">DEFEND AGAIN</button></div></div>
  <script src="./game.js"></script>
</body>
</html>
