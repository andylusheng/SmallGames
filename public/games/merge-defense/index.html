<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Merge Defense</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#06101a;color:#f8fafc}body{padding:6px;display:flex;align-items:stretch;justify-content:center}button{font:inherit}.game{width:min(720px,100%);height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:6px;user-select:none}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px}.brand{display:flex;align-items:center;gap:8px;min-width:0}.brandmark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#22d3ee,#2563eb);box-shadow:0 7px 22px #0284c755;font-size:17px}.brand h1{margin:0;font-size:18px;line-height:1;letter-spacing:-.03em}.brand small{display:block;margin-top:3px;color:#7dd3fc;font-size:7px;font-weight:900;letter-spacing:.17em;text-transform:uppercase}.hud{display:flex;gap:4px}.chip{min-width:51px;padding:5px 7px;border:1px solid #ffffff12;background:#0d1a2c;border-radius:10px;text-align:center;color:#8198ae;font-size:7px;font-weight:900}.chip b{display:block;margin-top:1px;color:#fff;font-size:13px}.chip.gold b{color:#fbbf24}.chip.hp b{color:#86efac}
    .battle-wrap{position:relative;min-height:0;border:1px solid #5ddcff24;border-radius:19px;padding:5px;background:linear-gradient(150deg,#0b1a2d,#07131f);box-shadow:0 18px 55px #0008,inset 0 0 42px #0ea5e910}.battle{position:relative;width:100%;height:100%;min-height:230px;overflow:hidden;border-radius:14px}.battle canvas{display:block;width:100%;height:100%;background:#102438;touch-action:none}.battle:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 58px #02061788}.phase-label,.wave-preview{position:absolute;z-index:4;top:9px;display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;background:#07111dcc;border:1px solid #ffffff16;backdrop-filter:blur(7px);font-size:8px;font-weight:950;letter-spacing:.06em}.phase-label{left:9px}.wave-preview{right:9px;max-width:48%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#cbd5e1}.phase-dot{width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399}.phase-label.battle .phase-dot{background:#fbbf24;box-shadow:0 0 10px #f59e0b}.boss-hud{display:none;position:absolute;z-index:5;left:50%;top:8px;transform:translateX(-50%);width:min(300px,64%);padding:5px 8px;border-radius:10px;background:#25091ddd;border:1px solid #fb718555;backdrop-filter:blur(7px)}.boss-hud.show{display:block}.boss-title{display:flex;justify-content:space-between;color:#fda4af;font-size:8px;font-weight:950;letter-spacing:.08em}.boss-track{height:5px;margin-top:3px;border-radius:999px;background:#4c102f;overflow:hidden}.boss-fill{height:100%;width:100%;background:linear-gradient(90deg,#fb7185,#e11d48,#c026d3);box-shadow:0 0 13px #fb718588}.warning{display:none;position:absolute;inset:0;z-index:8;align-items:center;justify-content:center;flex-direction:column;background:#14030fbb;backdrop-filter:blur(3px);text-align:center}.warning.show{display:flex;animation:warnFlash .28s linear 3}.warning strong{font-size:28px;letter-spacing:.14em;color:#fb7185;text-shadow:0 0 24px #ef4444}.warning span{margin-top:3px;font-size:10px;color:#fecdd3;letter-spacing:.18em;font-weight:900}@keyframes warnFlash{50%{background:#4c0519cc}}
    .command{min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:7px;padding:6px 8px;border:1px solid #ffffff10;border-radius:13px;background:#0b1726}.inspector{min-width:0;flex:1;text-align:left}.inspector strong{display:block;font-size:9px;color:#f8fafc}.inspector span{display:block;margin-top:2px;max-width:460px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:8px;color:#8fa8bf}.specialize{display:none;gap:5px;flex:0 0 auto}.specialize.show{display:flex}.path-btn{border:1px solid #ffffff12;border-radius:9px;background:#111d2f;padding:6px 8px;color:#cbd5e1;cursor:pointer;font-size:8px;font-weight:900}.path-btn.rapid{border-color:#22d3ee55;color:#67e8f9}.path-btn.blast{border-color:#fb923c55;color:#fdba74}.actions{display:grid;grid-template-columns:1.05fr 1.25fr .65fr .72fr;gap:6px}.btn{border:0;border-radius:11px;padding:9px 7px;font-size:9px;font-weight:950;cursor:pointer;transition:transform .13s,filter .13s}.btn:active{transform:scale(.98)}.buy{background:linear-gradient(135deg,#38bdf8,#6366f1);color:#06101e}.start{background:linear-gradient(135deg,#34d399,#a3e635);color:#052e16;box-shadow:0 0 0 0 #34d39955;animation:breathe 1.8s infinite}.start:disabled{animation:none}.speed{background:#172236;color:#cbd5e1;border:1px solid #ffffff12}.emp{background:linear-gradient(135deg,#a78bfa,#22d3ee);color:#08111f}.btn:disabled{opacity:.38;cursor:default;filter:saturate(.35)}@keyframes breathe{55%{box-shadow:0 0 0 8px #34d39900,0 0 24px #34d39944}}
    .toast{position:fixed;left:50%;top:50%;z-index:30;pointer-events:none;transform:translate(-50%,-50%) scale(.8);opacity:0;padding:9px 15px;border-radius:13px;background:#07111de8;border:1px solid #ffffff1c;font-size:12px;font-weight:950;box-shadow:0 18px 50px #0009}.toast.show{animation:toast .72s ease-out}@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-72%) scale(1)}}.game-over{display:none;position:fixed;inset:0;z-index:40;align-items:center;justify-content:center;padding:20px;background:#020617dc;backdrop-filter:blur(7px)}.game-over.show{display:flex}.over-card{width:min(330px,90vw);padding:21px;border:1px solid #ffffff16;border-radius:22px;background:linear-gradient(150deg,#15233a,#0a1424);text-align:center;box-shadow:0 30px 90px #000a}.over-card h2{margin:0;font-size:25px}.over-card p{color:#9fb2c4;font-size:10px;line-height:1.5}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:13px 0}.summary div{padding:7px 3px;border-radius:10px;background:#07111d;color:#7890a6;font-size:8px}.summary b{display:block;margin-top:2px;color:#fff;font-size:14px}.over-card .btn{width:100%;padding:11px;background:linear-gradient(135deg,#38bdf8,#818cf8);color:#06101e}
    @media(max-width:520px){body{padding:4px}.game{gap:4px}.brand small{display:none}.brand h1{font-size:16px}.brandmark{width:29px;height:29px}.chip{min-width:43px;padding:4px 5px}.chip b{font-size:12px}.battle-wrap{border-radius:15px;padding:4px}.battle{min-height:205px;border-radius:11px}.command{min-height:42px;padding:5px 6px}.inspector span{max-width:235px}.actions{gap:4px}.btn{padding:8px 4px;font-size:8px}.wave-preview{max-width:55%;font-size:7px}}
    @media(max-height:590px){.top{min-height:32px}.battle{min-height:190px}.command{min-height:38px}.btn{padding:7px 5px}.phase-label,.wave-preview{top:6px}.game{gap:4px}}
  </style>
</head>
<body>
  <main class="game">
    <header class="top">
      <div class="brand"><div class="brandmark">🛡</div><div><h1>Merge Defense</h1><small>Neon Outpost</small></div></div>
      <div class="hud"><div class="chip">WAVE<b id="wave">1</b></div><div class="chip hp">BASE<b id="hp">20</b></div><div class="chip gold">GOLD<b id="gold">60</b></div></div>
    </header>
    <section class="battle-wrap">
      <div class="battle" id="battleBox">
        <canvas id="battle" aria-label="Merge Defense battlefield"></canvas>
        <div id="phaseLabel" class="phase-label"><i class="phase-dot"></i><span id="phaseText">PREP</span></div>
        <div id="wavePreview" class="wave-preview">NEXT · DRONE ×4</div>
        <div id="bossHud" class="boss-hud"><div class="boss-title"><span>TITAN MK-I</span><span id="bossPct">100%</span></div><div class="boss-track"><div id="bossFill" class="boss-fill"></div></div></div>
        <div id="warning" class="warning"><strong>WARNING</strong><span>TITAN MK-I INCOMING</span></div>
      </div>
    </section>
    <section class="command">
      <div class="inspector"><strong id="inspectTitle">Build Phase</strong><span id="message">Buy a Core tower, then choose a glowing field pad. Drag equal towers together to merge.</span></div>
      <div id="specialize" class="specialize"><button id="rapidBtn" class="path-btn rapid">⚡ RAPID</button><button id="blastBtn" class="path-btn blast">💥 BLAST</button></div>
    </section>
    <div class="actions"><button id="buy" class="btn buy">Buy Core · 20g</button><button id="startWave" class="btn start">Start Wave 1</button><button id="speed" class="btn speed">1×</button><button id="emp" class="btn emp" disabled>EMP</button></div>
  </main>
  <div id="toast" class="toast">LEVEL UP!</div>
  <div id="gameOver" class="game-over"><div class="over-card"><h2>Outpost Lost</h2><p id="overText"></p><div class="summary"><div>WAVE<b id="finalWave">1</b></div><div>KILLS<b id="finalKills">0</b></div><div>BEST<b id="bestWave">1</b></div></div><button id="again" class="btn">Defend Again</button></div></div>
  <script src="./game.js"></script>
</body>
</html>
