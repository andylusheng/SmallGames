<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>连连看 - Animal Link Connect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Segoe UI Rounded","SF Pro Rounded","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(160deg,#1a1040 0%,#2d1b69 30%,#1e3a5f 65%,#0f1a3d 100%);
  color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  margin:0;overflow:hidden;position:fixed;inset:0;width:100%;height:100%;
}
body::before{content:"";position:fixed;inset:0;background:
  radial-gradient(circle at 12% 18%,rgba(120,80,255,.28),transparent 22%),
  radial-gradient(circle at 78% 12%,rgba(60,180,255,.22),transparent 25%),
  radial-gradient(circle at 50% 55%,rgba(180,100,255,.15),transparent 30%),
  radial-gradient(circle at 88% 60%,rgba(255,120,200,.18),transparent 20%),
  radial-gradient(circle at 20% 85%,rgba(80,200,255,.16),transparent 24%),
  radial-gradient(circle at 65% 92%,rgba(255,200,100,.12),transparent 22%);
  pointer-events:none;z-index:0}
body::after{content:"";position:fixed;inset:0;
  background:
    radial-gradient(ellipse 140px 90px at 4% 6%,rgba(0,0,0,.5),transparent 70%),
    radial-gradient(ellipse 120px 80px at 96% 10%,rgba(0,0,0,.45),transparent 70%),
    radial-gradient(ellipse 160px 100px at 2% 94%,rgba(0,0,0,.5),transparent 70%),
    radial-gradient(ellipse 130px 90px at 98% 90%,rgba(0,0,0,.45),transparent 70%);
  pointer-events:none;z-index:0}

#app{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;box-sizing:border-box;position:relative;overflow:hidden}

/* ===== 屏幕 ===== */
.screen{display:none;width:100%;max-width:520px;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:2}
.screen.active{display:flex}

/* ===== 开始页 ===== */
.menu-gems{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.menu-gems img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.menu-title{font-size:clamp(26px,8vw,38px);font-weight:900;background:linear-gradient(135deg,#a78bfa 0%,#60a5fa 35%,#34d399 70%,#fbbf24 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 8px rgba(120,100,255,.4));letter-spacing:2px}
.menu-sub{font-size:11px;color:#8892b0;letter-spacing:4px;margin-bottom:16px}
.rules{width:100%;max-width:340px}
.rule{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 14px;margin-bottom:8px;backdrop-filter:blur(4px)}
.rule .ri{font-size:22px;flex-shrink:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border-radius:10px}
.rule .rt{font-weight:700;font-size:14px}
.rule .rd{font-size:11px;color:#8892b0;margin-top:1px}
.btn-primary{background:linear-gradient(135deg,#8b5cf6,#6366f1 50%,#3b82f6);border:none;border-radius:16px;padding:14px 48px;font-size:17px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 6px 24px rgba(99,102,241,.45),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s,box-shadow .15s;margin-top:8px}
.btn-primary:active{transform:scale(.96);box-shadow:0 3px 12px rgba(99,102,241,.3)}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 22px;font-size:13px;font-weight:700;color:#ccc;cursor:pointer;transition:background .15s}
.btn-secondary:active{background:rgba(255,255,255,.15)}
.menu-stats{margin-top:14px;font-size:12px;color:#6b7394;display:flex;gap:16px}
.menu-stats span{color:#ffd166;font-weight:700}

/* ===== HUD ===== */
.hud{display:flex;align-items:center;justify-content:space-between;width:100%;gap:6px;padding:0 4px}
.hud-item{background:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:6px 11px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.12)}
.hud-item .ic{font-size:13px}
.hud-item .v{color:#ffd166}
.time-wrap{display:flex;flex-direction:column;align-items:center;gap:1px}
.time-circle{width:42px;height:42px;border-radius:50%;background:conic-gradient(var(--tc,#4ecdc4) 0% var(--tp,100%),rgba(255,255,255,.1) var(--tp,100%) 100%);display:flex;align-items:center;justify-content:center;position:relative;transition:background .3s}
.time-circle::before{content:"";position:absolute;inset:3px;border-radius:50%;background:#1a1f3a;border:1px solid rgba(255,255,255,.08)}
.time-circle span{position:relative;font-size:14px;font-weight:800;color:#fff}
.time-circle.low span{color:#ff6b6b}
.time-label{font-size:9px;color:#6b7394;letter-spacing:1px}
.pause-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;flex-shrink:0}

/* 进度条 */
.progress-bar{width:100%;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;padding:0 4px}
.progress-fill{height:100%;background:linear-gradient(90deg,#4ecdc4,#44d9a8);border-radius:3px;transition:width .4s;width:0%}

/* ===== 棋盘（森林草地 + 3D宝石底座） ===== */
.board-wrap{position:relative;width:100%;padding:var(--channel,18px);background:
  linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border-radius:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 24px rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.1)}
.board{display:grid;gap:2px;position:relative;z-index:1;background:rgba(0,0,0,.15);padding:2px;border-radius:8px}
.cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5vw,34px);position:relative;cursor:pointer;transition:transform .12s,background .12s,box-shadow .12s;will-change:transform;line-height:1;
  background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.cell.t2{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(0,0,0,.08))}
/* 3D 宝石（真实图片） */
.cell .gem,.cell .gem-img{width:96%;height:96%;object-fit:contain;display:block;filter:drop-shadow(0 5px 6px rgba(0,0,0,.35));transition:transform .12s,filter .12s;pointer-events:none;user-select:none;-webkit-user-drag:none}
.cell:hover .gem,.cell:hover .gem-img{transform:scale(1.1);filter:drop-shadow(0 7px 10px rgba(0,0,0,.45)) brightness(1.08)}
.cell.empty{background:transparent;border-color:transparent;box-shadow:none;cursor:default;pointer-events:none}
.cell.rock{background:rgba(60,60,60,.3);border-color:rgba(0,0,0,.2)}
.cell.selected{transform:scale(1.12);z-index:5}
.cell.selected .gem,.cell.selected .gem-img{filter:brightness(1.2) drop-shadow(0 0 12px rgba(255,209,102,.9));transform:scale(1.1)}
.cell.selected::after{content:"";position:absolute;inset:-4px;border-radius:13px;border:2px solid rgba(255,209,102,.6);animation:selPulse 1s infinite;pointer-events:none}
@keyframes selPulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.75;transform:scale(1.05)}}
.cell.hint{animation:hintGlow .8s infinite}
@keyframes hintGlow{0%,100%{box-shadow:0 0 0 2px #4ecdc4,0 0 12px rgba(78,205,196,.5)}50%{box-shadow:0 0 0 3px #44d9a8,0 0 24px rgba(78,205,196,.95)}}
.cell.shake{animation:cellShake .3s}
@keyframes cellShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cell.removing{animation:gemRemove .28s forwards;z-index:6}
@keyframes gemRemove{0%{transform:scale(1) rotate(0);opacity:1}30%{transform:scale(1.2) rotate(-4deg);filter:brightness(1.7)}100%{transform:scale(0) rotate(10deg);opacity:0}}
.cell.bonus .gem,.cell.bonus .gem-img{animation:bonusGlow 1.2s infinite}
@keyframes bonusGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(255,209,102,.6))}50%{filter:drop-shadow(0 0 14px rgba(255,209,102,1)) brightness(1.15)}}
.cell.spawn{animation:cellSpawn .3s ease-out backwards}
@keyframes cellSpawn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}

/* 连线 SVG */
.link-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8;overflow:visible}
.link-path{fill:none;stroke:url(#linkGrad);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 10px rgba(255,209,102,1))}
.link-dot{fill:#fff;filter:drop-shadow(0 0 8px rgba(255,209,102,1))}

/* 特效层 */
.fx-layer{position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.particle{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none}
.combo-text{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-size:clamp(22px,7vw,36px);font-weight:900;color:#ffd166;text-shadow:0 0 24px rgba(255,209,102,.8),0 2px 6px rgba(0,0,0,.5);z-index:20;pointer-events:none;animation:comboPop .9s forwards}
@keyframes comboPop{0%{transform:translate(-50%,-50%) scale(.4) rotate(-5deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.2) rotate(2deg);opacity:1}70%{transform:translate(-50%,-60%) scale(1);opacity:1}100%{transform:translate(-50%,-90%) scale(.9);opacity:0}}
.score-float{position:absolute;font-size:14px;font-weight:800;color:#ffd166;text-shadow:0 1px 3px rgba(0,0,0,.5);z-index:15;pointer-events:none;animation:scoreFloat 1s forwards}
@keyframes scoreFloat{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-46px);opacity:0}}
.time-float{position:absolute;font-size:15px;font-weight:900;color:#44d9a8;text-shadow:0 1px 3px rgba(0,0,0,.5);z-index:15;pointer-events:none;animation:scoreFloat 1.1s forwards}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* 道具栏 */
.tools{display:flex;gap:10px;width:100%;justify-content:center;padding:0 4px}
.tool-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:9px 22px;cursor:pointer;color:#fff;font-weight:700;transition:transform .12s,background .12s;min-width:84px;box-shadow:0 4px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.15)}
.tool-btn:active{transform:scale(.94)}
.tool-btn .ti{font-size:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.tool-btn .tn{font-size:11px}
.tool-btn .tc{font-size:10px;color:#ffd166;font-weight:800}
.tool-btn:disabled{opacity:.4;cursor:not-allowed}
.tool-btn.hint-btn{background:linear-gradient(160deg,rgba(59,130,246,.4),rgba(37,99,235,.18));border-color:rgba(96,165,250,.5)}
.tool-btn.shuffle-btn{background:linear-gradient(160deg,rgba(139,92,246,.4),rgba(124,58,237,.18));border-color:rgba(167,139,250,.5)}

/* ===== 关卡选择 ===== */
.lv-header{text-align:center;margin-bottom:6px}
.lv-header h2{font-size:20px;font-weight:800;color:#ffd166}
.lv-header p{font-size:11px;color:#8892b0;margin-top:2px}
.chapters{width:100%;max-height:58vh;overflow-y:auto;padding:4px}
.chapter{margin-bottom:14px}
.chapter-title{font-size:13px;font-weight:700;color:#a29bfe;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.chapter-title .bar{flex:1;height:1px;background:linear-gradient(90deg,rgba(162,155,254,.3),transparent)}
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lvl-btn{aspect-ratio:1;border-radius:12px;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,#ff9a3d,#ff6b6b);box-shadow:0 3px 10px rgba(255,107,107,.3);transition:transform .12s;position:relative}
.lvl-btn:active{transform:scale(.94)}
.lvl-btn.locked{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#4a4e69;box-shadow:none;cursor:not-allowed;font-size:18px}
.lvl-btn.current{box-shadow:0 0 0 2px #ffd166,0 0 16px rgba(255,209,102,.4)}
.lvl-btn .ls{font-size:9px;margin-top:2px;letter-spacing:0}

/* ===== 结算 ===== */
.result-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:24px 20px;text-align:center;width:100%;max-width:360px;backdrop-filter:blur(8px)}
.result-title{font-size:26px;font-weight:900;margin-bottom:10px}
.result-title.win{color:#ffd166;text-shadow:0 0 20px rgba(255,209,102,.4)}
.result-title.lose{color:#ff6b6b}
.result-stars{font-size:34px;margin-bottom:14px;letter-spacing:6px}
.result-stars .s{filter:grayscale(1);opacity:.2;display:inline-block}
.result-stars .s.on{filter:none;opacity:1;animation:starPop .5s backwards}
@keyframes starPop{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
.result-stars .s.on:nth-child(2){animation-delay:.2s}
.result-stars .s.on:nth-child(3){animation-delay:.4s}
.result-score{font-size:13px;color:#8892b0;margin-bottom:4px}
.result-score b{color:#fff;font-size:22px;display:block;margin-top:2px}
.result-info{margin:14px 0;text-align:left}
.ri-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.ri-row:last-child{border-bottom:none}
.ri-row .rv{margin-left:auto;color:#ffd166;font-weight:700}

/* ===== 暂停 ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center}
.overlay.active{display:flex}
.overlay-card{background:linear-gradient(160deg,#1e2440,#141830);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:28px 24px;text-align:center;min-width:260px}
.overlay-card h3{font-size:20px;margin-bottom:18px;color:#ffd166}
.overlay-card button{display:block;width:100%;margin-bottom:10px;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:transform .12s}
.overlay-card button:active{transform:scale(.97)}
.overlay-card .ob{background:linear-gradient(135deg,#ff9a3d,#ff6b6b);color:#fff}
.overlay-card .os{background:rgba(255,255,255,.08);color:#ccc;border:1px solid rgba(255,255,255,.12)}

/* toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(0,0,0,.85);color:#fff;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:200;opacity:0;transition:all .3s;pointer-events:none;border:1px solid rgba(255,255,255,.15)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 宽屏 */
@media (min-width:780px) and (min-height:560px){
  .screen{max-width:560px}
  .board-wrap{max-width:520px}
  .board{gap:6px}
  .cell{font-size:32px;border-radius:13px}
  .board{gap:7px}
  .hud-item{font-size:12px;padding:6px 11px}
  .time-circle{width:48px;height:48px}
  .time-circle span{font-size:16px}
}
</style>
</head>
<body>
<div id="app">
  <!-- 开始页 -->
  <div class="screen active" id="screen-menu">
    <div class="menu-gems" id="menuGems"></div>
    <div class="menu-title">宝石连连看</div>
    <div class="menu-sub">GEM LINK CONNECT</div>
    <div class="rules">
      <div class="rule"><div class="ri">🔗</div><div><div class="rt">连线消除</div><div class="rd">点两个相同宝石，折线不超过2个拐弯</div></div></div>
      <div class="rule"><div class="ri">⚡</div><div><div class="rt">连击加分</div><div class="rd">快速连消触发 Combo，最高 ×3 倍率</div></div></div>
      <div class="rule"><div class="ri">⏱️</div><div><div class="rt">限时挑战</div><div class="rd">倒计时内清空棋盘，金边宝石 +5 秒</div></div></div>
    </div>
    <button class="btn-primary" onclick="continueGame()">▶ 开始游戏</button>
    <div class="btn-row">
      <button class="btn-secondary" onclick="showScreen('levels')">选择关卡</button>
      <button class="btn-secondary" onclick="toggleAudio()" id="audioBtn">🔊 音效</button>
    </div>
    <div class="menu-stats">总分 <span id="menuBest">0</span> · ⭐ <span id="menuStars">0</span>/180</div>
  </div>

  <!-- 关卡选择 -->
  <div class="screen" id="screen-levels">
    <div class="lv-header">
      <h2>选择关卡</h2>
      <p>⭐ 总星数 <span id="lvStars">0</span>/180</p>
    </div>
    <div class="chapters" id="chapters"></div>
    <button class="btn-secondary" onclick="showScreen('menu')" style="margin-top:8px">← 返回</button>
  </div>

  <!-- 游戏中 -->
  <div class="screen" id="screen-game">
    <div class="hud">
      <div class="hud-item"><span class="ic">🐾</span> LV <span class="v" id="hudLevel">1</span></div>
      <div class="hud-item"><span class="ic">⭐</span> <span class="v" id="hudScore">0</span></div>
      <div class="hud-item"><span class="ic">🧩</span> <span class="v" id="hudLeft">0</span></div>
      <div class="time-wrap">
        <div class="time-circle" id="timeCircle"><span id="hudTime">60</span></div>
        <div class="time-label">时间</div>
      </div>
      <div class="pause-btn" onclick="togglePause()">⏸</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board"></div>
      <svg class="link-svg" id="linkSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div class="fx-layer" id="fxLayer"></div>
    </div>
    <div class="tools">
      <button class="tool-btn hint-btn" id="btnHint" onclick="useHint()"><span class="ti">💡</span><span class="tn">提示</span><span class="tc" id="hintCount">×3</span></button>
      <button class="tool-btn shuffle-btn" id="btnShuffle" onclick="useShuffle()"><span class="ti">🔀</span><span class="tn">洗牌</span><span class="tc" id="shuffleCount">×2</span></button>
    </div>
  </div>

  <!-- 结算 -->
  <div class="screen" id="screen-result">
    <div class="result-card" id="resultCard"></div>
  </div>
</div>

<!-- 暂停 -->
<div class="overlay" id="pauseOverlay">
  <div class="overlay-card">
    <h3>⏸ 游戏暂停</h3>
    <button class="ob" onclick="togglePause()">▶ 继续游戏</button>
    <button class="os" onclick="restartLevel()">🔄 重玩本关</button>
    <button class="os" onclick="quitToMenu()">🏠 返回菜单</button>
  </div>
</div>

<!-- 死局提示 -->
<div class="overlay" id="deadOverlay">
  <div class="overlay-card">
    <h3>😵 没有可连的了</h3>
    <button class="ob" onclick="doShuffle(true)">🔀 自动洗牌</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 全局错误捕获 ============ */
window.addEventListener('error',e=>{console.error('GAME ERROR:',e.message)});
/* ============ 工具 ============ */
const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=arr=>{for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr};
const GEM_IMAGES=['gems/orange.png','gems/purple_tri.png','gems/purple_cyl.png','gems/purple_mar.png','gems/green_leaf.png','gems/blue_drop.png','gems/yellow_star.png','gems/blue_circle.png'];
function gemSVG(g,idx){
  return `<img src="${GEM_IMAGES[idx%GEM_IMAGES.length]}" class="gem-img" alt="gem" draggable="false" style="pointer-events:none;display:block;-webkit-user-drag:none;user-select:none">`;
}
function rockSVG(){
  return `<svg viewBox="0 0 100 100" class="gem" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="rockG" cx="38%" cy="32%" r="70%">
        <stop offset="0%" stop-color="#b0bec5"/>
        <stop offset="38%" stop-color="#607d8b"/>
        <stop offset="78%" stop-color="#37474f"/>

let audioCtx=null,audioOn=true;
function ensureAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch{}}}
function beep(freq,dur,type='sine',vol=.15){
  if(!audioOn||!audioCtx)return;
  try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch{}
}
function noiseBurst(dur,vol,freq){
  if(!audioOn||!audioCtx)return;
  try{
    const len=audioCtx.sampleRate*dur;
    const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);
    const ns=audioCtx.createBufferSource();ns.buffer=buf;
    const ng=audioCtx.createGain();ng.gain.value=vol;
    const nf=audioCtx.createBiquadFilter();nf.type='lowpass';nf.frequency.value=freq||1200;
    ns.connect(nf);nf.connect(ng);ng.connect(audioCtx.destination);ns.start();
  }catch{}
}
function sfxSelect(){ensureAudio();beep(880,.07,'sine',.1)}
function sfxLink(combo){
  ensureAudio();if(!audioCtx)return;
  try{
    // 连线滑音
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(420+combo*40,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(820+combo*60,audioCtx.currentTime+.1);
    g.gain.setValueAtTime(.14,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.14);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.14);
    // 消除打击
    setTimeout(()=>{
      const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();
      o2.type='square';
      o2.frequency.setValueAtTime(220+combo*50,audioCtx.currentTime);
      o2.frequency.exponentialRampToValueAtTime(55,audioCtx.currentTime+.13);
      g2.gain.setValueAtTime(.2,audioCtx.currentTime);
      g2.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.15);
      o2.connect(g2);g2.connect(audioCtx.destination);o2.start();o2.stop(audioCtx.currentTime+.15);
      noiseBurst(.08,.16,1300);
      beep(720+combo*110,.07,'triangle',.09);
    },90);
  }catch{}
}

/* ============ 棋盘生成 ============ */
function generateBoard(cfg){
  const {rows,cols,types,rocks}=cfg;
  let board,attempts=0;
  do{
    board=Array.from({length:rows},()=>Array(cols).fill(null));
    // 障碍位置（偶数个，对称随机）
    const positions=[];
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)positions.push([r,c]);
    shuffle(positions);
    let rockCount=Math.min(rocks,rows*cols- (rows*cols%2? 1:0));
    // 保证有效格为偶数
    let validCount=rows*cols-rockCount;
    if(validCount%2!==0)rockCount++;
    const rockPos=positions.slice(0,rockCount);
    rockPos.forEach(([r,c])=>board[r][c]=ROCK);
    // 收集空位，成对填动物
    const empties=[];
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(board[r][c]===null)empties.push([r,c]);
    const pairs=empties.length/2;
    // 均匀分配每种类型的数量，确保每种都出现且数量接近
    const seq=[];
    const perType=Math.floor(pairs/types);
    const remainder=pairs%types;
    for(let t=0;t<types;t++){
      const count=perType+(t<remainder?1:0);
      for(let i=0;i<count;i++)seq.push(t,t);
    }
    shuffle(seq);
    empties.forEach(([r,c],i)=>board[r][c]=seq[i]);
    attempts++;
  }while(!hasAnyMove(board)&&attempts<60);
  return board;
}

/* ============ 连线判定（扩展网格，≤2拐弯） ============ */
// 构建 (rows+2)x(cols+2) 阻挡网格，外围一圈为空通道
function buildGrid(board){
  const rows=board.length,cols=board[0].length;
  const g=Array.from({length:rows+2},()=>Array(cols+2).fill(false));
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(board[r][c]!==null)g[r+1][c+1]=true; // 动物或石头都阻挡
  }
  return g;
}
// 直线是否畅通（不含端点）
function straightClear(g,r1,c1,r2,c2){
  if(r1===r2){
    const lo=Math.min(c1,c2),hi=Math.max(c1,c2);
    for(let c=lo+1;c<hi;c++)if(g[r1][c])return false;
    return true;
  }
  if(c1===c2){
    const lo=Math.min(r1,r2),hi=Math.max(r1,r2);
    for(let r=lo+1;r<hi;r++)if(g[r][c1])return false;
    return true;
  }
  return false;
}
// 找路径，返回扩展坐标点数组或null
function findPath(grid,sR,sC,eR,eC){
  const R=grid.length,C=grid[0].length;
  // 0拐弯
  if((sR===eR||sC===eC)&&straightClear(grid,sR,sC,eR,eC))return[[sR,sC],[eR,eC]];
  // 1拐弯
  for(const[cr,cc]of[[sR,eC],[eR,sC]]){
    if(grid[cr][cc])continue;
    if(straightClear(grid,sR,sC,cr,cc)&&straightClear(grid,cr,cc,eR,eC))return[[sR,sC],[cr,cc],[eR,eC]];
  }
  // 2拐弯：中间水平行
  for(let mr=0;mr<R;mr++){
    if(mr===sR||mr===eR)continue;
    if(grid[mr][sC]||grid[mr][eC])continue;
    if(straightClear(grid,sR,sC,mr,sC)&&straightClear(grid,mr,sC,mr,eC)&&straightClear(grid,mr,eC,eR,eC))
      return[[sR,sC],[mr,sC],[mr,eC],[eR,eC]];
  }
  // 2拐弯：中间垂直列
  for(let mc=0;mc<C;mc++){
    if(mc===sC||mc===eC)continue;
    if(grid[sR][mc]||grid[eR][mc])continue;
    if(straightClear(grid,sR,sC,sR,mc)&&straightClear(grid,sR,mc,eR,mc)&&straightClear(grid,eR,mc,eR,eC))
      return[[sR,sC],[sR,mc],[eR,mc],[eR,eC]];
  }
  return null;
}
// 判断两个实际格子能否相连
function canLink(board,r1,c1,r2,c2){
  if(r1===r2&&c1===c2)return null;
  const t1=board[r1][c1],t2=board[r2][c2];
  if(t1===null||t2===null||t1===ROCK||t2===ROCK)return null;
  if(t1!==t2)return null;
  const g=buildGrid(board);
  const path=findPath(g,r1+1,c1+1,r2+1,c2+1);
  return path;
}
// 是否存在任意可连对
function hasAnyMove(board){
  const rows=board.length,cols=board[0].length;
  const byType={};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const t=board[r][c];
    if(t===null||t===ROCK)continue;
    (byType[t]=byType[t]||[]).push([r,c]);
  }
  const g=buildGrid(board);
  for(const t in byType){
    const cells=byType[t];
    for(let i=0;i<cells.length;i++)for(let j=i+1;j<cells.length;j++){
      const[r1,c1]=cells[i],[r2,c2]=cells[j];
      if(findPath(g,r1+1,c1+1,r2+1,c2+1))return true;
    }
  }
  return false;
}
// 找一对可连（提示用）
function findHint(board){
  const rows=board.length,cols=board[0].length;
  const byType={};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const t=board[r][c];
    if(t===null||t===ROCK)continue;
    (byType[t]=byType[t]||[]).push([r,c]);
  }
  const g=buildGrid(board);
  for(const t in byType){
    const cells=byType[t];
    for(let i=0;i<cells.length;i++)for(let j=i+1;j<cells.length;j++){
      const[r1,c1]=cells[i],[r2,c2]=cells[j];
      const path=findPath(g,r1+1,c1+1,r2+1,c2+1);
      if(path)return{r1,c1,r2,c2,path};
    }
  }
  return null;
}

/* ============ 渲染 ============ */
function renderBoard(spawn){

      if(t===null){cell.classList.add('empty');}
      else if(t===ROCK){cell.classList.add('rock');cell.innerHTML=rockSVG();}

/* 事件委托：在 board 上绑定一次，通过 e.target 找到 cell */
function onBoardClick(e){

function getCellEl(r,c){return $('board').children[r*state.cols+c]}
function updateRemain(){
  let cnt=0;
  for(let r=0;r<state.rows;r++)for(let c=0;c<state.cols;c++){

/* ============ 坐标映射（扩展网格→SVG像素） ============ */
function buildPointMap(){
  const wrapEl=$('boardWrap');
  if(!wrapEl)return null;
  const wrap=wrapEl.getBoundingClientRect();
  const boardEl=$('board');
  if(!boardEl)return null;
  const R=state.rows+2,C=state.cols+2;
  const map=Array.from({length:R},()=>Array(C).fill(null));
  // 内部格子中心
  for(let r=0;r<state.rows;r++)for(let c=0;c<state.cols;c++){
    const el=getCellEl(r,c);
    if(!el)continue;
    const rc=el.getBoundingClientRect();
    map[r+1][c+1]={x:rc.left+rc.width/2-wrap.left,y:rc.top+rc.height/2-wrap.top};
  }
  const ch=parseFloat(getComputedStyle(wrapEl).paddingLeft)||22;
  // 外围通道中线
  for(let c=1;c<=state.cols;c++){
    map[0][c]={x:map[1][c].x,y:ch/2};
    map[R-1][c]={x:map[state.rows][c].x,y:wrap.height-ch/2};
  }
  for(let r=1;r<=state.rows;r++){
    map[r][0]={x:ch/2,y:map[r][1].y};
    map[r][C-1]={x:wrap.width-ch/2,y:map[r][state.cols].y};
  }
  // 四角
  map[0][0]={x:ch/2,y:ch/2};
  map[0][C-1]={x:wrap.width-ch/2,y:ch/2};
  map[R-1][0]={x:ch/2,y:wrap.height-ch/2};
  map[R-1][C-1]={x:wrap.width-ch/2,y:wrap.height-ch/2};
  return map;
}

/* ============ 连线绘制 ============ */
function drawLink(path,cb){
  const bw=$('boardWrap'),svg=$('linkSvg');
  if(!bw||!svg){state.busy=false;return;}
  const wrap=bw.getBoundingClientRect();
  svg.setAttribute('viewBox',`0 0 ${wrap.width} ${wrap.height}`);
  svg.innerHTML='<defs><linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="1%"><stop offset="0%" stop-color="#ffe08a"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient></defs>';
  const map=buildPointMap();
  if(!map){state.busy=false;return;}
  const pts=path.map(([r,c])=>map[r][c]);
  if(pts.some(p=>!p)){state.busy=false;return;}
  const d='M'+pts.map(p=>`${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L ');
  const pathEl=document.createElementNS('http://www.w3.org/2000/svg','path');
  pathEl.setAttribute('d',d);pathEl.setAttribute('class','link-path');
  // 计算长度做延伸动画
  let len=0;for(let i=1;i<pts.length;i++)len+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
  pathEl.style.strokeDasharray=len;pathEl.style.strokeDashoffset=len;
  pathEl.style.transition='stroke-dashoffset .16s ease-out';
  svg.appendChild(pathEl);
  // 端点圆点
  [pts[0],pts[pts.length-1]].forEach(p=>{
    const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);dot.setAttribute('r',5);dot.setAttribute('class','link-dot');
    svg.appendChild(dot);
  });
  requestAnimationFrame(()=>{pathEl.style.strokeDashoffset=0});
  setTimeout(()=>{cb&&cb();setTimeout(()=>{svg.innerHTML=''},180)},170);
}

/* ============ 点击交互 ============ */
function onCellClick(r,c){
  try{
    if(state.busy||state.paused)return;
    ensureAudio();
    if(!state.firstInput){state.firstInput=true;emit('first_input')}
    const t=state.board[r][c];
    if(t===null||t===ROCK)return;
    if(!state.selected){
      state.selected={r,c};renderBoard();sfxSelect();return;
    }
    const sr=state.selected.r,sc=state.selected.c;
    if(sr===r&&sc===c){state.selected=null;renderBoard();return;}
    const path=canLink(state.board,sr,sc,r,c);
    if(path){
      state.busy=true;
      state.selected=null;
      drawLink(path,()=>removePair(sr,sc,r,c,path));
      // 超时保护：1.5秒后强制重置busy，防止卡住
      setTimeout(()=>{if(state.busy)state.busy=false;},1500);
    }else{
      sfxInvalid();
      const a=getCellEl(sr,sc);a?.classList.add('shake');
      setTimeout(()=>a?.classList.remove('shake'),300);
      state.selected={r,c};renderBoard();
      const b=getCellEl(r,c);b?.classList.add('shake');
      setTimeout(()=>b?.classList.remove('shake'),300);
    }
  }catch(e){
    state.busy=false;state.selected=null;
  }
}

/* ============ 消除一对 ============ */
function removePair(r1,c1,r2,c2,path){
  const now=Date.now();
  if(now-state.lastMatchAt<1500)state.combo++;else state.combo=1;
  state.lastMatchAt=now;
  state.maxCombo=Math.max(state.maxCombo,state.combo);
  // 计分
  const mult=Math.min(3,1+(state.combo-1)*0.2);
  let gain=Math.round(100*mult);
  // 加时奖励
  const b1=state.bonusCells.some(b=>b[0]===r1&&b[1]===c1);
  const b2=state.bonusCells.some(b=>b[0]===r2&&b[1]===c2);
  let bonusTime=0;
  if(b1){bonusTime+=5;state.bonusCells=state.bonusCells.filter(b=>!(b[0]===r1&&b[1]===c1))}
  if(b2){bonusTime+=5;state.bonusCells=state.bonusCells.filter(b=>!(b[0]===r2&&b[1]===c2))}
  state.score+=gain;
  // 消除动画
  [getCellEl(r1,c1),getCellEl(r2,c2)].forEach((el,i)=>{
    if(!el)return;
    el.classList.add('removing');
    spawnParticles(el,i===0?path[0]:path[path.length-1]);
  });
  sfxLink(state.combo);
  if(bonusTime>0){state.timeLeft+=bonusTime;sfxTime();showTimeFloat(getCellEl(r1,c1),`+${bonusTime}s`)}
  showScoreFloat(getCellEl(r1,c1),`+${gain}${state.combo>1?` ×${state.combo}`:''}`);
  if(state.combo>=2)showCombo(state.combo);
  if(state.combo>=3)$('boardWrap').classList.add('shake');
  setTimeout(()=>$('boardWrap').classList.remove('shake'),300);
  // 更新数据
  setTimeout(()=>{
    state.board[r1][c1]=null;state.board[r2][c2]=null;
    renderBoard();
    state.busy=false;
    updateHUD();
    if(state.remain===0){winLevel();return}
    // 死局检测
    if(!hasAnyMove(state.board)){
      setTimeout(()=>$('deadOverlay').classList.add('active'),300);
    }
  },240);
  updateHUD();
}

/* ============ 特效 ============ */
function spawnParticles(el){
  const wrap=$('boardWrap').getBoundingClientRect();
  const rc=el.getBoundingClientRect();
  const cx=rc.left+rc.width/2-wrap.left,cy=rc.top+rc.height/2-wrap.top;
  const colors=['#ffd166','#ff9a3d','#ff6b6b','#4ecdc4','#fff'];
  for(let i=0;i<10;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=cx+'px';p.style.top=cy+'px';
    p.style.background=colors[rand(0,colors.length-1)];
    $('fxLayer').appendChild(p);
    const ang=Math.random()*Math.PI*2,dist=24+Math.random()*30;
    const dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist;
    p.animate([
      {transform:'translate(0,0) scale(1)',opacity:1},
      {transform:`translate(${dx}px,${dy}px) scale(0)`,opacity:0}
    ],{duration:500+Math.random()*200,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>p.remove();
  }
}
function showScoreFloat(el,text){
  if(!el)return;
  const wrap=$('boardWrap').getBoundingClientRect();
  const rc=el.getBoundingClientRect();
  const f=document.createElement('div');f.className='score-float';f.textContent=text;
  f.style.left=(rc.left+rc.width/2-wrap.left-20)+'px';
  f.style.top=(rc.top-wrap.top-10)+'px';
  $('fxLayer').appendChild(f);setTimeout(()=>f.remove(),1000);
}
function showTimeFloat(el,text){
  if(!el)return;
  const wrap=$('boardWrap').getBoundingClientRect();
  const rc=el.getBoundingClientRect();
  const f=document.createElement('div');f.className='time-float';f.textContent=text;
  f.style.left=(rc.left+rc.width/2-wrap.left-16)+'px';
  f.style.top=(rc.top-wrap.top-28)+'px';
  $('fxLayer').appendChild(f);setTimeout(()=>f.remove(),1100);
}
function showCombo(n){
  const f=document.createElement('div');f.className='combo-text';f.textContent=`COMBO ×${n}!`;
  $('fxLayer').appendChild(f);setTimeout(()=>f.remove(),900);
}

/* ============ 道具 ============ */
function useHint(){
  if(state.busy||state.paused||state.screen!=='game')return;
  if(state.hintsLeft<=0){toast('提示次数用完了');return}
  const h=findHint(state.board);
  if(!h){toast('没有可连的了');return}
  state.hintsLeft--;state.hintsUsed++;
  sfxHint();updateHUD();
  const a=getCellEl(h.r1,h.c1),b=getCellEl(h.r2,h.c2);
  a?.classList.add('hint');b?.classList.add('hint');
  // 画提示连线（浅色）
  const wrap=$('boardWrap').getBoundingClientRect();
  const svg=$('linkSvg');
  svg.setAttribute('viewBox',`0 0 ${wrap.width} ${wrap.height}`);
  const map=buildPointMap();
  const pts=h.path.map(([r,c])=>map[r][c]);
  const d='M'+pts.map(p=>`${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L ');
  svg.innerHTML=`<path d="${d}" fill="none" stroke="#4ecdc4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" style="filter:drop-shadow(0 0 6px rgba(78,205,196,.8));opacity:.9"/>`;
  setTimeout(()=>{a?.classList.remove('hint');b?.classList.remove('hint');svg.innerHTML=''},1200);
}
function useShuffle(){
  if(state.busy||state.paused||state.screen!=='game')return;
  if(state.shufflesLeft<=0){toast('洗牌次数用完了');return}
  doShuffle(false);
}
function doShuffle(auto){
  if(!auto)state.shufflesLeft--;
  $('deadOverlay').classList.remove('active');
  sfxShuffle();
  state.busy=true;
  // 收集剩余动物重新排布（保留石头和加时标记数量）
  const animals=[];
  const slots=[];
  for(let r=0;r<state.rows;r++)for(let c=0;c<state.cols;c++){
    const t=state.board[r][c];
    if(t!==null&&t!==ROCK){animals.push(t);slots.push([r,c]);}
  }
  let tries=0,nb;
  do{
    shuffle(animals);
    nb=state.board.map(row=>row.slice());
    slots.forEach(([r,c],i)=>nb[r][c]=animals[i]);
    tries++;
  }while(!hasAnyMove(nb)&&tries<60);
  state.board=nb;
  // 重新分配加时位置
  state.bonusCells=pickBonusCells();
  renderBoard(true);
  updateHUD();
  setTimeout(()=>{state.busy=false},350);
  toast(auto?'🔀 已自动洗牌':'🔀 洗牌完成');
}

/* ============ 加时图标 ============ */
function pickBonusCells(){
  const slots=[];
  for(let r=0;r<state.rows;r++)for(let c=0;c<state.cols;c++){
    if(state.board[r][c]!==null&&state.board[r][c]!==ROCK)slots.push([r,c]);
  }
  shuffle(slots);
  const n=Math.min(3,Math.max(2,Math.floor(slots.length/12)));
  return slots.slice(0,n);
}

/* ============ HUD / 计时 ============ */
function updateHUD(){
  $('hudLevel').textContent=state.cfg.level;
  $('hudScore').textContent=state.score.toLocaleString();
  $('hudTime').textContent=state.timeLeft;
  $('hintCount').textContent='×'+state.hintsLeft;
  $('shuffleCount').textContent='×'+state.shufflesLeft;
  $('btnHint').disabled=state.hintsLeft<=0;
  $('btnShuffle').disabled=state.shufflesLeft<=0;
  const pct=Math.max(0,state.timeLeft/state.cfg.time*100);
  const circ=$('timeCircle');
  circ.style.setProperty('--tp',pct+'%');
  circ.style.setProperty('--tc',pct<25?'#ff6b6b':'#4ecdc4');
  circ.classList.toggle('low',pct<25);
}
function tick(){
  if(state.paused||state.screen!=='game')return;
  state.timeLeft--;
  updateHUD();
  if(state.timeLeft<=0){loseLevel();}
}

/* ============ 关卡流程 ============ */
function startLevel(n){
  const cfg=getLevelConfig(n);
  state.cfg=cfg;state.rows=cfg.rows;state.cols=cfg.cols;
  state.board=generateBoard(cfg);
  state.score=0;state.timeLeft=cfg.time;state.combo=0;state.maxCombo=0;
  state.selected=null;state.busy=false;state.paused=false;state.hintsUsed=0;
  state.hintsLeft=cfg.hints;state.shufflesLeft=cfg.shuffles;
  state.firstInput=false;state.lastMatchAt=0;
  state.total=cfg.rows*cfg.cols-cfg.rocks;
  state.bonusCells=pickBonusCells();
  $('pauseOverlay').classList.remove('active');
  $('deadOverlay').classList.remove('active');
  $('linkSvg').innerHTML='';
  clearInterval(state.timerId);
  state.timerId=setInterval(tick,1000);
  // 适配棋盘尺寸
  fitBoard();
  renderBoard(true);
  updateHUD();
  showScreen('game');
  emit('level_start',{level:n});
}
function fitBoard(){
  // 根据视口高度限制棋盘最大宽度，保证整屏可见
  const wrap=$('boardWrap');
  wrap.style.maxWidth='';
  const vh=window.innerHeight,vw=window.innerWidth;
  // 估算：HUD(~60)+进度(~16)+道具(~70)+padding(~40)
  const reserved=210;
  const availH=vh-reserved;
  const aspect=state.cols/state.rows;
  let maxW=Math.min(vw-24,520);
  const byH=availH*aspect;
  maxW=Math.min(maxW,byH);
  wrap.style.maxWidth=Math.max(240,maxW)+'px';
  wrap.style.setProperty('--channel',vw<560?'18px':'24px');
}
window.addEventListener('resize',()=>{if(state.screen==='game')fitBoard()});

function winLevel(){
  clearInterval(state.timerId);
  state.busy=true;
  sfxWin();
  const timeBonus=state.timeLeft*10;
  const perfect=state.hintsUsed===0?500:0;
  state.score+=timeBonus+perfect;
  // 星级
  const ratio=state.timeLeft/state.cfg.time;
  let stars=1;
  if(ratio>=0.3)stars=2;
  if(ratio>=0.5&&state.hintsUsed<=1)stars=3;
  // 保存进度
  const lv=state.cfg.level;
  if(!progress.stars[lv]||progress.stars[lv]<stars)progress.stars[lv]=stars;
  if(!progress.best[lv]||progress.best[lv]<state.score)progress.best[lv]=state.score;
  progress.totalScore=Object.values(progress.best).reduce((a,b)=>a+b,0);
  if(lv===progress.unlocked&&lv<60)progress.unlocked=lv+1;
  saveProgress();
  emit('game_end',{result:'win',level:lv,score:state.score,stars,time:state.cfg.time-state.timeLeft});
  setTimeout(()=>showResult(true,stars,timeBonus,perfect),600);
}
function loseLevel(){
  clearInterval(state.timerId);
  state.busy=true;
  sfxLose();
  emit('game_end',{result:'lose',level:state.cfg.level,score:state.score,stars:0,time:state.cfg.time});
  setTimeout(()=>showResult(false,0,0,0),500);
}
function showResult(win,stars,timeBonus,perfect){
  const card=$('resultCard');
  if(win){
    card.innerHTML=`
      <div class="result-title win">🎉 过关！</div>
      <div class="result-stars">${[1,2,3].map(i=>`<span class="s ${i<=stars?'on':''}">⭐</span>`).join('')}</div>
      <div class="result-score">得分<b>${state.score.toLocaleString()}</b></div>
      <div class="result-info">
        <div class="ri-row"><span>⏱️ 用时</span><span class="rv">${state.cfg.time-state.timeLeft}秒</span></div>
        <div class="ri-row"><span>⚡ 最高连击</span><span class="rv">×${state.maxCombo}</span></div>
        <div class="ri-row"><span>⏳ 剩余时间奖励</span><span class="rv">+${timeBonus}</span></div>
        ${perfect?`<div class="ri-row"><span>🏅 无提示完美通关</span><span class="rv">+${perfect}</span></div>`:''}
      </div>
      <button class="btn-primary" style="width:100%" onclick="nextLevel()">${state.cfg.level<60?'下一关 →':'🏆 已通关'}</button>
      <br><button class="btn-secondary" onclick="restartLevel()" style="width:100%;margin-top:6px">🔄 重玩</button>
      <br><button class="btn-secondary" onclick="showScreen('menu')" style="width:100%;margin-top:6px">返回菜单</button>`;
  }else{
    card.innerHTML=`
      <div class="result-title lose">⏰ 时间到</div>
      <div class="result-stars"><span class="s">⭐</span><span class="s">⭐</span><span class="s">⭐</span></div>
      <div class="result-score">得分<b>${state.score.toLocaleString()}</b></div>
      <div class="result-info">
        <div class="ri-row"><span>🧩 剩余动物</span><span class="rv">${state.remain}</span></div>
        <div class="ri-row"><span>⚡ 最高连击</span><span class="rv">×${state.maxCombo}</span></div>
      </div>
      <button class="btn-primary" style="width:100%" onclick="restartLevel()">🔄 再试一次</button>
      <br><button class="btn-secondary" onclick="showScreen('menu')" style="width:100%;margin-top:6px">返回菜单</button>`;
  }
  showScreen('result');
}
function nextLevel(){if(state.cfg.level<60)startLevel(state.cfg.level+1);else showScreen('menu')}
function restartLevel(){startLevel(state.cfg.level)}
function continueGame(){startLevel(progress.unlocked||1)}
function quitToMenu(){$('pauseOverlay').classList.remove('active');clearInterval(state.timerId);showScreen('menu')}

/* ============ 暂停 ============ */
function togglePause(){
  if(state.screen!=='game')return;
  state.paused=!state.paused;
  $('pauseOverlay').classList.toggle('active',state.paused);
}

/* ============ 屏幕切换 ============ */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('screen-'+name).classList.add('active');
  state.screen=name;
  if(name==='menu')updateMenuStats();
  if(name==='levels')renderLevels();
}
function updateMenuStats(){
  $('menuBest').textContent=progress.totalScore.toLocaleString();
  $('menuStars').textContent=totalStars();
}
function renderLevels(){
  $('lvStars').textContent=totalStars();
  const wrap=$('chapters');wrap.innerHTML='';
  for(let ch=0;ch<6;ch++){
    const div=document.createElement('div');div.className='chapter';
    let html=`<div class="chapter-title">${CHAPTER_ICONS[ch]} 第${ch+1}章 · ${CHAPTER_NAMES[ch]}<span class="bar"></span></div><div class="level-grid">`;
    for(let i=0;i<10;i++){
      const lv=ch*10+i+1;
      const locked=lv>progress.unlocked;
      const stars=progress.stars[lv]||0;
      const current=lv===progress.unlocked;
      html+=`<button class="lvl-btn${locked?' locked':''}${current?' current':''}" ${locked?'disabled':''} onclick="startLevel(${lv})">
        ${locked?'🔒':lv}
        <div class="ls">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      </button>`;
    }
    html+='</div>';div.innerHTML=html;wrap.appendChild(div);
  }
}

/* ============ 初始化 ============ */
// 渲染开始页宝石
(function(){
  const mg=$('menuGems');if(!mg)return;
  [0,1,4,5,6,7].forEach(i=>{
    const img=document.createElement('img');
    img.src=GEM_IMAGES[i];
    img.alt='gem';
    mg.appendChild(img);
  });
})();
loadProgress();
updateMenuStats();
// 事件委托：board 上绑定一次点击
$('board').onclick=onBoardClick;
emit('runtime_ready');
// 自测：自动玩第1关
if(location.search.includes('selftest=1')){
  setTimeout(()=>{
    startLevel(1);
    const auto=setInterval(()=>{
      if(state.screen!=='game'||state.paused){clearInterval(auto);return}
      if(!state.busy&&state.remain>0){
        const h=findHint(state.board);
        if(h){
          onCellClick(h.r1,h.c1);
          setTimeout(()=>onCellClick(h.r2,h.c2),260);
        }
      }
      if(state.remain===0)clearInterval(auto);
    },600);
  },500);
}
</script>
