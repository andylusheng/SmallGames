<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hex Merge</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,Arial,sans-serif}body{background:radial-gradient(circle at 50% 0,#28335f,#11172e 48%,#090d1c);color:#fff;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}.game{width:min(430px,96vw);text-align:center}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.title{font-weight:900;font-size:22px}.hud{display:flex;gap:6px}.pill{background:#121b34;border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:6px 10px;color:#94a3b8;font-size:10px}.pill b{display:block;color:#fff;font-size:15px}.pill.combo b{color:#fbbf24}canvas{width:100%;max-height:68vh;aspect-ratio:1/1.02;border-radius:22px;background:linear-gradient(150deg,#17233f,#10182e);border:1px solid rgba(255,255,255,.09);box-shadow:0 24px 70px rgba(0,0,0,.35);touch-action:none}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}.msg{flex:1;text-align:left;font-size:12px;color:#cbd5e1;min-height:32px}.btn{border:0;border-radius:11px;padding:9px 14px;font-weight:800;background:#38bdf8;color:#07111f;cursor:pointer}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,7,18,.72);backdrop-filter:blur(5px)}.card{background:#111a31;border:1px solid rgba(255,255,255,.1);padding:22px;border-radius:20px;width:min(300px,86vw);box-shadow:0 24px 70px #0008}.card h2{margin:0 0 6px;font-size:26px}.card p{color:#cbd5e1;font-size:13px}.card .btn{margin-top:10px;width:100%;padding:12px}
</style></head><body><main class="game"><div class="top"><div class="title">⬢ Hex Merge</div><div class="hud"><div class="pill">SCORE<b id="sc">0</b></div><div class="pill combo">STREAK<b id="st">×0</b></div><div class="pill">BEST<b id="bs">0</b></div></div></div><canvas id="c"></canvas><div class="bottom"><div id="msg" class="msg">Tap a tile, then an adjacent matching tile to merge.</div><button class="btn" id="restart">Restart</button></div></main><div id="over" class="overlay"><div class="card"><h2>Board Locked</h2><p id="summary"></p><button class="btn" id="again">Play Again</button></div></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),sc=document.getElementById('sc'),st=document.getElementById('st'),bs=document.getElementById('bs'),msg=document.getElementById('msg'),over=document.getElementById('over'),summary=document.getElementById('summary');
const DPR=Math.min(devicePixelRatio||1,2),COLS=5,ROWS=5;let W,H,R,grid=[],selected=null,score=0,best=+localStorage.getItem('hex-merge-best')||0,streak=0,lastMerge=0,fx=[],audio=null;bs.textContent=best;
const colors=['','#38bdf8','#34d399','#fbbf24','#fb923c','#fb7185','#c084fc','#22d3ee','#f97316','#84cc16','#f43f5e','#8b5cf6'];
function tone(freq=420,d=.05){try{audio=audio||new (AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function resize(){const css=Math.min(410,innerWidth-24,innerHeight*.68);W=css;H=css*1.02;c.style.width=W+'px';c.style.height=H+'px';c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);R=Math.min(W/(COLS*1.82),H/(ROWS*1.66));draw()}addEventListener('resize',resize);
function center(col,row){return{x:R*1.8*col+R*1.18+(row%2)*R*.9,y:R*1.6*row+R*1.15}}
function neighbors(col,row){const even=row%2===0,dirs=even?[[-1,0],[1,0],[0,-1],[0,1],[-1,-1],[-1,1]]:[[-1,0],[1,0],[0,-1],[0,1],[1,-1],[1,1]];return dirs.map(([dc,dr])=>({c:col+dc,r:row+dr})).filter(n=>n.c>=0&&n.c<COLS&&n.r>=0&&n.r<ROWS)}
function adjacent(a,b){return neighbors(a.c,a.r).some(n=>n.c===b.c&&n.r===b.r)}
function hasMove(){for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++)if(grid[r][col]&&neighbors(col,r).some(n=>grid[n.r][n.c]===grid[r][col]))return true;return false}
function init(){grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++)grid[r][col]=Math.random()<.58?Math.ceil(Math.random()*3):0;while(!hasMove()){const r=Math.floor(Math.random()*ROWS),col=Math.floor(Math.random()*(COLS-1));grid[r][col]=1;grid[r][col+1]=1}score=0;streak=0;selected=null;fx=[];sc.textContent=0;st.textContent='×0';msg.textContent='Tap a tile, then an adjacent matching tile to merge.';over.style.display='none';draw()}
function spawn(){const e=[];for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++)if(!grid[r][col])e.push({r,c:col});if(!e.length)return;const s=e[Math.floor(Math.random()*e.length)];grid[s.r][s.c]=Math.ceil(Math.random()*3);const p=center(s.c,s.r);fx.push({type:'spawn',x:p.x,y:p.y,t:0})}
function merge(a,b){const now=performance.now();streak=now-lastMerge<2400?streak+1:1;lastMerge=now;grid[b.r][b.c]++;grid[a.r][a.c]=0;const val=grid[b.r][b.c],gain=val*2*Math.min(4,streak);score+=gain;sc.textContent=score;st.textContent='×'+streak;if(score>best){best=score;localStorage.setItem('hex-merge-best',best);bs.textContent=best}const p=center(b.c,b.r);fx.push({type:'merge',x:p.x,y:p.y,t:0,text:'+'+gain});tone(300+val*55,.07);navigator.vibrate?.(15);spawn();selected=null;msg.textContent=streak>=3?`Chain x${streak} · keep merging quickly!`:`Merged to ${val}`;if(!hasMove()&&grid.every(row=>row.every(Boolean))){summary.textContent=`Score ${score} · best ${best} · longest live streak ${streak}`;setTimeout(()=>over.style.display='flex',350)}draw()}
function hex(x,y,r,fill,stroke,width=2){ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3,px=x+r*Math.cos(a),py=y+r*Math.sin(a);i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}
function draw(){if(!W)return;ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#17233f');g.addColorStop(1,'#0d1428');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++){const p=center(col,r),v=grid[r]?.[col]||0,sel=selected&&selected.c===col&&selected.r===r;if(v){const glow=sel?10:0;if(glow){ctx.shadowBlur=18;ctx.shadowColor='#fff'}hex(p.x,p.y,R*.84,colors[Math.min(v,11)],sel?'#fff':'rgba(255,255,255,.12)',sel?4:2);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font=`900 ${Math.max(17,R*.52)}px Inter,Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(v,p.x,p.y)}else hex(p.x,p.y,R*.84,'rgba(15,23,42,.65)','rgba(148,163,184,.12)',1)}for(const f of fx){const life=Math.min(1,f.t/22);if(f.type==='merge'){ctx.globalAlpha=1-life;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,8+life*42,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 16px Inter';ctx.fillText(f.text,f.x,f.y-18-life*22)}else{ctx.globalAlpha=1-life;ctx.strokeStyle='#38bdf8';ctx.beginPath();ctx.arc(f.x,f.y,5+life*22,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1}}
function tick(){for(const f of fx)f.t++;fx=fx.filter(f=>f.t<22);draw();requestAnimationFrame(tick)}
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);let hit=null;outer:for(let row=0;row<ROWS;row++)for(let col=0;col<COLS;col++){const p=center(col,row);if(Math.hypot(mx-p.x,my-p.y)<R*.86){hit={c:col,r:row};break outer}}if(!hit)return;if(!selected){if(grid[hit.r][hit.c]){selected=hit;tone(230,.025);draw()}return}if(hit.c===selected.c&&hit.r===selected.r){selected=null;draw();return}if(adjacent(selected,hit)&&grid[selected.r][selected.c]===grid[hit.r][hit.c]&&grid[hit.r][hit.c])merge(selected,hit);else{selected=grid[hit.r][hit.c]?hit:null;streak=0;st.textContent='×0';tone(150,.03);draw()}});
document.getElementById('restart').onclick=init;document.getElementById('again').onclick=init;resize();init();requestAnimationFrame(tick);
</script></body></html>
