<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hex Merge</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,Arial,sans-serif}body{background:radial-gradient(circle at 50% 0,#313c74,#11172e 48%,#080c19);color:#fff;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}.game{width:min(438px,97vw);text-align:center}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.brand{text-align:left}.title{font-weight:950;font-size:21px;letter-spacing:-.03em}.subtitle{font-size:8px;color:#94a3b8;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}.hud{display:flex;gap:5px}.pill{background:#121b34;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:5px 8px;color:#94a3b8;font-size:8px}.pill b{display:block;color:#fff;font-size:14px}.pill.combo b{color:#fbbf24}.mission{display:flex;justify-content:space-between;align-items:center;text-align:left;background:#0f172acc;border:1px solid #ffffff12;border-radius:12px;padding:7px 9px;margin-bottom:7px}.mission strong{font-size:10px}.mission span{display:block;color:#94a3b8;font-size:8px;margin-top:2px}.mission b{color:#fbbf24;font-size:10px;white-space:nowrap}.mission.done{border-color:#34d39955}.mission.done b{color:#34d399}canvas{width:100%;max-height:65vh;aspect-ratio:1/1.02;border-radius:22px;background:linear-gradient(150deg,#17233f,#10182e);border:1px solid rgba(255,255,255,.09);box-shadow:0 24px 70px rgba(0,0,0,.35);touch-action:none}.legend{display:flex;justify-content:center;gap:5px;margin-top:6px}.tag{border-radius:999px;background:#111827;border:1px solid #ffffff10;padding:4px 7px;font-size:8px;color:#94a3b8}.tag i{font-style:normal;color:#fff}.bottom{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:6px}.msg{flex:1;text-align:left;font-size:10px;color:#cbd5e1;min-height:28px}.btn{border:0;border-radius:10px;padding:8px 12px;font-weight:900;font-size:10px;background:#38bdf8;color:#07111f;cursor:pointer}.btn.alt{background:#172033;color:#cbd5e1;border:1px solid #ffffff12}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,7,18,.76);backdrop-filter:blur(6px);z-index:10}.card{background:linear-gradient(160deg,#15213d,#0d1528);border:1px solid rgba(255,255,255,.1);padding:20px;border-radius:20px;width:min(320px,88vw);box-shadow:0 24px 70px #0008}.card h2{margin:0 0 5px;font-size:24px}.card p{color:#cbd5e1;font-size:11px;line-height:1.5}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.summary div{background:#0b1326;border-radius:9px;padding:7px 3px;color:#94a3b8;font-size:8px}.summary b{display:block;color:#fff;font-size:14px;margin-top:2px}.card .btn{width:100%;padding:11px;margin-top:7px}
</style></head><body><main class="game"><div class="top"><div class="brand"><div class="title">⬢ Hex Merge</div><div class="subtitle">ZeroPlay Puzzle Lab</div></div><div class="hud"><div class="pill">SCORE<b id="sc">0</b></div><div class="pill combo">CHAIN<b id="st">×0</b></div><div class="pill">BEST<b id="bs">0</b></div></div></div><div id="mission" class="mission"><div><strong id="missionTitle">Daily mission</strong><span id="missionText"></span></div><b id="missionProgress">0 / 0</b></div><canvas id="c"></canvas><div class="legend"><span class="tag"><i>🌈</i> wild</span><span class="tag"><i>💣</i> blast</span><span class="tag"><i>×2</i> score</span></div><div class="bottom"><div id="msg" class="msg">Merge adjacent matching tiles. Chain quickly for score multipliers.</div><button class="btn alt" id="restart">Restart</button></div></main><div id="over" class="overlay"><div class="card"><h2>Board Locked</h2><p id="overText"></p><div class="summary"><div>SCORE<b id="rScore">0</b></div><div>TOP TILE<b id="rTile">1</b></div><div>BEST CHAIN<b id="rChain">0</b></div></div><button class="btn" id="again">Play Again</button></div></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),sc=document.getElementById('sc'),st=document.getElementById('st'),bs=document.getElementById('bs'),msg=document.getElementById('msg'),over=document.getElementById('over');const DPR=Math.min(devicePixelRatio||1,2),COLS=5,ROWS=5,STORE='hex-merge-v3';let save={best:0,top:1,daily:{}};try{save={...save,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){}let W,H,R,grid=[],selected=null,score=0,streak=0,bestChain=0,lastMerge=0,fx=[],audio=null,mergeCount=0,topTile=1,mission=null;bs.textContent=save.best||0;const colors=['','#38bdf8','#34d399','#fbbf24','#fb923c','#fb7185','#c084fc','#22d3ee','#f97316','#84cc16','#f43f5e','#8b5cf6','#ec4899'];
function persist(){save.best=Math.max(save.best||0,score);save.top=Math.max(save.top||1,topTile);localStorage.setItem(STORE,JSON.stringify(save))}function dateKey(){return new Date().toISOString().slice(0,10)}function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function tone(freq=420,d=.05){try{audio=audio||new (AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.04,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function resize(){const css=Math.min(420,innerWidth-20,innerHeight*.65);W=css;H=css*1.02;c.style.width=W+'px';c.style.height=H+'px';c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);R=Math.min(W/(COLS*1.82),H/(ROWS*1.66));draw()}addEventListener('resize',resize);function center(col,row){return{x:R*1.8*col+R*1.18+(row%2)*R*.9,y:R*1.6*row+R*1.15}}function neighbors(col,row){const even=row%2===0,dirs=even?[[-1,0],[1,0],[0,-1],[0,1],[-1,-1],[-1,1]]:[[-1,0],[1,0],[0,-1],[0,1],[1,-1],[1,1]];return dirs.map(([dc,dr])=>({c:col+dc,r:row+dr})).filter(n=>n.c>=0&&n.c<COLS&&n.r>=0&&n.r<ROWS)}function adjacent(a,b){return neighbors(a.c,a.r).some(n=>n.c===b.c&&n.r===b.r)}function validPair(a,b){if(!a||!b)return false;if(a.sp==='rainbow'||b.sp==='rainbow')return true;return a.v===b.v}function hasMove(){for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++){const a=grid[r][col];if(a&&neighbors(col,r).some(n=>grid[n.r][n.c]&&validPair(a,grid[n.r][n.c])))return true}return false}function empties(){const e=[];for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++)if(!grid[r][col])e.push({r,c:col});return e}
const MISSIONS=[{type:'score',goal:400,title:'Score Hunter',text:'Reach 400 points in one board.'},{type:'tile',goal:7,title:'Forge Seven',text:'Create a level 7 tile.'},{type:'chain',goal:4,title:'Chain Reaction',text:'Reach a ×4 live chain.'}];function pickMission(){mission={...MISSIONS[hash(dateKey()+'-hex')%MISSIONS.length],done:false};if(save.daily?.[dateKey()])mission.done=true;updateMission()}function missionValue(){return mission.type==='score'?score:mission.type==='tile'?topTile:bestChain}function updateMission(){const el=document.getElementById('mission'),v=Math.min(missionValue(),mission.goal);document.getElementById('missionTitle').textContent='Daily · '+mission.title;document.getElementById('missionText').textContent=mission.text;document.getElementById('missionProgress').textContent=mission.done?'✓ Complete':v+' / '+mission.goal;el.classList.toggle('done',mission.done);if(!mission.done&&missionValue()>=mission.goal){mission.done=true;save.daily=save.daily||{};save.daily[dateKey()]=true;persist();msg.textContent='🏆 Daily mission complete';tone(820,.13);navigator.vibrate?.(35)}}
function tile(v,sp=null){return{v,sp}}function init(){grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++)if(Math.random()<.58)grid[r][col]=tile(Math.ceil(Math.random()*3));while(!hasMove()){const r=Math.floor(Math.random()*ROWS),col=Math.floor(Math.random()*(COLS-1));grid[r][col]=tile(1);grid[r][col+1]=tile(1)}score=0;streak=0;bestChain=0;mergeCount=0;topTile=3;selected=null;fx=[];sc.textContent=0;st.textContent='×0';msg.textContent='Merge adjacent matching tiles. Chain quickly for score multipliers.';over.style.display='none';pickMission();draw()}
function specialForSpawn(){if(mergeCount<3)return null;const roll=Math.random();if(roll<.06)return'rainbow';if(roll<.12)return'bomb';if(roll<.19)return'x2';return null}function spawn(){const e=empties();if(!e.length)return;const s=e[Math.floor(Math.random()*e.length)],sp=specialForSpawn();grid[s.r][s.c]=tile(Math.ceil(Math.random()*3),sp);const p=center(s.c,s.r);fx.push({type:'spawn',x:p.x,y:p.y,t:0,text:sp?sp==='rainbow'?'🌈':sp==='bomb'?'💣':'×2':''});ensurePlayable()}
function ensurePlayable(){if(hasMove())return;const e=empties();if(e.length){const occupied=[];for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++)if(grid[r][col])occupied.push({r,c:col});if(occupied.length){const q=occupied[Math.floor(Math.random()*occupied.length)];grid[q.r][q.c].sp='rainbow';msg.textContent='🌈 Wild tile appeared to keep the board alive.'}}}
function blastAt(pos){let bonus=0;for(const n of neighbors(pos.c,pos.r)){const t=grid[n.r][n.c];if(t){bonus+=t.v*3;const p=center(n.c,n.r);fx.push({type:'blast',x:p.x,y:p.y,t:0,text:'+'+t.v*3});grid[n.r][n.c]=null}}return bonus}
function merge(aPos,bPos){const a=grid[aPos.r][aPos.c],b=grid[bPos.r][bPos.c];if(!validPair(a,b))return;const now=performance.now();streak=now-lastMerge<2500?streak+1:1;bestChain=Math.max(bestChain,streak);lastMerge=now;const rainbow=a.sp==='rainbow'||b.sp==='rainbow',bomb=a.sp==='bomb'||b.sp==='bomb',double=a.sp==='x2'||b.sp==='x2';const baseV=rainbow?(a.sp==='rainbow'?b.v:a.v):b.v;const newV=Math.min(12,baseV+1);grid[bPos.r][bPos.c]=tile(newV);grid[aPos.r][aPos.c]=null;mergeCount++;topTile=Math.max(topTile,newV);let gain=newV*6*Math.min(5,streak);if(double)gain*=2;if(bomb)gain+=blastAt(bPos);score+=gain;sc.textContent=score;st.textContent='×'+streak;if(score>save.best){save.best=score;bs.textContent=score;persist()}const p=center(bPos.c,bPos.r);fx.push({type:'merge',x:p.x,y:p.y,t:0,text:'+'+gain});if(bomb)fx.push({type:'ring',x:p.x,y:p.y,t:0,text:'💥'});tone(300+newV*52,.075);navigator.vibrate?.(bomb?30:14);spawn();selected=null;msg.textContent=bomb?'💣 Blast merge cleared nearby tiles':double?'×2 score merge':rainbow?'🌈 Wild merge':streak>=3?`Chain ×${streak} · keep moving`:`Merged to ${newV}`;updateMission();if(!hasMove()&&!empties().length)finish();draw()}
function finish(){persist();document.getElementById('overText').textContent=mission.done?'Daily mission complete. Start another board to push your best.':'Board locked. Build faster chains and use special tiles to create space.';document.getElementById('rScore').textContent=score;document.getElementById('rTile').textContent=topTile;document.getElementById('rChain').textContent='×'+bestChain;setTimeout(()=>over.style.display='flex',300)}
function hex(x,y,r,fill,stroke,width=2){ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3,px=x+r*Math.cos(a),py=y+r*Math.sin(a);i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}
function draw(){if(!W)return;ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#17233f');g.addColorStop(1,'#0d1428');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++){const p=center(col,r),t=grid[r]?.[col],sel=selected&&selected.c===col&&selected.r===r;if(t){if(sel){ctx.shadowBlur=18;ctx.shadowColor='#fff'}const fill=t.sp==='rainbow'?'#7c3aed':colors[Math.min(t.v,12)];hex(p.x,p.y,R*.84,fill,sel?'#fff':'rgba(255,255,255,.13)',sel?4:2);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font=`950 ${Math.max(17,R*.5)}px Inter,Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.v,p.x,p.y+2);if(t.sp){ctx.font=`900 ${Math.max(10,R*.28)}px Arial`;ctx.fillStyle=t.sp==='x2'?'#fff7ed':'#fff';ctx.fillText(t.sp==='rainbow'?'🌈':t.sp==='bomb'?'💣':'×2',p.x,p.y-R*.42)}}else hex(p.x,p.y,R*.84,'rgba(15,23,42,.65)','rgba(148,163,184,.12)',1)}for(const f of fx){const life=Math.min(1,f.t/24);ctx.globalAlpha=1-life;if(f.type==='merge'||f.type==='ring'){ctx.strokeStyle=f.type==='ring'?'#fb7185':'#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,8+life*(f.type==='ring'?60:42),0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='950 15px Inter';if(f.text)ctx.fillText(f.text,f.x,f.y-18-life*20)}else if(f.type==='blast'){ctx.fillStyle='#fbbf24';ctx.font='900 12px Inter';ctx.fillText(f.text,f.x,f.y-life*24)}else{ctx.strokeStyle='#38bdf8';ctx.beginPath();ctx.arc(f.x,f.y,5+life*22,0,Math.PI*2);ctx.stroke();if(f.text){ctx.fillStyle='#fff';ctx.font='11px Arial';ctx.fillText(f.text,f.x,f.y)}}ctx.globalAlpha=1}}
function tick(){for(const f of fx)f.t++;fx=fx.filter(f=>f.t<24);draw();requestAnimationFrame(tick)}c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);let hit=null;outer:for(let row=0;row<ROWS;row++)for(let col=0;col<COLS;col++){const p=center(col,row);if(Math.hypot(mx-p.x,my-p.y)<R*.86){hit={c:col,r:row};break outer}}if(!hit)return;if(!selected){if(grid[hit.r][hit.c]){selected=hit;tone(230,.025);draw()}return}if(hit.c===selected.c&&hit.r===selected.r){selected=null;draw();return}if(adjacent(selected,hit)&&grid[hit.r][hit.c]&&validPair(grid[selected.r][selected.c],grid[hit.r][hit.c]))merge(selected,hit);else{selected=grid[hit.r][hit.c]?hit:null;streak=0;st.textContent='×0';tone(150,.03);draw()}});document.getElementById('restart').onclick=()=>{persist();init()};document.getElementById('again').onclick=init;resize();init();requestAnimationFrame(tick);
</script></body></html>
