    <text x="54" y="125" text-anchor="middle" font-size="18">🍉</text>
    <rect x="72" y="104" width="28" height="28" rx="6" fill="url(#tile)"/>
    <text x="86" y="125" text-anchor="middle" font-size="18">🍎</text>
    <rect x="104" y="104" width="28" height="28" rx="6" fill="url(#tile)"/>
    <text x="118" y="125" text-anchor="middle" font-size="18">🍇</text>
