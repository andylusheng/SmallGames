    <text x="150" y="189" text-anchor="middle" font-size="18">🍓</text>
    <rect x="168" y="168" width="28" height="28" rx="6" fill="url(#tile)"/>
    <text x="182" y="189" text-anchor="middle" font-size="18">🍊</text>
    <!-- 消除特效：3连高亮 -->
    <rect x="36" y="36" width="96" height="36" rx="8" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="4,3" opacity=".7"/>
    <!-- 粒子 -->
    <circle cx="84" cy="54" r="3" fill="#ffd166" opacity=".8"/>
    <circle cx="70" cy="45" r="2" fill="#ff9a3d" opacity=".6"/>
    <circle cx="100" cy="62" r="2.5" fill="#fff" opacity=".7"/>
  </g>
  <!-- 底部标签 -->
  <text x="200" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#6b7394">MATCH 3 · 60 LEVELS</text>
