    <text x="118" y="93" text-anchor="middle" font-size="18">🍓</text>
    <rect x="136" y="72" width="28" height="28" rx="6" fill="url(#tile)"/>
    <text x="150" y="93" text-anchor="middle" font-size="18">🍇</text>
    <rect x="168" y="72" width="28" height="28" rx="6" fill="url(#tile)"/>
