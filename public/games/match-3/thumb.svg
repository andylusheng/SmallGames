    <rect x="136" y="136" width="28" height="28" rx="6" fill="url(#tile)"/>
    <text x="150" y="157" text-anchor="middle" font-size="18">🍋</text>
    <rect x="168" y="136" width="28" height="28" rx="6" fill="url(#tile)"/>
    <text x="182" y="157" text-anchor="middle" font-size="18">🍇</text>
    <!-- row 5 -->
    <rect x="8" y="168" width="28" height="28" rx="6" fill="url(#tile)"/>
    <text x="22" y="189" text-anchor="middle" font-size="18">🍓</text>
    <rect x="40" y="168" width="28" height="28" rx="6" fill="url(#tile)"/>
    <text x="54" y="189" text-anchor="middle" font-size="18">🍎</text>
    <rect x="72" y="168" width="28" height="28" rx="6" fill="url(#tile)"/>
