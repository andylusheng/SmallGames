<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Golf Putt</title>
<style>
*{margin:0;padding:0}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;overflow:hidden}
#ui{color:#fff;margin-bottom:6px;font-size:16px}
#ui span{color:#4fc3f7;font-weight:bold}
canvas{border-radius:8px;touch-action:none}
#msg{color:#aaa;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div id="ui">Hole: <span id="hl">1</span>/9 | Strokes: <span id="sk">0</span> | Total: <span id="tt">0</span> | Best: <span id="bs">0</span></div>
<canvas id="c"></canvas>
<div id="msg">Drag back from ball to aim & set power, release to putt!</div>
<script>
const W=Math.min(860,innerWidth-16),H=Math.min(640,innerHeight-80);
const c=document.getElementById('c');c.width=W;c.height=H;
const ctx=c.getContext('2d');
let hole=1,strokes=0,total=0,ball={x:W/2,y:H-60},holePos={x:W/2,y:60},dragging=false,dragStart=null,moving=false,particles=[],best=+localStorage.getItem('golf-putt-best')||0;
document.getElementById('bs').textContent=best;
function newHole(){ball={x:W/2,y:H-60};holePos={x:50+Math.random()*(W-100),y:40+Math.random()*100};moving=false;strokes=0;document.getElementById('sk').textContent=0;}
c.addEventListener('pointerdown',e=>{if(moving)return;const r=c.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;if(Math.hypot(mx-ball.x,my-ball.y)<30){dragging=true;dragStart={x:mx,y:my};}});
c.addEventListener('pointermove',e=>{if(!dragging)return;});
c.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;const r=c.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;const dx=ball.x-mx,dy=ball.y-my;const power=Math.min(Math.hypot(dx,dy),120);if(power<8)return;const angle=Math.atan2(dy,dx);ball.vx=Math.cos(angle)*power*0.08;ball.vy=Math.sin(angle)*power*0.08;moving=true;strokes++;document.getElementById('sk').textContent=strokes;});
function update(){if(!moving)return;ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=0.98;ball.vy*=0.98;
if(ball.x<10||ball.x>W-10){ball.vx*=-0.7;ball.x=Math.max(10,Math.min(W-10,ball.x));}
if(ball.y<10||ball.y>H-10){ball.vy*=-0.7;ball.y=Math.max(10,Math.min(H-10,ball.y));}
if(Math.hypot(ball.vx,ball.vy)<0.1){moving=false;ball.vx=0;ball.vy=0;}
if(Math.hypot(ball.x-holePos.x,ball.y-holePos.y)<14&&Math.hypot(ball.vx,ball.vy)<4){moving=false;total+=strokes;document.getElementById('tt').textContent=total;for(let p=0;p<10;p++){particles.push({x:holePos.x,y:holePos.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:25,color:'#ffc107'});}
if(hole>=9){if(total>0&&(best===0||total<best)){best=total;localStorage.setItem('golf-putt-best',best);document.getElementById('bs').textContent=best;}hole=1;total=0;document.getElementById('tt').textContent=0;}else{hole++;}document.getElementById('hl').textContent=hole;newHole();}
particles.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)particles.splice(i,1);});}
function draw(){ctx.fillStyle='#2e7d32';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#388e3c';for(let i=0;i<W;i+=30)for(let j=0;j<H;j+=30){if((i+j)%60===0)ctx.fillRect(i,j,30,30);}
ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.strokeRect(8,8,W-16,H-16);
ctx.beginPath();ctx.arc(holePos.x,holePos.y,12,0,Math.PI*2);ctx.fillStyle='#111';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1;
ctx.fillStyle='#e94560';ctx.fillRect(holePos.x-1,holePos.y-35,2,35);ctx.beginPath();ctx.moveTo(holePos.x+1,holePos.y-35);ctx.lineTo(holePos.x+18,holePos.y-28);ctx.lineTo(holePos.x+1,holePos.y-21);ctx.fillStyle='#e94560';ctx.fill();
ctx.beginPath();ctx.arc(ball.x,ball.y,8,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#ccc';ctx.stroke();
if(dragging&&dragStart){ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(ball.x,ball.y);const dx=ball.x*2-dragStart.x,dy=ball.y*2-dragStart.y;ctx.lineTo(dx,dy);ctx.stroke();ctx.setLineDash([]);}
particles.forEach(p=>{ctx.globalAlpha=p.life/25;ctx.fillStyle=p.color;ctx.fillRect(p.x-3,p.y-3,6,6);ctx.globalAlpha=1;});}
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
