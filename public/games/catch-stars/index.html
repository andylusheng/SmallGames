<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Catch Stars</title>
<style>
*{margin:0;padding:0}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;overflow:hidden}
#ui{color:#fff;margin-bottom:6px;font-size:16px}
#ui span{color:#4fc3f7;font-weight:bold}
canvas{border-radius:8px;touch-action:none}
#msg{color:#aaa;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div id="ui">Score: <span id="sc">0</span> | ❤️ <span id="lv">5</span> | Best: <span id="bs">0</span></div>
<canvas id="c"></canvas>
<div id="msg">Move to catch ⭐ stars • Avoid 💀 skulls!</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=Math.min(860,innerWidth-16),H=Math.min(640,innerHeight-80);
cv.width=W;cv.height=H;
let catcher,items,score,lives,best=+localStorage.getItem('cs2-best')||0;
let gameOver=false,started=false,frame=0;
document.getElementById('bs').textContent=best;
function init(){
  catcher={x:W/2,y:H-35,w:50,h:16};
  items=[];score=0;lives=5;frame=0;gameOver=false;started=false;
  document.getElementById('sc').textContent=0;
  document.getElementById('lv').textContent=5;
}
function update(){
  if(!started||gameOver)return;
  frame++;
  if(frame%Math.max(20,45-Math.floor(score/3))===0){
    const isSkull=Math.random()<0.2;
    items.push({x:15+Math.random()*(W-30),y:-20,vy:2+Math.random()*2+score*0.02,type:isSkull?'skull':'star',r:12});
  }
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];it.y+=it.vy;
    if(it.y>H+20){
      if(it.type==='star'){lives--;document.getElementById('lv').textContent=lives;if(lives<=0)die();}
      items.splice(i,1);continue;
    }
    if(it.y+it.r>catcher.y&&it.y<catcher.y+catcher.h&&it.x>catcher.x-catcher.w/2&&it.x<catcher.x+catcher.w/2){
      if(it.type==='star'){score++;document.getElementById('sc').textContent=score;}
      else{lives-=2;document.getElementById('lv').textContent=lives;if(lives<=0)die();}
      items.splice(i,1);
    }
  }
}
function die(){
  gameOver=true;
  if(score>best){best=score;localStorage.setItem('cs2-best',best);}
  document.getElementById('bs').textContent=best;
}
function draw(){
  ctx.fillStyle='#0f3460';ctx.fillRect(0,0,W,H);
  for(let it of items){
    ctx.font='20px Arial';ctx.textAlign='center';
    ctx.fillText(it.type==='star'?'⭐':'💀',it.x,it.y+7);
  }
  ctx.fillStyle='#ffc107';
  ctx.beginPath();ctx.roundRect(catcher.x-catcher.w/2,catcher.y,catcher.w,catcher.h,8);ctx.fill();
  ctx.fillStyle='#ff8f00';
  ctx.beginPath();ctx.roundRect(catcher.x-catcher.w/2+4,catcher.y+3,catcher.w-8,5,3);ctx.fill();
  if(!started&&!gameOver){
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText('TAP TO START',W/2,H/2);
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e94560';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText('GAME OVER',W/2,H/2-12);
    ctx.fillStyle='#fff';ctx.font='15px Arial';
    ctx.fillText('Score: '+score+' | Tap to retry',W/2,H/2+18);
  }
}
function loop(){update();draw();requestAnimationFrame(loop);}
cv.addEventListener('pointermove',e=>{
  if(!started||gameOver)return;
  const r=cv.getBoundingClientRect();
  catcher.x=Math.max(catcher.w/2,Math.min(W-catcher.w/2,e.clientX-r.left));
});
cv.addEventListener('pointerdown',e=>{
  if(!started){started=true;return;}
  if(gameOver){init();started=true;return;}
  const r=cv.getBoundingClientRect();
  catcher.x=Math.max(catcher.w/2,Math.min(W-catcher.w/2,e.clientX-r.left));
});
document.addEventListener('keydown',e=>{
  if(!started){started=true;return;}
  if(gameOver){init();started=true;return;}
  if(e.code==='ArrowLeft')catcher.x=Math.max(catcher.w/2,catcher.x-25);
  if(e.code==='ArrowRight')catcher.x=Math.min(W-catcher.w/2,catcher.x+25);
});
init();loop();
</script>
</body>
</html>
