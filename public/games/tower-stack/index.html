<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tower Stack</title>
<style>
*{margin:0;padding:0}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;overflow:hidden}
#ui{color:#fff;margin-bottom:8px;font-size:18px}
#ui span{color:#4fc3f7;font-weight:bold}
canvas{border-radius:8px}
#msg{color:#aaa;margin-top:8px;font-size:13px}
</style>
</head>
<body>
<div id="ui">Height: <span id="sc">0</span> | Best: <span id="bs">0</span></div>
<canvas id="c"></canvas>
<div id="msg">Tap / Click / Space to drop the block</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=Math.min(860,innerWidth-16),H=Math.min(640,innerHeight-80);c.width=W;c.height=H;
let blocks,current,score,best=0,gameOver,speed,dir,animId;

const colors=['#e94560','#4fc3f7','#4caf50','#ffc107','#9c27b0','#ff9800','#00bcd4','#8bc34a'];

function init(){
  blocks=[{x:W/2-60,y:H-30,w:120,h:28}];
  score=0;gameOver=false;speed=3;dir=1;
  document.getElementById('sc').textContent='0';
  spawnBlock();
  cancelAnimationFrame(animId);
  loop();
}

function spawnBlock(){
  const last=blocks[blocks.length-1];
  const y=last.y-30;
  current={x:0,y:y,w:last.w,h:28};
  dir=1;speed=2+score*0.15;
}

function loop(){
  if(gameOver)return;
  update();draw();
  animId=requestAnimationFrame(loop);
}

function update(){
  current.x+=speed*dir;
  if(current.x<=0||current.x+current.w>=W)dir*=-1;
}

function drop(){
  if(gameOver)return;
  const last=blocks[blocks.length-1];
  
  // Calculate overlap
  const overlapStart=Math.max(current.x,last.x);
  const overlapEnd=Math.min(current.x+current.w,last.x+last.w);
  const overlapW=overlapEnd-overlapStart;
  
  if(overlapW<=0){
    // Missed completely
    endGame();return;
  }
  
  // Perfect or near-perfect placement bonus
  const diff=Math.abs(current.x-last.x);
  if(diff<5){
    // Perfect placement - keep same width
    blocks.push({x:last.x,y:current.y,w:last.w,h:28});
  }else{
    blocks.push({x:overlapStart,y:current.y,w:overlapW,h:28});
  }
  
  score++;
  document.getElementById('sc').textContent=score;
  spawnBlock();
  
  // Scroll down if tower gets too high
  if(blocks[blocks.length-1].y<150){
    const shift=30;
    blocks.forEach(b=>b.y+=shift);
    current.y+=shift;
  }
}

function endGame(){
  gameOver=true;
  if(score>best){best=score;document.getElementById('bs').textContent=best;}
  draw();
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.textAlign='center';
  ctx.fillText('Game Over!',W/2,H/2-20);
  ctx.font='18px Arial';ctx.fillStyle='#4fc3f7';
  ctx.fillText('Height: '+score,W/2,H/2+15);
  ctx.fillStyle='#aaa';ctx.font='14px Arial';
  ctx.fillText('Tap to restart',W/2,H/2+50);
}

function draw(){
  // Background gradient
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0f3460');grad.addColorStop(1,'#1a1a2e');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  
  // Placed blocks
  blocks.forEach((b,i)=>{
    ctx.fillStyle=colors[i%colors.length];
    ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,4);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.1)';
    ctx.fillRect(b.x,b.y,b.w,b.h/2);
  });
  
  // Current moving block
  if(!gameOver){
    ctx.fillStyle=colors[blocks.length%colors.length];
    ctx.globalAlpha=0.9;
    ctx.beginPath();ctx.roundRect(current.x,current.y,current.w,current.h,4);ctx.fill();
    ctx.globalAlpha=1;
  }
}

// Controls
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(gameOver)init();else drop();}});
c.addEventListener('click',()=>{if(gameOver)init();else drop();});
c.addEventListener('touchstart',e=>{e.preventDefault();if(gameOver)init();else drop();});

init();
</script>
</body>
</html>
