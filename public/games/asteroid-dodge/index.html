<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Asteroid Dodge</title>
<style>
*{margin:0;padding:0}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;overflow:hidden}
#ui{color:#fff;margin-bottom:6px;font-size:16px}
#ui span{color:#4fc3f7;font-weight:bold}
canvas{border-radius:8px;touch-action:none}
#msg{color:#aaa;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div id="ui">Score: <span id="sc">0</span> | Best: <span id="bs">0</span></div>
<canvas id="c"></canvas>
<div id="msg">Drag/Arrow keys to dodge asteroids!</div>
<script>
const W=Math.min(860,innerWidth-16),H=Math.min(640,innerHeight-80);
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');
let score=0,best=+localStorage.getItem('asteroid_best')||0,gameOver=false;
document.getElementById('bs').textContent=best;
const ship={x:W/2,y:H-60,w:24,h:30,speed:6};
let asteroids=[],stars=[],frame=0,spawnRate=40;
// Stars background
for(let i=0;i<50;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+0.5,sp:Math.random()*2+1});
let keys={};
document.addEventListener('keydown',e=>keys[e.key]=true);
document.addEventListener('keyup',e=>keys[e.key]=false);
let dragging=false;
cv.addEventListener('pointerdown',e=>{dragging=true;moveShip(e)});
cv.addEventListener('pointermove',e=>{if(dragging)moveShip(e)});
cv.addEventListener('pointerup',()=>draging=false);
cv.addEventListener('pointerup',()=>dragging=false);
function moveShip(e){
  const r=cv.getBoundingClientRect();
  ship.x=Math.max(ship.w/2,Math.min(W-ship.w/2,e.clientX-r.left));
}
function spawnAsteroid(){
  const size=15+Math.random()*25;
  asteroids.push({x:Math.random()*(W-size*2)+size,y:-size,r:size,vy:2+Math.random()*3+score*0.02,rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*0.1});
}
function loop(){
  if(gameOver)return;
  frame++;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  // Stars
  stars.forEach(s=>{
    s.y+=s.sp;if(s.y>H){s.y=0;s.x=Math.random()*W}
    ctx.fillStyle='rgba(255,255,255,'+(s.s/3)+')';
    ctx.fillRect(s.x,s.y,s.s,s.s);
  });
  // Input
  if(keys['ArrowLeft']||keys['a'])ship.x-=ship.speed;
  if(keys['ArrowRight']||keys['d'])ship.x+=ship.speed;
  ship.x=Math.max(ship.w/2,Math.min(W-ship.w/2,ship.x));
  // Spawn
  if(frame%Math.max(15,spawnRate-Math.floor(score/5))===0)spawnAsteroid();
  // Asteroids
  asteroids.forEach(a=>{
    a.y+=a.vy;a.rot+=a.vr;
    ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);
    ctx.fillStyle='#78909c';
    ctx.beginPath();
    for(let i=0;i<7;i++){
      const ang=i/7*Math.PI*2;
      const rad=a.r*(0.7+Math.random()*0.01+((i%2)?0.2:0));
      ctx.lineTo(Math.cos(ang)*rad,Math.sin(ang)*rad);
    }
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#546e7a';
    ctx.beginPath();ctx.arc(a.r*0.2,-a.r*0.1,a.r*0.2,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // Collision
    const dist=Math.hypot(a.x-ship.x,a.y-ship.y);
    if(dist<a.r+ship.w/2-4){
      gameOver=true;
      if(score>best){best=score;localStorage.setItem('asteroid_best',best);document.getElementById('bs').textContent=best}
    }
  });
  asteroids=asteroids.filter(a=>{
    if(a.y>H+a.r){score++;document.getElementById('sc').textContent=score;return false}
    return true;
  });
  // Draw ship
  ctx.fillStyle='#4fc3f7';
  ctx.beginPath();
  ctx.moveTo(ship.x,ship.y-ship.h/2);
  ctx.lineTo(ship.x-ship.w/2,ship.y+ship.h/2);
  ctx.lineTo(ship.x+ship.w/2,ship.y+ship.h/2);
  ctx.closePath();ctx.fill();
  // Engine glow
  ctx.fillStyle='#ff9800';
  ctx.beginPath();
  ctx.moveTo(ship.x-6,ship.y+ship.h/2);
  ctx.lineTo(ship.x,ship.y+ship.h/2+8+Math.random()*6);
  ctx.lineTo(ship.x+6,ship.y+ship.h/2);
  ctx.closePath();ctx.fill();
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText('GAME OVER',W/2,H/2-20);
    ctx.font='18px Arial';ctx.fillText('Score: '+score,W/2,H/2+15);
    ctx.font='14px Arial';ctx.fillStyle='#4fc3f7';
    ctx.fillText('Tap to restart',W/2,H/2+50);
    cv.addEventListener('pointerdown',restart,{once:true});
    return;
  }
  requestAnimationFrame(loop);
}
function restart(){
  score=0;gameOver=false;asteroids=[];frame=0;
  document.getElementById('sc').textContent=0;
  loop();
}
loop();
</script>
</body>
</html>
