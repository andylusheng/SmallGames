<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Minesweeper</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;padding:10px}
.header{display:flex;align-items:center;gap:20px;margin-bottom:12px;color:#fff}
.stat{background:#16213e;padding:6px 14px;border-radius:8px;font-size:16px;font-weight:bold}
.stat span{color:#e94560}
#board{display:grid;gap:2px;background:#0f3460;padding:6px;border-radius:8px;touch-action:manipulation}
.cell{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;border-radius:4px;cursor:pointer;user-select:none;transition:background .1s}
.cell.hidden{background:#1a1a4e;border:1px solid #2a2a5e}
.cell.hidden:hover{background:#2a2a6e}
.cell.revealed{background:#16213e;border:1px solid #1a2a4e}
.cell.mine{background:#e94560}
.cell.flagged{background:#1a1a4e}
.cell.flagged::after{content:"🚩"}
.c1{color:#4fc3f7}.c2{color:#81c784}.c3{color:#e57373}.c4{color:#7c4dff}.c5{color:#ff8a65}.c6{color:#4dd0e1}.c7{color:#f06292}.c8{color:#aaa}
.msg{color:#aaa;margin-top:12px;font-size:14px;text-align:center}
.btn{margin-top:10px;padding:8px 20px;background:#e94560;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer}
.btn:hover{background:#c73e54}
.mode-toggle{display:flex;gap:8px;margin-bottom:10px}
.mode-btn{padding:6px 16px;border-radius:6px;border:1px solid #333;background:#16213e;color:#fff;cursor:pointer;font-size:13px}
.mode-btn.active{background:#e94560;border-color:#e94560}
@media(max-width:400px){.cell{width:28px;height:28px;font-size:12px}}
</style>
</head>
<body>
<div class="header">
  <div class="stat">💣 <span id="mines">10</span></div>
  <div class="stat">⏱ <span id="timer">0</span>s</div>
</div>
<div class="mode-toggle">
  <button class="mode-btn active" id="digBtn" onclick="setMode('dig')">⛏ Dig</button>
  <button class="mode-btn" id="flagBtn" onclick="setMode('flag')">🚩 Flag</button>
</div>
<div id="board"></div>
<div class="msg" id="msg">Tap to dig • Switch to Flag mode to mark mines</div>
<button class="btn" onclick="init()">New Game</button>
<script>
const ROWS=10,COLS=10,MINES=10;
let board,revealed,flagged,gameOver,mode='dig',timer=0,timerInt=null,firstClick=true;

function init(){
  board=[];revealed=[];flagged=[];gameOver=false;firstClick=true;timer=0;
  clearInterval(timerInt);document.getElementById('timer').textContent='0';
  document.getElementById('mines').textContent=MINES;
  document.getElementById('msg').textContent='Tap to dig • Switch to Flag mode to mark mines';
  for(let r=0;r<ROWS;r++){board[r]=[];revealed[r]=[];flagged[r]=[];for(let c=0;c<COLS;c++){board[r][c]=0;revealed[r][c]=false;flagged[r][c]=false;}}
  render();
}

function placeMines(sr,sc){
  let placed=0;
  while(placed<MINES){
    let r=Math.floor(Math.random()*ROWS),c=Math.floor(Math.random()*COLS);
    if(board[r][c]===-1||(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1))continue;
    board[r][c]=-1;placed++;
  }
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(board[r][c]===-1)continue;
    let count=0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      let nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===-1)count++;
    }
    board[r][c]=count;
  }
}

function render(){
  const el=document.getElementById('board');
  el.style.gridTemplateColumns=`repeat(${COLS},1fr)`;
  el.innerHTML='';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell=document.createElement('div');
    cell.className='cell hidden';
    cell.dataset.r=r;cell.dataset.c=c;
    cell.addEventListener('click',()=>handleClick(r,c));
    cell.addEventListener('contextmenu',(e)=>{e.preventDefault();toggleFlag(r,c);});
    el.appendChild(cell);
  }
}

function getCell(r,c){return document.querySelector(`[data-r="${r}"][data-c="${c}"]`);}

function handleClick(r,c){
  if(gameOver||flagged[r][c])return;
  if(mode==='flag'){toggleFlag(r,c);return;}
  if(firstClick){firstClick=false;placeMines(r,c);timerInt=setInterval(()=>{timer++;document.getElementById('timer').textContent=timer;},1000);}
  if(revealed[r][c])return;
  if(board[r][c]===-1){lose(r,c);return;}
  reveal(r,c);checkWin();
}

function reveal(r,c){
  if(r<0||r>=ROWS||c<0||c>=COLS||revealed[r][c]||flagged[r][c])return;
  revealed[r][c]=true;
  const cell=getCell(r,c);
  cell.className='cell revealed';
  if(board[r][c]>0){cell.textContent=board[r][c];cell.classList.add('c'+board[r][c]);}
  else if(board[r][c]===0){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)reveal(r+dr,c+dc);}
}

function toggleFlag(r,c){
  if(gameOver||revealed[r][c])return;
  flagged[r][c]=!flagged[r][c];
  const cell=getCell(r,c);
  cell.className=flagged[r][c]?'cell hidden flagged':'cell hidden';
  let flags=0;for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++)if(flagged[i][j])flags++;
  document.getElementById('mines').textContent=MINES-flags;
}

function lose(r,c){
  gameOver=true;clearInterval(timerInt);
  const cell=getCell(r,c);cell.className='cell mine';cell.textContent='💥';
  for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++){
    if(board[i][j]===-1&&!flagged[i][j]){const m=getCell(i,j);m.className='cell mine';m.textContent='💣';}
  }
  document.getElementById('msg').textContent='💥 Game Over! Tap New Game to retry.';
}

function checkWin(){
  let unrevealed=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(!revealed[r][c])unrevealed++;
  if(unrevealed===MINES){gameOver=true;clearInterval(timerInt);document.getElementById('msg').textContent='🎉 You Win! Time: '+timer+'s';}
}

function setMode(m){
  mode=m;
  document.getElementById('digBtn').className='mode-btn'+(m==='dig'?' active':'');
  document.getElementById('flagBtn').className='mode-btn'+(m==='flag'?' active':'');
}

init();
</script>
<script>
(function(){function z(){document.body.style.zoom=1;var w=Math.max(document.documentElement.scrollWidth,320);var h=Math.max(document.documentElement.scrollHeight,320);var s=Math.min((innerWidth-12)/w,(innerHeight-12)/h,1.85);if(s>1.05)document.body.style.zoom=s;else document.body.style.zoom=1}z();addEventListener('resize',z)})();
</script>
</body>
</html>
