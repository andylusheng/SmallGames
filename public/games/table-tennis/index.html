<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Table Tennis</title>
<style>
*{margin:0;padding:0}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;overflow:hidden}
#ui{color:#fff;margin-bottom:6px;font-size:16px}
#ui span{color:#4fc3f7;font-weight:bold}
canvas{border-radius:8px;touch-action:none}
#msg{color:#aaa;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div id="ui">You: <span id="p1">0</span> | CPU: <span id="p2">0</span> | First to 7 wins!</div>
<canvas id="c"></canvas>
<div id="msg">Move up/down to hit the ball! (Touch drag or ↑↓)</div>
<script>
const W=Math.min(860,innerWidth-16),H=Math.min(640,innerHeight-100);
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');
let s1=0,s2=0,gameOver=false;
const padH=50,padW=8;
const p1={x:15,y:H/2-padH/2,vy:0};
const p2={x:W-15-padW,y:H/2-padH/2,vy:0};
const ball={x:W/2,y:H/2,vx:4,vy:2,r:6};
let keys={};
document.addEventListener('keydown',e=>keys[e.key]=true);
document.addEventListener('keyup',e=>keys[e.key]=false);
let touchY=null;
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();touchY=e.clientY-r.top});
cv.addEventListener('pointermove',e=>{if(touchY!==null){const r=cv.getBoundingClientRect();touchY=e.clientY-r.top}});
cv.addEventListener('pointerup',()=>touchY=null);
function resetBall(dir){ball.x=W/2;ball.y=H/2;ball.vx=4*dir;ball.vy=(Math.random()-0.5)*4}
function loop(){
  if(gameOver)return;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0f3460';ctx.fillRect(0,0,W,H);
  // Center line
  ctx.setLineDash([8,8]);ctx.strokeStyle='#ffffff33';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
  // Player input
  if(keys['ArrowUp'])p1.y-=6;
  if(keys['ArrowDown'])p1.y+=6;
  if(touchY!==null)p1.y+=(touchY-padH/2-p1.y)*0.3;
  p1.y=Math.max(0,Math.min(H-padH,p1.y));
  // AI
  const aiTarget=ball.y-padH/2;
  p2.y+=(aiTarget-p2.y)*0.06;
  p2.y=Math.max(0,Math.min(H-padH,p2.y));
  // Ball
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.y<ball.r||ball.y>H-ball.r)ball.vy*=-1;
  // Paddle collision
  if(ball.x-ball.r<p1.x+padW&&ball.y>p1.y&&ball.y<p1.y+padH&&ball.vx<0){
    ball.vx=Math.abs(ball.vx)*1.05;
    ball.vy+=(ball.y-(p1.y+padH/2))*0.15;
  }
  if(ball.x+ball.r>p2.x&&ball.y>p2.y&&ball.y<p2.y+padH&&ball.vx>0){
    ball.vx=-Math.abs(ball.vx)*1.05;
    ball.vy+=(ball.y-(p2.y+padH/2))*0.15;
  }
  // Score
  if(ball.x<0){s2++;document.getElementById('p2').textContent=s2;checkWin();resetBall(1)}
  if(ball.x>W){s1++;document.getElementById('p1').textContent=s1;checkWin();resetBall(-1)}
  // Draw paddles
  ctx.fillStyle='#4fc3f7';ctx.fillRect(p1.x,p1.y,padW,padH);
  ctx.fillStyle='#e94560';ctx.fillRect(p2.x,p2.y,padW,padH);
  // Draw ball
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  requestAnimationFrame(loop);
}
function checkWin(){
  if(s1>=7||s2>=7){
    gameOver=true;
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText(s1>=7?'YOU WIN! 🏆':'CPU WINS!',W/2,H/2-10);
    ctx.font='14px Arial';ctx.fillStyle='#4fc3f7';ctx.fillText('Tap to play again',W/2,H/2+25);
    cv.addEventListener('pointerdown',restart,{once:true});
  }
}
function restart(){s1=0;s2=0;gameOver=false;document.getElementById('p1').textContent=0;document.getElementById('p2').textContent=0;resetBall(1);loop()}
loop();
</script>
</body>
</html>
