<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Brick Breaker</title>
<style>
*{margin:0;padding:0}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;overflow:hidden}
#ui{color:#fff;margin-bottom:6px;font-size:16px}
#ui span{color:#4fc3f7;font-weight:bold}
canvas{border-radius:8px;border:2px solid #0f3460;touch-action:none}
#msg{color:#aaa;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div id="ui">Score: <span id="sc">0</span> | Lives: <span id="lv">3</span> | Level: <span id="ll">1</span></div>
<canvas id="c"></canvas>
<div id="msg">Move mouse/touch to control paddle • Break all bricks!</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=Math.min(860,innerWidth-16),H=Math.min(640,innerHeight-80);
cv.width=W;cv.height=H;
let paddle,ball,bricks,score,lives,level,gameOver,launched,particles;
const COLORS=['#e94560','#ff9800','#ffc107','#4caf50','#4fc3f7','#9c27b0'];
function initLevel(){
  paddle={x:W/2-35,y:H-30,w:70,h:12};
  ball={x:W/2,y:H-45,r:7,vx:3*(Math.random()>0.5?1:-1),vy:-4};
  launched=false;gameOver=false;particles=[];
  bricks=[];
  const rows=3+level,cols=7;
  const bw=(W-20)/cols,bh=18;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const hp=r<2?2:1;
      bricks.push({x:10+c*bw,y:40+r*(bh+4),w:bw-4,h:bh,hp,maxHp:hp,color:COLORS[r%COLORS.length]});
    }
  }
  updateUI();
}
function init(){score=0;lives=3;level=1;initLevel();}
function updateUI(){
  document.getElementById('sc').textContent=score;
  document.getElementById('lv').textContent=lives;
  document.getElementById('ll').textContent=level;
}
function update(){
  if(gameOver)return;
  if(!launched){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;return;}
  ball.x+=ball.vx;ball.y+=ball.vy;
  // walls
  if(ball.x<ball.r||ball.x>W-ball.r)ball.vx*=-1;
  if(ball.y<ball.r)ball.vy*=-1;
  // bottom
  if(ball.y>H+10){
    lives--;updateUI();
    if(lives<=0){gameOver=true;return;}
    launched=false;
    ball.vx=3*(Math.random()>0.5?1:-1);ball.vy=-4;
    return;
  }
  // paddle
  if(ball.y+ball.r>paddle.y&&ball.y<paddle.y+paddle.h&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w){
    ball.vy=-Math.abs(ball.vy);
    const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
    ball.vx=hit*5;
  }
  // bricks
  for(let i=bricks.length-1;i>=0;i--){
    const b=bricks[i];
    if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
      ball.vy*=-1;b.hp--;
      if(b.hp<=0){
        bricks.splice(i,1);score+=10;updateUI();
        for(let p=0;p<5;p++)particles.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:20,color:b.color});
      }
      break;
    }
  }
  // speed up
  const spd=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
  const maxSpd=6+level;
  if(spd>maxSpd){ball.vx*=maxSpd/spd;ball.vy*=maxSpd/spd;}
  for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.life--;}
  particles=particles.filter(p=>p.life>0);
  if(bricks.length===0){level++;initLevel();}
}
function draw(){
  ctx.fillStyle='#16213e';ctx.fillRect(0,0,W,H);
  // bricks
  for(let b of bricks){
    ctx.fillStyle=b.hp<b.maxHp?b.color+'88':b.color;
    ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,4);ctx.fill();
    if(b.hp>1){ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillRect(b.x+2,b.y+2,b.w-4,4);}
  }
  // paddle
  ctx.fillStyle='#4fc3f7';
  ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,6);ctx.fill();
  // ball
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fillStyle='#fff';ctx.fill();
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r+3,0,Math.PI*2);
  ctx.strokeStyle='#4fc3f744';ctx.lineWidth=2;ctx.stroke();
  // particles
  for(let p of particles){
    ctx.globalAlpha=p.life/20;ctx.fillStyle=p.color;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
  if(!launched&&!gameOver){
    ctx.fillStyle='#aaa';ctx.font='14px Arial';ctx.textAlign='center';
    ctx.fillText('Tap or Space to launch',W/2,H/2);
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e94560';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText('GAME OVER',W/2,H/2-15);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText('Score: '+score+' | Tap to retry',W/2,H/2+20);
  }
}
function loop(){update();draw();requestAnimationFrame(loop);}
cv.addEventListener('pointermove',e=>{
  const r=cv.getBoundingClientRect();
  paddle.x=Math.max(0,Math.min(W-paddle.w,e.clientX-r.left-paddle.w/2));
});
cv.addEventListener('pointerdown',e=>{
  if(gameOver){init();return;}
  if(!launched)launched=true;
});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(gameOver){init();return;}if(!launched)launched=true;}
  if(e.code==='ArrowLeft')paddle.x=Math.max(0,paddle.x-25);
  if(e.code==='ArrowRight')paddle.x=Math.min(W-paddle.w,paddle.x+25);
});
init();loop();
</script>
</body>
</html>
