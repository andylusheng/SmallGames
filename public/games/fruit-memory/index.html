<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fruit Memory</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;padding:10px}
h1{color:#fff;font-size:20px;margin-bottom:6px}
.hud{display:flex;gap:16px;margin-bottom:12px;color:#fff;font-size:14px}
.hud span{color:#4fc3f7;font-weight:bold}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;width:88vw}
.card{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;transition:transform .3s,background .3s;user-select:none;background:#0f3460;position:relative}
.card.flipped{background:#16213e;transform:rotateY(180deg)}
.card.matched{background:#1b5e20;transform:scale(0.95);opacity:0.8}
.card .face{display:none}
.card.flipped .face,.card.matched .face{display:block}
.card .back{position:absolute;font-size:22px}
.card.flipped .back,.card.matched .back{display:none}
#win{display:none;color:#4caf50;font-size:20px;font-weight:bold;margin-top:12px}
#restart{margin-top:12px;padding:8px 20px;border:none;border-radius:8px;background:#4fc3f7;color:#1a1a2e;font-weight:bold;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<h1>🍉 Fruit Memory</h1>
<div class="hud">Moves: <span id="mv">0</span> | Pairs: <span id="pr">0</span>/8</div>
<div id="board"></div>
<div id="win">🎉 You Win!</div>
<button id="restart">New Game</button>
<script>
const FRUITS=['🍎','🍊','🍋','🍇','🍓','🍑','🥝','🍌'];
let cards,flipped,matched,moves,locked;
const boardEl=document.getElementById('board');
function init(){
  const pairs=[...FRUITS,...FRUITS];
  // shuffle
  for(let i=pairs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pairs[i],pairs[j]]=[pairs[j],pairs[i]];}
  cards=pairs;flipped=[];matched=new Set();moves=0;locked=false;
  document.getElementById('mv').textContent=0;
  document.getElementById('pr').textContent=0;
  document.getElementById('win').style.display='none';
  render();
}
function render(){
  boardEl.innerHTML='';
  cards.forEach((fruit,i)=>{
    const div=document.createElement('div');
    div.className='card'+(flipped.includes(i)||matched.has(i)?' flipped':'')+(matched.has(i)?' matched':'');
    div.innerHTML=`<span class="face">${fruit}</span><span class="back">❓</span>`;
    div.addEventListener('click',()=>flip(i));
    boardEl.appendChild(div);
  });
}
function flip(i){
  if(locked||flipped.includes(i)||matched.has(i))return;
  flipped.push(i);
  render();
  if(flipped.length===2){
    moves++;
    document.getElementById('mv').textContent=moves;
    locked=true;
    const[a,b]=flipped;
    if(cards[a]===cards[b]){
      matched.add(a);matched.add(b);
      flipped=[];locked=false;
      document.getElementById('pr').textContent=matched.size/2;
      render();
      if(matched.size===cards.length){
        document.getElementById('win').style.display='block';
      }
    }else{
      setTimeout(()=>{flipped=[];locked=false;render();},800);
    }
  }
}
document.getElementById('restart').addEventListener('click',init);
init();
</script>
<script>
(function(){function z(){document.body.style.zoom=1;var w=Math.max(document.documentElement.scrollWidth,320);var h=Math.max(document.documentElement.scrollHeight,320);var s=Math.min((innerWidth-12)/w,(innerHeight-12)/h,1.85);if(s>1.05)document.body.style.zoom=s;else document.body.style.zoom=1}z();addEventListener('resize',z)})();
</script>
</body>
</html>
