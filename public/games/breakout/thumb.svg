<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#1a1a2e"/>
  <!-- Bricks -->
  <g>
    <rect x="60" y="40" width="55" height="18" rx="2" fill="#ef5350"/>
    <rect x="120" y="40" width="55" height="18" rx="2" fill="#ef5350"/>
    <rect x="180" y="40" width="55" height="18" rx="2" fill="#ef5350"/>
    <rect x="240" y="40" width="55" height="18" rx="2" fill="#ef5350"/>
    <rect x="300" y="40" width="55" height="18" rx="2" fill="#ef5350"/>
    <rect x="60" y="62" width="55" height="18" rx="2" fill="#ff9800"/>
    <rect x="120" y="62" width="55" height="18" rx="2" fill="#ff9800"/>
    <rect x="180" y="62" width="55" height="18" rx="2" fill="#ff9800"/>
    <rect x="240" y="62" width="55" height="18" rx="2" fill="#ff9800"/>
    <rect x="300" y="62" width="55" height="18" rx="2" fill="#ff9800"/>
    <rect x="60" y="84" width="55" height="18" rx="2" fill="#ffeb3b"/>
    <rect x="120" y="84" width="55" height="18" rx="2" fill="#ffeb3b"/>
    <rect x="240" y="84" width="55" height="18" rx="2" fill="#ffeb3b"/>
    <rect x="300" y="84" width="55" height="18" rx="2" fill="#ffeb3b"/>
    <rect x="60" y="106" width="55" height="18" rx="2" fill="#4caf50"/>
    <rect x="120" y="106" width="55" height="18" rx="2" fill="#4caf50"/>
    <rect x="300" y="106" width="55" height="18" rx="2" fill="#4caf50"/>
    <rect x="60" y="128" width="55" height="18" rx="2" fill="#2196f3"/>
    <rect x="300" y="128" width="55" height="18" rx="2" fill="#2196f3"/>
  </g>
  <!-- Ball -->
  <circle cx="200" cy="180" r="8" fill="#fff"/>
  <circle cx="197" cy="177" r="3" fill="#ddd"/>
  <!-- Ball trail -->
  <circle cx="210" cy="195" r="4" fill="#fff" opacity=".3"/>
  <circle cx="218" cy="208" r="3" fill="#fff" opacity=".2"/>
  <!-- Paddle -->
  <rect x="160" y="260" width="80" height="12" rx="6" fill="#6366f1"/>
  <rect x="165" y="262" width="70" height="4" rx="2" fill="#818cf8" opacity=".5"/>
  <!-- Breaking effect -->
  <rect x="180" y="84" width="55" height="18" rx="2" fill="none" stroke="#ffeb3b" stroke-width="1" stroke-dasharray="4,3" opacity=".5"/>
  <line x1="195" y1="88" x2="190" y2="78" stroke="#ffeb3b" stroke-width="1.5" opacity=".6"/>
  <line x1="210" y1="86" x2="215" y2="76" stroke="#ffeb3b" stroke-width="1.5" opacity=".6"/>
  <line x1="220" y1="90" x2="228" y2="82" stroke="#ffeb3b" stroke-width="1.5" opacity=".6"/>
</svg>
