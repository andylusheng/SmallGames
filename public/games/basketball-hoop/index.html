<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hoop Master</title>
<style>
*{margin:0;padding:0}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;overflow:hidden}
#ui{color:#fff;margin-bottom:6px;font-size:16px}
#ui span{color:#4fc3f7;font-weight:bold}
canvas{border-radius:8px;touch-action:none}
#msg{color:#aaa;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div id="ui">Score: <span id="sc">0</span> | Streak: <span id="st">0</span> | Best: <span id="bs">0</span></div>
<canvas id="c"></canvas>
<div id="msg">Drag from ball to aim & shoot! Hoop moves faster as you score!</div>
<script>
const W=Math.min(860,innerWidth-16),H=Math.min(640,innerHeight-80);
const c=document.getElementById('c');c.width=W;c.height=H;
const ctx=c.getContext('2d');
let score=0,streak=0,ball=null,hoop={x:W/2,y:100,w:60,dir:1,speed:1},dragging=false,dragStart=null,particles=[],gameOver=false,misses=0,best=+localStorage.getItem('hoop-master-best')||0;
document.getElementById('bs').textContent=best;
const ballStart={x:W/2,y:H-60};
c.addEventListener('pointerdown',e=>{if(gameOver){reset();return;}if(ball)return;const r=c.getBoundingClientRect();dragging=true;dragStart={x:e.clientX-r.left,y:e.clientY-r.top};});
c.addEventListener('pointermove',e=>{if(!dragging)return;});
c.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;const r=c.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;const dx=dragStart.x-mx,dy=dragStart.y-my;const power=Math.min(Math.hypot(dx,dy),150);if(power<10)return;const angle=Math.atan2(dy,dx);ball={x:ballStart.x,y:ballStart.y,vx:Math.cos(angle)*power*0.09,vy:Math.sin(angle)*power*0.09,scored:false};});
function reset(){score=0;streak=0;misses=0;ball=null;gameOver=false;hoop.speed=1;document.getElementById('sc').textContent=0;document.getElementById('st').textContent=0;}
function update(){if(gameOver)return;
hoop.x+=hoop.dir*hoop.speed;if(hoop.x>W-hoop.w/2||hoop.x<hoop.w/2)hoop.dir*=-1;
if(ball){ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=0.2;
if(!ball.scored&&ball.vy>0&&Math.abs(ball.y-hoop.y)<8&&Math.abs(ball.x-hoop.x)<hoop.w/2-5){ball.scored=true;score+=10+streak*2;streak++;document.getElementById('sc').textContent=score;document.getElementById('st').textContent=streak;hoop.speed=1+score*0.02;for(let p=0;p<8;p++)particles.push({x:ball.x,y:ball.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:20,color:'#ffc107'});if(score>best){best=score;localStorage.setItem('hoop-master-best',best);document.getElementById('bs').textContent=best;}}
if(ball.y>H+20){if(!ball.scored){streak=0;misses++;document.getElementById('st').textContent=0;if(misses>=5)gameOver=true;}ball=null;}}
particles.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)particles.splice(i,1);});}
function draw(){ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#e94560';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(hoop.x-hoop.w/2,hoop.y);ctx.lineTo(hoop.x+hoop.w/2,hoop.y);ctx.stroke();ctx.lineWidth=1;
ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(hoop.x-hoop.w/2,hoop.y);ctx.lineTo(hoop.x-hoop.w/2+5,hoop.y+25);ctx.moveTo(hoop.x+hoop.w/2,hoop.y);ctx.lineTo(hoop.x+hoop.w/2-5,hoop.y+25);ctx.stroke();
for(let i=0;i<4;i++){ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.moveTo(hoop.x-hoop.w/2+8+i*12,hoop.y);ctx.lineTo(hoop.x-hoop.w/2+12+i*10,hoop.y+25);ctx.stroke();}
ctx.fillStyle='#546e7a';ctx.fillRect(hoop.x+hoop.w/2,hoop.y-40,6,80);
if(!ball){ctx.beginPath();ctx.arc(ballStart.x,ballStart.y,14,0,Math.PI*2);ctx.fillStyle='#ff9800';ctx.fill();ctx.strokeStyle='#e65100';ctx.lineWidth=1.5;ctx.stroke();ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(ballStart.x-14,ballStart.y);ctx.lineTo(ballStart.x+14,ballStart.y);ctx.moveTo(ballStart.x,ballStart.y-14);ctx.lineTo(ballStart.x,ballStart.y+14);ctx.stroke();}
if(ball){ctx.beginPath();ctx.arc(ball.x,ball.y,12,0,Math.PI*2);ctx.fillStyle='#ff9800';ctx.fill();ctx.strokeStyle='#e65100';ctx.stroke();}
if(dragging){ctx.strokeStyle='rgba(79,195,247,0.5)';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(ballStart.x,ballStart.y);ctx.lineTo(ballStart.x,ballStart.y-40);ctx.stroke();ctx.setLineDash([]);}
particles.forEach(p=>{ctx.globalAlpha=p.life/20;ctx.fillStyle=p.color;ctx.fillRect(p.x-3,p.y-3,6,6);ctx.globalAlpha=1;});
ctx.fillStyle='#aaa';ctx.font='12px Arial';ctx.textAlign='center';ctx.fillText('Misses: '+misses+'/5',W/2,H-15);
if(gameOver){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#e94560';ctx.font='bold 28px Arial';ctx.fillText('GAME OVER',W/2,H/2-20);ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.fillText('Score: '+score+' | Tap to retry',W/2,H/2+20);}}
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
