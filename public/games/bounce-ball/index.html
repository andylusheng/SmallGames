<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bounce Ball</title>
<style>
*{margin:0;padding:0}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;overflow:hidden}
#ui{color:#fff;margin-bottom:6px;font-size:16px}
#ui span{color:#4fc3f7;font-weight:bold}
canvas{border-radius:8px;border:2px solid #0f3460;touch-action:none}
#msg{color:#aaa;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div id="ui">Level: <span id="lv">1</span> | Score: <span id="sc">0</span></div>
<canvas id="c"></canvas>
<div id="msg">Tap/Click to bounce • Reach the green portal!</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=Math.min(860,innerWidth-16),H=Math.min(640,innerHeight-80);
cv.width=W;cv.height=H;
let ball,platforms,portal,level=1,score=0,gameOver=false,started=false;
function initLevel(){
  ball={x:40,y:H-60,vy:0,r:10,onGround:false};
  platforms=[];
  const count=4+level;
  for(let i=0;i<count;i++){
    platforms.push({x:30+Math.random()*(W-100),y:H-100-i*(H-120)/count,w:60+Math.random()*40,h:10});
  }
  platforms.push({x:20,y:H-30,w:80,h:10});
  portal={x:W/2-15+Math.random()*30,y:30,w:30,h:30};
  gameOver=false;started=false;
  document.getElementById('lv').textContent=level;
}
function update(){
  if(!started||gameOver)return;
  ball.vy+=0.4;
  ball.y+=ball.vy;
  ball.onGround=false;
  for(let p of platforms){
    if(ball.vy>0&&ball.y+ball.r>p.y&&ball.y+ball.r<p.y+p.h+8&&ball.x>p.x-5&&ball.x<p.x+p.w+5){
      ball.y=p.y-ball.r;ball.vy=0;ball.onGround=true;
    }
  }
  if(ball.y>H+20){gameOver=true;}
  if(ball.x<ball.r)ball.x=ball.r;
  if(ball.x>W-ball.r)ball.x=W-ball.r;
  // portal check
  if(ball.x>portal.x&&ball.x<portal.x+portal.w&&ball.y>portal.y&&ball.y<portal.y+portal.h){
    score+=level*10;level++;
    document.getElementById('sc').textContent=score;
    initLevel();started=true;
  }
}
function draw(){
  ctx.fillStyle='#16213e';ctx.fillRect(0,0,W,H);
  // platforms
  for(let p of platforms){
    ctx.fillStyle='#4fc3f7';
    ctx.beginPath();ctx.roundRect(p.x,p.y,p.w,p.h,5);ctx.fill();
  }
  // portal
  ctx.fillStyle='#4caf50';
  ctx.beginPath();ctx.roundRect(portal.x,portal.y,portal.w,portal.h,8);ctx.fill();
  ctx.fillStyle='#81c784';ctx.font='16px Arial';ctx.textAlign='center';
  ctx.fillText('🚪',portal.x+15,portal.y+22);
  // ball
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fillStyle='#ff9800';ctx.fill();
  ctx.beginPath();ctx.arc(ball.x-3,ball.y-3,3,0,Math.PI*2);
  ctx.fillStyle='#ffe0b2';ctx.fill();
  if(!started&&!gameOver){
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText('TAP TO START',W/2,H/2);
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e94560';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText('FELL OFF!',W/2,H/2-12);
    ctx.fillStyle='#fff';ctx.font='15px Arial';
    ctx.fillText('Score: '+score+' | Tap to retry',W/2,H/2+18);
  }
}
function jump(){
  if(!started){started=true;}
  if(gameOver){level=1;score=0;document.getElementById('sc').textContent=0;initLevel();started=true;return;}
  if(ball.onGround)ball.vy=-10;
}
function loop(){update();draw();requestAnimationFrame(loop);}
cv.addEventListener('pointerdown',e=>{e.preventDefault();jump();});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump();}});
// tilt/mouse move for horizontal
cv.addEventListener('pointermove',e=>{
  if(!started||gameOver)return;
  const r=cv.getBoundingClientRect();
  ball.x=e.clientX-r.left;
});
initLevel();loop();
</script>
</body>
</html>
