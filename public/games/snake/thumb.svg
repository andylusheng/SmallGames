<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#1a1a2e"/>
  <!-- Grid -->
  <g stroke="#333" stroke-width="1" opacity=".3">
    <line x1="100" y1="50" x2="100" y2="250"/><line x1="130" y1="50" x2="130" y2="250"/>
    <line x1="160" y1="50" x2="160" y2="250"/><line x1="190" y1="50" x2="190" y2="250"/>
    <line x1="220" y1="50" x2="220" y2="250"/><line x1="250" y1="50" x2="250" y2="250"/>
    <line x1="280" y1="50" x2="280" y2="250"/><line x1="310" y1="50" x2="310" y2="250"/>
    <line x1="100" y1="50" x2="310" y2="50"/><line x1="100" y1="80" x2="310" y2="80"/>
    <line x1="100" y1="110" x2="310" y2="110"/><line x1="100" y1="140" x2="310" y2="140"/>
    <line x1="100" y1="170" x2="310" y2="170"/><line x1="100" y1="200" x2="310" y2="200"/>
    <line x1="100" y1="230" x2="310" y2="230"/>
  </g>
  <!-- Snake body -->
  <g fill="#4caf50">
    <rect x="160" y="140" width="28" height="28" rx="4"/>
    <rect x="190" y="140" width="28" height="28" rx="4"/>
    <rect x="220" y="140" width="28" height="28" rx="4"/>
    <rect x="220" y="110" width="28" height="28" rx="4"/>
    <rect x="220" y="80" width="28" height="28" rx="4"/>
    <rect x="250" y="80" width="28" height="28" rx="4"/>
  </g>
  <!-- Snake head -->
  <rect x="280" y="80" width="28" height="28" rx="6" fill="#66bb6a"/>
  <circle cx="290" cy="88" r="3" fill="#fff"/>
  <circle cx="300" cy="88" r="3" fill="#fff"/>
  <circle cx="290" cy="88" r="1.5" fill="#333"/>
  <circle cx="300" cy="88" r="1.5" fill="#333"/>
  <!-- Food -->
  <circle cx="145" cy="195" r="10" fill="#ef5350"/>
  <path d="M145,185 Q148,180 150,185" stroke="#4caf50" stroke-width="2" fill="none"/>
  <!-- Score -->
  <text x="110" y="275" font-family="Arial" font-size="14" fill="#888">Score: 50</text>
</svg>
