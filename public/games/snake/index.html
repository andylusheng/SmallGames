<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
*{margin:0;padding:0}body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif}
#ui{color:#fff;margin-bottom:10px;font-size:16px}
canvas{border:2px solid #333;border-radius:4px;background:#16213e}
#msg{color:#aaa;margin-top:10px;font-size:14px}
</style>
</head>
<body>
<div id="ui">Score: <span id="sc">0</span> | Best: <span id="bs">0</span></div>
<canvas id="c"></canvas>
<div id="msg">Arrow keys / WASD / Swipe to move</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const COLS=20,ROWS=20,S=Math.max(20,Math.floor(Math.min((innerWidth-16)/COLS,(innerHeight-100)/ROWS)));
c.width=COLS*S;c.height=ROWS*S;
let snake,dir,food,score=0,best=0,running=false,speed,interval;

function init(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};score=0;speed=120;
  document.getElementById('sc').textContent='0';
  placeFood();running=true;
  clearInterval(interval);interval=setInterval(update,speed);
}
function placeFood(){
  do{food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}
function update(){
  if(!running)return;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){
    running=false;best=Math.max(best,score);
    document.getElementById('bs').textContent=best;
    clearInterval(interval);return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10;document.getElementById('sc').textContent=score;
    placeFood();
    if(speed>60){speed-=2;clearInterval(interval);interval=setInterval(update,speed)}
  }else{snake.pop()}
  draw();
}
function draw(){
  x.fillStyle='#16213e';x.fillRect(0,0,c.width,c.height);
  // grid
  x.strokeStyle='rgba(255,255,255,.03)';
  for(let i=0;i<COLS;i++)for(let j=0;j<ROWS;j++)x.strokeRect(i*S,j*S,S,S);
  // food
  x.fillStyle='#ff6b6b';x.beginPath();x.arc(food.x*S+S/2,food.y*S+S/2,S/2-2,0,7);x.fill();
  // snake
  snake.forEach((s,i)=>{
    x.fillStyle=i===0?'#4ade80':'#22c55e';
    x.fillRect(s.x*S+1,s.y*S+1,S-2,S-2);
    if(i===0){x.fillStyle='#166534';x.fillRect(s.x*S+4,s.y*S+4,4,4);x.fillRect(s.x*S+S-8,s.y*S+4,4,4)}
  });
  if(!running&&score>0){
    x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,c.width,c.height);
    x.fillStyle='#fff';x.font='bold 24px Arial';x.textAlign='center';
    x.fillText('Game Over!',c.width/2,c.height/2-10);
    x.font='16px Arial';x.fillText('Score: '+score,c.width/2,c.height/2+20);
    x.fillText('Press Space to restart',c.width/2,c.height/2+50);
  }
  if(!running&&score===0){
    x.fillStyle='#fff';x.font='bold 20px Arial';x.textAlign='center';
    x.fillText('🐍 Snake',c.width/2,c.height/2-10);
    x.font='14px Arial';x.fillText('Press Space to start',c.width/2,c.height/2+20);
  }
}
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();if(!running)init();return}
  if(!running)return;
  if((k==='arrowup'||k==='w')&&dir.y!==1)dir={x:0,y:-1};
  if((k==='arrowdown'||k==='s')&&dir.y!==-1)dir={x:0,y:1};
  if((k==='arrowleft'||k==='a')&&dir.x!==1)dir={x:-1,y:0};
  if((k==='arrowright'||k==='d')&&dir.x!==-1)dir={x:1,y:0};
});
let tx,ty;
c.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;if(!running)init()});
c.addEventListener('touchmove',e=>{e.preventDefault()});
c.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&dir.x!==-1)dir={x:1,y:0};else if(dx<0&&dir.x!==1)dir={x:-1,y:0}}
  else{if(dy>0&&dir.y!==-1)dir={x:0,y:1};else if(dy<0&&dir.y!==1)dir={x:0,y:-1}}
});
draw();
</script>
</body>
</html>
