<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Screw Sort Master</title><link rel="stylesheet" href="/games/_color-puzzle/core.css"><style>
.board-card{padding:9px;background:linear-gradient(180deg,#1d3b65,#102541 28%,#ead6b7 28%);border-color:#55769d}.trays{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:8px;position:relative;z-index:10}.tray{--c:#3f8cff;height:68px;border-radius:14px;background:linear-gradient(180deg,#f9fcff,#dce7ef);border:2px solid #b9c9d5;box-shadow:0 5px 11px #07172a4a,inset 0 1px #fff;display:flex;align-items:flex-end;justify-content:center;padding:5px;position:relative}.tray:before{content:"";position:absolute;left:5px;right:5px;top:6px;height:34px;border-radius:9px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 20%,#fff),#f4f8fb);border:2px solid color-mix(in srgb,var(--c) 45%,#9babb7);box-shadow:inset 0 2px #fff}.slots{position:absolute;top:13px;z-index:2;display:grid;grid-template-columns:repeat(2,14px);gap:3px}.slots i{width:14px;height:14px;border-radius:50%;background:#dce6ef;border:2px solid #94a8b8;box-shadow:inset 0 2px #fff}.slots i.on{background:radial-gradient(circle at 35% 30%,#fff 0 8%,color-mix(in srgb,var(--c) 70%,#fff) 11%,var(--c) 45%,color-mix(in srgb,var(--c) 68%,#22384e));border-color:color-mix(in srgb,var(--c) 60%,#304359)}.tray b{font-size:8px;color:#5d7286;position:relative;z-index:2}.bench{height:470px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(90deg,#a7774f,#c69a6e 30%,#aa754c 60%,#c29167);border:8px solid #825536;box-shadow:inset 0 0 0 3px #d5ad83,inset 0 12px 28px #fff2,0 14px 25px #030b1455}.bench:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(7deg,transparent 0 33px,#704b2a29 34px 36px,transparent 37px 70px),linear-gradient(90deg,#fff1,transparent 30%,#00000010 70%,#fff1)}.plate{position:absolute;background:linear-gradient(145deg,#f4f6f8,#c9d2d8 42%,#919fa9 72%,#6c7781);box-shadow:inset 0 5px #fff9,inset 0 -7px #4f596355,0 10px 9px #30201866;border:3px solid #707a83}.plate:after{content:"";position:absolute;inset:7px;border:1px solid #ffffff55;border-radius:inherit}.p0{left:6%;top:15%;width:70%;height:45%;border-radius:38% 18% 34% 22%;transform:rotate(-6deg)}.p1{right:6%;top:20%;width:58%;height:46%;border-radius:22% 38% 20% 36%;transform:rotate(8deg)}.p2{left:18%;bottom:8%;width:67%;height:39%;border-radius:22% 28% 38% 24%}.p3{left:33%;top:7%;width:38%;height:30%;border-radius:24% 34% 30% 20%;transform:rotate(2deg);background:linear-gradient(145deg,#f8e0a9,#d9b565 55%,#ad873b)}.screw{--c:#3f8cff;position:absolute;width:42px;height:42px;border-radius:50%;border:4px solid color-mix(in srgb,var(--c) 62%,#263b4f);background:radial-gradient(circle at 34% 26%,#fff 0 6%,color-mix(in srgb,var(--c) 70%,#fff) 8%,var(--c) 38%,color-mix(in srgb,var(--c) 68%,#1e3043) 77%);box-shadow:inset 0 0 0 3px #fff3,inset 0 -5px #0002,0 4px 0 color-mix(in srgb,var(--c) 40%,#23384c),0 8px 8px #24170f66;cursor:pointer;z-index:8;transition:filter .15s}.screw:before,.screw:after{content:"";position:absolute;left:9px;right:9px;top:15px;height:5px;border-radius:5px;background:#263f56;box-shadow:0 1px #fff4}.screw:after{transform:rotate(90deg)}.screw.blocked{filter:grayscale(.25) brightness(.72)}.screw.blocked span{display:grid}.screw span{display:none;position:absolute;right:-7px;top:-9px;width:19px;height:19px;border-radius:50%;place-items:center;background:linear-gradient(#7dc8ff,#2e6cae);color:#fff;font-size:9px;border:2px solid #fff;z-index:5;box-shadow:0 2px 5px #16293c66}.screw.out{animation:out .48s ease forwards}@keyframes out{25%{transform:rotate(120deg) translateY(-8px)}70%{transform:rotate(300deg) translateY(-55px) scale(.7)}100%{transform:rotate(430deg) translateY(-115px) scale(.2);opacity:0}}.combo{position:absolute;right:12px;bottom:10px;padding:7px 10px;background:linear-gradient(#fffbe7,#f8d98c);color:#9d5f11;border:2px solid #d8a84d;border-radius:12px;font-weight:1000;font-size:10px;z-index:20;box-shadow:0 4px 10px #3e291755}.plate-label{position:absolute;left:12px;bottom:10px;z-index:4;font-size:8px;font-weight:1000;color:#5b3f2b;background:#fff8dcaa;padding:5px 8px;border-radius:999px;border:1px solid #c59b69}
</style></head><body><main class="game-shell"><div class="topbar"><div class="brand">Screw <span>Sort Master</span></div><div class="level-pill">LEVEL <span id="level">1</span></div><div class="top-actions"><button class="icon-btn" id="sound">🔊</button><button class="icon-btn" id="restart">↻</button></div></div><div class="stats"><div class="stat"><small>Moves</small><b id="moves">0</b></div><div class="stat"><small>Score</small><b id="score">0</b></div><div class="stat"><small>Best</small><b id="best">0</b></div></div><section class="board-card"><div class="trays" id="trays"></div><div class="bench" id="bench"><div class="plate p0"></div><div class="plate p1"></div><div class="plate p2"></div><div class="plate p3"></div><div class="plate-label">REMOVE TOP SCREWS FIRST</div><div class="combo" id="combo">COMBO ×1</div></div><div class="modal-wrap" id="modal"><div class="modal"><div class="stars">⭐ ⭐ ⭐</div><h2>Panel cleared!</h2><p id="result"></p><div class="modal-actions"><button class="secondary-btn" id="again">Replay</button><button class="primary-btn" id="next">Next Level</button></div></div></div></section><div class="tools"><button class="tool-btn" id="hint"><b>💡</b><span>HINT</span></button><button class="tool-btn" id="free"><b>🔨</b><span>FREE SCREW</span></button><button class="tool-btn" id="shuffle"><b>🔄</b><span>SHUFFLE</span></button></div><div class="game-caption">Remove exposed screws, fill each color tray, and unlock the metal layers below.</div></main><script src="/games/_color-puzzle/core.js"></script><script>
const $=x=>document.getElementById(x),P=ZP.colors,ACTIVE=[4,2,1,0,5],POS=[[12,18,0],[28,18,0],[48,21,0],[17,38,0],[37,43,0],[61,39,0],[16,63,0],[35,70,0],[54,67,0],[72,59,0],[37,11,1],[55,14,1],[72,29,1],[29,31,1],[51,34,1],[69,47,1],[32,56,2],[49,59,2],[64,62,2],[50,24,3]];let level=Math.max(1,ZP.store('screw-sort-level',1)),moves=0,score=0,best=ZP.store('screw-sort-best',0),s=[],counts=[0,0,0,0,0],last=-1,combo=1,busy=false;$('best').textContent=best;function build(){moves=score=0;last=-1;combo=1;counts=[0,0,0,0,0];let colors=ACTIVE.flatMap(c=>[c,c,c,c]).sort(()=>Math.random()-.5);s=POS.map((p,i)=>({id:i,x:p[0],y:p[1],z:p[2],c:colors[i],gone:false}));$('moves').textContent=0;$('score').textContent=0;$('level').textContent=level;$('modal').classList.remove('show');render();ZP.emit('game_start',{game:'screw-sort-master',level})}function blockers(a){return s.filter(b=>!b.gone&&b.z>a.z&&Math.hypot(b.x-a.x,b.y-a.y)<23)}function trayIndex(c){return ACTIVE.indexOf(c)}function render(){$('trays').innerHTML=ACTIVE.map((c,i)=>`<div class="tray" style="--c:${P[c]}"><div class="slots">${[0,1,2,3].map(k=>`<i class="${k<counts[i]?'on':''}"></i>`).join('')}</div><b>${counts[i]}/4</b></div>`).join('');$('bench').querySelectorAll('.screw').forEach(e=>e.remove());s.filter(a=>!a.gone).forEach(a=>{let e=document.createElement('button');e.className='screw'+(blockers(a).length?' blocked':'');e.style.cssText=`--c:${P[a.c]};left:calc(${a.x}% - 21px);top:calc(${a.y}% - 21px);z-index:${8+a.z*4}`;e.innerHTML='<span>❄</span>';e.onclick=()=>pick(a,e);$('bench').appendChild(e)})}function pick(a,e,force=false){if(busy||a.gone)return;if(blockers(a).length&&!force){ZP.sfx('bad');e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),260);return ZP.toast('This screw is still covered')}busy=true;a.gone=true;moves++;let ti=trayIndex(a.c);counts[ti]++;combo=last===a.c?Math.min(8,combo+1):1;last=a.c;score+=100+combo*30;$('moves').textContent=moves;$('score').textContent=score;$('combo').textContent=`COMBO ×${combo}`;e.classList.add('out');ZP.sfx(combo>=3?'clear':'good');ZP.vibrate();setTimeout(()=>{busy=false;render();if(s.every(x=>x.gone))win()},500)}function win(){if(score>best){best=score;ZP.save('screw-sort-best',best);$('best').textContent=best}ZP.save('screw-sort-level',level);ZP.sfx('win');ZP.confetti();$('result').textContent=`${moves} moves · ${score} points`;$('modal').classList.add('show');ZP.emit('game_end',{game:'screw-sort-master',result:'win',level,moves,score})}$('hint').onclick=()=>{let a=s.find(x=>!x.gone&&!blockers(x).length);if(a)ZP.toast('A bright screw on the top layer can be removed now')};$('free').onclick=()=>{let a=s.filter(x=>!x.gone).sort((x,y)=>y.z-x.z)[0];if(a){let live=s.filter(x=>!x.gone),i=live.indexOf(a),e=document.querySelectorAll('.screw')[i];pick(a,e,true)}};$('shuffle').onclick=()=>{let live=s.filter(x=>!x.gone),cs=live.map(x=>x.c).sort(()=>Math.random()-.5);live.forEach((x,i)=>x.c=cs[i]);render();ZP.sfx('tap')};$('restart').onclick=build;$('again').onclick=build;$('next').onclick=()=>{level++;ZP.save('screw-sort-level',level);build()};$('sound').onclick=()=>{$('sound').textContent=ZP.toggleAudio()?'🔊':'🔇'};build();
</script></body></html>
