<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Screw Sort Master</title><link rel="stylesheet" href="/games/_color-puzzle/core.css"><style>
.board-card{padding:12px}.trays{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.tray{position:relative;height:72px;border-radius:15px;border:1px solid color-mix(in srgb,var(--c) 55%,#fff 10%);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 28%,#15283f),#0d1b2d);display:flex;flex-direction:column;align-items:center;justify-content:center}.tray b{font-size:12px}.tray .slots{display:flex;gap:3px;margin-top:7px}.tray i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08)}.tray i.on{background:var(--c);box-shadow:0 0 9px var(--c)}
.plate{position:relative;height:315px;border-radius:24px;border:8px solid #c6a779;background:radial-gradient(circle at 35% 25%,#f5ddb5,#d3ad7c 55%,#9f7449 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.3),inset 0 -18px 45px rgba(89,49,19,.2),0 12px 35px rgba(0,0,0,.25);overflow:hidden}.plate:before{content:"";position:absolute;inset:12px;border:2px dashed rgba(93,57,26,.22);border-radius:17px}
.screw{position:absolute;width:46px;height:46px;border:none;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff8,var(--c) 30%,color-mix(in srgb,var(--c) 72%,#000));box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--c) 55%,#fff),0 6px 9px rgba(0,0,0,.28);cursor:pointer;transition:.18s;z-index:2}.screw:before,.screw:after{content:"";position:absolute;left:11px;right:11px;top:21px;height:4px;border-radius:4px;background:#16304a}.screw:after{transform:rotate(90deg)}.screw.blocked{filter:grayscale(.65) brightness(.72);opacity:.75;cursor:not-allowed}.screw.blocked:after{content:"🔒";left:5px;top:4px;height:auto;background:none;transform:none;font-size:13px}.screw.fly{transform:scale(.25) translateY(-180px);opacity:0}.combo{position:absolute;right:18px;bottom:16px;padding:8px 11px;border-radius:12px;background:#132744bb;border:1px solid #ffffff22;font-weight:900;color:#ffd65a}.hint{color:var(--muted);font-size:11px;text-align:center;margin-top:8px}
@media(max-width:390px){.plate{height:300px}.screw{width:42px;height:42px}.screw:before,.screw:after{left:10px;right:10px;top:19px}}
</style></head><body><main class="game-shell"><div class="topbar"><div class="brand">Screw <span>Sort</span></div><div class="level-pill">LEVEL <span id="level">1</span></div><div class="top-actions"><button class="icon-btn" id="sound">🔊</button><button class="icon-btn" id="restart">↻</button></div></div><div class="stats"><div class="stat"><small>Moves</small><b id="moves">0</b></div><div class="stat"><small>Score</small><b id="score">0</b></div><div class="stat"><small>Best</small><b id="best">0</b></div></div><section class="board-card"><div class="trays" id="trays"></div><div class="plate" id="plate"><div class="combo" id="combo">COMBO ×1</div></div><div class="hint">Tap exposed screws. Matching colors fill the trays.</div><div class="modal-wrap" id="modal"><div class="modal"><div class="stars">⭐ ⭐ ⭐</div><h2>Board cleared!</h2><p id="result"></p><div class="modal-actions"><button class="secondary-btn" id="again">Replay</button><button class="primary-btn" id="next">Next Level</button></div></div></div></section><div class="tools"><button class="tool-btn" id="hint"><b>💡</b><span>HINT</span></button><button class="tool-btn" id="shuffle"><b>🔀</b><span>SHUFFLE</span></button><button class="tool-btn" id="easy"><b>🧲</b><span>FREE ONE</span></button></div></main><script src="/games/_color-puzzle/core.js"></script><script>
const P=ZP.colors;let level=Math.max(1,+localStorage.getItem('screw-sort-level')||1),moves=0,score=0,best=+localStorage.getItem('screw-sort-best')||0,screws=[],counts=[],last=-1,combo=1;const $=id=>document.getElementById(id),plate=$('plate');$('best').textContent=best;
function seeded(n){let x=n*9301+49297;return()=>((x=(x*233280+12345)%2147483647)/2147483647)}
function build(){moves=0;score=0;combo=1;last=-1;$('moves').textContent=0;$('score').textContent=0;$('combo').textContent='COMBO ×1';$('level').textContent=level;$('modal').classList.remove('show');[...plate.querySelectorAll('.screw')].forEach(e=>e.remove());const colorCount=Math.min(4+Math.floor((level-1)/5),6),per=4;counts=Array(colorCount).fill(0);const rnd=seeded(level+17),list=[];for(let c=0;c<colorCount;c++)for(let j=0;j<per;j++)list.push(c);for(let i=list.length-1;i;i--){const j=Math.floor(rnd()*(i+1));[list[i],list[j]]=[list[j],list[i]]}screws=list.map((color,i)=>({id:i,color,x:8+(i%5)*19+(rnd()*5),y:10+Math.floor(i/5)*19+(rnd()*4),z:Math.floor(i/8),gone:false}));renderTrays();renderScrews();ZP.emit('game_start',{game:'screw-sort-master',level})}
function renderTrays(){const t=$('trays');t.style.gridTemplateColumns=`repeat(${counts.length},1fr)`;t.innerHTML=counts.map((n,i)=>`<div class="tray" style="--c:${P[i]}"><b>${n}/4</b><div class="slots">${[0,1,2,3].map(k=>`<i class="${k<n?'on':''}"></i>`).join('')}</div></div>`).join('')}
function blockers(s){return screws.filter(o=>!o.gone&&o.id!==s.id&&o.z>s.z&&Math.hypot(o.x-s.x,o.y-s.y)<16)}
function renderScrews(){screws.forEach(s=>{let el=$('s'+s.id);if(!el){el=document.createElement('button');el.id='s'+s.id;el.className='screw';el.style.cssText=`--c:${P[s.color]};left:${s.x}%;top:${s.y}%;z-index:${3+s.z}`;el.onclick=()=>pick(s);plate.appendChild(el)}el.classList.toggle('blocked',blockers(s).length>0)})}
function pick(s,force=false){if(s.gone)return;if(blockers(s).length&&!force){ZP.sfx('bad');plate.classList.add('shake');setTimeout(()=>plate.classList.remove('shake'),260);ZP.toast('That screw is covered');return}moves++;$('moves').textContent=moves;s.gone=true;counts[s.color]++;if(last===s.color)combo=Math.min(8,combo+1);else combo=1;last=s.color;const add=80+combo*20;score+=add;$('score').textContent=score;$('combo').textContent='COMBO ×'+combo;const el=$('s'+s.id);el.classList.add('fly');ZP.sfx(combo>=3?'clear':'good');ZP.vibrate();setTimeout(()=>el.remove(),180);renderTrays();setTimeout(renderScrews,190);if(screws.every(x=>x.gone))setTimeout(win,350)}
function win(){score+=Math.max(0,600-moves*5);$('score').textContent=score;if(score>best){best=score;localStorage.setItem('screw-sort-best',best);$('best').textContent=best}localStorage.setItem('screw-sort-level',level);ZP.sfx('win');ZP.confetti();$('result').textContent=`${moves} moves · ${score.toLocaleString()} points`;$('modal').classList.add('show');ZP.emit('game_end',{game:'screw-sort-master',result:'win',level,moves,score})}
$('hint').onclick=()=>{const s=screws.find(s=>!s.gone&&!blockers(s).length);if(s){const el=$('s'+s.id);el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),320);ZP.toast('Try the glowing screw')}};$('shuffle').onclick=()=>{const live=screws.filter(s=>!s.gone),colors=live.map(s=>s.color).sort(()=>Math.random()-.5);live.forEach((s,i)=>s.color=colors[i]);[...plate.querySelectorAll('.screw')].forEach(e=>e.remove());renderScrews();ZP.sfx('tap')};$('easy').onclick=()=>{const blocked=screws.filter(s=>!s.gone&&blockers(s).length);if(blocked.length){blocked.sort((a,b)=>b.z-a.z);pick(blocked[0],true);ZP.toast('Magnet removed one screw')}else ZP.toast('No blocked screws left')};$('restart').onclick=build;$('again').onclick=build;$('next').onclick=()=>{level++;localStorage.setItem('screw-sort-level',level);build()};$('sound').onclick=()=>{$('sound').textContent=ZP.toggleAudio()?'🔊':'🔇'};build();
</script></body></html>
