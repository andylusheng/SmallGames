<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gravity Flip</title>
<style>
*{margin:0;padding:0}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;overflow:hidden}
#ui{color:#fff;margin-bottom:6px;font-size:16px}
#ui span{color:#4fc3f7;font-weight:bold}
canvas{border-radius:8px;border:2px solid #0f3460;touch-action:none}
#msg{color:#aaa;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div id="ui">Score: <span id="sc">0</span> | Best: <span id="bs">0</span></div>
<canvas id="c"></canvas>
<div id="msg">Tap to flip gravity • Avoid obstacles!</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=Math.min(860,innerWidth-16),H=Math.min(640,innerHeight-80);
cv.width=W;cv.height=H;
let player,obstacles,score,best=+localStorage.getItem('gf-best')||0;
let gravDir=1,gameOver=false,started=false,frame=0;
document.getElementById('bs').textContent=best;
function init(){
  player={x:60,y:H/2,vy:0,size:18};
  obstacles=[];score=0;frame=0;gravDir=1;gameOver=false;started=false;
  document.getElementById('sc').textContent=0;
}
function update(){
  if(!started||gameOver)return;
  frame++;
  player.vy+=0.5*gravDir;
  player.y+=player.vy;
  if(player.y<player.size/2){player.y=player.size/2;player.vy=0;}
  if(player.y>H-player.size/2){player.y=H-player.size/2;player.vy=0;}
  const speed=3+score*0.04;
  if(frame%70===0){
    const gap=90+Math.random()*40;
    const gapY=40+Math.random()*(H-80-gap);
    obstacles.push({x:W+20,gapY,gap,speed,scored:false});
  }
  for(let o of obstacles){
    o.x-=o.speed;
    if(!o.scored&&o.x+16<player.x){o.scored=true;score++;document.getElementById('sc').textContent=score;}
    if(player.x+player.size/2>o.x&&player.x-player.size/2<o.x+16){
      if(player.y-player.size/2<o.gapY||player.y+player.size/2>o.gapY+o.gap){die();}
    }
  }
  obstacles=obstacles.filter(o=>o.x>-30);
}
function die(){
  gameOver=true;
  if(score>best){best=score;localStorage.setItem('gf-best',best);}
  document.getElementById('bs').textContent=best;
}
function draw(){
  ctx.fillStyle='#16213e';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0f3460';ctx.fillRect(0,0,W,4);ctx.fillRect(0,H-4,W,4);
  for(let o of obstacles){
    ctx.fillStyle='#e94560';
    ctx.fillRect(o.x,0,16,o.gapY);
    ctx.fillRect(o.x,o.gapY+o.gap,16,H-o.gapY-o.gap);
  }
  ctx.save();ctx.translate(player.x,player.y);
  ctx.fillStyle='#4fc3f7';
  ctx.fillRect(-player.size/2,-player.size/2,player.size,player.size);
  ctx.fillStyle='#fff';
  const ey=gravDir>0?-3:3;
  ctx.fillRect(-4,ey-2,3,3);ctx.fillRect(2,ey-2,3,3);
  ctx.restore();
  // gravity arrow
  ctx.fillStyle='#ffc107';ctx.font='14px Arial';ctx.textAlign='center';
  ctx.fillText(gravDir>0?'⬇ Gravity':'⬆ Gravity',W/2,16);
  if(!started&&!gameOver){
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText('TAP TO START',W/2,H/2);
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e94560';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText('CRASHED!',W/2,H/2-12);
    ctx.fillStyle='#fff';ctx.font='15px Arial';
    ctx.fillText('Score: '+score+' | Tap to retry',W/2,H/2+18);
  }
}
function flip(){
  if(!started){started=true;return;}
  if(gameOver){init();started=true;return;}
  gravDir*=-1;player.vy=0;
}
function loop(){update();draw();requestAnimationFrame(loop);}
cv.addEventListener('pointerdown',e=>{e.preventDefault();flip();});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flip();}});
init();loop();
</script>
</body>
</html>
