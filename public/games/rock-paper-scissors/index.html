<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rock Paper Scissors</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;padding:20px;color:#fff}
h1{font-size:22px;margin-bottom:8px}
.score{display:flex;gap:20px;margin-bottom:16px;font-size:15px}
.score span{color:#4fc3f7;font-weight:bold}
#result{font-size:20px;font-weight:bold;min-height:32px;margin-bottom:16px}
#result.win{color:#4caf50}
#result.lose{color:#e94560}
#result.draw{color:#ffc107}
.arena{display:flex;gap:40px;align-items:center;margin-bottom:24px}
.pick{font-size:64px;transition:transform .3s}
.vs{font-size:20px;color:#aaa;font-weight:bold}
.choices{display:flex;gap:16px}
.btn{width:80px;height:80px;border-radius:16px;border:2px solid #0f3460;background:#16213e;font-size:36px;cursor:pointer;transition:transform .15s,border-color .2s;display:flex;align-items:center;justify-content:center}
.btn:hover{transform:scale(1.1);border-color:#4fc3f7}
.btn:active{transform:scale(0.95)}
.streak{margin-top:12px;color:#aaa;font-size:13px}
.streak span{color:#ffc107}
</style>
</head>
<body>
<h1>✊ Rock Paper Scissors</h1>
<div class="score">You: <span id="pw">0</span> | CPU: <span id="cw">0</span> | Draws: <span id="dr">0</span></div>
<div id="result">Choose your weapon!</div>
<div class="arena">
<div class="pick" id="pp">❔</div>
<div class="vs">VS</div>
<div class="pick" id="cp">❔</div>
</div>
<div class="choices">
<button class="btn" data-c="rock">✊</button>
<button class="btn" data-c="paper">✋</button>
<button class="btn" data-c="scissors">✌️</button>
</div>
<div class="streak">Win Streak: <span id="st">0</span></div>
<script>
const emojis={rock:'✊',paper:'✋',scissors:'✌️'};
const beats={rock:'scissors',paper:'rock',scissors:'paper'};
let pw=0,cw=0,dr=0,streak=0;
function play(choice){
  const opts=['rock','paper','scissors'];
  const cpu=opts[Math.floor(Math.random()*3)];
  document.getElementById('pp').textContent=emojis[choice];
  document.getElementById('cp').textContent=emojis[cpu];
  const el=document.getElementById('result');
  if(choice===cpu){
    el.textContent="It's a Draw!";el.className='draw';dr++;streak=0;
  }else if(beats[choice]===cpu){
    el.textContent='You Win! 🎉';el.className='win';pw++;streak++;
  }else{
    el.textContent='You Lose! 💀';el.className='lose';cw++;streak=0;
  }
  document.getElementById('pw').textContent=pw;
  document.getElementById('cw').textContent=cw;
  document.getElementById('dr').textContent=dr;
  document.getElementById('st').textContent=streak;
}
document.querySelectorAll('.btn').forEach(b=>{
  b.addEventListener('click',()=>play(b.dataset.c));
});
</script>
<script>
(function(){function z(){document.body.style.zoom=1;var w=Math.max(document.documentElement.scrollWidth,320);var h=Math.max(document.documentElement.scrollHeight,320);var s=Math.min((innerWidth-12)/w,(innerHeight-12)/h,1.85);if(s>1.05)document.body.style.zoom=s;else document.body.style.zoom=1}z();addEventListener('resize',z)})();
</script>
</body>
</html>
