<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<rect width="400" height="300" fill="#1a1a2e"/>
<text x="200" y="100" font-size="48" fill="#e94560" font-family="Arial" font-weight="bold" text-anchor="middle">BLUE</text>
<text x="200" y="150" font-size="16" fill="#aaa" font-family="Arial" text-anchor="middle">Does the color match the word?</text>
<rect x="100" y="175" width="90" height="50" rx="10" fill="#4caf50"/>
<text x="145" y="207" font-size="20" fill="#fff" font-family="Arial" font-weight="bold" text-anchor="middle">YES</text>
<rect x="210" y="175" width="90" height="50" rx="10" fill="#e94560"/>
<text x="255" y="207" font-size="20" fill="#fff" font-family="Arial" font-weight="bold" text-anchor="middle">NO</text>
<text x="200" y="270" font-size="22" fill="#fff" font-family="Arial" font-weight="bold" text-anchor="middle">🎨 COLOR MATCH</text>
</svg>
