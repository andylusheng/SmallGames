<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a472a"/>
      <stop offset="100%" style="stop-color:#2d1b69"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Fruits -->
  <circle cx="100" cy="120" r="30" fill="#ff6b6b"/>
  <path d="M100,90 Q105,80 110,90" stroke="#4caf50" stroke-width="3" fill="none"/>
  <circle cx="200" cy="80" r="28" fill="#ffa726"/>
  <path d="M200,52 L200,45" stroke="#795548" stroke-width="3"/>
  <circle cx="300" cy="130" r="32" fill="#66bb6a"/>
  <path d="M280,110 Q300,100 320,110" stroke="#388e3c" stroke-width="2" fill="none"/>
  <circle cx="150" cy="200" r="26" fill="#ffee58"/>
  <ellipse cx="280" cy="210" rx="30" ry="26" fill="#ab47bc"/>
  <!-- Slash effects -->
  <path d="M60,180 Q200,100 340,60" stroke="#fff" stroke-width="3" fill="none" opacity=".8" stroke-linecap="round"/>
  <path d="M80,250 Q220,150 350,120" stroke="#fff" stroke-width="2" fill="none" opacity=".5" stroke-linecap="round"/>
  <!-- Fruit halves -->
  <path d="M170,140 A20,20 0 0,1 170,180" fill="#ff8a80"/>
  <path d="M175,140 A20,20 0 0,0 175,180" fill="#ffcdd2"/>
  <!-- Juice splashes -->
  <circle cx="130" cy="160" r="4" fill="#ff6b6b" opacity=".6"/>
  <circle cx="240" cy="100" r="3" fill="#ffa726" opacity=".6"/>
  <circle cx="310" cy="170" r="5" fill="#66bb6a" opacity=".5"/>
  <circle cx="180" cy="230" r="3" fill="#ffee58" opacity=".6"/>
</svg>
