<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Fish</title>
<style>
*{margin:0;padding:0}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;overflow:hidden}
#ui{color:#fff;margin-bottom:6px;font-size:16px}
#ui span{color:#4fc3f7;font-weight:bold}
canvas{border-radius:8px;touch-action:none}
#msg{color:#aaa;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div id="ui">Score: <span id="sc">0</span> | Best: <span id="bs">0</span></div>
<canvas id="c"></canvas>
<div id="msg">Tap or Space to swim up • Avoid the pipes!</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=Math.min(860,innerWidth-16),H=Math.min(640,innerHeight-80);
cv.width=W;cv.height=H;
let fish,pipes,bubbles,score,best=+localStorage.getItem('ff-best')||0;
let gameOver=false,started=false,frame=0;
document.getElementById('bs').textContent=best;
function init(){
  fish={x:70,y:H/2,vy:0,r:14};
  pipes=[];bubbles=[];score=0;frame=0;gameOver=false;started=false;
  document.getElementById('sc').textContent=0;
}
function spawnPipe(){
  const gap=130+Math.random()*40;
  const gapY=80+Math.random()*(H-160-gap);
  pipes.push({x:W+30,gapY,gap,speed:2.5+score*0.03,scored:false});
}
function update(){
  if(!started||gameOver)return;
  frame++;
  fish.vy+=0.4;fish.y+=fish.vy;
  if(fish.y<fish.r){fish.y=fish.r;fish.vy=0;}
  if(fish.y>H-fish.r){fish.y=H-fish.r;fish.vy=0;}
  if(frame%100===0)spawnPipe();
  // bubbles
  if(frame%8===0)bubbles.push({x:fish.x-10,y:fish.y+Math.random()*10-5,r:2+Math.random()*3,life:40});
  for(let b of bubbles){b.x-=1;b.life--;}
  bubbles=bubbles.filter(b=>b.life>0);
  for(let p of pipes){
    p.x-=p.speed;
    if(!p.scored&&p.x+25<fish.x){p.scored=true;score++;document.getElementById('sc').textContent=score;}
    if(fish.x+fish.r>p.x&&fish.x-fish.r<p.x+25){
      if(fish.y-fish.r<p.gapY||fish.y+fish.r>p.gapY+p.gap){die();return;}
    }
  }
  pipes=pipes.filter(p=>p.x>-40);
}
function die(){
  gameOver=true;
  if(score>best){best=score;localStorage.setItem('ff-best',best);}
  document.getElementById('bs').textContent=best;
}
function draw(){
  // ocean bg
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0f3460');g.addColorStop(1,'#16213e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // seaweed
  for(let i=0;i<6;i++){
    ctx.fillStyle='#1b5e20';
    const sx=i*70+20,sh=30+Math.sin(frame*0.03+i)*10;
    ctx.fillRect(sx,H-sh,6,sh);
  }
  // pipes as coral/rock
  for(let p of pipes){
    ctx.fillStyle='#e94560';
    ctx.fillRect(p.x,0,25,p.gapY);
    ctx.fillRect(p.x,p.gapY+p.gap,25,H-p.gapY-p.gap);
    ctx.fillStyle='#ff6b6b';
    ctx.fillRect(p.x-4,p.gapY-12,33,12);
    ctx.fillRect(p.x-4,p.gapY+p.gap,33,12);
  }
  // bubbles
  for(let b of bubbles){
    ctx.globalAlpha=b.life/40;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.strokeStyle='#81d4fa';ctx.lineWidth=1;ctx.stroke();
  }
  ctx.globalAlpha=1;
  // fish
  ctx.save();ctx.translate(fish.x,fish.y);
  ctx.rotate(Math.min(fish.vy*0.04,0.4));
  ctx.fillStyle='#ff9800';
  ctx.beginPath();ctx.ellipse(0,0,fish.r,fish.r*0.7,0,0,Math.PI*2);ctx.fill();
  // tail
  ctx.beginPath();ctx.moveTo(-fish.r,0);ctx.lineTo(-fish.r-10,-7);ctx.lineTo(-fish.r-10,7);ctx.closePath();
  ctx.fillStyle='#f57c00';ctx.fill();
  // eye
  ctx.beginPath();ctx.arc(6,-3,4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.beginPath();ctx.arc(7,-3,2,0,Math.PI*2);ctx.fillStyle='#000';ctx.fill();
  ctx.restore();
  if(!started&&!gameOver){
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText('🐟 TAP TO SWIM',W/2,H/2);
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e94560';ctx.font='bold 26px Arial';ctx.textAlign='center';
    ctx.fillText('SPLAT!',W/2,H/2-15);
    ctx.fillStyle='#fff';ctx.font='16px Arial';
    ctx.fillText('Score: '+score+' | Tap to retry',W/2,H/2+20);
  }
}
function flap(){
  if(!started){started=true;fish.vy=-7;return;}
  if(gameOver){init();started=true;fish.vy=-7;return;}
  fish.vy=-7;
}
function loop(){update();draw();requestAnimationFrame(loop);}
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap();});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap();}});
init();loop();
</script>
</body>
</html>
