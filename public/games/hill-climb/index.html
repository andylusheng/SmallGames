<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hill Climb</title>
<style>
*{margin:0;padding:0}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;overflow:hidden}
#ui{color:#fff;margin-bottom:6px;font-size:16px}
#ui span{color:#4fc3f7;font-weight:bold}
canvas{border-radius:8px;touch-action:none}
#msg{color:#aaa;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div id="ui">Distance: <span id="dist">0</span>m | Fuel: <span id="fuel">100</span>% | Best: <span id="bs">0</span>m</div>
<canvas id="c"></canvas>
<div id="msg">Hold LEFT=brake RIGHT=gas | Keys: ← →</div>
<script>
const W=Math.min(860,innerWidth-16),H=Math.min(640,innerHeight-100);
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');
let dist=0,fuel=100,best=+localStorage.getItem('hillclimb_best')||0,gameOver=false;
document.getElementById('bs').textContent=best;
// Terrain
let terrain=[];
function genTerrain(){terrain=[];let y=H*0.6;for(let i=0;i<2000;i++){y+=Math.sin(i*0.02)*2+Math.sin(i*0.05)*1.5+(Math.random()-0.5)*1;y=Math.max(H*0.3,Math.min(H*0.8,y));terrain.push(y)}}
genTerrain();
// Car
const car={x:100,y:0,vy:0,angle:0,speed:0,wheelR:10};
let gas=false,brake=false;
// Controls
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();if(e.clientX-r.left<W/2)brake=true;else gas=true});
cv.addEventListener('pointerup',()=>{gas=false;brake=false});
cv.addEventListener('pointerleave',()=>{gas=false;brake=false});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')gas=true;if(e.key==='ArrowLeft')brake=true});
document.addEventListener('keyup',e=>{if(e.key==='ArrowRight')gas=false;if(e.key==='ArrowLeft')brake=false});
let camX=0;
function getTerrainY(x){const i=Math.floor(x/4);if(i<0||i>=terrain.length-1)return H*0.6;const t=(x/4)-i;return terrain[i]*(1-t)+terrain[i+1]*t}
function loop(){
  if(gameOver)return;
  ctx.clearRect(0,0,W,H);
  // Sky gradient
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0f3460');grad.addColorStop(1,'#16213e');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  // Physics
  if(gas&&fuel>0){car.speed+=0.15;fuel-=0.08}
  if(brake){car.speed-=0.2}
  car.speed*=0.99;
  car.speed=Math.max(-2,Math.min(6,car.speed));
  car.x+=car.speed;
  if(car.x<0)car.x=0;
  const groundY=getTerrainY(car.x);
  const groundY2=getTerrainY(car.x+30);
  car.angle=Math.atan2(groundY2-groundY,30);
  car.y+=(groundY-car.y)*0.3;
  // Slope effect
  car.speed-=Math.sin(car.angle)*0.08;
  // Camera
  camX+=(car.x-W*0.3-camX)*0.1;
  // Draw terrain
  ctx.beginPath();ctx.moveTo(0,H);
  for(let sx=0;sx<=W;sx+=4){
    const wx=camX+sx;
    ctx.lineTo(sx,getTerrainY(wx));
  }
  ctx.lineTo(W,H);ctx.closePath();
  ctx.fillStyle='#2d5a27';ctx.fill();
  ctx.strokeStyle='#4caf50';ctx.lineWidth=2;ctx.stroke();
  // Draw car
  const sx=car.x-camX,sy=car.y;
  ctx.save();ctx.translate(sx,sy);ctx.rotate(car.angle);
  // Body
  ctx.fillStyle='#e94560';
  ctx.fillRect(-20,-18,40,14);
  ctx.fillStyle='#4fc3f7';
  ctx.fillRect(-10,-26,20,10);
  // Wheels
  ctx.fillStyle='#333';
  ctx.beginPath();ctx.arc(-12,0,car.wheelR,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(12,0,car.wheelR,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#666';
  ctx.beginPath();ctx.arc(-12,0,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(12,0,4,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // Fuel cans
  dist=Math.max(dist,Math.floor(car.x/20));
  document.getElementById('dist').textContent=dist;
  document.getElementById('fuel').textContent=Math.max(0,Math.floor(fuel));
  if(fuel<=0&&car.speed<0.1){
    gameOver=true;
    if(dist>best){best=dist;localStorage.setItem('hillclimb_best',best);document.getElementById('bs').textContent=best}
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText('OUT OF FUEL!',W/2,H/2-15);
    ctx.font='16px Arial';ctx.fillText('Distance: '+dist+'m',W/2,H/2+15);
    ctx.font='13px Arial';ctx.fillStyle='#4fc3f7';ctx.fillText('Tap to restart',W/2,H/2+45);
    cv.addEventListener('pointerdown',restart,{once:true});
    return;
  }
  requestAnimationFrame(loop);
}
function restart(){
  dist=0;fuel=100;gameOver=false;car.x=100;car.speed=0;car.y=getTerrainY(100);camX=0;
  genTerrain();
  document.getElementById('dist').textContent=0;
  document.getElementById('fuel').textContent=100;
  loop();
}
car.y=getTerrainY(car.x);
loop();
</script>
</body>
</html>
