<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#road)"/>
  <!-- Road -->
  <polygon points="150,300 250,300 220,0 180,0" fill="#333"/>
  <polygon points="155,300 245,300 218,0 182,0" fill="#444"/>
  <!-- Lane markings -->
  <rect x="196" y="20" width="8" height="30" fill="#fff" opacity=".8"/>
  <rect x="194" y="80" width="10" height="35" fill="#fff" opacity=".7"/>
  <rect x="192" y="150" width="12" height="40" fill="#fff" opacity=".6"/>
  <rect x="190" y="230" width="14" height="45" fill="#fff" opacity=".5"/>
  <!-- Player car -->
  <rect x="175" y="220" width="40" height="60" rx="8" fill="#2196f3"/>
  <rect x="180" y="225" width="30" height="20" rx="4" fill="#64b5f6"/>
  <rect x="178" y="250" width="34" height="15" rx="3" fill="#1565c0"/>
  <rect x="172" y="235" width="6" height="12" rx="2" fill="#ffeb3b"/>
  <rect x="212" y="235" width="6" height="12" rx="2" fill="#ffeb3b"/>
  <!-- Enemy cars -->
  <rect x="185" y="60" width="35" height="50" rx="7" fill="#f44336"/>
  <rect x="189" y="65" width="27" height="16" rx="3" fill="#ef9a9a"/>
  <rect x="160" y="130" width="30" height="45" rx="6" fill="#ff9800"/>
  <rect x="163" y="134" width="24" height="14" rx="3" fill="#ffcc80"/>
  <!-- Speed lines -->
  <line x1="130" y1="200" x2="130" y2="260" stroke="#4fc3f7" stroke-width="2" opacity=".4"/>
  <line x1="270" y1="180" x2="270" y2="250" stroke="#4fc3f7" stroke-width="2" opacity=".3"/>
  <line x1="120" y1="100" x2="120" y2="150" stroke="#4fc3f7" stroke-width="1.5" opacity=".3"/>
  <line x1="280" y1="80" x2="280" y2="130" stroke="#4fc3f7" stroke-width="1.5" opacity=".2"/>
  <!-- Neon glow -->
  <rect x="148" y="0" width="3" height="300" fill="#e91e63" opacity=".3"/>
  <rect x="249" y="0" width="3" height="300" fill="#e91e63" opacity=".3"/>
</svg>
