<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tic Tac Toe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;padding:20px}
h1{color:#fff;font-size:24px;margin-bottom:8px}
.status{color:#aaa;font-size:16px;margin-bottom:16px;min-height:24px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(320px,85vw);height:min(320px,85vw)}
.cell{background:#16213e;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:bold;cursor:pointer;transition:all .15s;border:2px solid #0f3460}
.cell:hover{background:#1a2a4e;border-color:#e94560}
.cell.x{color:#4fc3f7}
.cell.o{color:#e94560}
.cell.win{background:#0f3460;border-color:#ffd700;animation:pulse .5s}
@keyframes pulse{50%{transform:scale(1.05)}}
.scores{display:flex;gap:24px;margin-top:16px;color:#fff;font-size:15px}
.scores span{padding:6px 14px;background:#16213e;border-radius:8px}
.btn{margin-top:16px;padding:10px 24px;background:#e94560;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.btn:hover{background:#c73e54}
.diff{display:flex;gap:8px;margin-bottom:16px}
.diff button{padding:6px 14px;border-radius:6px;border:1px solid #333;background:#16213e;color:#fff;cursor:pointer;font-size:13px}
.diff button.active{background:#e94560;border-color:#e94560}
</style>
</head>
<body>
<h1>Tic Tac Toe</h1>
<div class="diff">
  <button id="easyBtn" onclick="setDiff('easy')">Easy</button>
  <button id="hardBtn" class="active" onclick="setDiff('hard')">Unbeatable</button>
</div>
<div class="status" id="status">Your turn (X)</div>
<div class="board" id="board"></div>
<div class="scores">
  <span>You: <b id="pw">0</b></span>
  <span>Draw: <b id="pd">0</b></span>
  <span>AI: <b id="pa">0</b></span>
</div>
<button class="btn" onclick="reset()">New Round</button>
<script>
let board,turn,gameOver,difficulty='hard';
let wins=0,draws=0,losses=0;
const WINS=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function init(){
  board=Array(9).fill('');turn='X';gameOver=false;
  document.getElementById('status').textContent='Your turn (X)';
  render();
}

function render(){
  const el=document.getElementById('board');el.innerHTML='';
  for(let i=0;i<9;i++){
    const cell=document.createElement('div');
    cell.className='cell'+(board[i]==='X'?' x':board[i]==='O'?' o':'');
    cell.textContent=board[i];
    cell.addEventListener('click',()=>play(i));
    el.appendChild(cell);
  }
}

function play(i){
  if(board[i]||gameOver||turn!=='X')return;
  board[i]='X';render();
  if(checkEnd())return;
  turn='O';document.getElementById('status').textContent='AI thinking...';
  setTimeout(()=>{aiMove();render();checkEnd();},300);
}

function aiMove(){
  let move;
  if(difficulty==='easy'){
    const empty=board.map((v,i)=>v===''?i:null).filter(v=>v!==null);
    // 60% random, 40% smart
    if(Math.random()<0.6)move=empty[Math.floor(Math.random()*empty.length)];
    else move=bestMove();
  }else{move=bestMove();}
  board[move]='O';
}

function bestMove(){
  let best=-Infinity,move=0;
  for(let i=0;i<9;i++){
    if(board[i]===''){board[i]='O';let s=minimax(board,0,false);board[i]='';if(s>best){best=s;move=i;}}
  }
  return move;
}

function minimax(b,depth,isMax){
  const w=getWinner(b);
  if(w==='O')return 10-depth;
  if(w==='X')return depth-10;
  if(b.every(c=>c!==''))return 0;
  if(isMax){let best=-Infinity;for(let i=0;i<9;i++){if(b[i]===''){b[i]='O';best=Math.max(best,minimax(b,depth+1,false));b[i]='';}}return best;}
  else{let best=Infinity;for(let i=0;i<9;i++){if(b[i]===''){b[i]='X';best=Math.min(best,minimax(b,depth+1,true));b[i]='';}}return best;}
}

function getWinner(b){
  for(const[a,c,d]of WINS){if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];}
  return null;
}

function checkEnd(){
  const w=getWinner(board);
  if(w){
    gameOver=true;
    const cells=document.querySelectorAll('.cell');
    for(const[a,b2,c]of WINS){if(board[a]===w&&board[b2]===w&&board[c]===w){cells[a].classList.add('win');cells[b2].classList.add('win');cells[c].classList.add('win');}}
    if(w==='X'){wins++;document.getElementById('status').textContent='🎉 You win!';}
    else{losses++;document.getElementById('status').textContent='🤖 AI wins!';}
    updateScores();return true;
  }
  if(board.every(c=>c!=='')){gameOver=true;draws++;document.getElementById('status').textContent='🤝 Draw!';updateScores();return true;}
  if(turn==='X')document.getElementById('status').textContent='Your turn (X)';
  return false;
}

function updateScores(){
  document.getElementById('pw').textContent=wins;
  document.getElementById('pd').textContent=draws;
  document.getElementById('pa').textContent=losses;
}

function reset(){init();}
function setDiff(d){
  difficulty=d;
  document.getElementById('easyBtn').className=d==='easy'?'active':'';
  document.getElementById('hardBtn').className=d==='hard'?'active':'';
  init();
}
init();
</script>
<script>
(function(){function z(){document.body.style.zoom=1;var w=Math.max(document.documentElement.scrollWidth,320);var h=Math.max(document.documentElement.scrollHeight,320);var s=Math.min((innerWidth-12)/w,(innerHeight-12)/h,1.85);if(s>1.05)document.body.style.zoom=s;else document.body.style.zoom=1}z();addEventListener('resize',z)})();
</script>
</body>
</html>
