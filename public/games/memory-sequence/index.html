<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Memory Sequence</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial,sans-serif;background:#050712;color:#fff}body{display:flex;align-items:center;justify-content:center;padding:6px}.game{width:min(420px,100%);height:100%;max-height:700px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:7px}.top{text-align:center}.top h1{margin:0;font-size:22px}.hud{display:flex;justify-content:center;gap:5px}.pill{min-width:74px;padding:5px 8px;border:1px solid #ffffff14;border-radius:10px;background:#0d1428;color:#64748b;font-size:8px;text-align:center}.pill b{display:block;color:#fff;font-size:14px}.console{position:relative;min-height:0;padding:15px;border:2px solid #5b4bb7;border-radius:26px;background:radial-gradient(circle at 50% 45%,#232657,#0d122a 66%,#060817);box-shadow:0 22px 70px #0009}.status{text-align:center;height:24px;color:#fbbf24;font-size:12px;font-weight:950}.board{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(330px,86%);margin:5px auto 0}.pad{aspect-ratio:1;border:0;border-radius:24px;opacity:.48;cursor:pointer;transition:transform .1s,opacity .1s,filter .1s;box-shadow:inset 0 5px 12px #ffffff1f,0 10px 28px #0006}.pad:active{transform:scale(.94)}.pad.lit{opacity:1;transform:scale(1.05);filter:brightness(1.35);box-shadow:0 0 32px currentColor,inset 0 5px 12px #ffffff44}.pad.wrong{background:#ef4444!important;opacity:1;animation:shake .25s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}#p0{background:#fb7185;color:#fb7185}#p1{background:#38bdf8;color:#38bdf8}#p2{background:#fbbf24;color:#fbbf24}#p3{background:#34d399;color:#34d399}.progress{height:6px;width:min(330px,86%);margin:11px auto 0;background:#ffffff0d;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#a78bfa);transition:width .1s}.focus{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}.focusCopy{font-size:8px;color:#a5b4fc;font-weight:900}.focusTrack{height:6px;margin-top:4px;background:#ffffff10;border-radius:999px;overflow:hidden}.focusTrack i{display:block;height:100%;width:0;background:linear-gradient(90deg,#818cf8,#f0abfc,#fbbf24)}.replay{border:0;border-radius:9px;padding:8px 11px;background:#818cf8;color:#090b18;font-size:9px;font-weight:950}.replay:disabled{opacity:.35}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020617dd;z-index:20}.overlay.hidden{display:none}.card{width:min(320px,88vw);padding:21px;border:1px solid #ffffff1a;border-radius:20px;background:#10172d;text-align:center}.card h2{margin:0 0 5px}.card p{font-size:11px;color:#94a3b8;line-height:1.5}.btn{width:100%;border:0;border-radius:11px;padding:10px;background:linear-gradient(135deg,#38bdf8,#818cf8);color:#07111f;font-weight:950}</style></head><body><main class="game"><div class="top"><h1>🧠 Memory Sequence</h1><div class="hud"><div class="pill">LEVEL<b id="level">0</b></div><div class="pill">TEMPO<b id="tempo">1.0×</b></div><div class="pill">BEST<b id="best">0</b></div></div></div><section class="console"><div id="status" class="status">READY</div><div class="board"><button class="pad" id="p0"></button><button class="pad" id="p1"></button><button class="pad" id="p2"></button><button class="pad" id="p3"></button></div><div class="progress"><i id="progress"></i></div></section><div class="focus"><div><div id="focusCopy" class="focusCopy">FOCUS · 0 / 3 perfect rounds</div><div class="focusTrack"><i id="focusBar"></i></div></div><button id="replay" class="replay" disabled>REPLAY</button></div></main><div id="overlay" class="overlay"><div class="card"><h2 id="title">Memory Sequence</h2><p id="summary">Each round adds one step. Perfect rounds charge Focus; spend it to replay the current pattern once.</p><button id="start" class="btn">START</button></div></div><script>(()=>{'use strict';const pads=[...document.querySelectorAll('.pad')],$=id=>document.getElementById(id),levelEl=$('level'),tempoEl=$('tempo'),bestEl=$('best'),status=$('status'),progress=$('progress'),focusBar=$('focusBar'),focusCopy=$('focusCopy'),replay=$('replay'),overlay=$('overlay');let seq=[],input=[],level=0,accept=false,best=+localStorage.getItem('memory-sequence-flag-best')||0,audio=null,token=0,focus=0,replayReady=false,replayUsed=false;bestEl.textContent=best;const tones=[261.6,329.6,392,523.3];function sound(i,d=.12){try{audio=audio||new(AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=i<0?'sawtooth':'sine';o.frequency.value=i<0?120:tones[i];g.gain.setValueAtTime(.05,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}function flash(i,d=190){pads[i].classList.add('lit');sound(i,Math.max(.07,d/1000*.65));setTimeout(()=>pads[i].classList.remove('lit'),d)}const delay=ms=>new Promise(r=>setTimeout(r,ms));function gap(){return Math.max(230,620-level*23)}function focusUi(){focusBar.style.width=(replayReady?100:focus/3*100)+'%';focusCopy.textContent=replayReady?'FOCUS READY · replay this pattern once':`FOCUS · ${focus} / 3 perfect rounds`;replay.disabled=!replayReady||accept===false||replayUsed}async function playSeq(my,isReplay=false){accept=false;status.textContent=isReplay?'REPLAY…':'WATCH…';progress.style.width='0';const g=gap();tempoEl.textContent=(620/g).toFixed(1)+'×';await delay(isReplay?150:320);for(let i=0;i<seq.length;i++){if(my!==token)return;flash(seq[i],Math.min(300,g*.58));progress.style.width=((i+1)/seq.length*100)+'%';await delay(g)}if(my!==token)return;input=[];progress.style.width='0';accept=true;status.textContent='YOUR TURN';focusUi()}function next(){level++;levelEl.textContent=level;seq.push(Math.floor(Math.random()*4));replayUsed=false;status.textContent=level%5===0?'🔥 SPEED ROUND':'NEXT PATTERN';const my=++token;setTimeout(()=>playSeq(my),450)}async function fail(i){accept=false;token++;pads[i].classList.add('wrong');sound(-1,.18);navigator.vibrate?.(55);setTimeout(()=>pads[i].classList.remove('wrong'),320);const survived=Math.max(0,level-1);best=Math.max(best,survived);localStorage.setItem('memory-sequence-flag-best',best);bestEl.textContent=best;status.textContent='SEQUENCE LOST';await delay(600);$('title').textContent=survived>=best&&survived>0?'🏆 New Best':'Sequence Lost';$('summary').textContent=`Reached level ${survived} · best ${best}. Save Focus for the fastest rounds.`;$('start').textContent='TRY AGAIN';overlay.classList.remove('hidden')}function tap(i){if(!accept)return;flash(i,135);input.push(i);progress.style.width=(input.length/seq.length*100)+'%';const k=input.length-1;if(input[k]!==seq[k]){focus=0;replayReady=false;focusUi();fail(i);return}if(input.length===seq.length){accept=false;status.textContent='✓ PERFECT';focus++;if(focus>=3){focus=0;replayReady=true}best=Math.max(best,level);localStorage.setItem('memory-sequence-flag-best',best);bestEl.textContent=best;navigator.vibrate?.(10);focusUi();setTimeout(next,570)}}pads.forEach((p,i)=>p.addEventListener('pointerdown',()=>tap(i)));replay.onclick=()=>{if(!replayReady||!accept||replayUsed)return;replayReady=false;replayUsed=true;focus=0;focusUi();playSeq(++token,true)};function newGame(){token++;seq=[];input=[];level=0;focus=0;replayReady=false;replayUsed=false;accept=false;levelEl.textContent='0';tempoEl.textContent='1.0×';progress.style.width='0';overlay.classList.add('hidden');status.textContent='GET READY';focusUi();setTimeout(next,420)}$('start').onclick=newGame;focusUi()})();</script></body></html>
