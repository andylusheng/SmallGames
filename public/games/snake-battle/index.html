<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake Battle</title>
<style>
*{margin:0;padding:0}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Arial,sans-serif;overflow:hidden}
#ui{color:#fff;margin-bottom:6px;font-size:16px}
#ui span{color:#4fc3f7;font-weight:bold}
canvas{border-radius:8px;border:2px solid #0f3460;touch-action:none}
#msg{color:#aaa;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div id="ui">Score: <span id="sc">0</span> | Length: <span id="ln">3</span></div>
<canvas id="c"></canvas>
<div id="msg">Swipe or Arrow keys to move • Eat food, avoid AI snakes!</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const COLS=18,ROWS=18,GRID=Math.max(20,Math.floor(Math.min((innerWidth-16)/COLS,(innerHeight-100)/ROWS)));
const W=COLS*GRID,H=ROWS*GRID;
cv.width=W;cv.height=H;
let snake,dir,nextDir,food,aiSnakes,score,gameOver,started,frame;
const AI_COLORS=['#e94560','#ff9800','#9c27b0'];
function init(){
  snake=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;gameOver=false;started=false;frame=0;
  aiSnakes=[];
  for(let i=0;i<3;i++){
    const sx=Math.floor(Math.random()*COLS),sy=Math.floor(Math.random()*ROWS);
    aiSnakes.push({body:[{x:sx,y:sy},{x:sx-1,y:sy},{x:sx-2,y:sy}],dir:{x:1,y:0},color:AI_COLORS[i],timer:0});
  }
  spawnFood();updateUI();
}
function updateUI(){
  document.getElementById('sc').textContent=score;
  document.getElementById('ln').textContent=snake.length;
}
function spawnFood(){
  let pos;
  do{pos={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
  while(snake.some(s=>s.x===pos.x&&s.y===pos.y));
  food=pos;
}
function moveAI(ai){
  ai.timer++;
  if(ai.timer%3!==0)return;
  const head=ai.body[0];
  // simple AI: move toward food sometimes, random otherwise
  if(Math.random()<0.4){
    const dx=food.x-head.x,dy=food.y-head.y;
    if(Math.abs(dx)>Math.abs(dy))ai.dir={x:Math.sign(dx),y:0};
    else ai.dir={x:0,y:Math.sign(dy)};
  }else if(Math.random()<0.2){
    const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
    ai.dir=dirs[Math.floor(Math.random()*4)];
  }
  const nh={x:(head.x+ai.dir.x+COLS)%COLS,y:(head.y+ai.dir.y+ROWS)%ROWS};
  ai.body.unshift(nh);
  if(ai.body.length>8)ai.body.pop();
}
function update(){
  if(!started||gameOver)return;
  frame++;
  if(frame%4!==0)return;
  dir=nextDir;
  const head={x:(snake[0].x+dir.x+COLS)%COLS,y:(snake[0].y+dir.y+ROWS)%ROWS};
  // self collision
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){die();return;}
  // AI collision
  for(let ai of aiSnakes){
    if(ai.body.some(s=>s.x===head.x&&s.y===head.y)){die();return;}
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10;spawnFood();updateUI();
  }else{
    snake.pop();
  }
  for(let ai of aiSnakes)moveAI(ai);
}
function die(){
  gameOver=true;
}
function draw(){
  ctx.fillStyle='#16213e';ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle='#1a2744';ctx.lineWidth=0.5;
  for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*GRID,0);ctx.lineTo(i*GRID,H);ctx.stroke();}
  for(let i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*GRID);ctx.lineTo(W,i*GRID);ctx.stroke();}
  // food
  ctx.fillStyle='#4caf50';
  ctx.beginPath();ctx.arc(food.x*GRID+GRID/2,food.y*GRID+GRID/2,GRID/2-3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#81c784';
  ctx.beginPath();ctx.arc(food.x*GRID+GRID/2-2,food.y*GRID+GRID/2-2,3,0,Math.PI*2);ctx.fill();
  // AI snakes
  for(let ai of aiSnakes){
    for(let i=0;i<ai.body.length;i++){
      const s=ai.body[i];
      ctx.fillStyle=i===0?ai.color:ai.color+'99';
      ctx.beginPath();ctx.roundRect(s.x*GRID+2,s.y*GRID+2,GRID-4,GRID-4,4);ctx.fill();
    }
  }
  // player snake
  for(let i=0;i<snake.length;i++){
    const s=snake[i];
    ctx.fillStyle=i===0?'#4fc3f7':'#4fc3f7aa';
    ctx.beginPath();ctx.roundRect(s.x*GRID+1,s.y*GRID+1,GRID-2,GRID-2,5);ctx.fill();
    if(i===0){
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(s.x*GRID+GRID/2+dir.x*3,s.y*GRID+GRID/2+dir.y*3-2,2.5,0,Math.PI*2);ctx.fill();
    }
  }
  if(!started&&!gameOver){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText('TAP TO START',W/2,H/2);
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e94560';ctx.font='bold 24px Arial';ctx.textAlign='center';
    ctx.fillText('GAME OVER',W/2,H/2-12);
    ctx.fillStyle='#fff';ctx.font='15px Arial';
    ctx.fillText('Score: '+score+' | Tap to retry',W/2,H/2+18);
  }
}
function loop(){update();draw();requestAnimationFrame(loop);}
// controls
document.addEventListener('keydown',e=>{
  if(!started){started=true;}
  if(gameOver){init();started=true;return;}
  if(e.code==='ArrowUp'&&dir.y!==1)nextDir={x:0,y:-1};
  if(e.code==='ArrowDown'&&dir.y!==-1)nextDir={x:0,y:1};
  if(e.code==='ArrowLeft'&&dir.x!==1)nextDir={x:-1,y:0};
  if(e.code==='ArrowRight'&&dir.x!==-1)nextDir={x:1,y:0};
  e.preventDefault();
});
let touchStart=null;
cv.addEventListener('pointerdown',e=>{
  if(!started){started=true;return;}
  if(gameOver){init();started=true;return;}
  touchStart={x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointerup',e=>{
  if(!touchStart)return;
  const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>10&&dir.x!==-1)nextDir={x:1,y:0};
    else if(dx<-10&&dir.x!==1)nextDir={x:-1,y:0};
  }else{
    if(dy>10&&dir.y!==-1)nextDir={x:0,y:1};
    else if(dy<-10&&dir.y!==1)nextDir={x:0,y:-1};
  }
  touchStart=null;
});
init();loop();
</script>
</body>
</html>
