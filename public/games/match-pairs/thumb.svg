<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1140"/>
      <stop offset="100%" stop-color="#0f1a3a"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#e8d4a8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffd9a8"/>
      <stop offset="100%" stop-color="#ff9a3d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- 装饰光斑 -->
  <circle cx="60" cy="50" r="80" fill="#ff9a3d" opacity="0.12"/>
  <circle cx="350" cy="260" r="90" fill="#4ecdc4" opacity="0.1"/>
  <!-- 标题 -->
  <text x="200" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="900" fill="url(#title)" letter-spacing="2">水果对对碰</text>
  <text x="200" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#b8a4d8" letter-spacing="4">MATCH PAIRS</text>
  <!-- 棋盘 -->
  <g transform="translate(100,88)">
    <rect x="0" y="0" width="200" height="170" rx="14" fill="#1a2332" opacity="0.6" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- 格子 4x4 预览 -->
    <g transform="translate(14,14)">
      <!-- row1 -->
      <rect x="0" y="0" width="40" height="36" rx="7" fill="url(#tile)" stroke="rgba(255,255,255,0.5)"/>
      <text x="20" y="27" text-anchor="middle" font-size="22">🍎</text>
      <rect x="48" y="0" width="40" height="36" rx="7" fill="url(#tile)" stroke="rgba(255,255,255,0.5)"/>
      <text x="68" y="27" text-anchor="middle" font-size="22">🍇</text>
      <rect x="96" y="0" width="40" height="36" rx="7" fill="url(#tile)" stroke="rgba(255,217,61,0.8)" stroke-width="2" filter="url(#glow)"/>
      <text x="116" y="27" text-anchor="middle" font-size="22">🍊</text>
      <rect x="144" y="0" width="40" height="36" rx="7" fill="url(#tile)" stroke="rgba(255,255,255,0.5)"/>
      <text x="164" y="27" text-anchor="middle" font-size="22">🍋</text>
      <!-- row2 -->
      <rect x="0" y="44" width="40" height="36" rx="7" fill="url(#tile)" stroke="rgba(255,255,255,0.5)"/>
      <text x="20" y="71" text-anchor="middle" font-size="22">🍉</text>
      <rect x="48" y="44" width="40" height="36" rx="7" fill="rgba(0,0,0,0.25)"/>
      <rect x="96" y="44" width="40" height="36" rx="7" fill="url(#tile)" stroke="rgba(255,217,61,0.8)" stroke-width="2" filter="url(#glow)"/>
      <text x="116" y="71" text-anchor="middle" font-size="22">🍊</text>
      <rect x="144" y="44" width="40" height="36" rx="7" fill="url(#tile)" stroke="rgba(255,255,255,0.5)"/>
      <text x="164" y="71" text-anchor="middle" font-size="22">🍓</text>
      <!-- row3 -->
      <rect x="0" y="88" width="40" height="36" rx="7" fill="url(#tile)" stroke="rgba(255,255,255,0.5)"/>
      <text x="20" y="115" text-anchor="middle" font-size="22">🥝</text>
      <rect x="48" y="88" width="40" height="36" rx="7" fill="url(#tile)" stroke="rgba(255,255,255,0.5)"/>
      <text x="68" y="115" text-anchor="middle" font-size="22">🍒</text>
      <rect x="96" y="88" width="40" height="36" rx="7" fill="rgba(0,0,0,0.25)"/>
      <rect x="144" y="88" width="40" height="36" rx="7" fill="url(#tile)" stroke="rgba(255,255,255,0.5)"/>
      <text x="164" y="115" text-anchor="middle" font-size="22">🍎</text>
      <!-- 配对连线 -->
      <path d="M116,18 Q140,40 116,62" stroke="#ffd93d" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="6 4" filter="url(#glow)" opacity="0.9"/>
    </g>
  </g>
  <!-- 底部标签 -->
  <text x="200" y="282" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#8b95b8" letter-spacing="1">限时消除 · 连击倍率 · 60 关</text>
</svg>
