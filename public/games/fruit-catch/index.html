<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Fruit Catch</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial,sans-serif;background:#b7e7ff;color:#17320f}body{display:flex;align-items:center;justify-content:center}.wrap{position:relative;width:min(760px,100vw);height:min(700px,100vh);overflow:hidden;background:#8edbff}.hud{position:absolute;z-index:5;left:9px;right:9px;top:9px;display:flex;justify-content:space-between}.group{display:flex;gap:5px}.pill{min-width:60px;padding:6px 8px;border:2px solid #ffffffaa;border-radius:12px;background:#163515d9;color:#b9dfa9;font-size:8px;text-align:center;box-shadow:0 3px 0 #0d220d}.pill b{display:block;color:#fff;font-size:14px}.pill.combo b{color:#ffe27a}canvas{width:100%;height:100%;display:block;touch-action:none}.rush{position:absolute;z-index:5;left:50%;top:10px;transform:translateX(-50%);width:min(210px,34%);padding:5px 7px;border-radius:999px;background:#ffffffcc;border:2px solid #e98b2a}.rushLabel{display:flex;justify-content:space-between;color:#9a4a14;font-size:8px;font-weight:950}.rushTrack{height:5px;margin-top:3px;background:#f4d6a7;border-radius:999px;overflow:hidden}.rushTrack i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb703,#fb8500,#ef476f);transition:width .12s}.hint{position:absolute;z-index:4;bottom:8px;left:50%;transform:translateX(-50%);padding:5px 9px;border-radius:999px;background:#214e20dd;color:#d8f3c8;font-size:9px;white-space:nowrap}.overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#163515cc}.overlay.show{display:flex}.card{width:min(320px,88vw);padding:20px;border:3px solid #fff3c4;border-radius:20px;background:#fff8dd;color:#422a12;text-align:center;box-shadow:0 9px 0 #986329}.card h2{margin:0}.card p{font-size:11px;color:#6f4b2a}.btn{border:0;border-radius:11px;padding:10px 18px;background:#f5b942;color:#422a12;font-weight:950;cursor:pointer}</style></head><body><main id="wrap" class="wrap"><div class="hud"><div class="group"><div class="pill">SCORE<b id="score">0</b></div><div class="pill combo">COMBO<b id="combo">×0</b></div></div><div class="group"><div class="pill">LIVES<b id="lives">♥♥♥♥♥</b></div><div class="pill">BEST<b id="best">0</b></div></div></div><div class="rush"><div class="rushLabel"><span>CATCH RUSH</span><span id="rushText">0 / 8</span></div><div class="rushTrack"><i id="rushBar"></i></div></div><canvas id="c"></canvas><div class="hint">Drag the basket · fruit = points · bomb = danger</div><div id="over" class="overlay"><div class="card"><h2 id="title">Basket Empty</h2><p id="summary"></p><button id="again" class="btn">CATCH AGAIN</button></div></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d'),wrap=$('wrap'),scoreEl=$('score'),comboEl=$('combo'),livesEl=$('lives'),bestEl=$('best'),bar=$('rushBar'),rushText=$('rushText'),over=$('over');let W=0,H=0,D=Math.min(devicePixelRatio||1,2),basket,items=[],fx=[],score=0,lives=5,combo=0,best=+localStorage.getItem('fruit-catch-flag-best')||0,rush=0,rushTime=0,running=true,frame=0,shake=0,audio=null;bestEl.textContent=best;const fruit=['🍎','🍊','🍋','🍇','🍓','🍑','🍒','🥝','🍌','🫐'];function resize(){const r=wrap.getBoundingClientRect();W=r.width;H=r.height;c.width=Math.round(W*D);c.height=Math.round(H*D);x.setTransform(D,0,0,D,0,0);if(basket){basket.y=H-70;basket.x=Math.min(W-basket.w,basket.x)}}addEventListener('resize',resize);resize();function tone(f,d=.05){try{audio=audio||new(AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.03,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}function hud(){scoreEl.textContent=score;comboEl.textContent='×'+combo;livesEl.textContent='♥'.repeat(Math.max(0,lives));bar.style.width=(rushTime>0?100:Math.min(100,rush/8*100))+'%';rushText.textContent=rushTime>0?'RUSH ×2':Math.min(8,rush)+' / 8'}function reset(){basket={x:W/2-40,y:H-70,w:80,h:30};items=[];fx=[];score=0;lives=5;combo=0;rush=0;rushTime=0;frame=0;shake=0;running=true;over.classList.remove('show');hud()}function spawn(){const bomb=Math.random()<Math.min(.2,.09+score/500),gold=!bomb&&Math.random()<.075,size=26+Math.random()*7;items.push({x:28+Math.random()*(W-56),y:-30,vy:100+Math.min(240,score*1.1)+Math.random()*45,bomb,gold,size,emoji:bomb?'💣':gold?'⭐':fruit[Math.floor(Math.random()*fruit.length)],rot:Math.random()*6.28})}function burst(px,py,color,n=8){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*110;fx.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45,color})}}function end(){running=false;best=Math.max(best,score);localStorage.setItem('fruit-catch-flag-best',best);bestEl.textContent=best;$('title').textContent=score>=best?'🏆 Orchard Record':'Basket Empty';$('summary').textContent=`Score ${score} · best ${best} · protect combos to trigger Catch Rush.`;over.classList.add('show');tone(170,.15)}function catchFruit(it){combo++;rush++;if(rush>=8&&rushTime<=0){rush=0;rushTime=5;tone(900,.12);navigator.vibrate?.(24)}const gain=(it.gold?5:1)+Math.min(4,Math.floor(combo/5)),pts=gain*(rushTime>0?2:1);score+=pts;burst(it.x,it.y,it.gold?'#ffd166':'#52b788',it.gold?15:9);tone(it.gold?820:420+Math.min(combo,12)*18,.04);hud()}function update(dt){if(!running)return;frame++;if(rushTime>0){rushTime-=dt;if(rushTime<=0){rushTime=0;combo=Math.max(0,combo-2)}}const rate=Math.max(14,34-Math.floor(score/12));if(frame%rate===0)spawn();basket.w=80+(rushTime>0?34:0);for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=it.vy*dt;it.rot+=dt*2;if(it.y+it.size>basket.y&&it.y-it.size/2<basket.y+basket.h&&it.x>basket.x-10&&it.x<basket.x+basket.w+10){items.splice(i,1);if(it.bomb){lives=Math.max(0,lives-2);combo=0;rush=0;rushTime=0;shake=12;burst(it.x,it.y,'#e63946',18);tone(120,.08);navigator.vibrate?.(45);hud();if(lives<=0)end()}else catchFruit(it);continue}if(it.y>H+40){items.splice(i,1);if(!it.bomb){lives--;combo=0;rush=0;hud();if(lives<=0)end()}}}for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=120*dt;f.life-=dt;if(f.life<=0)fx.splice(i,1)}if(shake>0)shake*=.84;hud()}function drawBg(){const sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#78d7ff');sky.addColorStop(.62,'#c8f3ff');sky.addColorStop(.63,'#88ce65');sky.addColorStop(1,'#4f9d48');x.fillStyle=sky;x.fillRect(-20,-20,W+40,H+40);x.fillStyle='#fff6';x.beginPath();x.arc(W*.82,H*.16,34,0,6.28);x.fill();for(let i=0;i<8;i++){const tx=(i*127)%W,ty=H*.58+(i%2)*18;x.fillStyle='#3b7c3a';x.fillRect(tx-7,ty,14,80);x.fillStyle='#2f8b46';x.beginPath();x.arc(tx,ty,43,0,6.28);x.fill();x.fillStyle='#ef476f';x.beginPath();x.arc(tx-15,ty-5,4,0,6.28);x.arc(tx+13,ty+8,4,0,6.28);x.fill()}}function drawBasket(){x.fillStyle=rushTime>0?'#ffd166':'#9a6837';x.beginPath();x.roundRect(basket.x,basket.y,basket.w,basket.h,7);x.fill();x.strokeStyle='#fff0b8';x.lineWidth=3;x.beginPath();x.arc(basket.x+basket.w/2,basket.y+3,basket.w*.34,Math.PI,0);x.stroke();x.fillStyle='#6d4527';for(let k=1;k<4;k++)x.fillRect(basket.x+8,basket.y+k*6,basket.w-16,2)}function draw(){x.save();if(shake>1)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawBg();x.textAlign='center';x.textBaseline='middle';for(const it of items){x.save();x.translate(it.x,it.y);x.rotate(Math.sin(it.rot)*.12);x.font=`${it.size}px Arial`;x.shadowBlur=it.gold?17:0;x.shadowColor='#ffd166';x.fillText(it.emoji,0,0);x.restore()}drawBasket();for(const f of fx){x.globalAlpha=Math.max(0,f.life/.45);x.fillStyle=f.color;x.fillRect(f.x,f.y,4,4)}x.globalAlpha=1;x.restore()}let last=performance.now();function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}function move(clientX){const r=c.getBoundingClientRect();basket.x=Math.max(0,Math.min(W-basket.w,(clientX-r.left)*W/r.width-basket.w/2))}c.addEventListener('pointerdown',e=>move(e.clientX));c.addEventListener('pointermove',e=>move(e.clientX));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')basket.x=Math.max(0,basket.x-38);if(e.key==='ArrowRight')basket.x=Math.min(W-basket.w,basket.x+38)});$('again').onclick=reset;reset();requestAnimationFrame(loop)})();</script></body></html>
