<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Fruit Catch</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Arial,sans-serif;background:#08111f;color:#fff}body{display:flex;align-items:center;justify-content:center;overflow:hidden}.wrap{position:relative;width:min(760px,100vw);height:min(680px,100vh);background:linear-gradient(#10243e,#0b1326);overflow:hidden}.hud{position:absolute;z-index:3;left:10px;right:10px;top:10px;display:flex;justify-content:space-between}.group{display:flex;gap:6px}.pill{background:#071126cc;border:1px solid #ffffff18;border-radius:10px;padding:6px 9px;font-size:10px;color:#94a3b8}.pill b{display:block;color:#fff;font-size:15px}.pill.combo b{color:#fbbf24}canvas{width:100%;height:100%;display:block;touch-action:none}.msg{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;color:#cbd5e1;background:#020617aa;padding:5px 9px;border-radius:999px}.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#020617c9}.card{width:min(300px,86vw);background:#101a34;border:1px solid #ffffff1c;border-radius:20px;padding:22px;text-align:center}.card h2{margin:0 0 6px}.card p{font-size:13px;color:#cbd5e1}.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:900;background:linear-gradient(135deg,#fbbf24,#fb7185);color:#1f1302}</style></head><body><main id="wrap" class="wrap"><div class="hud"><div class="group"><div class="pill">SCORE<b id="sc">0</b></div><div class="pill combo">COMBO<b id="cb">×0</b></div></div><div class="group"><div class="pill">LIVES<b id="lv">♥♥♥♥♥</b></div><div class="pill">BEST<b id="bs">0</b></div></div></div><canvas id="c"></canvas><div class="msg">Move the basket · catch fruit · avoid bombs</div><div id="over" class="overlay"><div class="card"><h2 id="ovTitle">Game Over</h2><p id="summary"></p><button id="again" class="btn">Catch Again</button></div></div></main><script>
const c=document.getElementById('c'),x=c.getContext('2d'),wrap=document.getElementById('wrap'),sc=document.getElementById('sc'),cb=document.getElementById('cb'),lv=document.getElementById('lv'),bs=document.getElementById('bs'),over=document.getElementById('over'),ovTitle=document.getElementById('ovTitle'),summary=document.getElementById('summary');let W=0,H=0,D=Math.min(devicePixelRatio||1,2),basket,items=[],fx=[],score=0,lives=5,combo=0,best=+localStorage.getItem('fruit-catch-best')||0,frame=0,running=true,shake=0;bs.textContent=best;const fruit=['🍎','🍊','🍋','🍇','🍓','🍑','🍒','🥝','🍌','🫐'];
function resize(){const r=wrap.getBoundingClientRect();W=r.width;H=r.height;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);if(basket){basket.y=H-64;basket.x=Math.min(W-basket.w,basket.x)}}addEventListener('resize',resize);resize();
function reset(){basket={x:W/2-38,y:H-64,w:76,h:34};items=[];fx=[];score=0;lives=5;combo=0;frame=0;running=true;shake=0;sc.textContent=0;cb.textContent='×0';lv.textContent='♥♥♥♥♥';over.style.display='none'}
function spawn(){const bomb=Math.random()<Math.min(.21,.12+score/350),gold=!bomb&&Math.random()<.08,size=gold?31:25+Math.random()*7;items.push({x:25+Math.random()*(W-50),y:-30,vy:2.1+Math.min(4.8,score*.025)+Math.random()*1.1,bomb,gold,size,emoji:bomb?'💣':gold?'🌟':fruit[Math.floor(Math.random()*fruit.length)],rot:Math.random()*6.2})}
function burst(px,py,color,n=8){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*3;fx.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:24,color})}}
function end(){running=false;const isBest=score>best;if(isBest){best=score;localStorage.setItem('fruit-catch-best',best);bs.textContent=best}ovTitle.textContent=isBest?'🏆 New Best':'Basket Empty';summary.textContent=`Caught ${score} points · Best ${best} · keep combos alive by catching every fruit.`;over.style.display='flex'}
function update(){if(!running)return;frame++;const rate=Math.max(16,42-Math.floor(score/8));if(frame%rate===0)spawn();for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=it.vy;it.rot+=.03;if(it.y+it.size>basket.y&&it.y<basket.y+basket.h&&it.x>basket.x-8&&it.x<basket.x+basket.w+8){items.splice(i,1);if(it.bomb){lives=Math.max(0,lives-2);combo=0;cb.textContent='×0';shake=12;burst(it.x,it.y,'#fb7185',15);navigator.vibrate?.(45);lv.textContent='♥'.repeat(lives);if(lives<=0)end()}else{combo++;const pts=(it.gold?5:1)+Math.min(4,Math.floor(combo/5));score+=pts;sc.textContent=score;cb.textContent='×'+combo;burst(it.x,it.y,it.gold?'#fbbf24':'#34d399',it.gold?14:8);if(it.gold)navigator.vibrate?.(15)}continue}if(it.y>H+30){items.splice(i,1);if(!it.bomb){lives--;combo=0;cb.textContent='×0';lv.textContent='♥'.repeat(Math.max(0,lives));if(lives<=0)end()}}}for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.x+=f.vx;f.y+=f.vy;f.vy+=.05;f.life--;if(f.life<=0)fx.splice(i,1)}if(shake>0)shake*=.82}
function drawBasket(){const y=basket.y;x.fillStyle='#8b5e3c';x.beginPath();x.roundRect(basket.x,y,basket.w,basket.h,8);x.fill();x.strokeStyle='#f4c27a';x.lineWidth=3;x.beginPath();x.arc(basket.x+basket.w/2,y+4,basket.w*.35,Math.PI,0);x.stroke();x.fillStyle='#6b4427';for(let k=1;k<4;k++)x.fillRect(basket.x+8,y+k*7,basket.w-16,2)}
function draw(){x.save();if(shake>1)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#15355a');g.addColorStop(.65,'#0d2038');g.addColorStop(1,'#08111f');x.fillStyle=g;x.fillRect(-20,-20,W+40,H+40);x.fillStyle='#ffffff12';for(let i=0;i<18;i++){const px=(i*97+frame*.2*(i%3+1))%W,py=(i*53+frame*.45)%H;x.beginPath();x.arc(px,py,1+(i%3),0,6.28);x.fill()}x.textAlign='center';x.textBaseline='middle';for(const it of items){x.save();x.translate(it.x,it.y);x.rotate(Math.sin(it.rot)*.15);x.font=`${it.size}px Arial`;x.shadowBlur=it.gold?18:0;x.shadowColor='#fbbf24';x.fillText(it.emoji,0,0);x.restore()}drawBasket();for(const f of fx){x.globalAlpha=f.life/24;x.fillStyle=f.color;x.fillRect(f.x,f.y,4,4)}x.globalAlpha=1;x.restore()}
function loop(){update();draw();requestAnimationFrame(loop)}function move(clientX){const r=c.getBoundingClientRect();basket.x=Math.max(0,Math.min(W-basket.w,(clientX-r.left)*W/r.width-basket.w/2))}c.addEventListener('pointerdown',e=>move(e.clientX));c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e.clientX)});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')basket.x=Math.max(0,basket.x-34);if(e.key==='ArrowRight')basket.x=Math.min(W-basket.w,basket.x+34)});document.getElementById('again').onclick=reset;reset();requestAnimationFrame(loop);
</script></body></html>
