<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Simon Says</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;padding:20px}
h1{color:#fff;font-size:24px;margin-bottom:6px}
.info{color:#aaa;font-size:15px;margin-bottom:20px}
.info span{color:#4fc3f7;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(320px,80vw);height:min(320px,80vw)}
.pad{border-radius:16px;cursor:pointer;transition:all .15s;opacity:.6;border:3px solid transparent}
.pad:active,.pad.active{opacity:1;transform:scale(.95);border-color:#fff}
.pad.green{background:#4caf50}.pad.red{background:#e94560}.pad.yellow{background:#ffc107}.pad.blue{background:#2196f3}
.pad.green.active{box-shadow:0 0 30px #4caf50}.pad.red.active{box-shadow:0 0 30px #e94560}
.pad.yellow.active{box-shadow:0 0 30px #ffc107}.pad.blue.active{box-shadow:0 0 30px #2196f3}
.status{margin-top:20px;color:#fff;font-size:18px;min-height:28px}
.best{margin-top:8px;color:#aaa;font-size:14px}
.btn{margin-top:16px;padding:10px 28px;background:#e94560;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.btn:hover{background:#c73e54}
</style>
</head>
<body>
<h1>🎵 Simon Says</h1>
<div class="info">Level: <span id="level">0</span></div>
<div class="grid">
  <div class="pad green" data-i="0"></div>
  <div class="pad red" data-i="1"></div>
  <div class="pad yellow" data-i="2"></div>
  <div class="pad blue" data-i="3"></div>
</div>
<div class="status" id="status">Press Start to play!</div>
<div class="best">Best: <span id="best">0</span></div>
<button class="btn" id="startBtn" onclick="startGame()">Start</button>
<script>
const pads=document.querySelectorAll('.pad');
const freqs=[261.63,329.63,392.00,523.25];
let sequence=[],playerSeq=[],level=0,best=0,playing=false,showingSequence=false;
const audioCtx=new(window.AudioContext||window.webkitAudioContext)();

function playTone(i,dur=300){
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.frequency.value=freqs[i];
  osc.type='sine';
  gain.gain.setValueAtTime(0.3,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+dur/1000);
  osc.start();osc.stop(audioCtx.currentTime+dur/1000);
}

function flashPad(i,dur=300){
  pads[i].classList.add('active');
  playTone(i,dur);
  setTimeout(()=>pads[i].classList.remove('active'),dur);
}

function startGame(){
  sequence=[];level=0;playing=true;
  document.getElementById('startBtn').style.display='none';
  nextRound();
}

function nextRound(){
  level++;
  document.getElementById('level').textContent=level;
  document.getElementById('status').textContent='Watch carefully...';
  sequence.push(Math.floor(Math.random()*4));
  playerSeq=[];showingSequence=true;
  
  let i=0;
  const interval=setInterval(()=>{
    if(i>=sequence.length){clearInterval(interval);showingSequence=false;document.getElementById('status').textContent='Your turn!';return;}
    flashPad(sequence[i],400);i++;
  },600);
}

function handlePad(i){
  if(!playing||showingSequence)return;
  audioCtx.resume();
  flashPad(i,200);
  playerSeq.push(i);
  
  const idx=playerSeq.length-1;
  if(playerSeq[idx]!==sequence[idx]){
    // Wrong!
    playing=false;
    document.getElementById('status').textContent='❌ Wrong! Game Over';
    if(level-1>best){best=level-1;document.getElementById('best').textContent=best;}
    document.getElementById('startBtn').style.display='inline-block';
    document.getElementById('startBtn').textContent='Play Again';
    playTone(0,800);
    return;
  }
  
  if(playerSeq.length===sequence.length){
    document.getElementById('status').textContent='✅ Correct!';
    setTimeout(nextRound,800);
  }
}

pads.forEach(pad=>{
  pad.addEventListener('click',()=>handlePad(parseInt(pad.dataset.i)));
  pad.addEventListener('touchstart',e=>{e.preventDefault();handlePad(parseInt(pad.dataset.i));});
});
</script>
<script>
(function(){function z(){document.body.style.zoom=1;var w=Math.max(document.documentElement.scrollWidth,320);var h=Math.max(document.documentElement.scrollHeight,320);var s=Math.min((innerWidth-12)/w,(innerHeight-12)/h,1.85);if(s>1.05)document.body.style.zoom=s;else document.body.style.zoom=1}z();addEventListener('resize',z)})();
</script>
</body>
</html>
