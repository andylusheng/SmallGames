name: Visual SEO QA

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "src/data/game-profiles.ts"
      - "src/views/GamePageView.tsx"
      - "src/components/GamePlayer.tsx"
      - "src/app/**/game/**"
      - "src/messages/**"
      - "public/games/**"
      - "scripts/list-optimized-games.mjs"
      - ".github/workflows/visual-seo.yml"
  push:
    branches: [master]
    paths:
      - "src/data/game-profiles.ts"
      - "src/views/GamePageView.tsx"
      - "src/components/GamePlayer.tsx"
      - "src/app/**/game/**"
      - "src/messages/**"
      - "public/games/**"
      - "scripts/list-optimized-games.mjs"
      - ".github/workflows/visual-seo.yml"

jobs:
  optimized-game-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npm run build

      - name: Discover optimized games
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/list-optimized-games.mjs
          TARGETS_JSON="$(node scripts/list-optimized-games.mjs --json)"
          echo "json=$TARGETS_JSON" >> "$GITHUB_OUTPUT"
          echo "Optimized games: $TARGETS_JSON" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Capture optimized game visual evidence
        shell: bash
        run: |
          set -euo pipefail

          python3 -m http.server 4173 --directory out >/tmp/zeroplay-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:4173/ >/dev/null

          CHROME="${{ steps.chrome.outputs.chrome-path }}"
          mapfile -t SLUGS < <(node scripts/list-optimized-games.mjs)

          echo "## Captured pages" >> "$GITHUB_STEP_SUMMARY"

          for SLUG in "${SLUGS[@]}"; do
            if [[ -f "out/game/${SLUG}.html" ]]; then
              PAGE_URL="http://127.0.0.1:4173/game/${SLUG}.html"
            elif [[ -f "out/game/${SLUG}/index.html" ]]; then
              PAGE_URL="http://127.0.0.1:4173/game/${SLUG}/"
            else
              echo "Exported SEO page not found for ${SLUG}" >&2
              exit 1
            fi

            if [[ ! -f "out/games/${SLUG}/index.html" ]]; then
              echo "Exported game runtime not found for ${SLUG}" >&2
              exit 1
            fi

            GAME_URL="http://127.0.0.1:4173/games/${SLUG}/index.html"
            OUTPUT_DIR="$GITHUB_WORKSPACE/artifacts/visual-seo/${SLUG}"
            mkdir -p "$OUTPUT_DIR"

            curl -fsS "$PAGE_URL" >/dev/null
            curl -fsS "$GAME_URL" >/dev/null

            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --window-size=1440,1200 \
              --virtual-time-budget=6000 \
              --screenshot="$OUTPUT_DIR/page-desktop.png" \
              "$PAGE_URL"

            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --window-size=390,844 \
              --virtual-time-budget=6000 \
              --screenshot="$OUTPUT_DIR/page-mobile.png" \
              "$PAGE_URL"

            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --window-size=900,700 \
              --virtual-time-budget=5000 \
              --screenshot="$OUTPUT_DIR/game-runtime.png" \
              "$GAME_URL"

            test -s "$OUTPUT_DIR/page-desktop.png"
            test -s "$OUTPUT_DIR/page-mobile.png"
            test -s "$OUTPUT_DIR/game-runtime.png"
            file "$OUTPUT_DIR"/*.png

            echo "- ${SLUG}: desktop page, 390x844 mobile page, game runtime" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload visual QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: optimized-game-visual-seo
          path: artifacts/visual-seo/**/*.png
          if-no-files-found: error
          retention-days: 30
