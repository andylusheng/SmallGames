name: Visual SEO QA

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "src/data/game-profiles.ts"
      - "src/data/game-profiles/**"
      - "src/data/topic-seo.ts"
      - "src/data/topic-seo/**"
      - "src/data/zh/**"
      - "src/data/zh-tw/**"
      - "src/data/es/**"
      - "src/lib/games.ts"
      - "src/lib/i18n.tsx"
      - "src/lib/server-i18n.ts"
      - "src/lib/metadata.ts"
      - "src/views/GamePageView.tsx"
      - "src/views/TopicPageView.tsx"
      - "src/views/HomePageView.tsx"
      - "src/views/CategoryPageView.tsx"
      - "src/components/GamePlayer.tsx"
      - "src/components/Header.tsx"
      - "src/components/CategoryNav.tsx"
      - "src/components/AdBanner.tsx"
      - "src/components/GameGrid.tsx"
      - "src/components/GameCard.tsx"
      - "src/app/**"
      - "src/messages/**"
      - "public/games/**"
      - "scripts/generate-game-index.js"
      - "scripts/list-p2-qa-games.mjs"
      - "scripts/list-topic-hubs.mjs"
      - ".github/workflows/visual-seo.yml"
  push:
    branches: [master]
    paths:
      - "src/data/game-profiles.ts"
      - "src/data/game-profiles/**"
      - "src/data/topic-seo.ts"
      - "src/data/topic-seo/**"
      - "src/data/zh/**"
      - "src/data/zh-tw/**"
      - "src/data/es/**"
      - "src/lib/games.ts"
      - "src/lib/i18n.tsx"
      - "src/lib/server-i18n.ts"
      - "src/lib/metadata.ts"
      - "src/views/GamePageView.tsx"
      - "src/views/TopicPageView.tsx"
      - "src/views/HomePageView.tsx"
      - "src/views/CategoryPageView.tsx"
      - "src/components/GamePlayer.tsx"
      - "src/components/Header.tsx"
      - "src/components/CategoryNav.tsx"
      - "src/components/AdBanner.tsx"
      - "src/components/GameGrid.tsx"
      - "src/components/GameCard.tsx"
      - "src/app/**"
      - "src/messages/**"
      - "public/games/**"
      - "scripts/generate-game-index.js"
      - "scripts/list-p2-qa-games.mjs"
      - "scripts/list-topic-hubs.mjs"
      - ".github/workflows/visual-seo.yml"

jobs:
  p2-visual-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npm run build

      - name: Discover P2 QA targets
        shell: bash
        run: |
          set -euo pipefail
          echo "## P2 QA games" >> "$GITHUB_STEP_SUMMARY"
          node scripts/list-p2-qa-games.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          echo "## Topic hubs" >> "$GITHUB_STEP_SUMMARY"
          node scripts/list-topic-hubs.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Capture P2 visual evidence
        shell: bash
        run: |
          set -euo pipefail

          python3 -m http.server 4173 --directory out >/tmp/zeroplay-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null

          CHROME="${{ steps.chrome.outputs.chrome-path }}"

          capture_page() {
            local url="$1"
            local output_dir="$2"
            mkdir -p "$output_dir"
            curl -fsS "$url" >/dev/null

            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --force-device-scale-factor=1 --window-size=1440,1200 --virtual-time-budget=6000 \
              --screenshot="$output_dir/page-desktop.png" "$url"

            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --force-device-scale-factor=1 --window-size=390,844 --virtual-time-budget=6000 \
              --screenshot="$output_dir/page-mobile.png" "$url"

            test -s "$output_dir/page-desktop.png"
            test -s "$output_dir/page-mobile.png"
          }

          resolve_page_url() {
            local path="$1"
            if [[ -f "out${path}.html" ]]; then
              printf 'http://127.0.0.1:4173%s.html\n' "$path"
            elif [[ -f "out${path}/index.html" ]]; then
              printf 'http://127.0.0.1:4173%s/\n' "$path"
            else
              echo "Exported page not found for ${path}" >&2
              exit 1
            fi
          }

          echo "## Captured mobile UX shell baselines" >> "$GITHUB_STEP_SUMMARY"
          capture_page "http://127.0.0.1:4173/" "$GITHUB_WORKSPACE/artifacts/visual-seo/shell/home"
          capture_page "$(resolve_page_url /action)" "$GITHUB_WORKSPACE/artifacts/visual-seo/shell/action-category"
          capture_page "$(resolve_page_url /game/tetris)" "$GITHUB_WORKSPACE/artifacts/visual-seo/shell/tetris-page"

          TETRIS_URL="http://127.0.0.1:4173/games/tetris/index.html"
          TETRIS_OUTPUT="$GITHUB_WORKSPACE/artifacts/visual-seo/shell/tetris-runtime"
          mkdir -p "$TETRIS_OUTPUT"
          curl -fsS "$TETRIS_URL" >/dev/null
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --force-device-scale-factor=1 --window-size=390,620 --virtual-time-budget=5000 \
            --screenshot="$TETRIS_OUTPUT/runtime-mobile.png" "$TETRIS_URL"
          test -s "$TETRIS_OUTPUT/runtime-mobile.png"
          echo "- home, action category, Tetris page, Tetris mobile runtime" >> "$GITHUB_STEP_SUMMARY"

          echo "## Simplified Chinese locale smoke QA" >> "$GITHUB_STEP_SUMMARY"
          ZH_HOME="$(resolve_page_url /zh)"
          ZH_ACTION="$(resolve_page_url /zh/action)"
          ZH_GAME="$(resolve_page_url /zh/game/quick-tap)"
          ZH_TOPIC="$(resolve_page_url /zh/tap-games)"
          curl -fsS "$ZH_HOME" | grep -q '免费在线'
          curl -fsS "$ZH_GAME" | grep -q 'inLanguage'
          test -s public/games-index-zh.json
          capture_page "$ZH_HOME" "$GITHUB_WORKSPACE/artifacts/visual-seo/zh/home"
          capture_page "$ZH_ACTION" "$GITHUB_WORKSPACE/artifacts/visual-seo/zh/action-category"
          capture_page "$ZH_GAME" "$GITHUB_WORKSPACE/artifacts/visual-seo/zh/quick-tap"
          capture_page "$ZH_TOPIC" "$GITHUB_WORKSPACE/artifacts/visual-seo/zh/tap-games"
          echo "- zh home, category, game and topic desktop/mobile + Simplified Chinese search index" >> "$GITHUB_STEP_SUMMARY"

          echo "## Traditional Chinese locale smoke QA" >> "$GITHUB_STEP_SUMMARY"
          ZHTW_HOME="$(resolve_page_url /zh-tw)"
          ZHTW_ACTION="$(resolve_page_url /zh-tw/action)"
          ZHTW_GAME="$(resolve_page_url /zh-tw/game/quick-tap)"
          ZHTW_TOPIC="$(resolve_page_url /zh-tw/tap-games)"
          curl -fsS "$ZHTW_HOME" | grep -q '免費線上'
          curl -fsS "$ZHTW_GAME" | grep -q 'zh-TW'
          capture_page "$ZHTW_HOME" "$GITHUB_WORKSPACE/artifacts/visual-seo/zh-tw/home"
          capture_page "$ZHTW_ACTION" "$GITHUB_WORKSPACE/artifacts/visual-seo/zh-tw/action-category"
          capture_page "$ZHTW_GAME" "$GITHUB_WORKSPACE/artifacts/visual-seo/zh-tw/quick-tap"
          capture_page "$ZHTW_TOPIC" "$GITHUB_WORKSPACE/artifacts/visual-seo/zh-tw/tap-games"
          echo "- zh-tw home, category, game and topic desktop/mobile" >> "$GITHUB_STEP_SUMMARY"

          echo "## Spanish locale smoke QA" >> "$GITHUB_STEP_SUMMARY"
          ES_HOME="$(resolve_page_url /es)"
          ES_ACTION="$(resolve_page_url /es/action)"
          ES_GAME="$(resolve_page_url /es/game/quick-tap)"
          ES_TOPIC="$(resolve_page_url /es/tap-games)"
          curl -fsS "$ES_HOME" | grep -q 'Juegos online gratis'
          curl -fsS "$ES_GAME" | grep -q 'inLanguage'
          capture_page "$ES_HOME" "$GITHUB_WORKSPACE/artifacts/visual-seo/es/home"
          capture_page "$ES_ACTION" "$GITHUB_WORKSPACE/artifacts/visual-seo/es/action-category"
          capture_page "$ES_GAME" "$GITHUB_WORKSPACE/artifacts/visual-seo/es/quick-tap"
          capture_page "$ES_TOPIC" "$GITHUB_WORKSPACE/artifacts/visual-seo/es/tap-games"
          echo "- es home, category, game and topic desktop/mobile" >> "$GITHUB_STEP_SUMMARY"

          echo "## Captured P2 game pages" >> "$GITHUB_STEP_SUMMARY"
          mapfile -t SLUGS < <(node scripts/list-p2-qa-games.mjs)
          for SLUG in "${SLUGS[@]}"; do
            PAGE_URL="$(resolve_page_url /game/${SLUG})"

            if [[ ! -f "out/games/${SLUG}/index.html" ]]; then
              echo "Exported game runtime not found for ${SLUG}" >&2
              exit 1
            fi

            OUTPUT_DIR="$GITHUB_WORKSPACE/artifacts/visual-seo/games/${SLUG}"
            capture_page "$PAGE_URL" "$OUTPUT_DIR"

            GAME_URL="http://127.0.0.1:4173/games/${SLUG}/index.html"
            curl -fsS "$GAME_URL" >/dev/null
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --force-device-scale-factor=1 --window-size=900,700 --virtual-time-budget=5000 \
              --screenshot="$OUTPUT_DIR/game-runtime.png" "$GAME_URL"
            test -s "$OUTPUT_DIR/game-runtime.png"
            file "$OUTPUT_DIR"/*.png
            echo "- ${SLUG}: desktop, mobile, runtime" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "## Captured topic hubs" >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r TOPIC_KEY TOPIC_PATH; do
            [[ -n "$TOPIC_KEY" ]] || continue
            TOPIC_URL="$(resolve_page_url "$TOPIC_PATH")"
            TOPIC_OUTPUT="$GITHUB_WORKSPACE/artifacts/visual-seo/topics/${TOPIC_KEY}"
            capture_page "$TOPIC_URL" "$TOPIC_OUTPUT"
            file "$TOPIC_OUTPUT"/*.png
            echo "- ${TOPIC_KEY}: desktop, mobile" >> "$GITHUB_STEP_SUMMARY"
          done < <(node scripts/list-topic-hubs.mjs)

      - name: Upload visual QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: p2-visual-seo
          path: artifacts/visual-seo/**/*.png
          if-no-files-found: error
          retention-days: 30
